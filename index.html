.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}

.media{position:relative;overflow:hidden;background:#ececec}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .media img,.card:hover .media svg,.hero:hover .media img,.hero:hover .media svg{transform:scale(1.04)}
.hero{display:grid;grid-template-columns:1.25fr 1fr;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(20,20,40,.08);cursor:pointer;margin-bottom:26px;transition:box-shadow .3s}

.hero .media{min-height:340px}
.hero .body{padding:30px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.hero h2{margin:0;font-size:29px;line-height:1.18;letter-spacing:-.02em}
.hero p{margin:0;color:#444}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 14px rgba(20,20,40,.06);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}

.card .media{aspect-ratio:16/10}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:9px}

.warn{font-size:12px;color:#92400e;background:#fef3c7;border-radius:8px;padding:5px 9px}
.overlay{position:fixed;inset:0;background:rgba(15,17,25,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px;z-index:50;animation:fade .25s}
.modal{background:#fff;border-radius:24px;max-width:780px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:up .3s}
.modal .media{aspect-ratio:16/9}
.modal .in{padding:28px 32px 34px;display:flex;flex-direction:column;gap:14px}
.modal h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
.modal .orig{color:var(--mut);font-size:13px;font-style:italic;margin-top:-6px}
.modal p{margin:0;font-size:16.5px;color:#2b2e35}
.src{align-self:flex-start;background:var(--ink);color:#fff;text-decoration:none;padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px}
.src:hover{background:var(--acc)}

@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

const PALETAS = {
  Branding: [["#ff9a44","#e8590c"],["#ffd166","#f4623a"],["#ff7a59","#c92a2a"]],
  Design: [["#5eead4","#0f766e"],["#86efac","#047857"],["#67e8f9","#0e7490"]],
  Tecnologia: [["#818cf8","#4338ca"],["#a78bfa","#6d28d9"],["#60a5fa","#3730a3"]]
};
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

function Ilustracao({ item }) {
  const h = hash(item.title);
  const pal = PALETAS[item.categoria][h % 3];
  const id = "g" + h;
  const shapes = [];
  for (let i = 0; i < 6; i++) {
    const k = hash(item.title + i);
    const x = k % 400, y = (k >> 3) % 250, r = 30 + (k >> 5) % 90;
    const t = k % 3;
    const op = 0.14 + ((k >> 7) % 20) / 100;
    if (t === 0) shapes.push(<circle key={i} cx={x} cy={y} r={r} fill="#fff" opacity={op} />);
    else if (t === 1) shapes.push(<rect key={i} x={x - r} y={y - r} width={r * 1.6} height={r * 1.6} rx={r / 5} fill="#fff" opacity={op} transform={`rotate(${k % 60} ${x} ${y})`} />);
    else shapes.push(<polygon key={i} points={`${x},${y - r} ${x + r},${y + r} ${x - r},${y + r}`} fill="#fff" opacity={op} />);
  }
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: " + item.tituloPt}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={pal[0]} /><stop offset="1" stopColor={pal[1]} /></linearGradient></defs>
      <rect width="400" height="250" fill={`url(#${id})`} />
      {shapes}
    </svg>
  );
}

function Midia({ item }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="media" style={{ width: "100%", height: "100%" }}>
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Foto da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
        : <Ilustracao item={item} />}
    </div>
  );
}

const Estrelas = ({ n }) => <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n) + "☆".repeat(5 - n)}</span>;
const Meta = ({ item }) => (
  <div className="meta">
    <span className={"tag " + item.categoria}>{item.categoria}</span>
    <Estrelas n={item.estrelas} />
    <span>{item.source} · {item.data}</span>
  </div>
);

function Modal({ item, onClose }) {
  useEffect(() => {
    const f = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", f);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", f); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <div className="media"><Midia item={item} /></div>
        <div className="in">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <div className="orig">Título original: {item.title}</div>
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          {item.paywall && <div className="warn">Matéria atrás de paywall: resumo feito a partir de elementos públicos (título, tags, categoria e imagem).</div>}
          <a className="src" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte — {item.source} ↗</a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const itens = [...NEWS].sort((a, b) => b.estrelas - a.estrelas);
  const [hero, ...resto] = itens;
  const hoje = new Date(2026, 9, 25).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return (
    <div className="wrap">
      <header className="top">
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">{hoje}</div>
      </header>
      <article className="hero" onClick={() => setAberto(hero)}>
        <div className="media"><Midia item={hero} /></div>
        <div className="body">
          <Meta item={hero} />
          <h2>{hero.tituloPt}</h2>
          <p>{hero.resumo[0].slice(0, 230)}…</p>
          <span style={{ color: "var(--acc)", fontWeight: 600, fontSize: 14 }}>Ler resumo →</span>
        </div>
      </article>
      <section className="grid">
        {resto.map(it => (
          <article className="card" key={it.url} onClick={() => setAberto(it)}>
            <div className="media"><Midia item={it} /></div>
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
              <p>{it.resumo[0].slice(0, 120)}…</p>
              {it.paywall && <div className="warn">Matéria com paywall — resumo parcial</div>}
            </div>
          </article>
        ))}
      </section>
      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
      <footer>Resumos parafraseados em português. Fontes: Brand New, Creative Bloq, The Drum, Campaign, Dezeen, Designboom e TechCrunch.</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
