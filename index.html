<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#12141a;--mut:#6b7280;--line:#e8eaf0;--acc:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
.date{color:var(--mut);font-size:14px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(20,24,40,.08);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}

.hero .img{min-height:340px}
.hero .txt{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(20,24,40,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,24,40,.12)}
.card .img{height:180px}
.card .b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px;line-height:1.3}
.img{position:relative;overflow:hidden;background:#eee}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-weight:600;font-size:11px}
.Branding{background:#fff1e6;color:#c2410c}.Design{background:#e0f7f4;color:#0f766e}.Tecnologia{background:#ece9ff;color:#4338ca}
.stars{color:#f59e0b;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(15,18,30,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;animation:fade .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:90vh;overflow:auto;animation:pop .3s}
.modal .img{height:320px}
.modal .c{padding:28px 32px 32px}
.modal h2{margin:8px 0 12px;font-size:26px;line-height:1.2}
.modal p{font-size:16px;color:#2b2f3a}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px}
.btn{display:inline-block;margin-top:14px;padding:10px 18px;background:var(--acc);color:#fff;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btn.g{background:#eef0f6;color:var(--ink);margin-left:8px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
footer{margin-top:40px;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.hero h2{font-size:23px}}
</style>

{
 title: "Sunlife's new logo design is 'optimised for a digital world', but does it take minimalism too far?",
 tituloPt: "O novo logo da Sunlife é 'otimizado para o mundo digital', mas será que o minimalismo foi longe demais?",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/news/sunlifes-new-logo-design-is-optimised-for-a-digital-world-but-does-it-take-minimalism-too-far",
 imageUrl: "https://cdn.mos.cms.futurecdn.net/zS4fgXaBnQXcy7vSHBDwG8-1920-80.jpg",
 cat: "Branding", stars: 5, date: "21/10",
 dek: "A financeira canadense Sun Life vira 'Sunlife' e reduz o símbolo a um disco quase sem detalhes.",
 resumo: ["A seguradora e gestora financeira canadense Sun Life passou a escrever o nome em uma única palavra, 'Sunlife', e apresentou um novo logo que a própria empresa descreve como otimizado para um mundo digital. O espaço entre as palavras sumiu e o símbolo do sol foi simplificado ao extremo: manteve-se a cor, mas o desenho virou um disco liso, parecido com o ícone de previsão do tempo.","O wordmark continua em fonte serifada, só que mais fina, leve e contemporânea. A marca praticamente não mudava havia 25 anos, enquanto o negócio saiu do seguro de vida para saúde, gestão de ativos e outros seguros. A empresa também lançou o slogan 'Making life brighter' e afirma que a mudança cria uma identidade global mais moderna, distinta e consistente.","A reação nas redes foi de estranhamento, com quem ache que o minimalismo passou do ponto, e o artigo compara o disco a outros símbolos ultra simples, como o da Green Party do Canadá e o do USA Today, inserindo o caso no debate sobre 'blanding'. O autor, porém, defende o resultado: acha o serifado distintivo e que o nome em uma palavra funciona melhor agora que a empresa deixou de ser só seguradora de vida."]

{

 cat: "Branding", stars: 4, date: "21/10",
 dek: "Nova plataforma de marca da defensora do consumidor aposta em provas, não em promessas.",
 resumo: ["A Which?, organização britânica de defesa do consumidor, lançou em 19 de outubro uma nova plataforma de marca criada pelas agências WhyProjects e Neverland. Num cenário em que os conselhos de compra vêm de criadores, links de afiliados e avaliações duvidosas, a ideia é ocupar a lacuna de confiança. A pesquisa da marca indica que 82% das pessoas sentem que pagam mais e recebem menos.","Em vez de apenas pedir confiança, a campanha explica de onde ela vem: testes independentes. Nos filmes de TV, uma imagem simples acompanha uma explicação — um aspirador robô recolhe migalhas enquanto se diz que os especialistas testam aparelhos com pelos de gato e cereal; uma cápsula derrama pó revelando uma 'dose de verdade'; um anúncio de máscara facial usa o mote 'Face the facts'.","Nos cartazes, frases como 'We can't be bought' lembram que a Which? paga pelos produtos que testa, uma alfinetada nos presentes a influenciadores. O visual é contido: tipografia calma, preto e branco e toques de vermelho do logo. A ação inclui rádio, social, conteúdo com especialistas e parcerias com podcasts. O texto conclui que a marca consegue sustentar o que promete com evidências."]

{
 title: "Dollar Tree branches out with first national brand campaign",
 tituloPt: "Dollar Tree amplia horizontes com sua primeira campanha nacional de marca",

{
 title: "Apple showcases upcycled found furniture and banana palm-paper lantern at Designers of Tomorrow show",

 cat: "Design", stars: 4, date: "21/10",
 dek: "Mostra em Paris dá palco a jovens designers de mobiliário e iluminação.",
 resumo: ["A exposição Designers of Tomorrow, da Apple, parte da Design Miami.Paris, abriu em 21 de outubro no L'hôtel de Maisons, em Paris, e vai até o dia 25. O tema é o processo criativo, 'a arte em construção', e o curador Rodman Primack selecionou os participantes com um júri que incluiu Jennifer Roberts, presidente da Design Miami, e o designer Nifemi Marcus-Bello. O recorte desta edição é 'Design for Presence'.","Entre as obras, a egípcio-dinamarquesa Salem S Charabi apresenta uma luminária de palmeira-tamareira, calcário e papel de bananeira; Yoonjeong Lee, de Seul, mostra uma luminária feita de uma mesa com cerca de 5 mil lâminas de madeira empilhadas; Isabel Rower, do Brooklyn, reconstrói uma cadeira a partir de móvel encontrado na rua, com papel machê e 1.500 contas de cerâmica; e a dupla Parafernalia exibe uma paisagem em aço inox corroído por ácido, cujas formas servem de bancos e mesa.","A Apple afirma que cada designer usou seus produtos em diferentes etapas, da ideação à execução. A edição de estreia, no ano passado, havia exibido uma mesa projetada para parecer manteiga."]
},
{
 title: "Johnston Marklee unveils designs for Bass Museum expansion",
 tituloPt: "Johnston Marklee revela projeto de ampliação do Bass Museum, em Miami Beach",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/21/johnston-marklee-bass-museum-expansion-miami-beach/",

 cat: "Design", stars: 4, date: "21/10",
 dek: "Dois pavilhões elevados sobre uma laje fina respondem ao risco de enchentes.",
 resumo: ["O escritório Johnston Marklee, de Los Angeles, apresentou o projeto para ampliar o Bass Museum of Art, em Miami Beach, com cerca de 2 mil m² (22 mil pés quadrados) de espaços internos e externos no canto sudoeste do terreno.","São dois pavilhões retangulares apoiados sobre uma laje de concreto fina e elevada do solo para atender a diretrizes de resiliência frente à elevação do nível do mar. Debaixo deles passam pátios; um óculo retroiluminado ilumina a passagem à noite, e a empena cega de um pavilhão servirá de tela para sessões de cinema. As galerias principais ficam nos pavilhões, com paredes brancas, janelas retangulares e claraboia.","O projeto dialoga com o prédio art déco de Russell Pancoast e com a ampliação de Arata Isozaki, e os sócios Sharon Johnston e Mark Lee dizem que ele amplia o acesso público e honra a ideia de um 'campus poroso'."]

{
 title: "Recursive launches Flint, a laptop coding model it says was largely built by AI",
 tituloPt: "Recursive lança o Flint, modelo de código para notebooks que diz ter sido construído em grande parte por IA",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/21/recursive-launches-flint-a-laptop-coding-model-it-says-was-largely-built-by-ai/",
 imageUrl: "https://techcrunch.com/wp-content/uploads/2026/05/GettyImages-2157738833.jpg?resize=1200,800",
 cat: "Tecnologia", stars: 4, date: "21/10",
 dek: "Modelo aberto roda localmente e testa a ideia de autoaperfeiçoamento recursivo.",
 resumo: ["A startup Recursive, fundada em 2025 e liderada por Richard Socher, ex-cientista-chefe da Salesforce, lançou o Flint, seu primeiro modelo: um assistente de programação gratuito que roda no próprio laptop. Segundo a empresa, um sistema de pesquisa automatizado chamado Eureka Machine ajudou em quase todas as etapas, e uma equipe pequena o construiu do zero em menos de quatro meses.","O Flint usa arquitetura de mistura de especialistas, ativando 2,5 bilhões dos seus 40 bilhões de parâmetros por tarefa. Nos testes da empresa, gerou cerca de 131 tokens por segundo num MacBook Pro com M4 Pro, aproximadamente o dobro de modelos comparáveis, e superou outros modelos abaixo de 50 bilhões de parâmetros no SWE-Bench Verified. Está disponível no Hugging Face com licença Apache 2.0.","A Recursive admite que o modelo precisa de mais orientação que assistentes pagos de grande porte. A ideia de IA que ajuda a construir IA é debatida, e Socher diz que a meta é o autoaperfeiçoamento recursivo com supervisão humana e possibilidade de interrupção."]

{
 title: "Meta says Muse has over 10M users, with shopping a top activity",

 resumo: ["A Meta informou, na divulgação de resultados do terceiro trimestre, que seu app de IA, o Muse, ultrapassou 10 milhões de usuários. Segundo Mark Zuckerberg, cerca de 25% de quem configura o app o usa diariamente, e as compras por agente aparecem entre os usos mais populares, via conector da Plaid, com parte dos compradores gastando mais de US$ 200 em média.","A empresa diz que o Muse alcançou product-market fit e que vai focar em escalar, gerar receita e reduzir custos de computação, com expectativa de melhorar a eficiência em mais de dez vezes em um ano. O plano é manter o app gratuito para a maioria, cobrar uma porcentagem do comércio e vender planos para usuários avançados.","O Muse é central para a estratégia de óculos inteligentes da Meta, cuja divisão Reality Labs ainda perde bilhões — a previsão é de queda do prejuízo de US$ 19,1 bi em 2025 para US$ 15 bi em 2026."]

{

 tituloPt: "Takero Shimazaki transforma teatro improvisado em casa permanente 'quase uma igreja' em Londres",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/21/yard-theatre-revamp-takero-shimazaki-architects-london/",

 resumo: ["O estúdio londrino Takero Shimazaki Architects reformou e ampliou o Yard Theatre, em Hackney Wick, usando materiais reaproveitados. Aberto em 2011 num galpão, como projeto temporário de três meses da Practice Architecture, o espaço agora vira um teatro permanente, com bar, bastidores e área comunitária.","O auditório antigo, de 110 lugares, foi renovado, e a nova sala, de 224 lugares, ocupa uma antiga cervejaria cujas paredes de tijolo foram mantidas, com arquibancada curva e estrutura de telhado em madeira laminada sobre aço reciclado. Uma torre de guindaste virou chaminé de ventilação de 23 metros, revestida de policarbonato translúcido, que funciona como marco visual.","A extensão usa fibrocimento, policarbonato e K-Briq colorido, feito com mais de 95% de conteúdo reciclado, e uma escultura de Antony Gormley fica sobre o telhado."]

const PAL = {Branding:["#f97316","#ec4899","#fbbf24"],Design:["#10b981","#06b6d4","#14b8a6"],Tecnologia:["#3b82f6","#8b5cf6","#6366f1"]};
function Art({cat,seed}){
  const p=PAL[cat]||PAL.Design; const s=seed*37;
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de "+cat}>
    <defs><linearGradient id={"g"+seed} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#g"+seed+")"}/>
    <circle cx={80+(s%160)} cy={60+(s%90)} r={70+(s%40)} fill={p[2]} opacity=".45"/>
    <rect x={200+(s%80)} y="90" width="140" height="140" rx="28" fill="#fff" opacity=".18" transform={"rotate("+(s%40)+" 270 160)"}/>
    <circle cx="340" cy="40" r="30" fill="#fff" opacity=".25"/>
    <path d="M0 200 Q100 150 200 200 T400 190 V240 H0Z" fill="#fff" opacity=".2"/>
  </svg>);
}
function Pic({item,seed}){
  const [falhou,setFalhou]=useState(false);
  if(!item.imageUrl||falhou) return <Art cat={item.cat} seed={seed}/>;
  return <img src={item.imageUrl} referrerPolicy="no-referrer" loading="lazy" alt={"Imagem da matéria: "+item.tituloPt} onError={()=>setFalhou(true)}/>;
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
const Meta=({it})=>(<div className="meta"><span className={"tag "+it.cat}>{it.cat}</span><Stars n={it.stars}/><span>{it.source} · {it.date}</span></div>);

function App(){
  const [open,setOpen]=useState(null);
  const items=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [hero,...rest]=items;
  useEffect(()=>{const h=e=>e.key==="Escape"&&setOpen(null);window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
  return (<div className="wrap">
    <header><div><h1>☀️ Portal da Manhã</h1><div className="date">Quinta-feira, 22 de outubro de 2026 · {items.length} notícias de {new Set(items.map(i=>i.source)).size} portais</div></div></header>
    <div className="hero" onClick={()=>setOpen(hero)}>
      <div className="img"><Pic item={hero} seed={0}/></div>
      <div className="txt"><Meta it={hero}/><h2>{hero.tituloPt}</h2><p>{hero.dek}</p><span style={{color:"var(--acc)",fontWeight:600}}>Ler resumo →</span></div>
    </div>
    <div className="grid">{rest.map((it,i)=>(
      <article className="card" key={it.url} onClick={()=>setOpen(it)}>
        <div className="img"><Pic item={it} seed={i+1}/></div>
        <div className="b"><Meta it={it}/><h3>{it.tituloPt}</h3><div style={{fontSize:13,color:"var(--mut)"}}>{it.dek}</div></div>
      </article>))}</div>
    {open&&(<div className="modal-bg" onClick={()=>setOpen(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
      <div className="img"><Pic item={open} seed={3}/></div>
      <div className="c"><Meta it={open}/><h2>{open.tituloPt}</h2>
        {open.resumo.map((p,i)=><p key={i}>{p}</p>)}
        {open.paywall&&<p className="note">Matéria atrás de paywall: resumo feito a partir dos elementos públicos (título, categoria, tags).</p>}
        <a className="btn" href={open.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({open.source})</a>
        <button className="btn g" onClick={()=>setOpen(null)}>Fechar</button>
      </div></div></div>)}
    <footer>Resumos parafraseados em português. Imagens carregadas diretamente dos portais de origem.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
