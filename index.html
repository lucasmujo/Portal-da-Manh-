<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 1 de outubro de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16161a;--mut:#6b6b76;--line:#e8e6e1;--acc:#e8590c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:28px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{margin:0;font-size:34px;letter-spacing:-.02em}
.date{color:var(--mut);font-size:15px;text-transform:capitalize}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.1)}
.hero .img{min-height:340px}
.hero .body{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.1)}
.card .img{height:190px}
.card .body{padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px;line-height:1.3}
.img{position:relative;overflow:hidden;background:#eee}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-weight:600;font-size:11.5px;color:#fff}
.Branding{background:#e8590c}.Design{background:#0f9d8a}.Tecnologia{background:#5b5bd6}
.stars{color:#f5a623;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:28px 14px;z-index:10;animation:f .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .3s;position:relative}
.modal .img{height:340px}
.modal .in{padding:28px 32px 34px}
.modal h2{margin:8px 0 4px;font-size:27px;line-height:1.2}
.modal .orig{color:var(--mut);font-size:14px;margin:0 0 16px}
.modal p{font-size:16.5px;margin:0 0 14px}
.note{background:#fff7ed;border-left:3px solid var(--acc);padding:10px 14px;border-radius:8px;font-size:13.5px;color:#7a4a1c;margin-top:8px}
.btn{display:inline-block;margin-top:14px;background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px}
.close{position:absolute;top:14px;right:14px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center}
@keyframes f{from{opacity:0}to{opacity:1}}@keyframes u{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:27px}.modal .in{padding:20px}.modal .img{height:220px}}
</style>
</head>
<body>
<div id="root"></div>

{

const PALETTES = { Branding:["#ff9a3c","#e8590c","#b3261e"], Design:["#7be0c3","#0f9d8a","#0b5c63"], Tecnologia:["#8b8bf0","#5b5bd6","#2a2a8f"] };

function Ilustracao({ cat, seed }) {
  const p = PALETTES[cat] || PALETTES.Design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração " + cat}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[2]}/></linearGradient></defs>
      <rect width="400" height="240" fill={"url(#"+id+")"}/>
      <circle cx={80+r(1)*240} cy={40+r(2)*120} r={50+r(3)*60} fill="#fff" opacity=".18"/>
      <rect x={r(4)*220} y={90+r(5)*80} width={120+r(6)*80} height={90} rx="18" fill={p[1]} opacity=".55" transform={"rotate("+Math.round(r(7)*30-15)+" 200 150)"}/>
      <polygon points={`${200+r(8)*150},20 ${330+r(9)*50},150 ${190+r(10)*60},170`} fill="#fff" opacity=".14"/>
      <circle cx={40+r(11)*60} cy={190} r="34" fill="none" stroke="#fff" strokeWidth="6" opacity=".4"/>
    </svg>
  );
}

function Imagem({ item, idx }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="img">
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
        : <Ilustracao cat={item.cat} seed={idx + 3} />}
    </div>
  );
}

const Estrelas = ({ n }) => <span className="stars" title={n + " de 5"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;
const Meta = ({ item }) => (
  <div className="meta">
    <span className={"tag " + item.cat}>{item.cat}</span>
    <strong>{item.source}</strong>
    <Estrelas n={item.stars} />
  </div>
);

function Detalhe({ item, idx, onClose }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", k);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", k); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <Imagem item={item} idx={idx} />
        <div className="in">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: {item.title}</p>
          {item.resumo.map((t, i) => <p key={i}>{t}</p>)}
          {item.paywall && <div className="note">Matéria com acesso restrito: o resumo foi escrito a partir dos elementos públicos da página (título, categoria, tags e imagem).</div>}
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);
  const lista = [...NEWS].sort((a, b) => b.stars - a.stars);
  const [top, ...resto] = lista;
  const hoje = new Date(2026, 9, 1).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return (
    <div className="wrap">
      <header>
        <h1>☀ Portal da Manhã</h1>
        <span className="date">{hoje}</span>
      </header>
      <div className="hero" onClick={() => setAberta(0)}>
        <Imagem item={top} idx={0} />
        <div className="body">
          <Meta item={top} />
          <h2>{top.tituloPt}</h2>
          <span style={{color:"var(--mut)"}}>{top.resumo[0].slice(0, 190)}…</span>
          <span style={{fontWeight:600,color:"var(--acc)"}}>Ler resumo →</span>
        </div>
      </div>
      <div className="grid">
        {resto.map((it, i) => (
          <article className="card" key={it.url} onClick={() => setAberta(i + 1)}>
            <Imagem item={it} idx={i + 1} />
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
            </div>
          </article>
        ))}
      </div>
      {aberta !== null && <Detalhe item={lista[aberta]} idx={aberta} onClose={() => setAberta(null)} />}
      <footer>{NEWS.length} notícias · resumos produzidos em português a partir das fontes originais</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
