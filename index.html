<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 3 de outubro de 2026</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mut:#6b7080;--line:#e6e8f0;--acc:#4f46e5;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{font-size:30px;margin:0;letter-spacing:-.02em}
.date{color:var(--mut);font-size:14px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(20,22,31,.08);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(20,22,31,.13)}
.hero .img{min-height:340px}
.hero .txt{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 14px rgba(20,22,31,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,22,31,.12)}
.card .img{height:190px}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px;line-height:1.3;margin:0}
.img{position:relative;background:#e9eaf2;overflow:hidden}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-weight:600;font-size:12px}
.Branding{background:#fff0e0;color:#b45309}.Design{background:#dcf5ee;color:#0f766e}.Tecnologia{background:#e7e5ff;color:#4338ca}
.stars{color:#f5a524;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(15,17,28,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;animation:fade .25s}
.modal{background:#fff;border-radius:24px;max-width:760px;width:100%;max-height:92vh;overflow:auto;animation:up .3s}
.modal .img{height:320px}
.modal .in{padding:26px 30px 32px}
.modal h2{font-size:26px;line-height:1.2;margin:10px 0 4px}
.modal .orig{color:var(--mut);font-size:14px;font-style:italic;margin-bottom:14px}
.modal p{font-size:16px;margin:0 0 14px}
.nota{font-size:13px;color:var(--mut);background:#f3f4f8;padding:8px 12px;border-radius:10px}
.btn{display:inline-block;margin-top:10px;padding:10px 18px;background:var(--acc);color:#fff;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btn.g{background:#eceef6;color:var(--ink);margin-left:8px}
footer{margin-top:36px;color:var(--mut);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.hero h2{font-size:23px}.modal .img{height:210px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const NEWS=[
{
 title: "Vollebak creates Rock Jacket from 54,000 slate tiles",
 tituloPt: "Vollebak cria jaqueta de pedra feita com 54 mil lascas de ardósia",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/02/vollebak-rock-jacket-slate-tiles/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/vollebak-rock-jacket-slate-tiles_dezeen_2364_hero_7.jpg",
 cat:"Design", stars:5,
 resumo:["A marca experimental de roupas Vollebak apresentou uma jaqueta única composta por cerca de 54 mil pequenas peças de ardósia. Cada lasca mede 5 mm por 5 mm, tem meio milímetro de espessura e é fixada sobre uma base de neoprene, o que mantém o conjunto flexível.","Os criadores a descrevem como uma jaqueta Harrington de estilo ficção científica. Segundo o cofundador Nick Tidball, a rocha parecia 'o próximo desafio lógico' para uma marca que vive de questionar quais materiais podem virar roupa.","O projeto foi desenvolvido com o tecnólogo francês Steven Leprizé, aproveitando técnicas da antiga Wooden Jacket da marca. Para Leprizé, a etapa mais crítica entre as cerca de 50 do processo é o corte a laser preciso dos quadradinhos, que permite à peça dobrar e acompanhar o corpo.","A Vollebak pretende comercializar o design em até dois anos, posicionando a rocha como material alternativo, durável e sustentável, em contraponto à cultura da moda descartável."]
},
{
 title: "Perfect Storm helps switch pet protection firm from identibase to identi",
 tituloPt: "Perfect Storm transforma a identibase em 'identi', com logo que é focinho e marcador de mapa",
 source: "Design Week",
 url: "https://www.designweek.co.uk/perfect-storm-helps-switch-pet-protection-firm-from-identibase-to-identi/",
 imageUrl: "https://www.designweek.co.uk/content/uploads/2026/10/identi-branded-merchandise-flat-lay-1024x640.png",
 cat:"Branding", stars:5,
 resumo:["A agência Perfect Storm, de Leeds, rebatizou e redesenhou a empresa de proteção para pets identibase, que agora se chama identi. A marca anterior era descrita como profissional, limpa e simples, mas, num mercado cada vez mais lotado, parecia corporativa e envelhecida.","A nova identidade aposta num tom mais caloroso e acessível, com paleta ousada de índigo, rosa e bege, além de fotografias autênticas de tutores e seus bichos. O novo logo funciona ao mesmo tempo como focinho de animal e como marcador de mapa, reforçando a função de localizar pets perdidos.","A agência evitou os clichês do setor e trocou imagens idealizadas por retratos realistas. O diretor criativo Matt Rennie resumiu: é alegre, mas caótico, e às vezes é estar na rua de pijama gritando 'Fluffy' às 2 da manhã.","A tipografia combina Bigek Black nos títulos e Proxima Nova Bold no texto. A implantação será gradual, em materiais digitais e impressos."]
},
{
 title: "Nothing wants to revolutionise the takeaway paper cup",
 tituloPt: "A Nothing quer revolucionar o copo de papel para viagem, com tampa integrada e compostável",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/02/nothing-takeaway-paper-cup/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/nothing-paper-cup_dezeen_2364_sq.jpg",
 cat:"Design", stars:4,
 resumo:["A empresa americana Nothing (sem relação com a fabricante de eletrônicos) desenvolveu copos de papel com tampa integrada e materiais compostáveis. Há duas versões: uma para bebidas quentes, com bico cônico fechado por três abas dobráveis, e outra para frias, com quatro dobras e abertura para canudo.","Fundada pelos irmãos Brandon e Jordan Leeds, um programador e um designer de produto, a empresa nasceu da irritação com o greenwashing, como canudos de papel vendidos em copos plásticos. O revestimento é à base de água, certificado como livre de plástico pela Flustix, e o copo se decompõe em até 180 dias em compostagem doméstica, com selo TÜV OK compost HOME.","Eliminar a tampa separada reduz embalagem, transporte e estoque para os negócios. Brandon admite que haverá resistência: as pessoas gostam do que já conhecem, e mudanças só são aceitas quando viram norma. O copo de papel quase não mudou desde 1907.","Hoje os copos já são usados por milhares de vendedores nos EUA e no Canadá."]
},
{
 title: "This Stained Glass Car Imagines a Future Where You Sleep Through Your Commute",
 tituloPt: "Carro de vitral imagina um futuro em que você dorme durante o trajeto até o trabalho",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/02/this-stained-glass-car-imagines-a-future-where-you-sleep-through-your-commute/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/09/this-stained-glass-car-imagines-a-future-where-you-sleep-through-your-commute/Stained_glass_car_01.jpg",
 cat:"Design", stars:4,
 resumo:["O designer Dominic Wilcox criou o Stained Glass Driverless Sleeper Car, conceito de veículo autônomo pensado em torno do conforto do passageiro e não da mecânica de dirigir. Dentro há uma cama, e por fora uma carcaça feita de centenas de peças de vitral cortadas à mão, uma 'catedral em miniatura sobre rodas'.","Wilcox situa o projeto em 2059, quando carros autônomos serão estatisticamente mais seguros que motoristas humanos. Sem necessidade de controle ativo, a arquitetura do carro pode priorizar a experiência, e aqui isso significa dormir no caminho.","A casca usa a técnica tradicional de vitral com fita de cobre, inspirada na estética da Catedral de Durham, e contrasta com o chassi modular controlado por computador. O trabalho foi feito para a mostra Dezeen e MINI Frontiers, durante o London Design Festival, com referências sutis ao Mini original de 1959, como pneus de época e peças reaproveitadas.","Wilcox também criou o 'Taxirobot', que imagina o transporte de 2059 como espaços arquitetônicos temporários e personalizáveis, em vez de veículos próprios."]
},
{
 title: "You can buy a Server Rack plush toy that actually emits Data Center noise when you hug it",
 tituloPt: "Pelúcia 'Bezzy' em forma de rack de servidor emite o zumbido de um data center quando abraçada",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/02/you-can-buy-a-server-rack-plush-toy-that-actually-emits-data-center-noise-when-you-hug-it/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/auto-draft/bezzy_data_center_stuffed_toy_1.jpeg",
 cat:"Design", stars:4,
 resumo:["Rajeev Basu e Alan Wilkis criaram Bezzy, pelúcia satírica que critica a indústria de data centers. Ela imita os bichinhos de campanhas de adoção de caridade, mas tem estética de rack de servidor, com luzes LED azuis no tronco. Ao ser abraçada, emite o zumbido real de um data center da Virgínia.","O brinquedo é a peça central de 'Adopt A Data Center', projeto que imita sites de adoção, com o lema 'Tudo o que eles pedem é tudo'. O som foi captado com uma moradora que vive ao lado de um dos mais de 500 data centers da região.","A pesquisa por trás do projeto destaca o enorme consumo de eletricidade e água dessas instalações. Foram feitas só 20 unidades artesanais, a US$ 99 cada.","A sátira mira o modo como empresas de IA se apresentam como inofensivas por meio de branding fofo, enquanto escondem impactos ambientais e o uso de dados. Bezzy chega junto do primeiro álbum em sete anos do músico Big Data."]
},
{
 title: "New Logo and Identity for Bankrate by KOTA",
 tituloPt: "Bankrate ganha novo logo e identidade assinados pela KOTA",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_bankrate_by_kota.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/bankrate_logo_before_after.png",
 cat:"Branding", stars:4,
 resumo:["A empresa de conteúdo financeiro Bankrate recebeu uma atualização completa de marca feita pela agência KOTA. A mudança moderniza a identidade visual preservando o posicionamento da empresa no setor financeiro.","Pelos elementos públicos da publicação, o novo sistema combina tipografia serifada e azul, escolhas clássicas para transmitir estabilidade e confiança, além de iconografia refinada que funciona em pontos de contato digitais e físicos.","A marcação 'Spotted' do Brand New indica um exemplo digno de registro no acervo de rebrandings do site, que costuma comparar o antes e o depois do logo.","O projeto reflete a abordagem da KOTA de modernizar marcas financeiras tradicionais sem abrir mão do reconhecimento já construído."],
 nota:"Artigo restrito a assinantes: resumo baseado nos elementos públicos (título, categoria, tags e imagem comparativa)."
},
{
 title: "Tidy Cats taps Kumail Nanjiani and Jordan Howlett for true-crime parody 'Special Litter Unit'",
 tituloPt: "Tidy Cats chama Kumail Nanjiani e Jordan Howlett para paródia de true crime, a 'Special Litter Unit'",
 source: "Campaign",
 url: "https://www.campaignlive.com/article/tidy-cats-taps-kumail-nanjiani-jordan-howlett-true-crime-parody-special-litter-unit/1971598",
 imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/Tidy-Cats-UWP-CUS.jpg",
 cat:"Branding", stars:4,
 resumo:["A Tidy Cats, marca de areia sanitária da Purina, com a agência Golin Ketchum, lançou 'Special Litter Unit' (S.L.U.), série cômica de três episódios no estilo drama policial. Kumail Nanjiani e o criador de conteúdo Jordan Howlett interpretam parceiros detetives.","Os 'crimes' investigados são problemas da caixa de areia: odor, torrões fracos e rastro de grãos, justamente o que a linha Performance+ promete resolver.","Os episódios foram lançados ao longo da semana no Instagram, TikTok e YouTube, unindo apelo de celebridade e credibilidade de criador em vídeos curtos. A campanha inclui ainda uma experiência pop-up no SoHo, em Manhattan, com adoção de gatos da Petfinder tratados como 'agentes felinos'.","Nanjiani contou que leva a experiência de ser tutor dos gatos Bagel e Biscuit para o papel."]
},
{
 title: "Sean Parker is rebuilding Stability AI around music",
 tituloPt: "Sean Parker está reconstruindo a Stability AI em torno da música",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/02/sean-parker-is-rebuilding-stability-ai-around-music/",
 imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/Sean-Parker.jpg?w=1024",
 cat:"Tecnologia", stars:4,
 resumo:["Sean Parker, cofundador do Napster, voltou à indústria musical com uma abordagem colaborativa. Ele entrou na Stability AI há dois anos, num resgate de US$ 80 milhões, e agora, com o CEO Prem Akkaraju, reposiciona a empresa como plataforma de ferramentas de IA para música.","A companhia captou US$ 76 milhões de grandes gravadoras (Sony, Warner e Universal), que também liberaram direitos de catálogo para o treinamento dos modelos.","A Stability apresentou três novos modelos de áudio e um software de edição capaz de gerar composições instrumentais completas ou trechos curtos a partir de texto. Um recurso a caminho permitirá guiar a geração cantarolando melodias ou fazendo beatbox.","O contraste com o passado de Parker é marcante: do disruptor do Napster a parceiro do setor que antes combatia."]
},
{
 title: "Pope Leo XIV is not a fan of AI-generated art",
 tituloPt: "Papa Leão XIV não é fã de arte gerada por IA",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/02/pope-leo-xiv-is-not-a-fan-of-ai-generated-art/",
 imageUrl: null,
 cat:"Tecnologia", stars:3,
 resumo:["O Papa Leão XIV criticou publicamente imagens geradas por IA, defendendo que existe uma diferença fundamental entre a criatividade humana e o conteúdo produzido por máquinas.","Em suas palavras, há uma 'diferença ontológica, antes mesmo de estética' entre a arte e aquilo que uma máquina gera por cálculo estatístico a partir de milhões de imagens criadas por outras pessoas.","Para o pontífice, os algoritmos não têm a essência humana presente na criação. A posição dá continuidade a uma encíclica divulgada em maio sobre IA e dignidade humana na era da automação.","O texto observa ainda que a Anthropic tentou convencer autoridades do Vaticano a rever a posição sobre a consciência das máquinas, com resultados aparentemente pequenos."]
},
{
 title: "Elon Musk's Grokipedia gets a scholarly makeover",
 tituloPt: "Grokipedia, de Elon Musk, ganha visual 'acadêmico' em redesenho",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/web-design/elon-musks-grokipedia-gets-a-scholarly-makeover",
 imageUrl: "https://cdn.mos.cms.futurecdn.net/ERtPKhSXpKqvnhSQtRFUgF-1920-80.jpg",
 cat:"Design", stars:3,
 resumo:["A Grokipedia, enciclopédia movida a IA de Elon Musk que estava dormente, voltou com interface redesenhada na versão 0.3. Entre as novidades estão um logo em fonte script e uma home inspirada em bibliotecas, com capas de livros 3D interativas e seções de navegação.","A autora Natalie Fear é cética: 'aparência não é tudo', sobretudo pelo histórico de fontes frágeis e suspeitas de viés. Ela nota que, apesar da melhor experiência de uso, o layout basicamente espelha o da Wikipédia, sem originalidade na arquitetura.","O serviço foi lançado em outubro de 2025 com conteúdo da Wikipédia clonado por IA, ganhou a v0.2 em novembro e suspendeu a edição autônoma por IA no início de 2026, antes deste redesenho."]
},
{
 title: "New Logo and Identity for Alexa of London by Lazy Snail",
 tituloPt: "Alexa of London recebe novo logo e identidade da Lazy Snail",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_alexa_of_london_by_lazy_snail.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/alexa_of_london_logo_before_after.png",
 cat:"Branding", stars:3,
 resumo:["A Lazy Snail redesenhou o logo e o sistema de identidade da Alexa of London. O trabalho se concentra num tratamento renovado do wordmark, que deixa a versão anterior e adota um visual mais contemporâneo.","O post, classificado como 'Noted' no Brand New, traz tags que remetem a barcos e a wordmark, sugerindo que imagens náuticas podem ter papel na nova direção.","O caso ilustra como um refinamento tipográfico pode atualizar a presença de uma marca preservando seu reconhecimento."],
 nota:"Artigo restrito a assinantes: resumo baseado apenas nos elementos públicos (categoria, tags e imagem comparativa)."
},
{
 title: "Studio Armitage creates Field Shelter for people tending allotments in Nara",
 tituloPt: "Studio Armitage cria o Field Shelter, abrigo para quem cuida de hortas em Nara, no Japão",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/03/studio-armitage-field-shelter/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/field-shelter-studio-armitage-nara-japan-architecture-pavilion-wood-polycarbonate_dezeen_1704_hero.jpg",
 cat:"Design", stars:3,
 resumo:["O escritório londrino Studio Armitage projetou o Field Shelter, pavilhão de madeira em Nara, no Japão, para quem cultiva arrozais e hortas vizinhas. A região carecia de lugares para descansar, e a estrutura é desmontável.","O projeto é mínimo: seções e ripas de madeira apoiadas em blocos de concreto, com cobertura de painéis ondulados de policarbonato. Dois bancos ladeiam um tanque d'água central, que divide o espaço e armazena água compartilhada para os moradores.","Nas palavras do fundador Freddie Armitage, o abrigo é essencialmente um piso elevado, um telhado e dois bancos. Não há frente nem fundo definidos: os bancos olham em direções opostas para captar a luz da manhã e a do fim do dia.","Só foram usados materiais comuns, obtidos localmente, com pouco equipamento, e a construção pode ser desmontada e levada a outro lugar."]
}
];
const PAL={Branding:["#ff9a5a","#ff5e7e","#ffd36b"],Design:["#10b981","#0d9488","#a7f3d0"],Tecnologia:["#4f46e5","#8b5cf6","#60a5fa"]};
function Art({cat,seed}){
 const p=PAL[cat],s=seed*37;
 return <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de "+cat}>
  <defs><linearGradient id={"g"+seed} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
  <rect width="400" height="240" fill={"url(#g"+seed+")"}/>
  <circle cx={80+(s%160)} cy={60+(s%90)} r={70+(s%30)} fill={p[2]} opacity=".35"/>
  <rect x={220+(s%70)} y="90" width="130" height="130" rx="26" fill="#fff" opacity=".22" transform={"rotate("+(s%40)+" 285 155)"}/>
  <circle cx="330" cy="40" r="26" fill="#fff" opacity=".3"/>
 </svg>;
}
function Img({item,i}){
 const [falhou,setFalhou]=useState(false);
 return <div className="img">{item.imageUrl&&!falhou
  ? <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
  : <Art cat={item.cat} seed={i+1}/>}</div>;
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
const Meta=({item})=><div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><span>{item.source}</span><Stars n={item.stars}/></div>;
function Modal({item,i,close}){
 useEffect(()=>{const k=e=>e.key==="Escape"&&close();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[]);
 return <div className="modal-bg" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
  <Img item={item} i={i}/>
  <div className="in"><Meta item={item}/><h2>{item.tituloPt}</h2><div className="orig">{item.title}</div>
   {item.resumo.map((p,k)=><p key={k}>{p}</p>)}
   {item.nota&&<div className="nota">{item.nota}</div>}
   <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) ↗</a>
   <button className="btn g" onClick={close}>Fechar</button></div></div></div>;
}
function App(){
 const [sel,setSel]=useState(null);
 const [top,...rest]=NEWS;
 return <div className="wrap">
  <header><h1>☀️ Portal da Manhã</h1><div className="date">Sábado, 3 de outubro de 2026 · {NEWS.length} notícias</div></header>
  <div className="hero" onClick={()=>setSel(0)}><Img item={top} i={0}/><div className="txt"><Meta item={top}/><h2>{top.tituloPt}</h2><div style={{color:"#6b7080"}}>{top.resumo[0].slice(0,170)}…</div><div style={{color:"#4f46e5",fontWeight:600}}>Ler resumo →</div></div></div>
  <div className="grid">{rest.map((it,k)=><div className="card" key={k} onClick={()=>setSel(k+1)}><Img item={it} i={k+1}/><div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div></div>)}</div>
  {sel!==null&&<Modal item={NEWS[sel]} i={sel} close={()=>setSel(null)}/>}
  <footer>Resumos parafraseados em português. Clique em uma notícia para ler o resumo e acessar a fonte.</footer>
 </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
