<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 14 de agosto de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:#f6f6f4;
    --surface:#ffffff;
    --ink:#14161a;
    --ink-2:#4a5058;
    --ink-3:#868d96;
    --line:#e6e6e2;
    --accent:#d2451e;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 28px rgba(20,22,26,.06);
    --shadow-lg:0 2px 6px rgba(20,22,26,.06), 0 24px 60px rgba(20,22,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 96px}

  /* ---------- Cabeçalho ---------- */
  header.top{padding:56px 0 34px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  h1.brand{
    font-family:'Fraunces',Georgia,serif;font-weight:700;
    font-size:clamp(40px,7vw,74px);line-height:.98;letter-spacing:-.025em;
    margin:16px 0 14px;
  }
  .sub{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--ink-3);font-size:14.5px}
  .sub b{color:var(--ink-2);font-weight:600}

  /* ---------- Manchete ---------- */
  .lead{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s;
    display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:44px;
  }
  .lead:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .lead .media{position:relative;min-height:380px;background:#ececea}
  .lead .body{padding:40px 42px;display:flex;flex-direction:column;justify-content:center}
  .lead h2{
    font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:clamp(26px,3vw,38px);line-height:1.14;letter-spacing:-.02em;margin:14px 0 16px;
  }
  .lead p.dek{color:var(--ink-2);font-size:16px;line-height:1.62;margin:0 0 24px}

  /* ---------- Grid de cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card .media{position:relative;height:196px;background:#ececea}
  .card .body{padding:20px 22px 24px;display:flex;flex-direction:column;flex:1}
  .card h3{
    font-family:'Fraunces',Georgia,serif;font-weight:600;
    font-size:19.5px;line-height:1.24;letter-spacing:-.012em;margin:12px 0 10px;
  }
  .card p.dek{color:var(--ink-2);font-size:14.2px;line-height:1.58;margin:0 0 18px;flex:1}

  /* ---------- Meta ---------- */
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
    padding:5px 10px;border-radius:999px;
  }
  .tag.branding{background:#fdeee6;color:#b03d17}
  .tag.design{background:#e4f3ee;color:#17715a}
  .tag.tec{background:#e9ecfb;color:#3a44a8}
  .src{font-size:12.5px;color:var(--ink-3);font-weight:500}
  .stars{margin-left:auto;font-size:12.5px;letter-spacing:1.5px;color:#e0a32c;white-space:nowrap}
  .foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
  .lead .foot{border-top:none;padding-top:0;margin-top:6px}

  img.shot{width:100%;height:100%;object-fit:cover;display:block}

  /* ---------- Overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(18,20,24,.5);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
    z-index:50;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:var(--surface);border-radius:24px;max-width:800px;width:100%;
    box-shadow:0 40px 90px rgba(0,0,0,.3);overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.3,1);
    margin:auto;
  }
  .modal .media{height:340px;background:#ececea;position:relative}
  .modal .inner{padding:34px 40px 40px}
  .modal h2{
    font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(24px,3.4vw,33px);
    line-height:1.16;letter-spacing:-.02em;margin:16px 0 6px;
  }
  .modal .orig{font-size:13.5px;color:var(--ink-3);font-style:italic;margin:0 0 22px;line-height:1.5}
  .modal .resumo p{font-size:16.5px;line-height:1.75;color:#282c33;margin:0 0 18px}
  .modal .nota{font-size:13.5px;color:var(--ink-3);border-left:3px solid var(--line);padding-left:14px;margin:22px 0 0;line-height:1.6}
  .actions{display:flex;gap:12px;align-items:center;margin-top:30px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    font-size:14.5px;font-weight:600;padding:13px 22px;border-radius:999px;
    border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
    transition:opacity .2s;font-family:inherit;
  }
  .btn:hover{opacity:.85}
  .btn.ghost{background:transparent;color:var(--ink)}
  .closeX{
    position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:19px;line-height:1;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.16);z-index:2;
  }

  footer.end{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13.5px;line-height:1.7}

  @media (max-width:960px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .lead{grid-template-columns:1fr}
    .lead .media{min-height:250px}
    .lead .body{padding:28px 26px 32px}
  }
  @media (max-width:620px){
    .wrap{padding:0 16px 64px}
    .grid{grid-template-columns:1fr}
    .modal .inner{padding:26px 22px 32px}
    .modal .media{height:220px}
    .overlay{padding:16px}
  }
</style>
</head>

const paletas = {
  "Branding": ["#F4A261","#E76F51","#F6D8B8"],
  "Design":   ["#2A9D8F","#48BFA5","#CFEDE5"],
  "Tecnologia":["#5B6BE1","#8B5CF6","#D6DBFB"]
};

function Ilustracao({ categoria, seed, alto }) {
  const p = paletas[categoria] || paletas["Design"];
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:'100%',height:'100%',display:'block'}} aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`}/>
      <circle cx={60 + r(1)*280} cy={40 + r(2)*160} r={40 + r(3)*55} fill={p[2]} opacity="0.55"/>
      <circle cx={40 + r(4)*320} cy={60 + r(5)*150} r={25 + r(6)*40} fill="#ffffff" opacity="0.28"/>
      <rect x={r(7)*260} y={r(8)*170} width={60 + r(9)*110} height={12 + r(10)*16}
            rx="8" fill="#ffffff" opacity="0.4"
            transform={`rotate(${-25 + r(11)*50} 200 130)`}/>
      <path d={`M0 ${190 + r(12)*40} Q 100 ${140 + r(13)*60} 200 ${190 + r(14)*40} T 400 ${180 + r(15)*50} L400 260 L0 260 Z`}
            fill="#ffffff" opacity="0.22"/>
    </svg>
  );
}

function Imagem({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={seed}/>;
  }
  return (
    <img className="shot" src={item.imageUrl} alt={item.tituloPt}
         referrerPolicy="no-referrer" loading="lazy"
         onError={() => setFalhou(true)}/>
  );
}

function Estrelas({ n }) {
  return <span className="stars" title={`${n} de 5`}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
}

function Tag({ c }) {
  const cls = c === "Branding" ? "branding" : c === "Tecnologia" ? "tec" : "design";
  return <span className={`tag ${cls}`}>{c}</span>;
}

function Modal({ item, seed, fechar }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") fechar(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [fechar]);

  return (
    <div className="overlay" onClick={fechar}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="media">
          <button className="closeX" onClick={fechar} aria-label="Fechar">×</button>
          <Imagem item={item} seed={seed}/>
        </div>
        <div className="inner">
          <div className="meta">
            <Tag c={item.categoria}/>
            <span className="src">{item.source}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="resumo">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <p className="nota">
              Este artigo está atrás de assinatura no {item.source}. O resumo acima foi escrito a partir
              dos elementos públicos da página — título, categoria editorial, indústria, tags e imagem de
              destaque. A análise crítica completa não foi lida.
            </p>
          )}
          <div className="actions">
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn ghost" onClick={fechar}>Voltar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...noticias].sort((a, b) => b.estrelas - a.estrelas);
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);
  const portais = new Set(noticias.map(n => n.source)).size;
  const comFoto = noticias.filter(n => n.imageUrl).length;

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker"><span className="dot"></span> Edição de sexta-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="sub">
          <span><b>14 de agosto de 2026</b></span>
          <span>{noticias.length} notícias</span>
          <span>{portais} portais</span>
          <span>{comFoto} com imagem original</span>
          <span>Branding · Design · Tecnologia</span>
        </div>
      </header>

      <article className="lead" onClick={() => setAberto(manchete)}>
        <div className="media"><Imagem item={manchete} seed={1}/></div>
        <div className="body">
          <div className="meta">
            <Tag c={manchete.categoria}/>
            <span className="src">{manchete.source}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p className="dek">{manchete.dek}</p>
          <div className="foot"><span className="src">Clique para ler o resumo completo →</span></div>
        </div>
      </article>

      <div className="grid">
        {resto.map((item, i) => (
          <article className="card" key={i} onClick={() => setAberto(item)}>
            <div className="media"><Imagem item={item} seed={i + 2}/></div>
            <div className="body">
              <div className="meta">
                <Tag c={item.categoria}/>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="foot"><span className="src">{item.source}</span></div>
            </div>
          </article>
        ))}
      </div>

      <footer className="end">
        <p>
          <b>Portal da Manhã</b> — seleção diária de branding, design e tecnologia a partir dos principais
          portais internacionais do setor. Resumos escritos em português a partir da leitura das matérias
          originais; nenhum texto é reproduzido literalmente. As imagens são carregadas diretamente dos
          servidores dos veículos de origem e pertencem a eles.
        </p>
        <p>Edição de 14 de agosto de 2026 · Fontes: Design Week, Brand New, Campaign US, Dezeen, Creative Bloq e It’s Nice That.</p>
      </footer>

      {aberto && <Modal item={aberto} seed={99} fechar={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
