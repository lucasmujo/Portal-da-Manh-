<style>
  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;

  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}

  .lead{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);
        border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .22s ease,box-shadow .22s ease}

  .lead .media img,.lead .media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .lead .body{padding:34px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .lead h2{font-size:clamp(23px,2.7vw,34px);line-height:1.16;letter-spacing:-.02em;margin:0;font-weight:800}
  .lead p.dek{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}
  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}.lead .media{min-height:230px;position:relative}}
  @media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:0 16px 60px}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;
        display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease}
  .card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(20,20,25,.06),0 16px 36px rgba(20,20,25,.09)}
  .thumb{position:relative;width:100%;aspect-ratio:16/10;background:#eceae5;overflow:hidden}
  .thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{margin:0;font-size:17px;line-height:1.3;letter-spacing:-.01em;font-weight:700}
  .card p.dek{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}

  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--accent)}
  .cat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
       border:1px solid var(--line);border-radius:999px;padding:3px 9px}
  .stars{font-size:12.5px;color:#c99a2e;letter-spacing:1px;margin-left:auto}

  .sechead{display:flex;align-items:baseline;gap:14px;margin:46px 0 4px}
  .sechead h2{font-size:14px;letter-spacing:.16em;text-transform:uppercase;margin:0;color:var(--muted);font-weight:700}
  .sechead .rule{flex:1;height:1px;background:var(--line)}

  .overlay{position:fixed;inset:0;background:rgba(18,18,22,.55);backdrop-filter:blur(6px);
           display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;
           animation:fade .2s ease;overflow-y:auto}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .modal{background:#fff;max-width:840px;width:100%;border-radius:22px;overflow:hidden;
         box-shadow:0 30px 80px rgba(0,0,0,.28);animation:rise .28s cubic-bezier(.2,.8,.3,1)}

  .modal h2{margin:12px 0 6px;font-size:clamp(21px,3vw,30px);line-height:1.17;letter-spacing:-.02em}
  .modal .orig{margin:0 0 18px;color:var(--muted);font-size:13px;font-style:italic}
  .modal .txt p{font-size:16px;line-height:1.72;color:#23242a;margin:0 0 15px}
  .modal .note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:18px}
  .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);

  .btn:hover{background:#f3f2ee}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  footer{margin-top:64px;padding-top:26px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
</style>
</head>

const PALETAS = {
  "Branding": [["#ff9a5a","#ff5f6d"],["#f7b733","#fc4a1a"],["#ffb26b","#e8505b"]],
  "Design":   [["#43c6ac","#0f7b6c"],["#5ee7c4","#118a7e"],["#7fd8be","#1b6b5a"]],
  "Tecnologia":[["#6a8cff","#8e44ff"],["#5b6ef5","#a13cf5"],["#4facfe","#7f5af0"]]
};

function Ilustracao({ categoria, seed }) {
  const paleta = PALETAS[categoria] || PALETAS["Design"];
  const [c1, c2] = paleta[seed % paleta.length];
  const gid = "g" + categoria.replace(/[^a-z]/gi,"") + seed;
  const rot = (seed * 37) % 360;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração gerada">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c1}/><stop offset="100%" stopColor={c2}/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={`url(#${gid})`}/>
      <g opacity="0.28" fill="#fff" transform={`rotate(${rot} 200 125)`}>
        <circle cx="90" cy="70" r="58"/>
        <rect x="200" y="30" width="130" height="130" rx="18"/>
        <path d="M40 240 L150 120 L260 240 Z"/>
      </g>
      <g opacity="0.18" stroke="#fff" strokeWidth="2" fill="none">
        <circle cx="300" cy="190" r="45"/>
        <circle cx="300" cy="190" r="72"/>
      </g>
    </svg>
  );
}

function Figura({ item, className }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <div className={className}><Ilustracao categoria={item.categoria} seed={item.id}/></div>;
  }
  return (
    <div className={className}>
      <img src={item.imageUrl} referrerPolicy="no-referrer" loading="lazy"
           alt={item.tituloPt} onError={() => setFalhou(true)}/>
    </div>
  );
}

function Estrelas({ n }) {
  return <span className="stars">{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
}

function Modal({ item, fechar }) {
  return (
    <div className="overlay" onClick={fechar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <Figura item={item} className="hero"/>
        <div className="inner">
          <div className="meta">
            <span className="src">{item.source}</span>
            <span className="cat">{item.categoria}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="txt">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall &&
            <p className="note">Matéria total ou parcialmente restrita a assinantes. Resumo produzido a partir dos elementos públicos da página.</p>}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={fechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a,b) => b.estrelas - a.estrelas || a.id - b.id);
  const [manchete, ...resto] = ordenadas;
  const portais = new Set(NOTICIAS.map(n => n.source)).size;

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Portal da Manhã</div>
        <h1 className="brand">Branding, design e tecnologia<br/>nas últimas 24 horas</h1>
        <div className="datebar">
          <strong>Quarta-feira, 16 de setembro de 2026</strong>
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais} portais</span>
          <span className="pill">Edição diária</span>
        </div>
      </header>

      <div className="lead" onClick={() => setAberto(manchete)}>
        <Figura item={manchete} className="media"/>
        <div className="body">
          <div className="meta">
            <span className="src">{manchete.source}</span>
            <span className="cat">{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p className="dek">{manchete.dek}</p>
        </div>
      </div>

      <div className="sechead"><h2>Mais desta edição</h2><div className="rule"></div></div>

      <div className="grid">
        {resto.map(item => (
          <div className="card" key={item.id} onClick={() => setAberto(item)}>
            <Figura item={item} className="thumb"/>
            <div className="body">
              <div className="meta">
                <span className="src">{item.source}</span>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
            </div>
          </div>
        ))}
      </div>

      <footer>
        Portal da Manhã — edição de 16 de setembro de 2026. Seleção e resumos em português produzidos a partir de
        matérias publicadas por Brand New, Design Week, The Brand Identity, Creative Review, It’s Nice That,
        VentureBeat e Dezeen. Os textos são paráfrases originais; clique em qualquer notícia para acessar a fonte.
        As imagens são carregadas diretamente dos servidores dos portais e pertencem a seus respectivos detentores.
      </footer>

      {aberto && <Modal item={aberto} fechar={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
