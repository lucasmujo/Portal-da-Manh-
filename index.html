      "No podcast Equity, do TechCrunch, Anthony Ha, Sean O'Kane e Rebecca Bellan debateram a decisão. Bellan duvida que as atuais moratórias tenham efeito duradouro, pois costumam durar um ou dois anos, enquanto as instalações levam anos para ficar prontas. Ha citou uma moratória de cerca de um ano em Nova York para licenças de grandes projetos, que deixa margem para aprovação posterior.",
      "O'Kane argumentou que negociações secretas alimentam a revolta pública e comparou a prática aos acordos sigilosos do Uber com governos locais em meados dos anos 2010. Ha ponderou que encerrar os NDAs não conquista opositores automaticamente, mas é um bom primeiro passo, já que moradores muitas vezes nem sabem o que está sendo construído.",
      "O problema maior, segundo O'Kane, é de comunicação: a indústria se explica mal e as pessoas têm dificuldade de ver utilidade da IA para elas. O episódio também comenta a missão \"abundância\" da Tesla, e Ha sugere que a pressão pública obriga as empresas de IA a defender de fato seu trabalho em vez de tratá-lo como inevitável."
    ]
  },
  {
    title: "Will the HomeView be Apple's first smart home success?",
    tituloPt: "O HomeView será o primeiro sucesso da Apple em casa inteligente?",
    source: "TechCrunch",
    url: "https://techcrunch.com/2026/10/11/will-the-homeview-be-apples-first-smart-home-success/",
    imageUrl: "https://techcrunch.com/wp-content/uploads/2021/11/homepod.jpg?resize=1200,854",
    cat: "Tecnologia", stars: 2,
    resumo: [
      "Citando Mark Gurman, da Bloomberg, o TechCrunch relata que a Apple anunciará na terça-feira um novo hub de casa inteligente chamado HomeView.",
      "Segundo Gurman, o aparelho é um dispositivo \"movido pela Siri\", com tela e chip A18, projetado para controlar outros gadgets da casa. Haveria duas versões: uma de bancada e outra para parede.",
      "O texto chama o HomeView de a aposta mais séria da Apple em casa inteligente, depois da adesão limitada ao HomeKit e ao HomePod. No mesmo evento, a empresa deve apresentar uma Apple TV e um HomePod mini atualizados.",
      "No começo da semana, Gurman também havia reportado que a Apple pretende fazer parceria com a LG em fechadura, termostato e campainha inteligentes. Rumores de um produto assim circulam há alguns anos, mas esta é a primeira vez que surgem nome e data de lançamento.",
      "A matéria, assinada por Anthony Ha, deixa a pergunta em aberto: o HomeView será o primeiro grande sucesso da Apple na casa conectada?"
    ],
    nota: "Imagem de arquivo do HomePod (a que o portal definiu como imagem de destaque)."
  }
];
NEWS[1].nota = "Imagem de destaque não disponível; exibindo ilustração gerada.";
NEWS[9].nota = "Resumo baseado no episódio do podcast Equity descrito na página do artigo.";

const PALETTES = {
  Branding: [["#fb923c","#f43f5e"],["#fbbf24","#ea580c"],["#f472b6","#f97316"]],
  Design: [["#10b981","#0d9488"],["#34d399","#0891b2"],["#2dd4bf","#16a34a"]],
  Tecnologia: [["#6366f1","#8b5cf6"],["#3b82f6","#7c3aed"],["#60a5fa","#a855f7"]]
};
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function Illustration({item}){
  const h=hash(item.title), p=PALETTES[item.cat][h%3], id="g"+h;
  const sh=[0,1,2,3].map(i=>({x:(h>>(i*3))%100*8,y:(h>>(i*2+1))%100*4,r:40+((h>>i)%90),o:.15+((h>>i)%4)*.08}));
  return (
    <svg viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: "+item.tituloPt}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
      <rect width="800" height="400" fill={`url(#${id})`}/>
      {sh.map((s,i)=> i%2? <circle key={i} cx={s.x} cy={s.y} r={s.r} fill="#fff" opacity={s.o}/> : <rect key={i} x={s.x-s.r} y={s.y-s.r} width={s.r*2} height={s.r*1.4} rx="18" fill="#fff" opacity={s.o} transform={`rotate(${(h>>i)%40-20} ${s.x} ${s.y})`}/>)}
    </svg>
  );
}
function Media({item}){
  const [falhou,setFalhou]=useState(false);
  return (
    <div className="media">
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Foto da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
        : <Illustration item={item}/>}
    </div>
  );
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Meta({item}){return <div className="meta"><span className={"tag t-"+item.cat}>{item.cat}</span><span>{item.source}</span><Stars n={item.stars}/></div>}

function Modal({item,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[]);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <Media item={item}/>
        <div className="inner">
          <Meta item={item}/>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: {item.title}</p>
          {item.resumo.map((p,i)=><p className="s" key={i}>{p}</p>)}
          {item.nota && <p className="note">{item.nota}</p>}
          <div className="btns">
            <a className="btn p" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
            <button className="btn g" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}
function App(){
  const [open,setOpen]=useState(null);
  const sorted=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [top,...rest]=sorted;
  return (
    <div className="wrap">
      <header className="top">
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">segunda-feira, 12 de outubro de 2026</div>
      </header>
      <div className="hero" onClick={()=>setOpen(top)}>
        <Media item={top}/>
        <div className="body">
          <Meta item={top}/>
          <h2>{top.tituloPt}</h2>
          <p>{top.resumo[0]}</p>
          <span style={{color:"var(--acc)",fontWeight:600,fontSize:14}}>Ler resumo →</span>
        </div>
      </div>
      <div className="grid">
        {rest.map(it=>(
          <article className="card" key={it.url} onClick={()=>setOpen(it)}>
            <Media item={it}/>
            <div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div>
          </article>
        ))}
      </div>
      <footer>Resumos escritos em português a partir dos artigos originais · Fotos hospedadas nos portais de origem · Edição de 12/10/2026</footer>
      {open && <Modal item={open} onClose={()=>setOpen(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
