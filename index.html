<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 12 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:#f6f6f4;
    --surface:#ffffff;
    --ink:#15171a;
    --ink-2:#4a5057;
    --ink-3:#868d95;
    --line:#e6e5e1;
    --accent:#d8452f;
    --radius:20px;
    --shadow:0 1px 2px rgba(16,18,20,.04), 0 8px 24px rgba(16,18,20,.06);
    --shadow-lg:0 2px 4px rgba(16,18,20,.05), 0 18px 48px rgba(16,18,20,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  header.top{padding:56px 0 28px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1.brand{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(38px,6vw,62px);line-height:1.02;margin:12px 0 10px;letter-spacing:-.02em}
  .datebar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;color:var(--ink-3);font-size:14px}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-3);display:inline-block}

  .lede{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s}
  .lede:hover{transform:translateY(-3px)}
  .lede .media{position:relative;min-height:360px;background:#eceae5}
  .lede .media img,.lede .media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .lede .body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center}
  .lede h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,2.6vw,34px);line-height:1.15;margin:14px 0 14px;letter-spacing:-.015em}
  .lede p{color:var(--ink-2);font-size:15.5px;line-height:1.6;margin:0}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:34px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.7,.3,1),box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card .media{position:relative;aspect-ratio:16/10;background:#eceae5;overflow:hidden}
  .card .media img,.card .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:20px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:17px;line-height:1.32;margin:0;font-weight:650;letter-spacing:-.01em}
  .card .dek{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0}

  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 9px;border-radius:999px}
  .t-branding{background:#fdefe9;color:#b8492c}
  .t-design{background:#e6f4ef;color:#1f7a5e}
  .t-tec{background:#ecedfb;color:#4a4fb0}
  .src{font-size:12px;color:var(--ink-3);font-weight:500}
  .stars{font-size:12px;color:#e0a020;letter-spacing:1px;margin-left:auto}

  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(20,22,24,.5);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .sheet{background:var(--surface);max-width:820px;width:100%;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.3);animation:rise .3s cubic-bezier(.2,.7,.3,1)}
  .sheet .media{position:relative;aspect-ratio:16/9;background:#eceae5}
  .sheet .media img,.sheet .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .sheet .body{padding:34px 38px 40px}
  .sheet h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(22px,3vw,32px);line-height:1.18;margin:14px 0 8px;letter-spacing:-.015em}
  .sheet .orig{font-size:13.5px;color:var(--ink-3);margin:0 0 20px;font-style:italic}
  .sheet .text p{font-size:16px;line-height:1.72;color:var(--ink-2);margin:0 0 16px}
  .note{font-size:13px;color:var(--ink-3);background:#faf8f4;border-left:3px solid var(--line);padding:12px 16px;border-radius:0 10px 10px 0;line-height:1.55}
  .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:.18s}
  .btn:hover{background:#f2f1ee}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .closeX{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.16);z-index:2}

  footer{margin:70px 0 50px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;line-height:1.7}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .lede{grid-template-columns:1fr}
    .lede .media{min-height:240px;position:relative;aspect-ratio:16/9}
    .lede .body{padding:28px 26px 30px}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px}
    .grid{grid-template-columns:1fr;gap:20px}
    header.top{padding:36px 0 22px;margin-bottom:28px}
    .sheet .body{padding:26px 22px 32px}
    .overlay{padding:16px 12px}
  }
</style>
</head>

const PALETAS = {
  Branding: ["#f7c59f", "#e8846b", "#d8452f", "#fce8dd"],
  Design:   ["#a8ddd0", "#48a98c", "#1f7a5e", "#e2f3ed"],
  Tecnologia: ["#bcc3f5", "#7a80d8", "#4a4fb0", "#e9eafb"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const s = (seed * 37) % 100;
  const id = "g" + seed;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label={"Ilustração abstrata — " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[3]} />
          <stop offset="55%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[1]} />
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#" + id + ")"} />
      <circle cx={60 + s} cy={70 + (s % 40)} r={64 + (s % 30)} fill={p[2]} opacity="0.22" />
      <circle cx={320 - (s % 60)} cy={200 - (s % 50)} r={48 + (s % 26)} fill={p[2]} opacity="0.16" />
      <rect x={200 + (s % 40)} y={-20} width="90" height="160" rx="14" fill={p[2]} opacity="0.14" transform={"rotate(" + (12 + (s % 25)) + " 245 60)"} />
      <path d={"M0 " + (200 + (s % 30)) + " Q 100 " + (140 + (s % 50)) + " 200 " + (196 + (s % 24)) + " T 400 " + (168 + (s % 40)) + " V250 H0 Z"} fill={p[2]} opacity="0.2" />
      <g opacity="0.35" stroke={p[2]} strokeWidth="1.4" fill="none">
        <circle cx="200" cy="125" r={34 + (s % 18)} />
        <circle cx="200" cy="125" r={58 + (s % 22)} />
      </g>
    </svg>
  );
}

function Media({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={seed} />;
  return (
    <img
      src={item.imageUrl}
      referrerPolicy="no-referrer"
      loading="lazy"
      alt={item.tituloPt}
      onError={() => setFalhou(true)}
    />
  );
}

const tagClass = c => c === "Branding" ? "t-branding" : c === "Tecnologia" ? "t-tec" : "t-design";
const estrelasStr = n => "★".repeat(n) + "☆".repeat(5 - n);

function Sheet({ item, seed, onClose }) {
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", h);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", h); document.body.style.overflow = ""; };
  }, [onClose]);

  const nota = item.resumo.filter(p => p.startsWith("Nota:"));
  const corpo = item.resumo.filter(p => !p.startsWith("Nota:"));

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="media">
          <button className="closeX" onClick={onClose} aria-label="Fechar">✕</button>
          <Media item={item} seed={seed} />
        </div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + tagClass(item.categoria)}>{item.categoria}</span>
            <span className="src">{item.source}</span>
            <span className="stars">{estrelasStr(item.estrelas)}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="text">
            {corpo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {nota.length > 0 && <div className="note">{nota[0]}</div>}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = NOTICIAS;
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição diária · Branding, Design &amp; Tecnologia</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="datebar">
          <span>Sábado, 12 de setembro de 2026</span>
          <span className="dot"></span>
          <span>{ordenadas.length} notícias</span>
          <span className="dot"></span>
          <span>6 portais</span>
        </div>
      </header>

      <article className="lede" onClick={() => setAberto(0)}>
        <div className="media"><Media item={manchete} seed={1} /></div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + tagClass(manchete.categoria)}>{manchete.categoria}</span>
            <span className="src">{manchete.source}</span>
            <span className="stars">{estrelasStr(manchete.estrelas)}</span>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
        </div>
      </article>

      <section className="grid">
        {resto.map((item, i) => (
          <article className="card" key={item.url + i} onClick={() => setAberto(i + 1)}>
            <div className="media"><Media item={item} seed={i + 2} /></div>
            <div className="body">
              <div className="meta">
                <span className={"tag " + tagClass(item.categoria)}>{item.categoria}</span>
                <span className="src">{item.source}</span>
                <span className="stars">{estrelasStr(item.estrelas)}</span>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
            </div>
          </article>
        ))}
      </section>

      {aberto !== null && (
        <Sheet item={ordenadas[aberto]} seed={aberto + 1} onClose={() => setAberto(null)} />
      )}

      <footer>
        Portal da Manhã · edição de 12 de setembro de 2026. Seleção e resumos em português produzidos a partir das publicações originais — nenhum texto é reprodução literal da fonte. Fontes desta edição: Dezeen, Creative Review, Design Week, Brand New, It’s Nice That e VentureBeat.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
