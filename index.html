      "A credora Lowell encomendou 25 porta-copos a cinco ilustradores de cinco cidades britânicas, cada um com uma pergunta para puxar conversas sobre dívidas em bares e cafés; a pesquisa da empresa indica que muitos preferem falar de sexo com a família a falar de dívidas. A coluna ainda cita o Effie australiano de uma dupla norte-irlandesa, nomeações na RSA, a ampliação do conselho do V&A Dundee, a exposição “Chairman”, de Yinka Ilori, e um concurso estudantil de design de latas."
    ]
  },
  {
    title: "New Logo and Identity for The Blaydon Race by Channels Agency",
    tituloPt: "Novo logo e identidade da The Blaydon Race, assinados pela Channels Agency",
    source: "Brand New",
    url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_the_blaydon_race_by_channels_agency.php",
    imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/the_blaydon_race_logo_before_after.png",
    cat: "Branding", stars: 2,
    resumo: [
      "O Brand New, de Armin Vit, publicou em 14 de outubro o novo logo e identidade da The Blaydon Race, corrida de rua tradicional do Reino Unido ligada ao setor de causas beneficentes, criada pela Channels Agency.",
      "A publicação mostra imagens de antes e depois do logotipo. Os elementos públicos da página apontam traços visuais como tipografia serifada e uma paleta de marrom e amarelo, com referência ao Reino Unido.",
      "O texto completo da análise, com o raciocínio do redesenho e as mudanças específicas, não está acessível publicamente."
    ],
    nota: "Matéria atrás de paywall: o resumo se baseia apenas em título, categoria, tags e imagens públicas. Nenhum detalhe adicional foi inventado."
  }
];

const PALETTES = {
  Branding:["#e4572e","#f6a04d","#ffd8a8","#b8401c"],
  Design:["#0f8b7a","#4cc5a8","#bfece0","#0b5d52"],
  Tecnologia:["#4a46b8","#8b7cf0","#c9c2ff","#2d2a7a"]
};
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function Ilustracao({item}){
  const p=PALETTES[item.cat], h=hash(item.title), id="g"+h;
  const r=(n,m)=>((h>>n)%m);
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: "+item.tituloPt}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[3]}/></linearGradient></defs>
      <rect width="400" height="240" fill={"url(#"+id+")"}/>
      <circle cx={80+r(2,240)} cy={50+r(5,100)} r={50+r(3,50)} fill={p[1]} opacity=".55"/>
      <rect x={200+r(4,120)} y={90+r(6,60)} width={90+r(7,60)} height={90+r(8,60)} rx="18" fill={p[2]} opacity=".5" transform={"rotate("+(r(9,40)-20)+" 300 160)"}/>
      <polygon points={`${40+r(1,60)},230 ${130+r(2,60)},120 ${230+r(3,40)},230`} fill={p[2]} opacity=".35"/>
      <circle cx={330} cy={40} r={22} fill="#fff" opacity=".3"/>
    </svg>
  );
}
function Midia({item}){
  const [falhou,setFalhou]=useState(false);
  return (
    <div className="media">
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
        : <Ilustracao item={item}/>}
    </div>
  );
}
const Estrelas=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Meta({item}){
  return <div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><strong>{item.source}</strong><Estrelas n={item.stars}/></div>;
}
function Modal({item,onClose}){
  useEffect(()=>{
    const k=e=>e.key==="Escape"&&onClose();
    document.addEventListener("keydown",k);
    document.body.style.overflow="hidden";
    return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""};
  },[]);
  return (
    <div className="overlay" onClick={onClose}>
      <article className="modal" onClick={e=>e.stopPropagation()}>
        <Midia item={item}/>
        <div className="inner">
          <Meta item={item}/>
          <h2>{item.tituloPt}</h2>
          <div className="orig">Título original: {item.title}</div>
          {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
          {item.nota && <div className="nota">{item.nota}</div>}
          <div className="btns">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </article>
    </div>
  );
}
function App(){
  const [aberto,setAberto]=useState(null);
  const itens=[...ITEMS].sort((a,b)=>b.stars-a.stars);
  const [top,...resto]=itens;
  const data=new Date(2026,9,19).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return (
    <div className="wrap">
      <header><h1>☀️ Portal da Manhã</h1><div className="date">{data}</div></header>
      <section className="hero" onClick={()=>setAberto(top)}>
        <div className="body">
          <Meta item={top}/>
          <h2>{top.tituloPt}</h2>
          <p>{top.resumo[0]}</p>
          <span style={{color:"var(--accent)",fontWeight:600}}>Ler resumo completo →</span>
        </div>
        <Midia item={top}/>
      </section>
      <section className="grid">
        {resto.map(it=>(
          <div className="card" key={it.url} onClick={()=>setAberto(it)}>
            <Midia item={it}/>
            <div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div>
          </div>
        ))}
      </section>
      <footer>Resumos em português produzidos a partir das matérias originais, sem cópia de texto. Imagens carregadas diretamente dos portais.</footer>
      {aberto && <Modal item={aberto} onClose={()=>setAberto(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
