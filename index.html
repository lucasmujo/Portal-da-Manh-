<title>Portal da Manhã — 17 de agosto de 2026</title>

<style>
  :root{
    --bg:#f7f7f5;
    --surface:#ffffff;
    --ink:#15161a;
    --ink-soft:#5b6069;
    --ink-faint:#8a9099;
    --line:#e7e7e3;
    --accent:#c8452f;
    --accent-soft:#fdf1ee;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --shadow-lg:0 2px 6px rgba(20,22,26,.06), 0 24px 60px rgba(20,22,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* Cabeçalho */
  header.top{padding:56px 0 28px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    padding:6px 12px;border-radius:999px;
  }
  h1.title{
    font-family:'Fraunces',Georgia,serif;font-weight:700;
    font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.02em;
    margin:18px 0 10px;
  }
  .subtitle{color:var(--ink-soft);font-size:16px;margin:0}
  .meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;font-size:13px;color:var(--ink-faint)}
  .meta-row b{color:var(--ink);font-weight:600}

  /* Estrelas */
  .stars{display:inline-flex;gap:2px;color:var(--accent);font-size:12px;letter-spacing:1px}
  .stars .off{color:#d8d8d4}

  .tag{
    display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;padding:5px 10px;border-radius:999px;
  }
  .tag.branding{background:#fdf0e9;color:#a8542a}
  .tag.design{background:#e8f5f0;color:#1e7a63}
  .tag.tecnologia{background:#eceaFb;color:#4b41a8}

  /* Manchete */
  .hero{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);border:1px solid var(--line);
    display:grid;grid-template-columns:1.15fr 1fr;cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s;
    margin-bottom:40px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero .media{position:relative;min-height:340px;background:#eee}
  .hero .media img,.hero .media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .hero .body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .hero h2{
    font-family:'Fraunces',Georgia,serif;font-weight:700;
    font-size:clamp(26px,2.6vw,36px);line-height:1.12;letter-spacing:-.015em;margin:0;
  }
  .hero p{margin:0;color:var(--ink-soft);font-size:15.5px;line-height:1.6}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .src{font-size:13px;color:var(--ink-faint);font-weight:500}

  /* Grade */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-bottom:60px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .26s cubic-bezier(.2,.7,.3,1), box-shadow .26s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card .media{position:relative;aspect-ratio:16/10;background:#eee}
  .card .media img,.card .media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:17.5px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em}
  .card .dek{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.55;flex:1}
  .rank{
    position:absolute;top:12px;left:12px;z-index:2;
    background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
    border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800;
    letter-spacing:.06em;color:var(--ink);
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,26,.5);backdrop-filter:blur(4px);
    z-index:50;display:flex;align-items:flex-start;justify-content:center;
    padding:5vh 20px;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(20px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:var(--surface);border-radius:24px;max-width:760px;width:100%;
    box-shadow:0 40px 100px rgba(0,0,0,.3);overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.3,1);
  }
  .modal .media{position:relative;aspect-ratio:16/9;background:#eee}
  .modal .media img,.modal .media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .modal .body{padding:32px 36px 36px}
  .modal h2{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(24px,3.4vw,32px);line-height:1.15;letter-spacing:-.015em;margin:14px 0 6px}
  .modal .orig{font-size:13.5px;color:var(--ink-faint);font-style:italic;margin:0 0 20px}
  .modal .text p{font-size:16px;line-height:1.72;color:#2c2f36;margin:0 0 16px}
  .modal .note{font-size:13px;color:var(--ink-faint);border-left:3px solid var(--line);padding-left:12px;margin-top:18px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .btn{
    display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;
    font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;transition:background .2s,border-color .2s;
  }
  .btn:hover{background:#f2f2ef}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#000}
  .close{
    position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;border-radius:999px;
    border:none;background:rgba(255,255,255,.95);cursor:pointer;font-size:18px;line-height:1;
    color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15);
  }

  footer{border-top:1px solid var(--line);padding:32px 0 56px;color:var(--ink-faint);font-size:13px;line-height:1.7}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero .media{min-height:240px;aspect-ratio:16/9}
    .hero .body{padding:26px 24px 30px}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 18px}
    header.top{padding:36px 0 22px}
    .modal .body{padding:24px 22px 28px}
  }
</style>
</head>

/* ---------- Ilustração SVG de fallback ---------- */
function paletaDe(categoria){
  if(categoria === "Branding") return ["#f6b17a","#e2703a","#9c3d1f","#fde8d7"];
  if(categoria === "Design")   return ["#7ecfb4","#2f9c7f","#14614f","#e2f5ee"];
  return ["#9d9bf0","#5b52c4","#332c86","#e9e7fb"];
}

function Ilustracao({categoria, seed}){
  const [c1,c2,c3,c4] = paletaDe(categoria);
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração gerada para categoria " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c4}/>
          <stop offset="55%" stopColor={c1}/>
          <stop offset="100%" stopColor={c2}/>
        </linearGradient>
        <linearGradient id={id + "b"} x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stopColor={c3} stopOpacity="0.85"/>
          <stop offset="100%" stopColor={c2} stopOpacity="0.25"/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#" + id + ")"}/>
      <circle cx={60 + r(1)*260} cy={40 + r(2)*140} r={40 + r(3)*55} fill={"url(#" + id + "b)"}/>
      <rect x={20 + r(4)*230} y={110 + r(5)*80} width={70 + r(6)*130} height={16 + r(7)*40}
            rx="10" fill={c3} opacity="0.35"/>
      <path d={"M0," + (170 + r(8)*40) + " C110," + (110 + r(9)*70) + " 250," + (215 - r(1)*60) + " 400," + (140 + r(2)*60) + " L400,250 L0,250 Z"}
            fill={c3} opacity="0.28"/>
      <circle cx={300 + r(3)*70} cy={60 + r(4)*60} r={10 + r(5)*16} fill="#fff" opacity="0.5"/>
    </svg>
  );
}

function Media({item}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={item.rank}/>;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

function Estrelas({n}){
  return (
    <span className="stars" title={n + " de 5"}>
      {[1,2,3,4,5].map(i => <span key={i} className={i <= n ? "" : "off"}>★</span>)}
    </span>
  );
}

function Etiqueta({categoria}){
  const cls = categoria === "Branding" ? "branding" : categoria === "Design" ? "design" : "tecnologia";
  return <span className={"tag " + cls}>{categoria}</span>;
}

function Modal({item, onClose}){
  useEffect(() => {
    const esc = (e) => { if(e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="media">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Media item={item}/>
        </div>
        <div className="body">
          <div className="row">
            <Etiqueta categoria={item.categoria}/>
            <Estrelas n={item.estrelas}/>
            <span className="src">{item.source} · {item.data}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="text">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.nota && <p className="note">{item.nota}</p>}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

                <Etiqueta categoria={item.categoria}/>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <span className="src">{item.source} · {item.data}</span>
            </div>
          </article>
        ))}
      </section>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)}/>}

      <footer>
        Portal da Manhã · edição de {DATA_EDICAO}. Todos os resumos foram escritos em português a partir da leitura das
        matérias originais; nenhum texto é reprodução literal da fonte. As imagens são carregadas diretamente dos
        servidores dos portais e permanecem sob direito de seus respectivos autores. Quando não há imagem disponível,
        uma ilustração geométrica é gerada automaticamente.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
