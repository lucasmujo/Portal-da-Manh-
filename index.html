<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 13 de outubro de 2026</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;background:#f6f7fb;color:#1a1d29;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
.date{color:#6b7280;font-size:14px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(20,25,50,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;margin-bottom:28px}
.hero:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(20,25,50,.12)}
.hero .img{min-height:320px}
.hero .body{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(20,25,50,.06);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,25,50,.12)}
.card .img{height:180px}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px;line-height:1.3}
.img{position:relative;overflow:hidden;background:#e5e7eb}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:#6b7280}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11px}
.Branding{background:#ffe9dc;color:#b4501a}.Design{background:#d9f5ee;color:#0f7a62}.Tecnologia{background:#e5e4ff;color:#4a3fc7}
.stars{color:#f59e0b;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(15,18,35,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:fade .2s}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;max-height:92vh;overflow:auto;animation:pop .25s}
.modal .img{height:340px}
.modal .content{padding:24px 28px 28px}
.modal h2{margin:8px 0 12px;font-size:26px;line-height:1.2}
.modal p{font-size:16px;margin:0 0 14px;color:#2b3042}
.note{font-size:13px;color:#8a5a00;background:#fff6dd;border-radius:10px;padding:8px 12px}
.btns{display:flex;gap:10px;margin-top:16px}
.btn{padding:10px 18px;border-radius:10px;border:0;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.primary{background:#1a1d29;color:#fff}.ghost{background:#eef0f6;color:#1a1d29}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.modal .img{height:220px}h1{font-size:24px}}
footer{margin-top:36px;text-align:center;color:#9aa0b0;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const NEWS=[
{
title: "Pentagram creates dynamic bilingual identity for Design Doha Biennial 2026",
tituloPt: "Pentagram cria identidade bilíngue dinâmica para a Bienal Design Doha 2026",
source: "Design Week",
url: "https://www.designweek.co.uk/pentagram-creates-dynamic-bilingual-identity-for-design-doha-biennial-2026/",
imageUrl: "https://www.designweek.co.uk/content/uploads/2026/10/SM_DDB26_1920x1080_15-1024x576.png",
cat:"Branding",stars:5,
resumo:["Samar Maakaroun e sua equipe na Pentagram desenvolveram a identidade visual da segunda edição da Bienal Design Doha, plataforma de design para o mundo árabe com exposições, instalações públicas e projetos colaborativos pela capital do Catar.","Em vez de um logotipo fixo, o sistema é tipográfico e flexível, pensado para representar conexões entre disciplinas, idiomas e comunidades. Árabe e inglês recebem peso igual: os dois alfabetos se fundem em composições compartilhadas, refletindo a mistura cultural da região e o papel do evento como ponte internacional.","O elemento-assinatura são traços de letras esticados que cruzam os layouts e ligam elementos distintos, lembrando linhas de mapa ou constelações. A paleta combina um bege inspirado no travertino local, um vinho profundo, um laranja vibrante e o azul saturado da primeira edição, mantido por continuidade.","O sistema se estende a sub-marcas e exposições; para a mostra principal, “Arab Design Now”, há uma variante mais ousada com a mesma estrutura. Aplicações incluem lápis, chaveiros, camisetas, cartazes em paredes de pedra e painéis iluminados. A bienal abre em 5 de novembro de 2026, em vários locais."]
},
{
title: "Meta releases its first frontier model, Muse Wonder",
tituloPt: "Meta lança seu primeiro modelo de fronteira, o Muse Wonder",
source: "TechCrunch",
url: "https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/",
imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/Screenshot-2026-10-12-at-1.09.43-PM.jpg?resize=1200,676",
cat:"Tecnologia",stars:4,
resumo:["O Meta Superintelligence Lab lançou o Muse Wonder e o Muse Wonder Full, a primeira tentativa da empresa de entregar um modelo de fronteira. Eles são maiores e mais capazes que o Muse Spark, versão leve focada em baixa latência, e pontuam mais alto em benchmarks e tarefas complexas como programação.","O Muse Wonder está disponível pela API de modelos da Meta a US$ 4 por milhão de tokens de entrada e US$ 20 por milhão de saída, preço próximo ao de concorrentes de ponta. O Wonder Full fica restrito a assinantes do Muse Code, sem acesso por API. Ambos vão alimentar o agente Muse.","A Meta destaca a “memória ativa”: a capacidade de reter e sintetizar o que o usuário conta ao longo do tempo, alinhada à aposta em assistentes pessoais para tarefas longas. No benchmark MemoryBench, a empresa afirma superar rivais.","É o primeiro lançamento de fronteira desde a reestruturação da área de IA por Alexandr Wang em agosto de 2025. Os modelos foram treinados no data center Prometheus, em Ohio."]
},
{
title: "Sour Patch Kids takes aim at Oreo in first UK campaign",
tituloPt: "Sour Patch Kids mira na Oreo em sua primeira campanha no Reino Unido",
source: "Creative Review",
url: "https://www.creativereview.co.uk/sour-patch-kids-tnot-as-sweet-as-they-look-campaign-ooh/",
imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/10/Sour-Patch-Kids-OOH-hero.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=1920&h=1080",
cat:"Branding",stars:4,
resumo:["A VCCP assina a primeira campanha integrada da Sour Patch Kids no Reino Unido, sob a plataforma “Not As Sweet As They Look”, que brinca com a aparência fofa e o sabor azedo do doce por meio de peças de mídia exterior travessas.","O destaque é uma ação em quatro pontos especiais de Londres e Bristol em que os personagens parecem rasgar o cartaz de uma Oreo vizinha. A ideia transforma a rivalidade nas redes entre as duas marcas, ambas da Mondelēz, em espetáculo de rua.","O texto compara a ação a clássicos da publicidade comparativa, como a guerra de outdoors BMW x Audi de 2009, e a coloca numa tendência de OOH que reconhece o próprio meio. Outras peças incluem um cabo de guerra em que um doce é partido ao meio e uma cena de tênis com uma cabeça decepada.","Para o autor, é uma forma inteligente de gerar conversa online em torno de um formato fácil de ignorar."]
},
{
title: "This viral packaging plays on a meme the brand ignored for decades",
tituloPt: "Esta embalagem viral brinca com um meme que a marca ignorou por décadas",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/this-ingenious-packaging-design-went-viral-simply-by-recognising-how-people-were-already-using-it",
imageUrl: "https://cdn.mos.cms.futurecdn.net/wRSCDPm62i7u424bJtVuYV-1920-80.jpg",
cat:"Branding",stars:4,
resumo:["A marca mexicana de laticínios Lala transformou um hábito doméstico em recurso oficial de design. Muitas famílias mexicanas reaproveitam os potes de creme para guardar feijão, molho e sobras, e o costume virou piada e meme: abre-se o pote esperando creme e encontra-se outra coisa.","O projeto “Mexiconteiners”, das agências Zurda México e Conciergency, adicionou um espaço para escrever o que há dentro após o creme acabar, com ilustrações de inspiração mexicana mantendo a identidade Lala.","A ideia veio da experiência compartilhada, não de pesquisa de mercado. A resposta foi forte, com consumidores criando versões próprias e novos memes. O conceito agora se estende a outros produtos e edições licenciadas, incluindo uma colaboração com Peanuts."]
},
{
title: "New Logo and Identity for Keen by Mother Design",
tituloPt: "Keen ganha novo logo e identidade da Mother Design",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_keen_by_mother_design.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/keen_logo_before_after.png",
cat:"Branding",stars:3,
resumo:["O Brand New publicou, em 12 de outubro de 2026, o novo logo e identidade da Keen, serviço web, criados pela Mother Design. A página traz comparativos de antes e depois e uma aplicação de exemplo.","Os elementos públicos da matéria são as tags “circles”, “illustration”, “mother design” e “wordmark”, que sugerem um sistema baseado em formas circulares, ilustração e logotipo tipográfico.","Nota: o artigo completo está atrás de paywall; este resumo se baseia apenas em título, categoria, indústria e tags."]
},
{
title: "New Logo for Vauxhall",
tituloPt: "Novo logo da Vauxhall",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_for_vauxhall.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/vauxhall_2026_logo_before_after.png",
cat:"Branding",stars:3,
resumo:["O Brand New, na categoria “Spotted”, registrou em 12 de outubro de 2026 um novo logo para a montadora britânica Vauxhall, com imagens de antes e depois.","As tags “bird”, “car” e “evolution” indicam que a marca mantém o motivo de pássaro (o grifo) e trata a mudança como evolução do símbolo atual, não substituição completa.","Nota: o texto completo está atrás de paywall; o resumo usa apenas título, categoria, indústria e tags, sem detalhes de forma ou cor."]
},
{
title: "Gustaf Westman creates Mickey Mouse-shaped sofa and cup for Disney",
tituloPt: "Gustaf Westman cria sofá e xícara em forma de Mickey Mouse para a Disney",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/12/gustaf-westman-mickey-mouse-collection-disney/",
imageUrl: "https://static.dezeen.com/uploads/2026/10/disney-x-gustaf-westman_dezeen_2364_col_sq-1.jpg",
cat:"Design",stars:4,
resumo:["O designer sueco Gustaf Westman se uniu à Disney para transformar o Mickey em móveis e acessórios que transmitem “alegria e ludicidade”. As três primeiras peças são um sofá, uma xícara e um copo.","Conhecido por formas arredondadas, coloridas e infladas, Westman diz que seu estilo combina com os personagens. Cada peça aborda o Mickey de forma abstrata: orelhas, rosto e o short vermelho com botões brancos, que inspira a base do copo.","O sofá de couro, sob encomenda, custa € 9.250. A coleção completa, da marca Mickey & Friends, incluirá roupas, acessórios e utilidades, com pop-ups em Paris (a partir de 30 de outubro), Tóquio e Nova York."]
},
{
title: "BIG designs cloud-like Tirana Fountain Plaza raised above public park",
tituloPt: "BIG projeta Tirana Fountain Plaza, edifício em forma de nuvem elevado sobre parque público",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/12/tirana-fountain-tower-big-albania/",
imageUrl: "https://static.dezeen.com/uploads/2026/10/tirana-fountain-tower-big_dezeen_2364_hero_0.jpg",
cat:"Design",stars:4,
resumo:["O escritório BIG venceu o concurso para o Tirana Fountain Plaza, edifício de uso misto em Tirana, na Albânia, que reúne apartamentos, escritórios, hotel e espaços culturais com elementos de água.","O volume superior fica sobre colunas brancas esbeltas acima do Parque Rinia, liberando o térreo como espaço público. As fachadas de vidro têm fileiras de discos brancos perfurados, e duas pontas curvas em vidro canelado ligam o volume ao chão.","A piscina existente será mantida, com água reciclada em circuito fechado, e o paisagismo prevê jardins e manejo de águas pluviais para reduzir enchentes e resfriar a área. A marca é uma “fonte invertida”, com água caindo de cima.","Bjarke Ingels descreve a obra como uma nuvem de casas flutuando sobre o parque. A BIG também constrói o Teatro Nacional da Albânia na cidade."]
},
{
title: "Grimshaw completes rammed-earth visitor centre for Twelve Apostles in Australia",
tituloPt: "Grimshaw conclui centro de visitantes em taipa de pilão para os Doze Apóstolos, na Austrália",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/12/grimshaw-visitor-centre-twelve-apostles-australia/",
imageUrl: "https://static.dezeen.com/uploads/2026/10/twelve-apostles-visitor-centre-victoria-australia-architecture-exterior_dezeen_2364_sq.jpg",
cat:"Design",stars:3,
resumo:["Grimshaw e Aspect Studios concluíram um centro de visitantes de 3.300 m² nos Doze Apóstolos, marco natural do Parque Nacional de Port Campbell, em Victoria. Paredes de taipa de pilão fazem o prédio se fundir à paisagem.","Dois edifícios ligados: o Coastal, com área de educação e mirante no terraço, e o Hinterland, com café e loja. O projeto foi desenvolvido com a Eastern Maar Aboriginal Corporation, que ajudou a definir escala e implantação, respeitando a Country dos Eastern Maar.","Caminhos paisagísticos sobem suavemente ao terraço. Os materiais principais são taipa e compensado, e o Welcome Garden celebra a herança Eastern Maar. O acesso foi reorganizado com estacionamento paisagístico e vias separadas para ônibus e carros."]
},
{
title: "Why CMF's New Milk Carton Speakers Are So Irresistible To Look At",
tituloPt: "Por que as novas caixas de som CMF em formato de caixa de leite são irresistíveis",
source: "Yanko Design",
url: "https://www.yankodesign.com/2026/10/12/why-cmfs-new-milk-carton-speakers-are-so-irresistible-to-look-at/",
imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/why-cmfs-new-milk-carton-speakers-are-so-irresistible-to-look-at/cmf_speaker_s_m_1.jpg",
cat:"Design",stars:3,
resumo:["A CMF, submarca econômica da Nothing, lançou suas primeiras caixas Bluetooth: Speaker S (US$ 59) e Speaker M (US$ 109). As duas se inspiram na caixa de leite de topo triangular, forma patenteada em 1915.","O argumento é que, num mercado dominado por cilindros e blocos pretos, um formato que todos reconhecem chama atenção. O telhado inclinado faz o papel do topo da caixa, o botão substitui a tampa e a aleta do modelo M serve de alça. Frente e botão são removíveis e podem ser impressos em 3D.","Há quatro cores e ambas têm IP68. A S entrega 10 W e a M, 35 W, com cerca de 18 horas de bateria. O autor vê o formato como escolha ousada a um preço de compra por impulso."]
},
{
title: "Now AI isn't just faking art, it's faking artists' signatures as well",
tituloPt: "Agora a IA não só falsifica arte, mas também assinaturas de artistas",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/now-ai-isnt-just-faking-art-its-faking-artists-signatures-as-well",
imageUrl: "https://cdn.mos.cms.futurecdn.net/sEXUggEyrv562jcWDU5esn-1450-80.png",
cat:"Tecnologia",stars:3,
resumo:["O ChatGPT tem acrescentado nomes reais de cartunistas a cartuns gerados por IA que imitam o estilo da The New Yorker. O caso viral mostra Dolly Parton e Tim Curry chegando ao céu, assinado “BLOPER”, pseudônimo do cartunista Brendan Loper, que não o criou.","Um fã pediu um cartum no estilo da revista e o chatbot gerou a imagem com assinatura forjada. Loper soube pelo irmão e passou a receber mensagens de desconhecidos. Uma apuração do Nieman Lab achou mais de 15 cartunistas com assinaturas em imagens do ChatGPT.","Para o autor, a assinatura falsa vai além da inspiração: atribui falsamente autoria e endosso, e pode prejudicar a reputação de criativos. Ele pede cautela ao curtir e compartilhar imagens de IA."]
}
];
const PAL={Branding:["#ff9a5a","#e8453c","#ffd36e"],Design:["#2fc9a5","#0e7c7b","#a6f0d5"],Tecnologia:["#6c63ff","#2f3fbf","#b9a8ff"]};
function Art({cat,seed}){
  const p=PAL[cat],id="g"+seed;
  return <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs><rect width="400" height="240" fill={`url(#${id})`}/><circle cx={80+seed*23%240} cy="70" r="70" fill={p[2]} opacity=".5"/><rect x={200+seed*11%80} y="110" width="140" height="140" rx="24" fill="#fff" opacity=".25" transform="rotate(18 270 180)"/><circle cx="330" cy="50" r="28" fill="#fff" opacity=".3"/></svg>;
}
function Img({item,i}){
  const [falhou,setFalhou]=useState(false);
  if(!item.imageUrl||falhou) return <div className="img"><Art cat={item.cat} seed={i+1}/></div>;
  return <div className="img"><img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/></div>;
}
const Stars=({n})=><span className="stars">{"★".repeat(n)+"☆".repeat(5-n)}</span>;
const Meta=({it})=><div className="meta"><span className={"tag "+it.cat}>{it.cat}</span><span>{it.source}</span><Stars n={it.stars}/></div>;
function Modal({it,i,close}){
  useEffect(()=>{const f=e=>e.key==="Escape"&&close();window.addEventListener("keydown",f);return()=>window.removeEventListener("keydown",f)},[]);
  const pay=it.resumo.some(t=>t.startsWith("Nota:"));
  return <div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
    <Img item={it} i={i}/>
    <div className="content"><Meta it={it}/><h2>{it.tituloPt}</h2>
    {it.resumo.map((t,k)=>t.startsWith("Nota:")?<div className="note" key={k}>{t}</div>:<p key={k}>{t}</p>)}
    <div className="btns"><a className="btn primary" href={it.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a><button className="btn ghost" onClick={close}>Fechar</button></div></div></div></div>;
}
function App(){
  const [sel,setSel]=useState(null);
  const items=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [h,...rest]=items;
  return <div className="wrap">
    <header><h1>☀️ Portal da Manhã</h1><div className="date">Terça-feira, 13 de outubro de 2026</div></header>
    <div className="hero" onClick={()=>setSel(0)}><Img item={h} i={0}/><div className="body"><Meta it={h}/><h2>{h.tituloPt}</h2><div className="date">{h.resumo[0].slice(0,180)}…</div></div></div>
    <div className="grid">{rest.map((it,k)=><div className="card" key={k} onClick={()=>setSel(k+1)}><Img item={it} i={k+1}/><div className="body"><Meta it={it}/><h3>{it.tituloPt}</h3></div></div>)}</div>
    {sel!==null&&<Modal it={items[sel]} i={sel} close={()=>setSel(null)}/>}
    <footer>Resumos parafraseados em português. Imagens e matérias pertencem aos portais de origem.</footer>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
