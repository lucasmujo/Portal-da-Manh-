<style>
  :root{

    --ink:#12151a;

    --ink-3:#828c9b;
    --line:#e7eaef;

    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

  header.top{padding:44px 0 10px}
  .kicker{
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin-bottom:10px
  }
  h1.brand{
    font-size:clamp(34px,5.4vw,54px);line-height:1.03;margin:0 0 10px;
    letter-spacing:-.033em;font-weight:800
  }
  .sub{color:var(--ink-2);font-size:16px;margin:0}
  .rule{height:1px;background:var(--line);margin:26px 0 30px}

  /* manchete */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    display:grid;grid-template-columns:1.15fr 1fr;
    transition:transform .25s ease, box-shadow .25s ease;
    margin-bottom:34px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero .media{position:relative;min-height:340px;background:#eef1f5}
  .hero .media img,.hero .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero .body{padding:34px 34px 32px;display:flex;flex-direction:column;justify-content:center}
  .hero h2{font-size:clamp(24px,2.7vw,34px);line-height:1.16;margin:14px 0 12px;letter-spacing:-.02em;font-weight:800}
  .hero p{color:var(--ink-2);margin:0 0 18px;font-size:16px}

  .metaRow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;border:1px solid transparent
  }
  .tag.branding{background:#fff2e8;color:#b3450a;border-color:#ffdcc4}
  .tag.design{background:#e8f7f2;color:#0b6b52;border-color:#c6ebe0}

  .source{font-size:13px;color:var(--ink-3);font-weight:600}
  .stars{font-size:13px;color:#e0a800;letter-spacing:1px}

  /* grid */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:22px;padding-bottom:60px
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card .media{height:186px;background:#eef1f5;position:relative}
  .card .media img,.card .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-size:17.5px;line-height:1.3;margin:0;letter-spacing:-.012em;font-weight:700}
  .card .dek{color:var(--ink-2);font-size:14px;margin:0;flex:1}
  .card .foot{display:flex;justify-content:space-between;align-items:center;padding-top:4px}

  .rank{
    position:absolute;top:12px;left:12px;background:rgba(18,21,26,.82);color:#fff;
    font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;backdrop-filter:blur(4px)
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(12,16,22,.55);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:32px 18px;
    z-index:50;overflow-y:auto;animation:fade .18s ease
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:var(--card);border-radius:22px;max-width:760px;width:100%;
    box-shadow:var(--shadow-lg);overflow:hidden;animation:rise .26s cubic-bezier(.2,.8,.3,1)

  .modal .media{height:320px;background:#eef1f5}

  .modal h2{font-size:27px;line-height:1.2;margin:14px 0 6px;letter-spacing:-.02em;font-weight:800}
  .modal .orig{font-size:13px;color:var(--ink-3);margin:0 0 18px;font-style:italic}
  .modal .txt p{color:var(--ink-2);font-size:15.6px;margin:0 0 14px}
  .modal .note{
    font-size:13px;color:var(--ink-3);background:#f8f9fb;border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;margin-top:6px
  }
  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;
    text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff;cursor:pointer
  }
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:hover{opacity:.9}

  footer{border-top:1px solid var(--line);padding:28px 0 60px;color:var(--ink-3);font-size:13px}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr}
    .hero .media{min-height:230px;height:230px}
    .hero .body{padding:24px}
    .modal .media{height:220px}
    .modal .body{padding:22px}
  }
</style>
</head>

const PALETAS = {
  Branding:   { a:"#ff8a4c", b:"#ffd166", c:"#f25f5c" },
  Design:     { a:"#2ec4a6", b:"#7ee0c8", c:"#118a72" },
  Tecnologia: { a:"#5b6ef5", b:"#a78bfa", c:"#3730a3" }
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const id = "g" + seed;
  const r = (n) => ((seed * 37 + n * 53) % 100);
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.a}/>
          <stop offset="100%" stopColor={p.b}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`}/>
      <circle cx={60 + r(1) * 2.6} cy={40 + r(2)} r={54 + r(3) * .5} fill={p.c} opacity=".26"/>
      <circle cx={300 - r(4)} cy={200 - r(5)} r={70 + r(6) * .4} fill="#ffffff" opacity=".22"/>
      <rect x={40 + r(7)} y={130 + r(8) * .4} width={120 + r(9)} height="14" rx="7" fill="#ffffff" opacity=".45"/>
      <rect x={40 + r(7)} y={158 + r(8) * .4} width={70 + r(2)} height="14" rx="7" fill="#ffffff" opacity=".30"/>
      <path d={`M0 ${230 - r(3)} Q 100 ${180 + r(4)} 200 ${222 - r(5)} T 400 ${200 + r(6)} V260 H0 Z`} fill={p.c} opacity=".22"/>
    </svg>
  );
}

function Imagem({ item }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.rank}/>;
  }
  return (
    <img
      src={item.imageUrl}
      alt={`Imagem da matéria: ${item.tituloPt}`}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const Estrelas = ({ n }) => <span className="stars">{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;
const Tag = ({ c }) => <span className={"tag " + c.toLowerCase()}>{c}</span>;

function Modal({ item, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="media"><Imagem item={item}/></div>
        <div className="body">
          <div className="metaRow">
            <Tag c={item.categoria}/>
            <span className="source">{item.source}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="txt">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Este resumo foi escrito a partir dos elementos públicos da matéria (título, categoria, tags e chamada), porque o texto integral está atrás de acesso restrito.
            </div>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} →</a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [manchete, ...resto] = DATA;

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") setAberto(null); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de quinta-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="sub">13 de agosto de 2026 · 12 notícias de branding, design e tecnologia, selecionadas em 6 veículos</p>
      </header>
      <div className="rule"></div>

      <div className="hero" onClick={() => setAberto(manchete)}>
        <div className="media"><Imagem item={manchete}/></div>
        <div className="body">
          <div className="metaRow">
            <Tag c={manchete.categoria}/>
            <span className="source">{manchete.source}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
          <div><span className="btn primary" style={{fontSize:13, padding:"9px 15px"}}>Ler resumo</span></div>
        </div>
      </div>

      <div className="grid">
        {resto.map((item) => (
          <div className="card" key={item.rank} onClick={() => setAberto(item)}>
            <div className="media">
              <Imagem item={item}/>
              <span className="rank">#{item.rank}</span>
            </div>
            <div className="body">
              <div className="metaRow"><Tag c={item.categoria}/><Estrelas n={item.estrelas}/></div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="foot"><span className="source">{item.source}</span></div>
            </div>
          </div>
        ))}
      </div>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)}/>}

      <footer>
        Portal da Manhã — resumo diário em português de branding, design e tecnologia. Os textos são paráfrases produzidas para esta edição; os créditos e o conteúdo original pertencem aos veículos citados. Edição de 13 de agosto de 2026.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
