<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 21 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f5f2; --surface:#ffffff; --ink:#15171a; --muted:#6b7280; --line:#e6e4df;
    --accent:#c2410c; --accent-soft:#fff3ec; --green:#0f766e; --blue:#4338ca;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px rgba(15,23,42,.06);
    --shadow-lg:0 2px 4px rgba(15,23,42,.06), 0 18px 50px rgba(15,23,42,.10);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}
  header.top{padding:48px 0 28px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px}
  h1.logo{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(40px,6.4vw,68px);line-height:1.02;margin:18px 0 8px;letter-spacing:-.01em}
  .date{color:var(--muted);font-size:15px}
  .meta-line{margin-top:14px;color:var(--muted);font-size:13.5px}

  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;border:1px solid var(--line)}
  .hero:hover{transform:translateY(-3px)}
  .hero-media{position:relative;min-height:340px;background:#eceae5}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .hero-body{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center}
  .hero-body h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,3.1vw,38px);line-height:1.12;margin:14px 0 12px;letter-spacing:-.01em}
  .hero-body p{margin:0;color:#3f444b;font-size:15.5px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:26px 0 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s ease, box-shadow .22s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card-media{position:relative;height:178px;background:#eceae5}
  .card-media img,.card-media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card-body h3{font-size:17px;line-height:1.3;margin:0;font-weight:600;letter-spacing:-.005em}
  .card-body .dek{font-size:13.5px;color:var(--muted);margin:0}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .tag.Branding{background:#fff1e7;color:#b4460f}
  .tag.Design{background:#e8f6f3;color:#0b6b62}
  .tag.Tecnologia{background:#eceafe;color:#4338ca}
  .src{font-size:12px;color:var(--muted);font-weight:500}
  .stars{font-size:12.5px;color:#d97706;letter-spacing:1px}
  .warn{font-size:11.5px;color:#9a6a00;background:#fff8e6;border-radius:8px;padding:5px 8px}

  .overlay{position:fixed;inset:0;background:rgba(16,18,22,.45);backdrop-filter:blur(5px);display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:50;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal{background:var(--surface);max-width:760px;width:100%;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
  .modal-media{position:relative;height:300px;background:#eceae5}
  .modal-media img,.modal-media svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .close{position:absolute;top:14px;right:14px;z-index:2;border:none;background:rgba(255,255,255,.94);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;box-shadow:var(--shadow);line-height:1}
  .modal-body{padding:28px 32px 34px}
  .modal-body h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,33px);line-height:1.15;margin:14px 0 6px}
  .modal-body .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 18px}
  .modal-body p.txt{font-size:16px;line-height:1.72;color:#2f343a;margin:0 0 15px}
  .srcbtn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none;padding:11px 20px;border-radius:999px;font-size:14px;font-weight:600}
  .srcbtn:hover{background:var(--accent)}
  .note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:16px}

  footer{border-top:1px solid var(--line);padding:30px 0 60px;color:var(--muted);font-size:13px;text-align:center}

  @media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-media{min-height:250px;height:250px}}
  @media(max-width:620px){.grid{grid-template-columns:1fr}.modal-media{height:220px}.modal-body{padding:22px 20px 28px}header.top{padding:32px 0 22px}}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState } = React;

const PALETAS = {
  Branding: ["#f59e0b","#ea580c","#be123c"],
  Design:   ["#14b8a6","#0f766e","#15803d"],
  Tecnologia:["#6366f1","#7c3aed","#2563eb"]
};

function Ilustracao({ categoria, seed }){
  const cores = PALETAS[categoria] || PALETAS.Design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={cores[0]} />
          <stop offset="55%" stopColor={cores[1]} />
          <stop offset="100%" stopColor={cores[2]} />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#" + id + ")"} />
      <circle cx={70 + r(1)*240} cy={60 + r(2)*120} r={40 + r(3)*45} fill="#ffffff" opacity="0.16" />
      <circle cx={40 + r(4)*300} cy={150 + r(5)*80} r={25 + r(6)*40} fill="#000000" opacity="0.10" />
      <rect x={200 + r(7)*120} y={20 + r(8)*60} width={90} height={90} rx="18" fill="#ffffff" opacity="0.13"
            transform={"rotate(" + Math.round(r(9)*40 - 20) + " 260 80)"} />
      <path d={"M0 " + (200 + r(10)*30) + " Q 100 " + (150 + r(11)*60) + " 200 " + (195 + r(12)*40) + " T 400 " + (185 + r(13)*45) + " L400 260 L0 260 Z"}
            fill="#ffffff" opacity="0.14" />
    </svg>
  );
}

function Figura({ item, tipo }){
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={item.id} />;
  return (
    <img src={item.imageUrl}
         alt={item.alt}
         loading={tipo === "hero" ? "eager" : "lazy"}
         referrerPolicy="no-referrer"
         onError={() => setFalhou(true)} />
  );
}

const Estrelas = ({ n }) => <span className="stars">{"★".repeat(n) + "☆".repeat(5 - n)}</span>;

function Modal({ item, onClose }){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e)=>e.stopPropagation()}>
        <div className="modal-media">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Figura item={item} tipo="modal" />
        </div>
        <div className="modal-body">
          <div className="row">
            <span className={"tag " + item.categoria}>{item.categoria}</span>
            <span className="src">{item.source} · {item.dataPt}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p, i) => <p className="txt" key={i}>{p}</p>)}
          <a className="srcbtn" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} →</a>
          {item.nota && <p className="note">{item.nota}</p>}
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a,b)=> b.estrelas - a.estrelas || a.id - b.id);
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);
  const portais = new Set(NOTICIAS.map(n=>n.source)).size;
  const comFoto = NOTICIAS.filter(n=>n.imageUrl).length;

  return (
    <div className="wrap">
      <header className="top">
        <span className="kicker">Edição diária</span>
        <h1 className="logo">Portal da Manhã</h1>
        <div className="date">Segunda-feira, 21 de setembro de 2026</div>
        <div className="meta-line">{NOTICIAS.length} notícias · {portais} portais · {comFoto} com imagem original · branding, design e tecnologia</div>
      </header>

      <article className="hero" onClick={()=>setAberto(manchete)}>
        <div className="hero-media"><Figura item={manchete} tipo="hero" /></div>
        <div className="hero-body">
          <div className="row">
            <span className={"tag " + manchete.categoria}>{manchete.categoria}</span>
            <span className="src">{manchete.source} · {manchete.dataPt}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.chamada}</p>
        </div>
      </article>

      <div className="grid">
        {resto.map(item => (
          <article className="card" key={item.id} onClick={()=>setAberto(item)}>
            <div className="card-media"><Figura item={item} tipo="card" /></div>
            <div className="card-body">
              <div className="row">
                <span className={"tag " + item.categoria}>{item.categoria}</span>
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.chamada}</p>
              <div className="row" style={{marginTop:"auto"}}>
                <span className="src">{item.source} · {item.dataPt}</span>
              </div>
              {!item.imageUrl && <span className="warn">Imagem original indisponível — ilustração gerada</span>}
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã · edição de 21 de setembro de 2026 · resumos em português escritos para esta edição.<br/>
        Clique em qualquer matéria para ler o resumo completo e ir à fonte original.
      </footer>

      {aberto && <Modal item={aberto} onClose={()=>setAberto(null)} />}
    </div>
  );
}

      "Boa parte das peças é protótipo de verdade, feito para colaborações com marcas como Hermès e Burberry ou para instalações em lugares tão distintos quanto o museu V&A e o festival Coachella. A escolha de expor justamente esses objetos foi deliberada: as duas queriam expor o método de trabalho, que gira quase inteiramente em torno da construção de modelos físicos.",
      "Gibson explicou ao Dezeen que o estúdio pula rápido para o protótipo porque imaginar e desenhar um movimento não basta — é preciso pôr a mão para descobrir como a coisa realmente se comporta. Chesner completa que o movimento costuma carregar alguma transformação ou um momento de revelação, e que a maneira como algo se move muda inteiramente a leitura: a mesma peça pode parecer alegre ou sinistra dependendo do gesto.",
      "O pano de fundo da exposição é uma série de pinturas de edição limitada, cada uma com uma roda colorida. Elas não foram pintadas à mão no sentido convencional: a dupla construiu uma máquina cinética que gira o pincel e desenha círculos concêntricos. Entre os destaques do salão estão um trem de brinquedo que carrega meia dúzia de ovos bamboleando em sincronia e um conjunto de quinze esferas de papel que giram quando se puxa um barbante.",
