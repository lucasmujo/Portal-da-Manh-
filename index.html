<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal da Manhã — 15 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#14151a;
    --ink-2:#4a4d57;
    --ink-3:#8b8f9a;
    --line:#e6e5e1;
    --accent:#c8442b;
    --branding:#e07a42;
    --design:#1f9d8c;
    --tech:#5b62d6;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,21,26,.04), 0 8px 24px rgba(20,21,26,.06);
    --shadow-lg:0 2px 4px rgba(20,21,26,.05), 0 20px 60px rgba(20,21,26,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px;}
  header.top{padding:56px 0 28px;border-bottom:1px solid var(--line);}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);
  }
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;}
  h1.brand{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;font-size:clamp(42px,7vw,74px);
    line-height:1.02;margin:14px 0 10px;letter-spacing:-.02em;
  }
  .subline{color:var(--ink-2);font-size:15px;max-width:640px;line-height:1.55;margin:0;}
  .meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;color:var(--ink-3);font-size:12.5px;font-weight:500;}
  .meta-row b{color:var(--ink-2);font-weight:600;}

  main{padding:36px 0 80px;}

  /* HERO */
  .hero{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    margin-bottom:40px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
  .hero-media{position:relative;min-height:380px;background:#eceae5;}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0;}
  .hero-body{padding:38px 36px;display:flex;flex-direction:column;justify-content:center;}
  .hero-body h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(26px,3.1vw,38px);line-height:1.14;letter-spacing:-.015em;margin:14px 0 14px;
  }
  .hero-body p{color:var(--ink-2);font-size:15px;line-height:1.6;margin:0 0 20px;}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);}
  .card-media{position:relative;aspect-ratio:16/10;background:#eceae5;overflow:hidden;}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block;}
  .card-body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1;}
  .card-body h3{font-size:16.5px;line-height:1.32;font-weight:650;letter-spacing:-.012em;margin:12px 0 10px;}
  .card-body .dek{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0 0 16px;flex:1;}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .tag{
    font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;color:#fff;
  }
  .t-branding{background:var(--branding);}
  .t-design{background:var(--design);}
  .t-tech{background:var(--tech);}
  .src{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.02em;}
  .stars{font-size:12px;letter-spacing:1px;color:#e0a800;margin-left:auto;}
  .rank{
    font-family:'Instrument Serif',serif;font-size:13px;color:var(--ink-3);
    border:1px solid var(--line);border-radius:6px;padding:1px 7px;
  }

  /* MODAL */
  .overlay{
    position:fixed;inset:0;background:rgba(20,21,26,.42);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
    z-index:50;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:var(--card);border-radius:24px;max-width:760px;width:100%;
    box-shadow:0 30px 90px rgba(20,21,26,.3);overflow:hidden;
    animation:rise .34s cubic-bezier(.2,.8,.2,1);
  }
  .modal-media{position:relative;aspect-ratio:16/9;background:#eceae5;}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block;}
  .modal-body{padding:30px 34px 36px;}
  .modal-body h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(25px,3.4vw,34px);line-height:1.15;letter-spacing:-.015em;margin:14px 0 8px;
  }
  .orig{color:var(--ink-3);font-size:12.5px;font-style:italic;margin:0 0 20px;line-height:1.5;}
  .modal-body .txt p{color:var(--ink-2);font-size:15.5px;line-height:1.72;margin:0 0 16px;}
  .note{
    background:#faf7f1;border-left:3px solid var(--branding);padding:12px 16px;
    border-radius:0 10px 10px 0;font-size:13px;color:var(--ink-2);line-height:1.55;margin:4px 0 20px;
  }
  .modal-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:26px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;text-decoration:none;
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 20px;border-radius:999px;border:none;cursor:pointer;
    transition:opacity .2s;font-family:inherit;
  }
  .btn:hover{opacity:.82;}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);}
  .closeX{
    position:absolute;top:14px;right:14px;z-index:3;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:18px;line-height:1;
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
  }

  footer{border-top:1px solid var(--line);padding:32px 0 60px;color:var(--ink-3);font-size:12.5px;line-height:1.7;}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .hero{grid-template-columns:1fr;}
    .hero-media{min-height:240px;position:relative;aspect-ratio:16/9;}
  }
  @media (max-width:600px){
    .grid{grid-template-columns:1fr;}
    .wrap{padding:0 18px;}
    header.top{padding:38px 0 22px;}
    .hero-body{padding:26px 22px;}
    .modal-body{padding:24px 22px 30px;}
  }
</style>
</head>

const PALETAS = {
  Branding: [["#f6b26b","#e0674a"],["#f9c784","#d4553d"],["#fbd28b","#c8442b"]],
  Design:   [["#7fd4c4","#178d7d"],["#a8e6d8","#0f7a6d"],["#8fe0cd","#14968a"]],
  Tecnologia:[["#a5aef5","#4a52c9"],["#b9c0fa","#3f45b5"],["#9aa4f2","#5b62d6"]]
};

function Ilustracao({ categoria, seed }) {
  const paleta = PALETAS[categoria] || PALETAS.Design;
  const p = paleta[seed % paleta.length];
  const gid = "g" + categoria + seed;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[1]} />
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={`url(#${gid})`} />
      <circle cx={80 + (seed * 37) % 160} cy={70 + (seed * 23) % 60} r={54 + (seed % 3) * 12}
              fill="#fff" opacity="0.17" />
      <rect x={200 + (seed * 19) % 70} y={110 + (seed * 13) % 40} width="120" height="120"
            rx="18" fill="#fff" opacity="0.13"
            transform={`rotate(${(seed * 17) % 40 - 20} 260 170)`} />
      <path d={`M0,${200 + (seed % 5) * 8} Q100,${150 + (seed % 7) * 9} 200,${195 - (seed % 4) * 10} T400,${180 + (seed % 3) * 14} L400,250 L0,250 Z`}
            fill="#fff" opacity="0.14" />
      <circle cx={330 - (seed * 11) % 60} cy={54 + (seed * 7) % 40} r="22" fill="#fff" opacity="0.2" />
    </svg>
  );
}

function Imagem({ item, alt }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} />;
  }
  return (
    <img
      src={item.imageUrl}
      alt={alt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const tagClass = c => c === "Branding" ? "t-branding" : c === "Design" ? "t-design" : "t-tech";
const estrelas = n => "★".repeat(n) + "☆".repeat(5 - n);

function Card({ item, onOpen }) {
  return (
    <article className="card" onClick={() => onOpen(item)}>
      <div className="card-media"><Imagem item={item} alt={item.tituloPt} /></div>
      <div className="card-body">
        <div className="row">
          <span className={"tag " + tagClass(item.categoria)}>{item.categoria}</span>
          <span className="src">{item.source}</span>
          <span className="stars">{estrelas(item.estrelas)}</span>
        </div>
        <h3>{item.tituloPt}</h3>
        <p className="dek">{item.dek}</p>
        <div className="row">
          <span className="src">{item.data}</span>
          <span className="src" style={{marginLeft:"auto"}}>Ler resumo →</span>
        </div>
      </div>
    </article>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", h);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", h); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-media">
          <button className="closeX" onClick={onClose} aria-label="Fechar">×</button>
          <Imagem item={item} alt={item.tituloPt} />
        </div>
        <div className="modal-body">
          <div className="row">
            <span className={"tag " + tagClass(item.categoria)}>{item.categoria}</span>
            <span className="src">{item.source} · {item.data}</span>
            <span className="stars">{estrelas(item.estrelas)}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.paywall && (
            <div className="note">
              <b>Matéria com paywall.</b> Este resumo foi escrito somente a partir dos elementos
              públicos da página (título, categoria, indústria, tags e estrutura do post). O texto
              analítico não foi lido.
            </div>
          )}
          <div className="txt">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          <div className="modal-actions">
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);
  const ordenadas = [...NOTICIAS];
  const manchete = ordenadas[0];
  const demais = ordenadas.slice(1);
  const portais = new Set(NOTICIAS.map(n => n.source)).size;

  return (
    <React.Fragment>
      <header className="top">
        <div className="wrap">
          <span className="kicker"><span className="dot"></span> Edição de terça-feira</span>
          <h1 className="brand">Portal da Manhã</h1>
          <p className="subline">
            Branding, design e tecnologia das últimas 24 horas, lidos, ranqueados e resumidos
            em português. Clique em qualquer matéria para abrir o resumo sem sair da página.
          </p>
          <div className="meta-row">
            <span><b>15 de setembro de 2026</b></span>
            <span><b>{NOTICIAS.length}</b> notícias</span>
            <span><b>{portais}</b> portais</span>
            <span>Branding · Design · Tecnologia</span>
          </div>
        </div>
      </header>

      <main>
        <div className="wrap">
          <article className="hero" onClick={() => setAberta(manchete)}>
            <div className="hero-media"><Imagem item={manchete} alt={manchete.tituloPt} /></div>
            <div className="hero-body">
              <div className="row">
                <span className={"tag " + tagClass(manchete.categoria)}>{manchete.categoria}</span>
                <span className="src">{manchete.source} · {manchete.data}</span>
                <span className="stars">{estrelas(manchete.estrelas)}</span>
              </div>
              <h2>{manchete.tituloPt}</h2>
              <p>{manchete.dek}</p>
              <div className="row">
                <span className="src">Ler resumo completo →</span>
              </div>
            </div>
          </article>

          <div className="grid">
            {demais.map(item => (
              <Card key={item.id} item={item} onOpen={setAberta} />
            ))}
          </div>
        </div>
      </main>

      <footer>
        <div className="wrap">
          Portal da Manhã · edição de 15 de setembro de 2026. Resumos escritos e parafraseados
          a partir das fontes originais; os textos integrais pertencem aos respectivos portais.
          As fotos são carregadas diretamente dos servidores de cada publicação.
        </div>
      </footer>

      {aberta && <Modal item={aberta} onClose={() => setAberta(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
