<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal da Manhã — 11 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --ink:#16150f;
    --ink-soft:#5b584e;
    --ink-faint:#8f8b80;
    --line:#e6e3dc;
    --accent:#c2410c;
    --accent-soft:#fdf1e7;
    --brand:#b45309;
    --design:#0f766e;
    --tech:#4f46e5;
    --radius:18px;
    --shadow:0 1px 2px rgba(22,21,15,.04), 0 8px 24px rgba(22,21,15,.06);
    --shadow-lg:0 2px 4px rgba(22,21,15,.05), 0 20px 48px rgba(22,21,15,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}

  /* Header */
  header.masthead{padding:52px 0 30px;border-bottom:1px solid var(--line)}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:6px 12px;border-radius:999px;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
  h1.logo{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;font-size:clamp(44px,7vw,76px);
    letter-spacing:-.02em;line-height:1.02;margin:18px 0 10px;
  }
  .sub{color:var(--ink-soft);font-size:15px;max-width:640px}
  .meta-row{display:flex;flex-wrap:wrap;gap:18px;margin-top:22px;font-size:13px;color:var(--ink-faint)}
  .meta-row b{color:var(--ink);font-weight:600}

  /* Headline */
  main{padding:40px 0 80px}
  .hero{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-lg);
    cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:0 4px 8px rgba(22,21,15,.06), 0 28px 60px rgba(22,21,15,.13)}
  .hero-media{position:relative;min-height:380px;background:#eee}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:38px 40px;display:flex;flex-direction:column;justify-content:center}
  .hero h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(27px,3.2vw,40px);line-height:1.13;letter-spacing:-.015em;
    margin:16px 0 14px;
  }
  .hero p.dek{color:var(--ink-soft);font-size:15.5px;margin:0 0 22px}

  /* Badges */
  .badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cat{
    font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    padding:5px 10px;border-radius:6px;color:#fff;
  }
  .cat.branding{background:var(--brand)}
  .cat.design{background:var(--design)}
  .cat.tech{background:var(--tech)}
  .src{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
  .stars{font-size:12px;color:var(--accent);letter-spacing:.08em}
  .stars .off{color:#d9d5cc}

  /* Grid */
  .section-label{
    display:flex;align-items:center;gap:14px;margin:54px 0 22px;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--ink-faint);
  }
  .section-label:after{content:'';flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#d8d4ca}
  .card-media{height:186px;background:#eee;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .card:hover .card-media img{transform:scale(1.035)}
  .card-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .card h3{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:21px;line-height:1.2;letter-spacing:-.01em;margin:0;
  }
  .card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}

  .warn{
    font-size:11.5px;color:#9a6b2f;background:#fdf6ec;border:1px solid #f0e0c8;
    padding:5px 9px;border-radius:6px;display:inline-block;
  }

  /* Overlay */
  .overlay{
    position:fixed;inset:0;background:rgba(22,21,15,.42);
    backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    z-index:60;display:flex;align-items:flex-start;justify-content:center;
    padding:36px 20px;overflow-y:auto;
    animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .modal{
    background:var(--surface);border-radius:22px;max-width:820px;width:100%;
    overflow:hidden;box-shadow:0 32px 90px rgba(22,21,15,.30);
    animation:rise .3s cubic-bezier(.2,.8,.3,1);
  }
  .modal-media{height:330px;background:#eee}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .modal-body{padding:32px 38px 38px}
  .modal h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(25px,3.4vw,34px);line-height:1.16;letter-spacing:-.015em;margin:16px 0 6px;
  }
  .orig-title{font-size:13px;color:var(--ink-faint);font-style:italic;margin:0 0 22px}
  .modal .resumo p{font-size:16px;line-height:1.72;color:#2c2a23;margin:0 0 16px}
  .modal-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .btn{
    font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:10px;
    text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    cursor:pointer;transition:.18s;font-family:inherit;
  }
  .btn:hover{background:#f3f1ec}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#302d24}
  .close-x{
    position:absolute;top:16px;right:18px;width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.92);border:none;cursor:pointer;font-size:19px;line-height:1;
    color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.16);
  }
  .modal-wrap{position:relative;max-width:820px;width:100%}

  footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--ink-faint);font-size:13px}
  footer a{color:var(--ink-soft)}

  @media (max-width:900px){
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:240px;height:240px}
    .hero-body{padding:28px 24px}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 18px}
    .modal-body{padding:26px 22px 30px}
    .modal-media{height:220px}
  }
</style>
</head>

  {

    dek: "O relatório Design Economy 2026 do Design Council reposiciona o setor como infraestrutura econômica, não como serviço criativo.",

    alt: "Capa do relatório Design Economy 2026, do Design Council britânico",
    resumo: [
      "O Design Council divulgou o relatório Design Economy 2026 e o número que abre o documento reorganiza a conversa: a economia do design no Reino Unido gerou £136,7 bilhões em valor adicionado bruto em 2023, o equivalente a 5,5% de todo o VAB britânico — aproximadamente £1 a cada £20 produzidos no país. É mais que o varejo inteiro (£114 bilhões) e quase o dobro de hospedagem e alimentação somados (£70 bilhões).",
      "O crescimento também impressiona pela velocidade: 40% entre 2019 e 2023, partindo de £97,4 bilhões. A economia britânica como um todo cresceu 24% no mesmo período, quase metade disso.",
      "Mas o dado politicamente mais relevante é outro. Dois terços de todo esse valor — £90,6 bilhões — não é produzido dentro de agências e estúdios de design. Vem de designers empregados em manufatura, saúde, engenharia e serviços financeiros. Cerca de 80% dos designers do país trabalham em setores que não são o de design. O emprego de designers fora da indústria criativa cresceu 20% entre 2020 e 2025, contra 6% nas empresas de design tradicionais. No total, o emprego em design subiu 15%, de 1,97 milhão em 2019 para 2,27 milhões em 2025.",
      "A produtividade média ficou em £60.704 por funcionário em 2023, chegando a £96.200 em design de produto e industrial. Por disciplina, o design digital domina: £81 bilhões de VAB, alta de 50% desde 2019, 59% de toda a economia do design e 1,09 milhão de profissionais. Depois vêm produto e industrial (£21,6 bi, +33%), arquitetura e ambiente construído (£18,4 bi, +30%), multidisciplinar (£6,6 bi, +23%), design gráfico (£3,2 bi, +14%), design publicitário (£2,9 bi, +33%), artesanato (£2,6 bi, +8%) e design de moda (£400 mi, +45%).",
      "Nas exportações, o setor totalizou £88,2 bilhões em 2022, 10% de tudo que o Reino Unido exporta. Só a exportação de serviços de design somou £71 bilhões, ou 17% das exportações britânicas de serviços — cerca de 77% do valor exportado pelos serviços financeiros. O design digital respondeu por £50,4 bilhões desse total.",

      "O alerta vem na formação. As inscrições no GCSE de Design & Tecnologia caíram 68% na década até 2024. Tony Ryan, da D&T Association, aponta a iniciativa de filiação regional da entidade como resposta parcial.",

      "Mat Hunter, presidente-executivo do Design Council, resume o argumento: \"Esses números deveriam mudar a forma como pensamos o design\" — descrevendo o setor como \"uma capacidade de £136,7 bilhões incorporada ao modo como as organizações inovam de forma eficaz\". Jane Geraghty, CEO global da Landor, acrescenta que \"marcas mais diferenciadas crescem mais rápido\". A economista Mariana Mazzucato, do IIPP da UCL, chama o design de \"capacidade estratégica\". Alisha Morenike-Fisher, do Black Females in Architecture, é mais direta: \"Talento existe em todo lugar, oportunidade não.\"",
      "O documento fecha com cinco pedidos de política pública: hubs regionais de crescimento em design liderados pelas autoridades estratégicas metropolitanas; reconhecimento explícito do design na Estratégia Industrial; um pipeline nacional de formação somado a um Learning Lab do Design Council focado em IA, design verde e pensamento sistêmico; apoio direcionado a exportação e propriedade intelectual para PMEs de design; e um Desafio Nacional de Design para Adoção de IA."

    alt: "Amostras das fontes blackletter e de grafite criadas por Yuta ONE",
    resumo: [
      "O designer japonês Yuta ONE liberou um pacote com aproximadamente 200 arquivos OTF — fontes que normalmente são pagas — em uma ação de um dia só, divulgada em 8 de setembro pela Creative Bloq.",
      "A distribuição é pelo Booth, plataforma japonesa de venda direta de criadores, no endereço yutaone.booth.pm. O prazo foi estendido até as 23h59 do dia 9 de setembro, horário do Japão.",
      "O motivo é um marco de audiência: o pacote é chamado de \"17万人記念パック\", o pacote comemorativo dos 170 mil seguidores no X.",
      "E há uma condição extra que transforma a promoção em mecânica de crescimento: se a contagem de seguidores ultrapassar 190 mil antes do prazo, 11 fontes inéditas entram no pacote e o período é estendido de novo. A reportagem registra ainda que \"também se fala de uma foto de micro biquíni aos 200 mil\".",
      "Yuta ONE é conhecido por tipografia e logotipos em estilo blackletter, grafite e gótico. Profissionalmente, faz branding digital para VTubers — as youtubers virtuais da agência Hololive, da COVER Corporation.",
      "Entre os créditos citados está o logotipo e a ilustração de capa do single \"SM4SH IT UP\", de Tokoyami Towa.",
      "A trajetória explica o repertório: ele descobriu a arte de rua como patinador de inline, aprendeu grafite e caligrafia sozinho e depois migrou para a tipografia, concentrando-se em tipos blackletter.",
      "O pacote cobre também estilos futuristas, além das famílias de grafite e gótico.",
      "O artigo observa que Yuta ONE é bastante ativo nas redes, publicando atualizações de trabalho e dicas — e vem usando exatamente essas liberações gratuitas de fontes para acelerar o crescimento da própria base. Texto de Joe Foley."
    ]
  }
];

const PALETAS = {
  Branding: ["#f59e0b", "#c2410c", "#fde68a", "#fb923c"],
  Design:   ["#0d9488", "#065f46", "#99f6e4", "#34d399"],
  Tecnologia: ["#6366f1", "#3730a3", "#c7d2fe", "#818cf8"]
};

function Ilustracao({ categoria, seed, className }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const s = (seed * 37) % 100;
  const gid = "g" + categoria + seed;
  const gid2 = "h" + categoria + seed;
  return (
    <svg className={className} viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         role="img" aria-label={"Ilustração abstrata de " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[1]} />
        </linearGradient>
        <linearGradient id={gid2} x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={p[2]} stopOpacity="0.95" />
          <stop offset="100%" stopColor={p[3]} stopOpacity="0.5" />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#" + gid + ")"} />
      <circle cx={80 + s} cy={70 + (s % 40)} r={72 + (s % 30)} fill={"url(#" + gid2 + ")"} opacity="0.75" />
      <rect x={210 - (s % 50)} y={130 - (s % 30)} width="150" height="150"
            rx="26" fill={p[2]} opacity="0.35"
            transform={"rotate(" + (s % 25) + " 285 205)"} />
      <path d={"M0," + (200 - (s % 50)) + " Q120," + (120 + (s % 60)) + " 240," + (190 - (s % 40)) + " T400," + (160 + (s % 40)) + " V260 H0 Z"}
            fill={p[1]} opacity="0.42" />
      <circle cx={320 - (s % 60)} cy={60 + (s % 30)} r="16" fill="#fff" opacity="0.55" />
    </svg>
  );
}

function Visual({ item, className }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} className={className} />;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.alt || item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

function Estrelas({ n }) {
  return (
    <span className="stars" title={n + " de 5"}>
      {[1,2,3,4,5].map(i => (
        <span key={i} className={i <= n ? "" : "off"}>★</span>
      ))}
    </span>
  );
}

function Badges({ item }) {
  const cls = item.categoria === "Branding" ? "branding" : item.categoria === "Design" ? "design" : "tech";
  return (
    <div className="badges">
      <span className={"cat " + cls}>{item.categoria}</span>
      <span className="src">{item.source}</span>
      <Estrelas n={item.estrelas} />
    </div>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const esc = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal-wrap" onClick={e => e.stopPropagation()}>
        <button className="close-x" onClick={onClose} aria-label="Fechar">×</button>
        <article className="modal">
          <div className="modal-media"><Visual item={item} /></div>
          <div className="modal-body">
            <Badges item={item} />
            <h2>{item.tituloPt}</h2>
            <p className="orig-title">Título original: “{item.title}” — {item.source}</p>
            <div className="resumo">
              {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
            </div>
            <div className="modal-actions">
              <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">
                Ler no {item.source} ↗
              </a>
              <button className="btn" onClick={onClose}>Fechar</button>
            </div>
          </div>
        </article>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS];
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);

  const portais = new Set(NOTICIAS.map(n => n.source)).size;
  const comFoto = NOTICIAS.filter(n => n.imageUrl).length;

  return (
    <React.Fragment>
      <header className="masthead">
        <div className="wrap">
          <span className="kicker"><span className="dot"></span>Edição de sexta-feira</span>
          <h1 className="logo">Portal da Manhã</h1>
          <p className="sub">
            Branding, design e tecnologia das últimas 24 horas, lidos, selecionados e resumidos em português.
          </p>
          <div className="meta-row">
            <span>11 de setembro de 2026</span>
            <span><b>{NOTICIAS.length}</b> notícias</span>
            <span><b>{portais}</b> portais</span>
            <span><b>{comFoto}</b> com foto original</span>
          </div>
        </div>
      </header>

      <main>
        <div className="wrap">
          <article className="hero" onClick={() => setAberto(manchete)}>
            <div className="hero-media"><Visual item={manchete} /></div>
            <div className="hero-body">
              <Badges item={manchete} />
              <h2>{manchete.tituloPt}</h2>
              <p className="dek">{manchete.dek}</p>
              <span className="src">Clique para ler o resumo completo →</span>
            </div>
          </article>

          <div className="section-label">Mais desta edição</div>

          <div className="grid">
            {resto.map(item => (
              <article className="card" key={item.id} onClick={() => setAberto(item)}>
                <div className="card-media"><Visual item={item} /></div>
                <div className="card-body">
                  <Badges item={item} />
                  <h3>{item.tituloPt}</h3>
                  {item.paywall && <span className="warn">Conteúdo parcialmente atrás de paywall</span>}
                  <div className="foot">
                    <span className="src">Ler resumo →</span>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      </main>

      <footer>
        <div className="wrap">
          Portal da Manhã · edição de 11 de setembro de 2026. Resumos em português escritos a partir da leitura das
          matérias originais; os textos e imagens pertencem aos respectivos veículos, sempre linkados.
        </div>
      </footer>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
