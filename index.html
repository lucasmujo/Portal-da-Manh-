<title>Portal da Manhã — 18 de agosto de 2026</title>

<style>
  :root{

    --shadow:0 1px 2px rgba(20,20,20,.04), 0 8px 24px rgba(20,20,20,.06);
    --shadow-lg:0 2px 4px rgba(20,20,20,.05), 0 18px 48px rgba(20,20,20,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.55}
  #root{max-width:1180px;margin:0 auto;padding:0 24px 96px}
  a{color:inherit}
  header.top{padding:56px 0 32px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1.brand{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(44px,7vw,76px);line-height:1;margin:16px 0 12px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:15px;max-width:60ch}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}

  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;margin-bottom:44px}
  .hero:hover{transform:translateY(-3px)}
  .hero-media{position:relative;min-height:380px;background:#eee}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .hero-body{padding:40px 40px 36px;display:flex;flex-direction:column;justify-content:center}
  .hero-body h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(28px,3.4vw,42px);line-height:1.12;letter-spacing:-.015em;margin:14px 0 14px}
  .hero-body p{color:var(--muted);font-size:15.5px;margin:0 0 22px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .22s ease, box-shadow .22s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card-media{position:relative;aspect-ratio:16/10;background:#eee;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card-body h3{font-size:18px;line-height:1.3;margin:0;font-weight:600;letter-spacing:-.01em}
  .card-body .dek{color:var(--muted);font-size:14px;margin:0;flex:1}

  .tagrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:8px;color:#fff}
  .tag.branding{background:var(--brand)} .tag.design{background:var(--design)} .tag.tech{background:var(--tech)}
  .src{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .stars{font-size:12px;color:#d9a441;letter-spacing:1px;margin-left:auto}

  .overlay{position:fixed;inset:0;background:rgba(18,18,18,.42);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .modal{background:var(--card);max-width:840px;width:100%;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.28);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
  .modal-media{position:relative;aspect-ratio:16/9;background:#eee}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .modal-body{padding:32px 38px 38px}
  .modal-body h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,3.6vw,38px);line-height:1.15;margin:14px 0 6px;letter-spacing:-.015em}
  .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 20px}
  .modal-body .resumo p{font-size:16px;line-height:1.7;margin:0 0 16px}
  .note{font-size:13px;color:var(--muted);background:#faf9f6;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
  .actions{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:11px 18px;border-radius:12px;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .18s ease}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn:hover{opacity:.88}
  .closex{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  footer{margin-top:64px;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  @media (max-width:860px){
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:240px;position:relative;aspect-ratio:16/9}
    .hero-body{padding:28px 24px 30px}
    .modal-body{padding:24px 22px 30px}
    #root{padding:0 16px 72px}
  }
</style>
</head>

const PALETAS = {
  branding: ["#FFB067","#F2683C","#E14D2A","#FFD8A8"],
  design:   ["#7FD8C8","#1F9C8A","#12756A","#C9F0E7"],
  tech:     ["#A9B6FF","#5A6FF0","#3B45B8","#D8DEFF"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[2]} />
        </linearGradient>
        <linearGradient id={id + "b"} x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stopColor={p[3]} stopOpacity="0.85" />
          <stop offset="100%" stopColor={p[1]} stopOpacity="0.5" />
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#" + id + ")"} />
      <circle cx={60 + r(1) * 260} cy={40 + r(2) * 120} r={50 + r(3) * 60} fill={"url(#" + id + "b)"} />
      <rect x={20 + r(4) * 200} y={90 + r(5) * 90} width={90 + r(6) * 120} height={70 + r(7) * 70}
            rx="18" fill={p[1]} opacity="0.55" transform={"rotate(" + Math.round(r(8) * 30 - 15) + " 200 150)"} />
      <path d={"M0 " + (170 + r(9) * 40) + " Q 100 " + (110 + r(10) * 60) + " 200 " + (165 + r(11) * 40) + " T 400 " + (150 + r(12) * 50) + " V250 H0 Z"}
            fill={p[3]} opacity="0.55" />
      <circle cx={320 - r(13) * 80} cy={190 - r(14) * 60} r={14 + r(15) * 18} fill="#fff" opacity="0.35" />
    </svg>
  );
}

function Figura({ item, idx }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={idx + 3} />;
  return (
    <img src={item.imageUrl}
         alt={"Imagem da matéria: " + item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)} />
  );
}

const Estrelas = ({ n }) => <span className="stars">{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;
const rotulo = { branding: "Branding", design: "Design", tech: "Tecnologia" };

function Modal({ item, idx, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-media">
          <button className="closex" onClick={onClose} aria-label="Fechar">×</button>
          <Figura item={item} idx={idx} />
        </div>
        <div className="modal-body">
          <div className="tagrow">
            <span className={"tag " + item.categoria}>{rotulo[item.categoria]}</span>
            <span className="src">{item.source}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="resumo">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Resumo produzido a partir dos elementos públicos da página (título, dek, categoria e etiquetas), porque o conteúdo completo está atrás de assinatura.
            </div>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [manchete, ...resto] = NOTICIAS;
  const portais = [...new Set(NOTICIAS.map(n => n.source))];

  return (
    <React.Fragment>
      <header className="top">
        <div className="kicker"><span className="dot"></span> Edição de {DATA_EXTENSO}</div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="sub">Uma leitura diária do que aconteceu em branding, design e tecnologia nas últimas 24 horas. Clique em qualquer matéria para ler o resumo completo em português.</p>
        <div className="meta-row">
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais.length} portais</span>
          {portais.map(p => <span className="pill" key={p}>{p}</span>)}
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(0)}>
        <div className="hero-media"><Figura item={manchete} idx={0} /></div>
        <div className="hero-body">
          <div className="tagrow">
            <span className={"tag " + manchete.categoria}>{rotulo[manchete.categoria]}</span>
            <span className="src">{manchete.source}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
          <span className="btn primary" style={{alignSelf:"flex-start"}}>Ler resumo →</span>
        </div>
      </article>

      <div className="grid">
        {resto.map((item, i) => (
          <article className="card" key={item.url} onClick={() => setAberto(i + 1)}>
            <div className="card-media"><Figura item={item} idx={i + 1} /></div>
            <div className="card-body">
              <div className="tagrow">
                <span className={"tag " + item.categoria}>{rotulo[item.categoria]}</span>
                <span className="src">{item.source}</span>
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
            </div>
          </article>
        ))}
      </div>

      <footer>
        <span>Portal da Manhã · {DATA_EXTENSO}</span>
        <span>Resumos escritos em português a partir das fontes originais. Direitos das imagens e dos textos originais pertencem aos respectivos portais.</span>
      </footer>

      {aberto !== null && <Modal item={NOTICIAS[aberto]} idx={aberto} onClose={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
