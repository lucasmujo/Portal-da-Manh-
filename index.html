function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function Ilustracao({item}){
  const h=hash(item.id),g=GRAD[item.cat],gid="g"+item.id;
  const shapes=[0,1,2,3].map(i=>{const x=(h>>(i*3))%400,y=(h>>(i*2+1))%250,r=40+((h>>i)%90);

  return <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: "+item.tituloPt}>
    <defs><linearGradient id={gid} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={g[0]}/><stop offset=".55" stopColor={g[1]}/><stop offset="1" stopColor={g[2]}/></linearGradient></defs>
    <rect width="400" height="250" fill={`url(#${gid})`}/>{shapes}</svg>;
}

  return <div className="media">{item.imageUrl&&!falhou
    ? <img src={item.imageUrl} alt={item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
    : <Ilustracao item={item}/>}</div>;
}
const Estrelas=({n})=><span className="stars" title={n+" de 5"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
const Tag=({cat})=><span className={"tag t-"+cat}>{CATS[cat]}</span>;
function Modal({item,onClose}){
  useEffect(()=>{const f=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",f);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",f);document.body.style.overflow=""}},[]);
  return <div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <button className="x" onClick={onClose} aria-label="Fechar">×</button>
    <Midia item={item}/>
    <div className="in"><div className="row"><Tag cat={item.cat}/><Estrelas n={item.stars}/></div>
      <h2>{item.tituloPt}</h2><div className="orig">{item.title} — {item.source}</div>
      <p>{item.resumo}</p>
      {item.nota&&<div className="nota">{item.nota}</div>}
      <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a></div>
  </div></div>;
}
function App(){
  const [sel,setSel]=useState(null);
  const [top,...resto]=NOTICIAS;
  return <div className="wrap">
    <header><h1>☀️ Portal da Manhã</h1><div className="data">segunda-feira, 5 de outubro de 2026</div></header>
    <div className="hero" onClick={()=>setSel(top)}>
      <div className="body"><div className="row"><Tag cat={top.cat}/><Estrelas n={top.stars}/></div>
        <h2>{top.tituloPt}</h2><div className="src">{top.source}</div><div style={{color:"var(--acc)",fontWeight:600}}>Ler resumo →</div></div>
      <Midia item={top}/>
    </div>
    <div className="grid">{resto.map(it=><div className="card" key={it.id} onClick={()=>setSel(it)}>
      <Midia item={it}/><div className="body"><div className="row"><Tag cat={it.cat}/><Estrelas n={it.stars}/></div>
      <h3>{it.tituloPt}</h3><div className="src">{it.source}</div></div></div>)}</div>
    <footer>Resumos escritos em português a partir das matérias originais. Clique em uma notícia para ler.</footer>
    {sel&&<Modal item={sel} onClose={()=>setSel(null)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
