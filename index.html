<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 19 de agosto de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#14161a; --muted:#6b7280;
    --line:#e8e6e1; --accent:#c8452d; --accent-soft:#fdf1ee;
    --brand:#c8452d; --design:#0f7d6b; --tech:#4b53c8;
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 28px rgba(16,18,22,.06);
    --shadow-lg:0 2px 6px rgba(16,18,22,.06), 0 24px 60px rgba(16,18,22,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px 80px}
  header.top{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1.logo{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(34px,5.4vw,58px);margin:10px 0 6px;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:15px}
  .meta-line{margin-top:14px;color:var(--muted);font-size:13.5px}

  .hero{display:block;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s}
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr}
  .hero-media{position:relative;min-height:380px;background:#eee}
  .hero-body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center}
  .hero h2{font-family:Fraunces,Georgia,serif;font-size:clamp(24px,2.7vw,36px);line-height:1.16;margin:14px 0 14px;letter-spacing:-.015em}
  .hero p{color:#3c4149;font-size:16px;line-height:1.62;margin:0}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:26px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1),box-shadow .26s}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card-media{position:relative;height:186px;background:#eee}
  .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-size:17px;line-height:1.32;margin:0;font-weight:650;letter-spacing:-.01em}
  .card p.dek{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}

  img.thumb{width:100%;height:100%;object-fit:cover;display:block}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .t-brand{background:#fdf1ee;color:var(--brand)}
  .t-design{background:#e9f7f3;color:var(--design)}
  .t-tech{background:#eef0fd;color:var(--tech)}
  .src{font-size:12px;color:var(--muted);font-weight:600}
  .stars{font-size:12.5px;color:#e0a12c;letter-spacing:.06em}
  .foot-row{margin-top:auto;padding-top:6px}

  .overlay{position:fixed;inset:0;background:rgba(18,19,22,.5);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:38px 20px;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .modal{background:var(--card);max-width:820px;width:100%;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
  .modal-media{height:340px;background:#eee;position:relative}
  .modal-body{padding:30px 38px 40px}
  .modal h2{font-family:Fraunces,Georgia,serif;font-size:clamp(22px,3vw,32px);line-height:1.18;margin:14px 0 6px;letter-spacing:-.015em}
  .orig{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 20px}
  .modal p.body{font-size:16.5px;line-height:1.72;color:#2e333b;margin:0 0 16px}
  .note{background:#fbf7ec;border-left:3px solid #e0a12c;padding:12px 16px;border-radius:0 10px 10px 0;font-size:13.5px;color:#6b5a2f;line-height:1.55;margin:20px 0 0}
  .actions{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-block;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:650;text-decoration:none;border:0;cursor:pointer;font-family:inherit}
  .btn-p{background:var(--ink);color:#fff}
  .btn-s{background:#f0efeb;color:var(--ink)}
  .close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.94);border:0;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.16);z-index:3}
  footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}

  @media(max-width:900px){
    .hero-grid{grid-template-columns:1fr}
    .hero-media{min-height:240px}
    .hero-body{padding:26px 24px 30px}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:620px){
    .grid{grid-template-columns:1fr}
    .modal-body{padding:24px 22px 32px}
    .modal-media{height:220px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState} = React;

const NOTICIAS = [
  {
    id: 1,
    title: "Tivoli creates theme park Japanese neighbourhood in central Copenhagen",
    tituloPt: "O Tivoli abre um bairro japonês de 2.000 m² no centro de Copenhague — e importou 60 toneladas de tijolos do Japão para isso",
    source: "Dezeen",
    url: "https://www.dezeen.com/2026/08/19/tivoli-theme-park-japanese-hikari-copenhagen/",
    imageUrl: "https://static.dezeen.com/uploads/2026/08/tivoli-hikari-theme-park-copenhagen_dezeen_2364_col_hero.jpg",
    categoria: "Design",
    estrelas: 5,
    dek: "Cinco anos de projeto, consultoria nipo-dinamarquesa e uma obra de Takashi Murakami: Hikari é o investimento arquitetônico mais ambicioso do parque em dois séculos.",
    resumo: [
      "O Tivoli, parque de diversões dinamarquês que funciona em pleno centro de Copenhague desde o século 19, inaugurou Hikari — uma área de 2.000 metros quadrados inspirada nas cidades japonesas. O nome significa 'luz' em japonês, e a nova ala ocupa um trecho do parque que já abrigava um jardim japonês e um pagode, o que dá alguma continuidade ao gesto.",
      "A CEO Susanne Mørch Koch enquadra o projeto dentro de uma tradição da casa: trazer o mundo para Copenhague seria parte do DNA do Tivoli há mais de 180 anos, como já mostravam o Teatro de Pantomima de inspiração chinesa e o Nimb, de linguagem mourisca. A diferença é a escala. Hikari levou cinco anos para sair do papel e é descrito pelo parque como o investimento arquitetônico mais ambicioso da sua história recente.",
      "Rasmus Altenborg, diretor de design e desenvolvimento, explica que a intenção nunca foi copiar uma rua específica, mas montar uma espécie de patchwork: a arquitetura de Hikari mistura referências de Tóquio, Quioto e Osaka e atravessa períodos diferentes, alternando cores, materiais e estilos ao longo do mesmo quarteirão. O resultado é um conjunto de edifícios em estilo japonês com lojas, restaurantes e o hotel maluco Hotel Hikari.",
      "A atração nova é o Typhoon's Eye, brinquedo giratório cujo revestimento externo evoca painéis shoji. Segundo Altenborg, o maior desafio foi o espaço limitado — o Tivoli é cercado pela cidade e não tem para onde crescer —, e o brinquedo foi pensado para complementar, e não substituir, o já existente The Demon.",
      "Boa parte do material veio do próprio Japão: 60 toneladas de tijolos, 200 janelas e portas de madeira, barris de saquê e bonecas kokeshi cruzaram meio mundo para compor a cenografia. O parque também montou uma comissão consultiva com especialistas dinamarqueses e nipo-dinamarqueses, e chamou um designer gráfico japonês para cuidar da sinalização.",
      "A área exibe uma obra de Takashi Murakami com sua flor sorridente — escolha que o parque justifica pela própria reputação de seus jardins. Gatos aparecem como personagem recorrente, em referência ao Maneki-neko, ao lado de pôsteres de cinema japoneses, cerejeiras e pagodes.",
      "Questionada sobre o risco de exotização, Koch responde que a equipe passou anos desenvolvendo a área, viajou ao Japão e envolveu consultores e parceiros japoneses justamente para ser, nas palavras dela, genuinamente respeitosa com a origem das referências. É a defesa esperada, e a discussão sobre onde termina a homenagem e começa o cenário temático segue aberta — mas o volume de pesquisa e a importação de materiais originais colocam Hikari num patamar diferente do pastiche habitual dos parques."
    ]
  },
  {
    id: 2,
    title: "Inside EMI and Island Records' New HQ",
    tituloPt: "Amarelo Pantone 109C de um lado, azul Klein do outro: como a EMI e a Island Records dividiram uma sede sem perder identidade",
    source: "Design Week",
    url: "https://www.designweek.co.uk/inside-emi-and-island-records-new-hq/",
    imageUrl: "https://www.designweek.co.uk/content/uploads/2026/08/KRL520-EMI-ISLAND-RECORDS-23-0814-v2-1024x683.jpg",
    categoria: "Design",
    estrelas: 5,
    dek: "Interesting Projects e o estúdio interno Studio Eye transformaram 800 m² em Pancras Square num híbrido de escritório e exposição, com mais de 70 obras nas paredes.",
    resumo: [
      "Duas gravadoras com histórias muito diferentes passaram a dividir o mesmo andar em Londres, e o problema de design era exatamente esse: como fazer uma sede única expressar duas culturas sem transformar tudo em papa neutra. A EMI nasceu em Londres em 1931; a Island Records foi fundada na Jamaica em 1959. Entre as duas está um catálogo que vai de Bob Marley e os Beatles a Grace Jones, Amy Winehouse, Taylor Swift e Lola Young. Ambas pertencem ao Universal Music Group e ocupavam andares distintos em Pancras Square desde 2015, até a equipe da EMI se mudar para os 800 m² da Island, no nono andar, dois anos atrás.",
      "O redesenho é assinado pelo escritório Interesting Projects com o Studio Eye, o time criativo interno de 12 pessoas que produz capas, videoclipes, conteúdo e shows para os artistas das duas gravadoras. A diretora criativa do Studio Eye, Holly Williams, descreve o estado anterior como um espaço caótico onde todo mundo estava espremido. Joana Filipe, da Interesting Projects, é mais direta: um labirinto com merchandising por toda parte e um carpete de estampa altíssima.",
      "Uma pesquisa interna deu o mandato do projeto. Mais de 40% dos funcionários pediam mais espaço para colaboração e convívio; mais da metade queria mais salas de reunião. Filipe faz questão de dizer que a bagunça tinha uma energia boa, com música alta saindo de cada sala — o desafio era manter esse clima e resolver a acústica, que virou requisito obrigatório.",
      "A resposta cromática separa as duas identidades. Na área da Island, o amarelo característico da casa (Pantone 109C) foi combinado com um rosa vivo (Pantone 671C), aceno à fase progressiva e folk do fim dos anos 1960, e há um mural pintado à mão pelo letrista britânico-jamaicano Jorge Jacobs, ligado ao coletivo Nurse Signs da Jamaica. Para a EMI, a equipe queria expressar uma britanicidade que soasse inclusiva e acolhedora, e chegou a uma paleta que desmonta a Union Jack: vermelho, branco e azul Klein, mais régio que o naval tradicional da bandeira.",
      "Os designers descrevem o resultado como um híbrido de escritório e exposição. Mais de 70 peças entre obras históricas, encomendas novas, fotografias e efemérides cobrem as paredes, com trabalhos de Annie Leibovitz, Thierry Noir, Jeremy Deller, Corbin Shaw e Anton Corbijn. Williams justifica: quando um artista, um empresário ou um funcionário atravessa o corredor e reconhece algo na parede, aquilo explica por que se faz o que se faz ali.",
      "Do lado técnico, 20% das divisórias foram mantidas e todo o envidraçamento acústico e a iluminação foram reaproveitados; o revestimento acústico do edifício foi atualizado para evitar vazamento de som entre ambientes. Cada gravadora ganhou entrada própria, as salas privativas do perímetro foram preservadas (e algumas somadas), e o miolo passou a concentrar as áreas comuns — sala de reuniões, armazenamento, cozinha e espaço de refeições, este último acumulando função de reunião fechada."
    ]
  },
  {
    id: 3,
    title: "IKEA's most recent collection is an \"entry point\" for young collectors",
    tituloPt: "A IKEA quer vender design de colecionador por menos de 200 libras — e chama as 22 peças da Konstrunda de 'objetos de arte'",
    source: "Dezeen",
    url: "https://www.dezeen.com/2026/08/19/ikea-konstrunda-collection-collectible-design-art/",
    imageUrl: "https://static.dezeen.com/uploads/2026/08/konstrunda-collection-ikea_dezeen_2364_hero.jpg",
    categoria: "Design",
    estrelas: 5,
    dek: "Sete designers, 22 peças, nenhuma acima de 200 libras. Karin Gustavsson defende que colecionar não deveria ter barreira de entrada — e o vaso mais barato custa 19 libras.",
    resumo: [
      "A IKEA lançou a Konstrunda, coleção de edição limitada que tenta traduzir o vocabulário do collectible design para a faixa de preço da marca. O nome significa algo como 'passeio de arte' em sueco, e a proposta é declarada: nenhuma das 22 peças passa das 200 libras.",
      "São sete designers envolvidos, entre nomes externos e internos — o londrino Andu Masebo, o italiano Emanuele Stamuli, a sueca Lisa Hilland, a artista Lisa Reiser, a dupla Ingrid Leander e Igor Holtermann e a designer interna Akanksha Deo.",
      "Karin Gustavsson, líder criativa da coleção, resume a tese à Dezeen: design colecionável não deveria ter barreira de entrada, e colecionar deveria ser possível 'para os muitos'. Ela imagina a Konstrunda como o ponto de partida de alguém jovem que está começando a montar uma casa e a acumular peças com alguma intenção.",
      "O extremo mais barato é um vaso preto e branco de Stamuli, por 19 libras. No topo, a mesa lateral de Masebo sai por 149 libras, com uma moldura robusta que ecoa a Tubular Chair do próprio designer. Masebo também assina dois bancos geométricos que funcionam igualmente como mesas de apoio ou plintos — um em pinho cru, outro pintado de azul vivo.",
      "Lisa Reiser contribuiu com vasos de vidro soprado à boca inspirados nos próprios devaneios, incluindo uma versão verde-viva com cara de bala de goma. Lisa Hilland entrou com um banco de pinho e uma escultura laranja curvada. Ingrid Leander e Igor Holtermann desenharam almofadas estampadas e um tapete a partir de faixas de pedestres e fitas de sinalização de Estocolmo — o repertório visual mais banal possível da rua sueca, transposto para o têxtil.",
      "Akanksha Deo, do time interno, criou dois vasos expressivos como resposta ao que descreve como epidemia de solidão; um deles se lê quase como um personagem montado com blocos empilhados.",
      "Gustavsson insiste em chamar tudo de 'objetos de arte' e explica o motivo: para a IKEA, arte e design não são mundos separados, e o briefing partiu da expressão artística, não de uma necessidade funcional. É uma inversão relevante para uma empresa cuja lógica de produto costuma nascer do problema doméstico a ser resolvido. Vale a ressalva de que 'edição limitada' na escala da IKEA significa algo bem diferente do que significa numa galeria — mas o experimento de preço é interessante por si só."
    ]
  },
  {
    id: 4,
    title: "New Logo and Identity for Vizcom by Outland",
    tituloPt: "A Outland refaz a marca da Vizcom com wordmark itálico e volume 3D — a ferramenta de sketch com IA para designers industriais ganha cara de software sério",
    source: "Brand New",
    url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_vizcom_by_outland.php",
    imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/08/vizcom_logo_before_after.png",
    categoria: "Branding",
    estrelas: 4,
    dek: "Publicado como 'Noted' no Brand New em 18 de agosto, com o trocadilho 'If you Sketch my Drift' no título e tags que apontam para 3D, bold, itálico e wordmark.",
    resumo: [
      "O Brand New publicou em 18 de agosto o rebrand da Vizcom assinado pelo estúdio Outland, na categoria editorial 'Noted' — o meio-termo da casa entre a resenha longa e a simples menção. O título da matéria é o trocadilho 'If you Sketch my Drift', referência direta ao produto: a Vizcom é uma plataforma que converte esboços em renderizações, usada sobretudo por designers industriais e de produto.",
      "Pelos elementos públicos do post, o projeto é classificado na indústria de Software e etiquetado com as tags 3d, bold, italic, outland e wordmark. A imagem de destaque é o clássico comparativo antes e depois do logotipo, e o post traz ainda uma seção de aplicação de exemplo.",

  {
    id: 5,
    title: "Athletics updates Salesforce's brand to mark its move into agentic AI",
    tituloPt: "'O círculo é a gramática, não a ideia': a Athletics reconstrói a marca da Salesforce em torno da IA agêntica e aposenta o Astro onipresente",
    source: "The Brand Identity",
    url: "https://the-brandidentity.com/project/athletics-updates-salesforces-brand-to-mark-its-move-into-agentic-ai",
    imageUrl: null,
    categoria: "Branding",
    estrelas: 4,
    dek: "Conceito 'Atmosphere of Possibility', paleta que estende o Cloud Blue para teal, amarelo, rosa e violeta, e um sistema de ícones 3D derivado do portfólio de produtos.",
    resumo: [
      "A Salesforce, fundada por Marc Benioff em 1999 sobre a ideia então herética de entregar software corporativo pela nuvem, atualizou sua marca para marcar a entrada na chamada IA agêntica, materializada na plataforma Agentforce. O trabalho é do estúdio nova-iorquino Athletics e cobriu pesquisa, estratégia criativa, identidade, direção de arte, voz de marca e motion graphics.",
      "O conceito central se chama 'Atmosphere of Possibility': profundidade e espaço tridimensional aplicados a uma experiência descrita como de 360 graus, onde dados, agentes e humanos se encontram. Na prática, isso significa que o sistema gráfico saiu do círculo que já existia dentro da nuvem do logotipo original.",
      "O diretor criativo Daniel Irizarry resume a lógica numa frase que vale para muito rebrand: o círculo é a gramática, não a ideia. Dele derivou um conjunto de formas centrais — de panoramas de 360 graus a dispositivos de enquadramento —, todas testadas em peças reais de marketing para checar se funcionavam como elemento funcional ou apenas expressivo.",
      "A paleta parte do Cloud Blue já associado à empresa, clareado para ambientes digitais, e se abre para teal, amarelo, rosa e violeta. Foi criado também um sistema de ícones tridimensionais derivado do portfólio de produtos, em que cada ícone representa um desafio, uma ambição ou uma conquista de cliente.",

      "Como equipes do mundo inteiro produzem material da marca, a Athletics trabalhou junto ao time interno nas diretrizes, priorizando exemplos acionáveis em vez de regras abstratas. O time interno construiu o Brand Central em Webflow, reunindo guidelines, boas práticas e downloads de assets. Ilustração de Laura Sirvent e Jelly."
    ]
  },
  {
    id: 6,
    title: "OMA completes first US affordable housing development in San Francisco",
    tituloPt: "A OMA entrega sua primeira habitação social nos EUA: 160 apartamentos em San Francisco com fachada ondulada de GFRC e três pátios",

    url: "https://www.dezeen.com/2026/08/18/730-stanyan-oma-affordable-housing-san-francisco-ya-studio/",

const PALETAS = {
  Branding: [["#ffb37a","#e8563f"],["#ffd08a","#d9484f"],["#ffc2a8","#c8452d"]],
  Design:   [["#7fe3c8","#0f7d6b"],["#a8e6d2","#12796f"],["#8fdcd0","#0d6b62"]],
  Tecnologia:[["#a8b6ff","#4b53c8"],["#c0b0ff","#5a45c0"],["#9fc4ff","#3f57cf"]]
};

function Ilustracao({categoria, seed, radius}){
  const paleta = PALETAS[categoria] || PALETAS.Design;
  const p = paleta[seed % paleta.length];
  const gid = "g" + categoria + seed;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block",borderRadius:radius||0}}
         role="img" aria-label={"Ilustração abstrata da categoria " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#"+gid+")"}/>
      <circle cx={80 + (seed*37)%180} cy={70 + (seed*23)%90} r={54 + (seed*11)%34}
              fill="#fff" opacity="0.17"/>
      <circle cx={300 - (seed*19)%110} cy={190 - (seed*13)%70} r={40 + (seed*7)%30}
              fill="#000" opacity="0.09"/>
      <rect x={40 + (seed*29)%160} y={130 + (seed*17)%50} width="130" height="130"
            transform={"rotate(" + (12 + (seed*9)%36) + " 120 190)"}
            fill="#fff" opacity="0.13"/>
      <path d={"M0," + (200 + (seed*5)%30) + " Q100," + (140 + (seed*9)%50) + " 200," + (195 + (seed*7)%30) + " T400," + (170 + (seed*11)%40)}
            stroke="#fff" strokeWidth="2.5" fill="none" opacity="0.36"/>
    </svg>
  );
}

function Media({item, radius}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={item.id} radius={radius}/>;
  }
  return (
    <img className="thumb" src={item.imageUrl} alt={item.tituloPt}
         referrerPolicy="no-referrer" loading="lazy"
         onError={() => setFalhou(true)}/>
  );
}

function tagClass(cat){
  if(cat === "Branding") return "tag t-brand";
  if(cat === "Tecnologia") return "tag t-tech";
  return "tag t-design";
}
const estrelas = n => "★".repeat(n) + "☆".repeat(5-n);

function Modal({item, onClose}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-media">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Media item={item}/>
        </div>
        <div className="modal-body">
          <div className="row">
            <span className={tagClass(item.categoria)}>{item.categoria}</span>
            <span className="src">{item.source}</span>
            <span className="stars">{estrelas(item.estrelas)}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((par, i) =>
            par.startsWith("PAYWALL:")
              ? <p key={i} className="note">{par.replace("PAYWALL: ","")}</p>
              : <p key={i} className="body">{par}</p>
          )}
          <div className="actions">
            <a className="btn btn-p" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} →</a>
            <button className="btn btn-s" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

  const manchete = NOTICIAS[0];
  const resto = NOTICIAS.slice(1);
  const portais = [...new Set(NOTICIAS.map(n => n.source))];

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição diária</div>
        <h1 className="logo">Portal da Manhã</h1>
        <div className="date">Quarta-feira, 19 de agosto de 2026</div>
        <div className="meta-line">
          {NOTICIAS.length} notícias · {portais.length} portais · branding, design e cultura visual
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <div className="hero-grid">
          <div className="hero-media"><Media item={manchete}/></div>
          <div className="hero-body">
            <div className="row">
              <span className={tagClass(manchete.categoria)}>{manchete.categoria}</span>
              <span className="src">{manchete.source}</span>
              <span className="stars">{estrelas(manchete.estrelas)}</span>
            </div>
            <h2>{manchete.tituloPt}</h2>
            <p>{manchete.dek}</p>
          </div>
        </div>
      </article>

      <div className="grid">
        {resto.map(item => (
          <article className="card" key={item.id} onClick={() => setAberto(item)}>
            <div className="card-media"><Media item={item}/></div>
            <div className="card-body">
              <div className="row">
                <span className={tagClass(item.categoria)}>{item.categoria}</span>
                <span className="src">{item.source}</span>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="foot-row"><span className="stars">{estrelas(item.estrelas)}</span></div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã — seleção diária de branding, design e cultura visual.<br/>
        Fontes desta edição: {portais.join(" · ")}.<br/>
        Resumos redigidos em português a partir das matérias originais; textos não são reprodução do conteúdo das fontes. Imagens hospedadas pelos próprios portais.
      </footer>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
