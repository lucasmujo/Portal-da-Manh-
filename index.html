<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 27 de agosto de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#14161a; --muted:#6b7280; --line:#e6e6e1;
    --accent:#e2483c; --branding:#f4a261; --design:#2a9d8f; --tech:#6366f1;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --shadow-lg:0 2px 6px rgba(20,22,26,.06), 0 20px 50px rgba(20,22,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  header.top{padding:52px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1.brand{font-family:"Instrument Serif",Georgia,serif;font-size:clamp(40px,7vw,68px);line-height:1;margin:12px 0 10px;font-weight:400;letter-spacing:-.02em}
  .date{color:var(--muted);font-size:14px}
  .meta-line{margin-top:16px;font-size:13px;color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px;color:#fff}
  .b-Branding{background:#d97706}
  .b-Design{background:#16857a}
  .b-Tecnologia{background:#4f46e5}
  .stars{color:#e0a800;font-size:13px;letter-spacing:1px}
  .lead{display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s;margin-bottom:34px}
  .lead:hover{transform:translateY(-3px)}
  .lead .ph{position:relative;min-height:340px;background:#eceae5}
  .lead .txt{padding:38px 40px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .lead h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,3.2vw,40px);line-height:1.1;margin:0;letter-spacing:-.01em}
  .lead p{color:#4b5158;font-size:15px;line-height:1.6;margin:0}
  .src{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1), box-shadow .26s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card .ph{position:relative;aspect-ratio:16/10;background:#eceae5}
  .card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:17px;line-height:1.32;margin:0;font-weight:600;letter-spacing:-.01em}
  .card .dek{font-size:13.5px;color:#5b6169;line-height:1.55;margin:0}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  img.cover{width:100%;height:100%;object-fit:cover;display:block}
  .ph svg{position:absolute;inset:0;width:100%;height:100%}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(18,20,24,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
  .modal{background:var(--card);max-width:820px;width:100%;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.3);animation:rise .3s cubic-bezier(.2,.8,.2,1)}
  .modal .hero{position:relative;aspect-ratio:16/9;background:#eceae5}
  .modal .inner{padding:32px 38px 40px}
  .modal h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.15;margin:14px 0 6px}
  .modal .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 18px}
  .modal p.body-t{font-size:15.5px;line-height:1.75;color:#33383f;margin:0 0 14px}
  .note{font-size:13px;color:#8a6d3b;background:#fdf6e3;border:1px solid #f1e3bd;padding:10px 14px;border-radius:10px;margin-top:6px}
  .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{border:0;font-family:inherit;font-size:14px;font-weight:600;padding:12px 20px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-block}
  .btn-p{background:var(--ink);color:#fff}
  .btn-s{background:#f0f0ec;color:var(--ink)}
  .close{position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;line-height:1;box-shadow:var(--shadow)}
  footer{margin:56px 0 40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}.lead .ph{min-height:220px;aspect-ratio:16/9}.lead .txt{padding:26px 24px}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.modal .inner{padding:24px 22px 32px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const NOTICIAS = [
  {
    title: "Big-name studios encouraging architects to use AI",
    tituloPt: "Os grandes escritórios de arquitetura pararam de resistir: como Foster, Zaha Hadid e companhia passaram a empurrar a IA para dentro do estúdio",
    source: "Dezeen",
    url: "https://www.dezeen.com/2026/08/25/architecture-studios-encouraging-ai-feature/",
    imageUrl: "https://static.dezeen.com/uploads/2026/08/architecture-studios-using-ai-feature-sq_dezeen_2364_col_1.jpg",
    categoria: "Design",
    estrelas: 5,
    dek: "Os escritórios mais influentes do mundo já usam IA de concepção formal a análise de projeto e relatórios.",
    resumo: [
      "O Dezeen levantou como os escritórios de arquitetura mais visíveis do planeta estão incorporando inteligência artificial no dia a dia — e a conclusão é que a fase de experimentação silenciosa acabou. A reportagem mostra estúdios de grande porte não apenas tolerando o uso de IA, mas incentivando ativamente que seus arquitetos recorram a ela.",
      "O uso descrito vai muito além da imagem bonita de concurso. A tecnologia aparece em três frentes distintas: geração e teste de alternativas formais nas etapas iniciais de projeto, análise de dados de desempenho e viabilidade, e produção de relatórios e documentação — justamente o trabalho que costuma consumir as horas menos glamourosas do escritório.",
      "O pano de fundo importa. A publicação vem poucos dias depois de o próprio Dezeen registrar a retração mais longa já medida nas receitas da arquitetura americana e da entrada em vigor, na União Europeia, da exigência de rotular renderizações realistas geradas por IA. Ou seja: os escritórios estão automatizando em um momento de aperto econômico e de regulação recém-nascida, o que torna a pergunta sobre o que sobra para o arquiteto júnior bem menos abstrata."
    ],
    parcial: true
  },
  {
    title: "New Name, Logo, and Identity for Kinisla by RichardsDee",
    tituloPt: "Um gigante irlandês de laticínios troca de nome e vira 'Kinisla' — e o Brand New batiza o texto de 'Kerry On, My Wheyward Sun'",
    source: "Brand New",
    url: "https://www.underconsideration.com/brandnew/archives/new_name_logo_and_identity_for_kinisla_by_richardsdee.php",
    imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/08/Kinisla_before_after.jpg",
    categoria: "Branding",
    estrelas: 5,
    dek: "Naming, tipografia proprietária e um sistema de ícones geométricos em verde para o setor de laticínios da Irlanda.",
    resumo: [
      "O Brand New abriu a quarta-feira com um projeto completo da RichardsDee: nome novo, logo novo e identidade nova para a Kinisla, uma empresa irlandesa de agricultura e laticínios. A resenha ficou por conta de Jon, na categoria 'Reviewed' — a mais aprofundada da casa — e com o trocadilho de sempre no título, 'Kerry On, My Wheyward Sun', que brinca com o 'whey' (soro do leite) e com a região de Kerry.",
      "Pelo que é público do post, o trabalho não foi um retoque: houve renomeação, o que significa que a empresa abandonou a marca anterior por inteiro. As tags do projeto entregam o vocabulário visual escolhido — geometria, verde, tipografia proprietária e um conjunto de ícones, mais uma sans serif como base. É a receita corporativa contemporânea aplicada a um setor que historicamente comunica através de fotografia de pasto e selos de tradição.",
      "A escolha de encomendar uma tipografia própria chama atenção num segmento em que a maioria das empresas se contenta com fontes de biblioteca. Combinada ao sistema de ícones, sugere uma marca pensada para operar em muitos pontos de contato — embalagem, veículo, uniforme, digital — sem depender do logo isolado para se fazer reconhecer."
    ],
    parcial: true
  },
  {
    title: "Dragon Rouge creates new brand identity for food processing giant Foodera Technologies",
    tituloPt: "Cinco fabricantes de máquinas viram uma marca só: a Dragon Rouge extraiu o logo da Foodera da geometria de uma linha de produção",
    source: "Design Week",
    url: "https://www.designweek.co.uk/dragon-rouge-creates-new-brand-identity-for-food-processing-giant-foodera-technologies/",
    imageUrl: "https://www.designweek.co.uk/content/uploads/2026/08/13-1024x576.png",
    categoria: "Branding",
    estrelas: 4,
    dek: "Verde-limão de equipamento de segurança, monograma isométrico e arquitetura de marca que preserva as cinco empresas de origem.",
    resumo: [
      "Depois de vencer uma concorrência em fevereiro, a Dragon Rouge foi encarregada de criar nome, estratégia, identidade visual e arquitetura de marca da Foodera Technologies — a entidade que reúne Kiremko, Idaho Steel, Reyco Systems, Tummers Group e Van der Giessen em um dos maiores fornecedores mundiais de máquinas para processamento de alimentos.",
      "A solução de arquitetura foi conservadora no bom sentido: a Foodera vira a marca corporativa mestre, enquanto as cinco empresas históricas continuam operando como marcas de produto dentro do portfólio. Ninguém perde o reconhecimento que construiu em seus mercados. O posicionamento se ancora na ideia 'Built to Lead'.",
      "O símbolo tem origem literal na fábrica: um elemento em ângulo reto representa a linha de produção integrada e um cubo isolado representa os componentes individuais de maquinário e o serviço de manutenção. Desenhados em projeção isométrica, os dois formam um 'F' abstrato. A paleta cruza um verde-limão de alta visibilidade — o mesmo de vestimenta de segurança industrial — com um verde escuro, apoiada por linhas técnicas, anotações de blueprint e tipografia condensada.",
      "Becky King, diretora executiva de criação da Dragon Rouge, descreve o sistema como algo desenhado para se mover, escalar e se adaptar. A marca foi ao ar globalmente em junho e está sendo implantada ao longo do ano em uniforme pesado, interfaces móveis e embalagem de consumo."
    ]
  },
  {
    title: "Studio Thonik's typographic orchestra identity mimics the movement of a conductor's baton",
    tituloPt: "Uma orquestra sem sede virou uma fonte que inclina até 90 graus: o Studio Thonik transformou a batuta do maestro em sistema visual",
    source: "It's Nice That",
    url: "https://www.itsnicethat.com/articles/studio-thonik-phion-symphony-orchestra-graphic-design-discover-260826",
    imageUrl: "https://admin.itsnicethat.com/images/mdWthyhQVdjNOmiC1IAObEBsDCM=/281332/width-1440%7Cformat-jpeg/Studio-Thonik-Phion-Symphony-Orchestra-Graphic-Design-Itsnicethat-1.png",
    categoria: "Design",
    estrelas: 4,
    dek: "A GT Planar, da Grilli Type, tem eixo contínuo de inclinação — e cada concerto ganha um ângulo diferente.",
    resumo: [
      "A Phion Symphony Orchestra não tem prédio. É um conjunto itinerante, sem sede nem fachada reconhecível — e foi exatamente essa ausência que definiu a estratégia do estúdio amsterdamês Thonik. Sem lugar nem arquitetura para servir de âncora, a identidade foi fundada na própria música.",
      "A ferramenta escolhida foi a GT Planar, uma sans serif da Grilli Type com eixo variável de inclinação que percorre 90 graus contínuos. Falco van Burg, líder de design do estúdio, explica que a fonte guarda detalhes que só aparecem quando ela é inclinada: no momento em que o tipo tomba, formas extras emergem e reforçam seu caráter.",
      "O sistema funciona como partitura. Antes de desenhar qualquer coisa, o estúdio pergunta o que a peça musical transmite — se é calma ou inquieta, se cresce devagar ou atinge o ouvinte de imediato. Uma peça inquieta dobra as letras com força e quebra a palavra; uma peça calma mantém tudo aberto e silencioso. Cada concerto ganha imagem própria sem que a orquestra deixe de ser reconhecível.",
      "É uma resposta elegante a um problema recorrente do branding cultural: como criar consistência para uma instituição que muda de endereço toda semana. A resposta do Thonik foi trocar o lugar pelo gesto — e o gesto, nesse caso, é o da batuta."
    ]
  },
  {
    title: "Advertising's new era of weird",
    tituloPt: "A publicidade sempre flertou com o estranho — mas as agências agora estão testando até onde dá para ir sem perder o sentido",
    source: "Creative Review",
    url: "https://www.creativereview.co.uk/advertising-new-era-of-weird/",
    imageUrl: "https://creativereview.imgix.net/uploads/2026/08/Manscaped.jpg?auto=compress%2Cformat&w=1200",
    categoria: "Branding",
    estrelas: 4,
    dek: "Com o público cada vez mais difícil de surpreender, a CR ouviu as agências que mantêm o bizarro ancorado em alguma ideia.",
    resumo: [
      "A Creative Review abriu a quinta-feira com uma reportagem sobre o que chama de 'nova era do estranho' na publicidade. A premissa: a propaganda nunca teve medo do bizarro, mas as campanhas de agora estão levando isso a extremos que não se viam antes.",
      "A explicação econômica é direta. À medida que o público fica mais difícil de surpreender — saturado de conteúdo, imune a fórmula, com o polegar sempre pronto para rolar a tela —, o estranho deixa de ser um risco criativo e vira uma tática de sobrevivência para conquistar atenção.",
      "O ângulo da reportagem, porém, não é celebratório. A publicação conversou com as agências que conseguem manter o descontrole ancorado em algo com significado, e a distinção é justamente essa: entre o bizarro que carrega uma ideia de marca e o bizarro que existe só para gerar recorte de rede social. A primeira categoria constrói memória; a segunda evapora no fim de semana.",
      "Vale a pena para quem trabalha com criação de campanha e vive a tensão entre ser notado e ser lembrado — que raramente são a mesma coisa."
    ],
    parcial: true
  },
  {
    title: "Shirt storm: the beautiful game and its critical clients",
    tituloPt: "A 'camisa código de barras' do Newcastle e o cliente mais implacável do design: o torcedor que se sente dono da marca",
    source: "Design Week",
    url: "https://www.designweek.co.uk/shirt-storm-the-beautiful-game-and-its-critical-clients/",
    imageUrl: "https://www.designweek.co.uk/content/uploads/2026/08/England_Admiral_Getty.jpg",
    categoria: "Branding",
    estrelas: 4,
    dek: "Tom Carey, da Canva e da Affinity, sobre por que o design de uniforme virou o briefing mais exigente que existe.",
    resumo: [
      "Horas — talvez segundos — depois de o Newcastle United revelar sua camisa titular 2026/27, as redes sociais já tinham veredito. Apelidada de 'camisa código de barras' pela torcida, o uniforme provocou milhares de comentários sobre a espessura das listras pretas e sobre se o clube tinha se afastado demais da própria identidade. Depois veio o escudo proposto, e o barulho aumentou.",
      "Tom Carey, diretor global de criação para experiência de marca na Affinity e na Canva, argumenta que essa reação, longe de ser um pesadelo, é a prova de que o design entrou em algo maior do que ele mesmo. Quando alguém discute apaixonadamente uma cor, uma listra ou um escudo, é porque aquilo passou a lhe pertencer.",
      "O texto passeia por exemplos que já venceram a disputa: o Venezia FC, cujos uniformes cruzam futebol com arte, arquitetura e moda de luxo; e o Walthamstow FC, cuja camisa inspirada em William Morris se tornou o primeiro uniforme de futebol a ganhar um prêmio D&AD. Do outro lado estão os fracassos célebres — o escudo do Leeds em 2018, abandonado após a revolta dos torcedores, e a troca do azul pelo vermelho no Cardiff City, revertida três anos depois.",
      "Segundo a ESPN, os clubes começam a discutir conceitos de 18 a 20 meses antes do lançamento. Rob Revel, designer da camisa do Sunderland, estudou desenhos arquitetônicos da ponte Keel Crossing fornecidos pela prefeitura e produziu mais de 60 conceitos antes de chegar ao definitivo. Sua observação mais reveladora é a mais simples: 'o design é a parte fácil'.",
      "Carey fecha lembrando que o julgamento também envelhece: a camisa da Inglaterra da Admiral, usada entre 1980 e 1983, foi acusada na época de ser comercial demais e diferente demais — e hoje é celebrada como pioneira. A do Newcastle talvez tenha o mesmo destino. Talvez."
    ]
  },
  {
    title: "New Logo and Identity for The Train Factory by Hasan & Partners",
    tituloPt: "Uma antiga fábrica de trens em Helsinque vira destino de gastronomia e entretenimento — com identidade industrial pela Hasan & Partners",
    source: "Brand New",
    url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_the_train_factory_by_hasan_partners.php",
    imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/08/the_train_factory_logo_before_after.png",
    categoria: "Branding",
    estrelas: 3,
    dek: "Sans serif em caixa alta e vocabulário industrial para um complexo finlandês de entretenimento e restaurantes.",
    resumo: [
      "Publicado na categoria 'Noted' por Armin Vit em 26 de agosto, o projeto da agência finlandesa Hasan & Partners para o The Train Factory ganhou do Brand New o trocadilho 'That Tracks' — algo como 'isso faz sentido', com o trilho embutido.",
      "Pelos elementos públicos do post, a marca atende a um complexo que cruza entretenimento e restaurantes, e a linguagem escolhida é declaradamente industrial: sans serif, caixa alta, referência direta ao passado fabril do lugar. É a estratégia clássica de reconversão de patrimônio industrial — não esconder a origem de galpão, e sim transformá-la em ativo de marca.",
      "O caso se soma a um movimento que aparece com frequência nas páginas do Brand New: antigas instalações produtivas europeias reconvertidas em destinos culturais e gastronômicos, quase sempre com identidades que preservam a tipografia robusta e a paleta contida do maquinário original."
    ],
    parcial: true
  },
  {
    title: "Viral AI startup Instinct has raised $350 million at a $2.5 billion valuation",
    tituloPt: "Um ano de vida, um fundador de 23 anos e US$ 2,5 bilhões de avaliação: a Instinct é o assistente de IA que ninguém sabe se deve deixar entrar no celular",
    source: "TechCrunch",
    url: "https://techcrunch.com/2026/08/26/viral-ai-startup-instinct-has-raised-350-million-at-a-2-5-billion-valuation/",
    imageUrl: "https://techcrunch.com/wp-content/uploads/2026/08/GettyImages-2255991416.jpg?resize=1200,795",
    categoria: "Tecnologia",
    estrelas: 4,
    dek: "Série B de US$ 250 milhões co-liderada por Index e Benchmark — e uma polêmica crescente sobre permissões.",
    resumo: [
      "A Instinct, fundada há pouco mais de um ano e comandada por Noah Shinn, de 23 anos, contou ao Wall Street Journal que levantou US$ 250 milhões em uma Série B recente. O aporte eleva o total captado a US$ 350 milhões e coloca a empresa — operada pela Spear Street Technology — em uma avaliação de US$ 2,5 bilhões. A rodada foi co-liderada por Index Ventures e Benchmark.",
      "O produto é um agente de IA que promete organizar a vida do usuário. Você conecta seus aplicativos e dispositivos e conversa com ele por mensagem de texto ou por ligação. Shinn afirma que os primeiros usuários já planejaram viagens de carro pelo país, compraram mercado da semana e ingressos de show, cancelaram centenas de dólares em assinaturas — e que alguém está organizando o próprio casamento pelo assistente.",
      "O contraponto vem junto. Ainda em beta fechado e com um site deliberadamente rudimentar, a Instinct já acumulou críticas por privacidade: usuários apontam permissões excessivamente generosas exigidas pelo aplicativo e termos de uso cujo potencial invasivo incomodou parte do público. É a tensão que define esta geração de agentes — para ser útil, o sistema precisa de acesso a tudo; e é justamente o acesso a tudo que assusta."
    ]
  },
  {
    title: "Nevi Brings a Little Playfulness to the Serious Desk Lamp",
    tituloPt: "A luminária que balança e volta sozinha: Nevi transforma o joão-bobo em objeto de mesa — e a embalagem também vira luminária",
    source: "Yanko Design",
    url: "https://www.yankodesign.com/2026/08/26/nevi-brings-a-little-playfulness-to-the-serious-desk-lamp/",
    imageUrl: "https://www.yankodesign.com/images/design_news/2026/08/nevi-brings-a-little-playfulness-to-the-serious-desk-lamp/nevi_kinetic_desk_lamp_1.jpg",
    categoria: "Design",
    estrelas: 3,
    dek: "Aço inox AISI 304 acabado à mão, base esférica meio escovada e meio espelhada — e uma caixa que ninguém precisa jogar fora.",

const PALETAS = {
  Branding: ["#f4a261","#e76f51","#ffb703"],
  Design:   ["#2a9d8f","#48cae4","#80ed99"],
  Tecnologia:["#6366f1","#8b5cf6","#22d3ee"]
};

function Ilustracao({categoria, seed}){
  const c = PALETAS[categoria] || PALETAS.Design;
  const id = "g"+seed;
  const r = (n)=> ((seed*9301+n*49297)%233280)/233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c[0]}/>
          <stop offset="100%" stopColor={c[1]}/>
        </linearGradient>
        <linearGradient id={id+"b"} x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c[2]} stopOpacity="0.85"/>
          <stop offset="100%" stopColor={c[1]} stopOpacity="0.2"/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#"+id+")"}/>
      <circle cx={60+r(1)*280} cy={40+r(2)*160} r={40+r(3)*55} fill={"url(#"+id+"b)"} opacity="0.75"/>
      <rect x={30+r(4)*220} y={30+r(5)*120} width={70+r(6)*110} height={60+r(7)*80} rx="18" fill="#ffffff" opacity="0.16"/>
      <path d={"M0 "+(180+r(8)*40)+" Q 100 "+(90+r(9)*70)+" 200 "+(160+r(10)*50)+" T 400 "+(130+r(11)*60)+" V250 H0 Z"} fill="#ffffff" opacity="0.14"/>
      <circle cx={320-r(12)*140} cy={200-r(13)*120} r={16+r(14)*22} fill="#ffffff" opacity="0.22"/>
    </svg>
  );
}

function Foto({item, idx}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={idx+3}/>;
  return (
    <img className="cover" src={item.imageUrl} alt={item.tituloPt}
         referrerPolicy="no-referrer" loading="lazy"
         onError={()=>setFalhou(true)}/>
  );
}

const Estrelas = ({n}) => <span className="stars">{"★".repeat(n)}<span style={{opacity:.3}}>{"★".repeat(5-n)}</span></span>;

function Modal({item, idx, onClose}){
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="hero">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Foto item={item} idx={idx}/>
        </div>
        <div className="inner">
          <div className="row2">
            <span className={"badge b-"+item.categoria}>{item.categoria}</span>
            <Estrelas n={item.estrelas}/>
            <span className="src">{item.source}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p,i)=><p className="body-t" key={i}>{p}</p>)}
          {item.parcial && <div className="note">Resumo produzido a partir dos elementos públicos da matéria (título, dek, categoria, tags e trechos abertos), já que o conteúdo integral está atrás de assinatura ou paywall.</div>}
          <div className="actions">
            <a className="btn btn-p" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn btn-s" onClick={onClose}>Voltar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const lead = NOTICIAS[0];
  const resto = NOTICIAS.slice(1);
  const portais = [...new Set(NOTICIAS.map(n=>n.source))];
  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de quinta-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="date">27 de agosto de 2026 · branding, design e tecnologia das últimas 24 horas</div>
        <div className="meta-line">{NOTICIAS.length} matérias · {portais.length} portais · clique em qualquer card para ler o resumo completo</div>
      </header>

      <article className="lead" onClick={()=>setAberto(0)}>
        <div className="ph"><Foto item={lead} idx={0}/></div>
        <div className="txt">
          <div className="row2">
            <span className={"badge b-"+lead.categoria}>{lead.categoria}</span>
            <Estrelas n={lead.estrelas}/>
          </div>
          <h2>{lead.tituloPt}</h2>
          <p>{lead.dek}</p>
          <div className="src">{lead.source}</div>
        </div>
      </article>

      <div className="grid">
        {resto.map((item,i)=>(
          <article className="card" key={item.url} onClick={()=>setAberto(i+1)}>
            <div className="ph"><Foto item={item} idx={i+1}/></div>
            <div className="body">
              <div className="row2">
                <span className={"badge b-"+item.categoria}>{item.categoria}</span>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="row" style={{marginTop:"auto",paddingTop:"8px"}}>
                <span className="src">{item.source}</span>
              </div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã — edição de 27 de agosto de 2026.<br/>
        Fontes desta edição: {portais.join(" · ")}.<br/>
        Resumos em português produzidos a partir da leitura das matérias originais; nenhum texto foi copiado. As imagens são carregadas diretamente dos servidores dos portais de origem e pertencem a seus respectivos detentores.
      </footer>

      {aberto !== null && <Modal item={NOTICIAS[aberto]} idx={aberto} onClose={()=>setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
