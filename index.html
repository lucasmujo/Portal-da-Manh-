*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;line-height:1.5}

.card h3{font-size:17px;line-height:1.3;margin:0}
.art{position:relative;overflow:hidden;background:#eee}
.art img,.art svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.tag{font-weight:600;color:#fff;border-radius:99px;padding:2px 10px;font-size:11.5px}
.stars{color:#f5a623;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(20,22,28,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:30px 14px;z-index:10;animation:fade .25s}

.modal p{font-size:16.5px;margin:0 0 14px}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:8px 12px;font-size:13.5px}
.close{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.95);width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.src{display:inline-block;margin-top:8px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .art{min-height:220px}h1{font-size:27px}.modal .art{height:220px}.modal .in{padding:20px}}

  },
  {
    title: "The new Clayface poster is skin crawlingly creepy",
    tituloPt: "O novo pôster de Clayface dá arrepios na pele",
    source: "Creative Bloq",
    url: "https://www.creativebloq.com/news/the-new-clayface-poster-is-skin-crawlingly-creepy",
    imageUrl: "https://cdn.mos.cms.futurecdn.net/KfEkngK3PoKBRTwMBazHPd-1920-80.jpg",
    cat: "Design", stars: 2,
    resumo: [
      "A Creative Bloq analisa o novo pôster do filme Clayface, da DC Studios, estrelado pela versão Matt Hagen do personagem. A campanha tem apostado em uma abordagem de terror corporal, e este cartaz segue a linha com imagens perturbadoras.",
      "A arte é do ilustrador Estevan Silveira e mistura ilustração em estilo quadrinhos com horror clássico: Clayface aparece curvado, segurando a cabeça, com o corpo parecendo derreter lentamente e um único olho brilhante que reforça a sensação de dor. A pele amarelo-esverdeada doentia se destaca contra um fundo vermelho escuro e sujo, evocando filmes antigos de monstros.",
      "Os fãs reagiram bem no X e no Reddit, elogiando a arte grotesca; um comentarista comparou o cartaz favoravelmente ao estilo de \"cabeças flutuantes\" de muitos pôsteres recentes."
    ]
  }
];

const PALETAS = {
  Branding: ["#ff9a3c","#e8590c","#ffd166","#c2410c"],
  Design: ["#2dd4bf","#0f9d82","#a7f3d0","#047857"],
  Tecnologia: ["#7c83fd","#5b5bd6","#c4b5fd","#3730a3"]
};
const COR = { Branding: "var(--brand)", Design: "var(--design)", Tecnologia: "var(--tech)" };

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

function Ilustracao({ seed, cat }) {
  const p = PALETAS[cat] || PALETAS.Design;
  const h = hash(seed);
  const id = "g" + h;
  const formas = [0,1,2,3].map(i => {
    const x = (h >> (i*3)) % 400, y = (h >> (i*2+1)) % 300, r = 40 + ((h >> i) % 90);
    return i % 2 ? <circle key={i} cx={x} cy={y} r={r} fill={p[i]} opacity=".45"/> :
      <rect key={i} x={x-r} y={y-r} width={r*2} height={r*1.4} rx={r/4} fill={p[i]} opacity=".4" transform={`rotate(${(h>>i)%60} ${x} ${y})`}/>;
  });
  return (
    <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração decorativa">
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[2]}/><stop offset="1" stopColor={p[0]}/></linearGradient></defs>
      <rect width="400" height="300" fill={`url(#${id})`}/>
      {formas}
    </svg>
  );
}

function Arte({ item }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="art">
      {item.imageUrl && !falhou ?
        <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} /> :
        <Ilustracao seed={item.title} cat={item.cat} />}
    </div>
  );
}

function Estrelas({ n }) { return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>; }

function Meta({ item }) {
  return (
    <div className="meta">
      <span className="tag" style={{ background: COR[item.cat] }}>{item.cat}</span>
      <strong>{item.source}</strong>
      <Estrelas n={item.stars} />
    </div>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const f = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", f);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", f); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <Arte item={item} />
        <div className="in">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <div className="orig">Original: {item.title}</div>
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          {item.paywall && <div className="note">Matéria atrás de paywall: resumo feito a partir dos elementos públicos (título, categoria, setor e tags).</div>}
          <a className="src" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const itens = [...NOTICIAS].sort((a, b) => b.stars - a.stars);
  const [top, ...resto] = itens;
  const data = new Date(2026, 9, 21).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return (
    <div className="wrap">
      <header>
        <h1>Portal da Manhã</h1>
        <div className="date">{data}</div>
      </header>
      <div className="hero" onClick={() => setAberto(top)}>
        <Arte item={top} />
        <div className="txt">
          <Meta item={top} />
          <h2>{top.tituloPt}</h2>
          <p style={{ margin: 0, color: "var(--muted)" }}>{top.resumo[0].slice(0, 190)}…</p>
        </div>
      </div>
      <div className="grid">
        {resto.map(it => (
          <article className="card" key={it.url} onClick={() => setAberto(it)}>
            <Arte item={it} />
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
            </div>
          </article>
        ))}
      </div>
      <footer>Resumos produzidos em português a partir das matérias originais · Clique em um card para ler</footer>
      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
