<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 31 de agosto de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#16161a;
    --ink-soft:#5c5c66;
    --ink-faint:#8e8e99;
    --line:#e6e6e1;
    --accent:#c9522b;
    --radius:18px;
    --shadow:0 1px 2px rgba(20,20,25,.04), 0 8px 28px rgba(20,20,25,.06);
    --shadow-hover:0 2px 6px rgba(20,20,25,.06), 0 18px 44px rgba(20,20,25,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 80px;}

  header.top{padding:56px 0 34px;border-bottom:1px solid var(--line);margin-bottom:38px;}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px;}
  h1.brand{font-size:clamp(34px,6vw,58px);line-height:1.02;margin:0 0 14px;letter-spacing:-.03em;font-weight:800;}
  .datebar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;color:var(--ink-soft);font-size:14px;}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--ink-soft);}

  .stars{color:var(--accent);letter-spacing:2px;font-size:13px;}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-faint);}
  .src{font-weight:700;color:var(--ink);letter-spacing:.02em;font-size:12px;text-transform:uppercase;}
  .tag{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--ink-soft);background:#fff;}

  .hero{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .25s ease, transform .25s ease;margin-bottom:44px;
  }
  .hero:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px);}
  .hero .media{min-height:380px;position:relative;background:#eceae5;}
  .hero .body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center;}
  .hero h2{font-size:clamp(24px,3vw,34px);line-height:1.14;letter-spacing:-.02em;margin:14px 0 14px;font-weight:800;}
  .hero p{color:var(--ink-soft);font-size:15.5px;margin:0 0 20px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:box-shadow .25s ease, transform .25s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px);}
  .card .media{height:190px;position:relative;background:#eceae5;}
  .card .body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .card h3{font-size:18.5px;line-height:1.25;letter-spacing:-.01em;margin:0;font-weight:700;}
  .card p{color:var(--ink-soft);font-size:14px;margin:0;}
  .rank{
    position:absolute;top:12px;left:12px;background:rgba(255,255,255,.94);
    border-radius:999px;padding:3px 11px;font-size:12px;font-weight:800;color:var(--ink);
    box-shadow:0 1px 6px rgba(0,0,0,.10);
  }
  img.shot{width:100%;height:100%;object-fit:cover;display:block;}

  .sectitle{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:0 0 18px;}

  /* leitor */
  .overlay{
    position:fixed;inset:0;background:rgba(22,22,26,.42);backdrop-filter:blur(4px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;
    animation:fade .22s ease;overflow-y:auto;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .reader{
    background:var(--card);max-width:760px;width:100%;border-radius:22px;overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.24);animation:rise .28s cubic-bezier(.2,.8,.3,1);
  }
  .reader .media{height:300px;background:#eceae5;position:relative;}
  .reader .inner{padding:32px 36px 40px;}
  .reader h2{font-size:clamp(23px,3.4vw,32px);line-height:1.16;letter-spacing:-.02em;margin:14px 0 18px;font-weight:800;}
  .reader .text p{font-size:16.5px;color:#2c2c33;margin:0 0 16px;line-height:1.68;}
  .note{font-size:13px;color:var(--ink-faint);border-left:3px solid var(--line);padding-left:12px;margin-top:22px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line);}
  .btn{
    display:inline-block;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;
    text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff;cursor:pointer;
    transition:background .18s ease,border-color .18s ease;
  }
  .btn:hover{background:#f2f1ee;}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .btn.primary:hover{background:#000;}

  footer{margin-top:60px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:13px;}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;}
    .hero .media{min-height:230px;}
    .hero .body{padding:26px 24px 30px;}
    .reader .inner{padding:26px 22px 32px;}
    .overlay{padding:16px 12px;}
  }
</style>
</head>
<body>
<div id="root"></div>

  {
    title: "Wildling’s identity by PAPA TOM is raw and deliberately imperfect",
    tituloPt: "Laranja Pantone 021 num spritzer de pomar: a PAPA TOM recusou o verde-e-marrom obrigatório do 'natural' e desenhou uma marca que parece ter crescido sozinha",
    source: "The Brand Identity",
    url: "https://the-brandidentity.com/project/wildlings-identity-by-papa-tom-is-raw-and-deliberately-imperfect",

    estrelas: 5,
    resumo: [
      "Existe um conjunto de códigos visuais que quase toda bebida 'regional e sustentável' obedece sem pensar: verde, marrom, uma folha, uma maçã, uma ilustração fofa de campo florido. A PAPA TOM, estúdio de branding sediado em Backnang, no sul da Alemanha, olhou para esse repertório e decidiu ir para o lado oposto ao criar a identidade do Wildling, um spritzer sem álcool feito com suco de maçã de pomares regionais, água com gás e urtiga selvagem.",
      "O cliente é a Schwäbisches Mostviertel, uma associação regional perto de Stuttgart que reúne municípios, empresas e moradores em torno da preservação dos pomares tradicionais da região — as chamadas Streuobstwiesen. A bebida é, na prática, um instrumento: dar visibilidade e valor econômico a uma paisagem que precisa de futuro. A associação levou a ideia ao estúdio pedindo posicionamento, nome, identidade e um sistema que funcionasse em bar, em evento e em varejo.",
      "A decisão estratégica central foi de postura. Segundo os cofundadores e diretores de criação Thomas Korell e Pascal Palmieri, ninguém quer estar num balcão segurando algo com cara de suquinho engraçado — então o Wildling foi posicionado para sentar ao lado de uma cerveja, de um vinho ou de um aperitivo, com a mesma confiança. O nome nasceu da aspereza real daquelas terras: árvores velhas, chão irregular, ervas selvagens, clima, trabalho, crescimento e apodrecimento. Wildling soa como algo que cresce nos próprios termos, dizem eles — algo enraizado, indomado, que não foi feito para se comportar bem.",
      "O sistema visual mistura três técnicas deliberadamente. A fotografia é documental e propositalmente suja: paisagens reais, mãos, trabalho, luz, borrão, movimento. O 3D entra para encenar a garrafa e a embalagem com controle de forma e reflexo. E a IA é usada para estender atmosferas e empurrar o mundo visual para algo levemente estranho. A regra que os diretores repetem é que nenhuma técnica poderia virar a história: todas tinham que servir ao mesmo sentimento — cru, regional, reduzido e um pouco selvagem.",
      "Na tipografia, a dupla Overused Grotesk (da Randommaerks) e Bradford (da Lineto) divide funções: a primeira carrega a informação de forma clara e funcional; a segunda entrega caráter, com força, arestas e uma qualidade que o estúdio descreve como suábia no melhor sentido, aterrada pelas serifas.",
      "O 'W' do logo foi desenhado do zero e não é símbolo de natureza nenhum — nada de maçã, folha ou ícone de prado. A inspiração são patas de animal: a pegada de uma criatura que segue o próprio caminho. Ele aparece com mais força no rótulo, dando presença a uma garrafa pequena de vidro transparente, escolhida justamente pelo ar despretensioso, quase de cerveja. E a cor é o gesto mais agressivo do projeto: Pantone Orange 021, um laranja-sinal, direto e alto, escolhido para que o Wildling fosse reconhecido antes de precisar se explicar."
    ]

  {

    resumo: [
      "O digest semanal da Design Week desta segunda abre com o pacote mais substancial que a Adobe entregou ao Photoshop em meses — e o eixo dele não é 'mais IA', é mais controle sobre a IA.",
      "Três adições concentram o interesse. As Light Adjustment Layers trazem para dentro do Photoshop um ajuste de luz não destrutivo no espírito do Camera Raw, o que significa poder reabrir a decisão de exposição, contraste e sombra depois. O Instruct Edit with Masks, movido pelo Firefly Image 5, combina comando em linguagem natural com máscara — ou seja, você diz o que quer e delimita exatamente onde. E o AI Markup permite anotar visualmente sobre a imagem: um rabisco vermelho de uma parede de grade e de um gato vira, ao clicar em 'Generate', uma parede azulejada real e um gato ruivo caminhando.",
      "A Adobe também abriu o beta de um AI-Assisted Editor, um espaço de trabalho baseado em prompt com remoção de fundo, expansão generativa e upscale de resolução. Entram ainda melhorias de fluxo como Dynamic Text em caminho customizado e um painel acoplável do Adobe Stock com mais de 900 milhões de ativos.",
      "O restante da edição cobre movimentações e projetos. A Instrument nomeou Jack De Caluwé como Chief Creative Officer — ele volta à agência quase nove anos depois de uma primeira passagem, vindo de diretor executivo de criação na R/GA, e vai comandar a direção criativa para clientes como Google, Spotify e ServiceNow. A FutureBrand promoveu Sam Hollis a Global Strategy Partner, tornando-o o estrategista mais sênior da rede de mais de 20 escritórios. E a SuperHeroes contratou o especialista em IA Quim Español como diretor de criação.",
      "Entre os projetos, dois se destacam. A artista Amanda Williams e o estúdio Span criaram Other Washingtons, instalação pública no bairro Washington Park, em Chicago, que cerca a estátua de George Washington de 1904 com bandeiras e faixas homenageando pessoas negras americanas que compartilham o sobrenome — com tipografia extraída da autobiografia de Booker T. Washington, de 1901, e um site interativo de arquivo coletivo. E o estúdio Wignall & Moore, com o paisagista Tom Stuart-Smith, entregou A Memorial Forest no cemitério militar de Brookwood, em Surrey: 31 estelas de pedra de Portland posicionadas segundo um mapa celeste feito com a Royal Astronomical Society, representando as estrelas visíveis no momento do Armistício de 1918, erguidas sem fundação de concreto para preservar o solo."

  {
    title: "Arkadë Studio’s identity for Camelot tells a legend instead of a view",
    tituloPt: "Um cavaleiro heráldico desenhado à mão para não competir com o cartão-postal: como o Arkadë Studio salvou um hotel chamado Camelot de virar resort temático",

    resumo: [
      "Chamar um hotel de Camelot é assumir uma dívida. O nome carrega expectativa, e havia dois jeitos óbvios de errar: fugir completamente da mitologia, deixando o nome parecer aleatório, ou abraçá-la demais e transformar o lugar num resort temático. O Arkadë Studio, de Tirana, foi contratado exatamente para encontrar o meio — confiante, aterrado, com mito suficiente para justificar o nome.",
      "O Camelot é um hotel de 26 quartos em Ksamil, na Riviera Albanesa, um destino comumente vendido como 'as Maldivas da Europa'. E é justamente aí que está a segunda decisão interessante: Ksamil já tem seu cartão-postal, e o estúdio se recusou a competir com ele. Segundo as cofundadoras Eduina Jaupi e Gea Madhi, a região está cheia de lugares idênticos — azul e branco, espreguiçadeiras, vibe mediterrânea. O litoral aparece apenas no azul de um lacre de cera e na linguagem da chegada. Uma vez que você está contando uma lenda em vez de vender uma vista, dizem elas, é permitido ser poético e literário.",
      "A marca heráldica foi desenhada à mão: um cavaleiro armado dentro de uma moldura. A escolha pelo traço manual em vez do vetor foi consciente — uma marca vetorial pareceria correta e fria, chegando pronta e sem passado, enquanto essa carrega peso e idade, como se sempre estivesse ali e o estúdio apenas a tivesse desenterrado. E o desenho serve a três materialidades: carimbo em cera, relevo seco no papel e gravação em metal.",
      "A tipografia trabalha em trio. O logotipo é em Caslon, afiado e coerente ao lado do cavaleiro. O texto de apoio usa a Brygada 1918, da Capitalics Warsaw Type Foundry, levemente condensada e editorial. E os momentos manuscritos ficam com a irregular Pushkin, da ParaType. As designers são explícitas sobre o risco: um toque 'antigo' a mais e o conjunto teria tombado de referência para pastiche.",
      "A paleta evita todo o vocabulário medieval esperado — sem dourado, sem bordô, sem tons de joia. É creme quente, marrom profundo, cinza-pedra e um azul tirado do mar Jônico. Marrom com azul não é combinação que alguém associe a branding medieval, o que faz o conjunto ler como pensado em vez de fantasiado.",

    source: "Dezeen",
    url: "https://www.dezeen.com/2026/08/30/foster-partners-norton-motorcycles-showroom/",
    imageUrl: "https://static.dezeen.com/uploads/2026/08/foster-and-partners-norton-motorcycles-showroom-hero-1.jpg",
    categoria: "Design",
    data: "30 de agosto de 2026",
    estrelas: 4,
    resumo: [
      "A Foster + Partners Industrial Design — o braço de produto do escritório fundado por Norman Foster — desenvolveu um conceito de showroom para a britânica Norton Motorcycles em que as motos deixam de ser mercadoria exposta e passam a ser objeto sobre plinto, apresentadas como esculturas.",
      "O projeto integra o rebranding em curso da marca, que busca reafirmar sua herança de engenharia sem parecer nostálgica. Gerry McGovern, chief creative advisor da Norton e responsável por conduzir a colaboração, resume a premissa: motos, no seu melhor, são objetos de desejo emocionais e escultóricos, e nas lojas experienciais elas serão apresentadas em ambientes que reflitam sua precisão e modernidade.",
      "Cada pódio individual tem estética futurista e resolve o lado prático junto com o teatral: iluminação superior dedicada para desenhar as formas aerodinâmicas, gavetas de armazenagem e um armário aberto para acessórios e equipamentos. Foster comenta que a história da Norton está enraizada em design, engenharia e artesanato, e que o conceito busca ser uma expressão contemporânea dessa herança.",

    resumo: [
      "O Tamagotchi original era um ovo de plástico de cerca de 50 mm que você prendia na mochila e tentava não deixar morrer. Trinta anos depois, a Bandai anunciou uma versão que se usa no dedo — a 39ª entrada da série principal e, de longe, a menor já feita.",
      "A engenharia é o ponto. Miniaturizar a esse nível não é encolher peças, é redesenhar o layout interno inteiro. O Tamagotchi Ring reúne 64 componentes — 52 eletrônicos e 12 plásticos — num corpo de 28 x 23 x 35 mm, quase metade do tamanho do chaveiro de 1996. O display é um LCD colorido de 0,56 polegada, o menor já montado num Tamagotchi. E a bateria deixou de ser célula-botão substituível para virar recarregável, carregada por um estojo que vem na caixa, simplesmente porque não sobrava espaço para outra solução.",
      "O que impressiona é que a experiência não foi cortada junto com o volume: são 30 personagens criáveis, minigames e customização de quarto. Não é uma versão reduzida rodando num corpo minúsculo — é o Tamagotchi completo. Na mão, o objeto se comporta mais como pequena escultura vestível do que como eletrônico de consumo.",
      "O anúncio saiu em 27 de agosto de 2026, marcando os 30 anos da franquia, e o timing não é acidental: uma marca que já passou por tantas reinvenções sabe quando um marco pede algo de fato novo em vez de mais uma variação de cor. Um bicho virtual em forma de anel é um objeto diferente de um bicho virtual de chaveiro, mesmo que a criatura lá dentro se comporte igual — muda onde ele vive no seu dia e o quanto sua dedicação fica visível.",

  {

    url: "https://www.yankodesign.com/2026/08/30/this-startup-says-your-house-should-be-the-robot-not-have-a-robot/",
    imageUrl: "https://www.yankodesign.com/images/design_news/2026/08/this-startup-says-your-house-should-be-the-robot-not-have-a-robot/LiveLarge-Reveals-Flagship-L-Space-Showcasing-an-AI-Powered-Adaptive-Living-Environment-hero.jpg",

      "Boa parte do dinheiro de IA hoje está apostando em robôs. Centenas de startups de IA corporificada e seus investidores acreditam que uma máquina bípede vai acabar virando o sistema operacional da casa, andando de cômodo em cômodo e resolvendo tudo. Endong Zhang, fundador e CEO da LiveLarge Home Inc., acha o enquadramento errado — e é bem direto sobre isso.",

const PALETAS = {
  "Branding":   ["#F6C177","#E4633A","#C1352B"],
  "Design":     ["#8FD6C0","#3BA88C","#1F6B63"],
  "Tecnologia": ["#A9B8F5","#6A6FE0","#3D2E8F"]
};

function Ilustracao({categoria, seed, alto}){
  const cores = PALETAS[categoria] || PALETAS["Design"];
  const id = "g" + seed;
  const r = (n)=> ((seed*9301 + n*49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%", height:"100%", display:"block"}} aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={cores[0]}/>
          <stop offset="55%" stopColor={cores[1]}/>
          <stop offset="100%" stopColor={cores[2]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`}/>
      <circle cx={60 + r(1)*260} cy={50 + r(2)*140} r={38 + r(3)*54} fill="#fff" opacity="0.13"/>
      <circle cx={90 + r(4)*240} cy={70 + r(5)*130} r={20 + r(6)*40} fill="#fff" opacity="0.10"/>
      <rect x={20 + r(7)*220} y={20 + r(8)*130} width={80 + r(9)*120} height={60 + r(10)*80}
            rx="14" fill="#000" opacity="0.08"
            transform={`rotate(${-18 + r(11)*36} 200 130)`}/>
      <path d={`M0,${200 + r(12)*40} Q ${100 + r(13)*60},${140 + r(14)*60} 200,${190 + r(15)*40} T 400,${170 + r(16)*50} L400,260 L0,260 Z`}
            fill="#fff" opacity="0.16"/>
    </svg>
  );
}

function Media({item, seed, alt}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={seed}/>;
  }
  return (
    <img className="shot"
         src={item.imageUrl}
         alt={alt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={()=>setFalhou(true)} />
  );
}

function Estrelas({n}){
  return <span className="stars">{"★".repeat(n)}<span style={{opacity:.28}}>{"★".repeat(5-n)}</span></span>;
}

function Leitor({item, seed, aoFechar}){
  return (
    <div className="overlay" onClick={aoFechar}>
      <div className="reader" onClick={e=>e.stopPropagation()}>
        <div className="media">
          <Media item={item} seed={seed} alt={`Imagem da matéria: ${item.tituloPt}`}/>
        </div>
        <div className="inner">
          <div className="meta">
            <span className="src">{item.source}</span>
            <span>·</span>
            <span>{item.data}</span>
            <span className="tag">{item.categoria}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="text">
            {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Nota: este texto do Brand New está atrás de assinatura. O resumo acima foi escrito a partir dos elementos públicos da página — título, categoria, indústria, tags e formato do post.
            </div>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={aoFechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberta, setAberta] = useState(null);
  const [manchete, ...resto] = NOTICIAS;
  const portais = new Set(NOTICIAS.map(n=>n.source));

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de segunda-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="datebar">
          <span>31 de agosto de 2026</span>
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais.size} portais</span>
          <span className="pill">Branding · Design · Tecnologia</span>
        </div>
      </header>

      <div className="hero" onClick={()=>setAberta(0)}>
        <div className="media">
          <span className="rank">1</span>
          <Media item={manchete} seed={1} alt={`Imagem da matéria: ${manchete.tituloPt}`}/>
        </div>
        <div className="body">
          <div className="meta">
            <span className="src">{manchete.source}</span>
            <span>·</span>
            <span>{manchete.data}</span>
            <span className="tag">{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0,190)}…</p>
          <div><span className="btn">Abrir resumo</span></div>
        </div>
      </div>

      <p className="sectitle">Demais destaques do dia</p>
      <div className="grid">
        {resto.map((item, i)=>(
          <div className="card" key={item.url} onClick={()=>setAberta(i+1)}>
            <div className="media">
              <span className="rank">{i+2}</span>
              <Media item={item} seed={i+2} alt={`Imagem da matéria: ${item.tituloPt}`}/>
            </div>
            <div className="body">
              <div className="meta">
                <span className="src">{item.source}</span>
                <span className="tag">{item.categoria}</span>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p>{item.resumo[0].slice(0,120)}…</p>
              <div style={{marginTop:"auto", paddingTop:"6px", fontSize:"12px", color:"var(--ink-faint)"}}>{item.data}</div>
            </div>
          </div>
        ))}
      </div>

      <footer>
        Portal da Manhã — recorte diário de branding, design e tecnologia. Resumos escritos em português a partir das fontes originais; os textos integrais permanecem com seus veículos.
      </footer>

      {aberta !== null && (
        <Leitor item={NOTICIAS[aberta]} seed={aberta+1} aoFechar={()=>setAberta(null)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
