<style>
  :root{
    --ink:#17181C;
    --ink-soft:#514F49;
    --paper:#F6F3EC;
    --paper-2:#FFFFFF;
    --line:#E4DFD3;
    --branding:#C1502E;
    --branding-tint:#FBECE4;
    --design:#20705C;
    --design-tint:#E7F2ED;
    --tecnologia:#3B4CC0;
    --tecnologia-tint:#EAEBFA;
    --star:#D79A2C;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  ::selection{background:var(--ink);color:var(--paper);}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}

  /* HEADER */
  .site-header{padding:56px 0 36px;}
  .kicker{
    font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 14px;
  }
  .wordmark{
    font-family:"Fraunces",serif;
    font-weight:500;
    font-size:clamp(40px,7vw,72px);
    letter-spacing:-0.02em;
    margin:0;
    line-height:0.98;
  }
  .wordmark em{font-style:italic;font-weight:400;color:var(--branding);}
  .header-meta{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-top:18px;padding-top:18px;border-top:1px solid var(--line);
    gap:20px;flex-wrap:wrap;
  }
  .header-date{font-size:15px;color:var(--ink-soft);text-transform:capitalize;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-btn{
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;padding:9px 16px;border-radius:100px;
    border:1px solid var(--line);background:var(--paper-2);color:var(--ink-soft);
    cursor:pointer;transition:all .15s ease;
  }
  .filter-btn:hover{border-color:var(--ink);color:var(--ink);}
  .filter-btn.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  /* TAG PILL */
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 12px;border-radius:100px;
  }
  .tag.branding{background:var(--branding-tint);color:var(--branding);}
  .tag.design{background:var(--design-tint);color:var(--design);}
  .tag.tecnologia{background:var(--tecnologia-tint);color:var(--tecnologia);}
  .stars{display:inline-flex;gap:2px;align-items:center;}
  .stars svg{width:12px;height:12px;}

  /* HERO */
  .hero{
    display:grid;grid-template-columns:1.05fr 0.95fr;gap:44px;align-items:center;
    padding:8px 0 56px;cursor:pointer;
  }
  .hero-art{border-radius:22px;overflow:hidden;box-shadow:0 24px 48px -24px rgba(23,24,28,.35);}
  .hero-art svg{display:block;width:100%;height:auto;}
  .hero-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .hero h1{
    font-family:"Fraunces",serif;font-weight:500;
    font-size:clamp(30px,4.2vw,50px);line-height:1.04;letter-spacing:-0.01em;
    margin:0 0 18px;
  }
  .hero p.dek{font-size:17px;color:var(--ink-soft);margin:0 0 22px;max-width:46ch;}
  .read-link{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;
  }
  .read-link .arrow{transition:transform .15s ease;}
  .hero:hover .read-link .arrow{transform:translateX(4px);}

  /* GRID */
  .section-label{
    font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 22px;padding-top:32px;border-top:1px solid var(--line);
  }
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:64px;
  }
  .card{
    background:var(--paper-2);border:1px solid var(--line);border-radius:18px;
    overflow:hidden;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);box-shadow:0 20px 32px -20px rgba(23,24,28,.28);}
  .card-art{aspect-ratio:4/3;}
  .card-art svg{display:block;width:100%;height:100%;}
  .card-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;flex:1;}
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .card h3{
    font-family:"Fraunces",serif;font-weight:500;font-size:19px;line-height:1.22;
    margin:0;letter-spacing:-0.01em;
  }
  .card .dek{font-size:13.5px;color:var(--ink-soft);margin:0;flex:1;}
  .card-foot{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:auto;}

  .warn{
    grid-column:1/-1;font-size:13px;color:var(--ink-soft);background:var(--paper-2);
    border:1px dashed var(--line);border-radius:14px;padding:16px 20px;
  }

  /* DETAIL OVERLAY */
  .overlay{
    position:fixed;inset:0;background:rgba(23,24,28,.5);backdrop-filter:blur(2px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
    overflow-y:auto;z-index:50;animation:fade .18s ease;
  }
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .panel{
    background:var(--paper-2);max-width:760px;width:100%;border-radius:24px;
    padding:0 0 48px;animation:rise .22s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 40px 80px -30px rgba(0,0,0,.4);
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  .panel-art{aspect-ratio:16/8;border-radius:24px 24px 0 0;overflow:hidden;position:relative;}
  .panel-art svg{display:block;width:100%;height:100%;}
  .close-btn{
    position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:100px;
    background:rgba(255,255,255,.9);border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:18px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
  }
  .panel-body{padding:32px 44px 0;}
  .panel-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .panel h2{
    font-family:"Fraunces",serif;font-weight:500;font-size:clamp(24px,3.4vw,34px);
    line-height:1.1;letter-spacing:-0.01em;margin:0 0 22px;
  }
  .panel .summary p{font-size:16px;line-height:1.68;color:#2B2C30;margin:0 0 16px;}
  .source-link{
    display:inline-flex;align-items:center;gap:8px;margin-top:14px;
    font-size:13px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:12px 22px;border-radius:100px;border:1.5px solid var(--ink);
    text-decoration:none;transition:background .15s ease,color .15s ease;
  }
  .source-link:hover{background:var(--ink);color:var(--paper);}

  footer{border-top:1px solid var(--line);padding:32px 0 60px;color:var(--ink-soft);font-size:13px;}
  footer .foot-row{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}

  @media (max-width:860px){
    .hero{grid-template-columns:1fr;gap:26px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    .panel-body{padding:26px 22px 0;}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:1fr;}
    .header-meta{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>

  },
  {
    id: 11,
    category: "design",
    categoryLabel: "Design",
    stars: 3,
    title: "Por que apps de saúde mental não deveriam seguir todas as modas de UI",
    dek: "Artigo de referência argumenta que microanimações chamativas viram sobrecarga cognitiva para usuários em momentos de crise.",
    source: "Smashing Magazine",
    sourceUrl: "https://www.smashingmagazine.com/2026/07/designing-distressed-users-mental-health-apps-ui/",
    summary: [
      "Um artigo de referência do setor questiona a corrida das equipes de produto em aplicar todas as modas visuais do momento — microanimações chamativas, gestos não convencionais, ícones experimentais — a aplicativos voltados para saúde mental. O argumento central: ninguém abre um app desse tipo por curiosidade, mas normalmente em momentos de estresse, ansiedade ou exaustão, estados em que qualquer atrito cognitivo extra vira sobrecarga, não charme.",
      "Interfaces bem-sucedidas nesse contexto priorizam sinais discretos que reforçam sensação de controle, evitam demandar esforço mental adicional e favorecem interações em texto, que simulam uma conversa segura e sem julgamento.",
      "O texto também aponta uma tendência de integrar dados de wearables — como Apple Watch e Oura — para antecipar sinais fisiológicos de estresse, como pico de frequência cardíaca ou queda na qualidade do sono, e sugerir proativamente um exercício de aterramento antes mesmo que o usuário perceba que precisa dele. A conclusão é direta: em produtos para públicos vulneráveis, simplicidade e sensibilidade emocional valem mais do que inovação visual por si só."
    ]
  },
  {
    id: 12,
    category: "branding",
    categoryLabel: "Branding",
    stars: 2,
    title: "Lavazza lança minissérie com Martin Scorsese dirigida pela própria filha",
    dek: "“Family Blend” tem cinco episódios mensais e mistura documentário com comédia leve em torno do ritual de café da dupla.",
    source: "Campaign US",
    sourceUrl: "https://www.campaignlive.com/article/double-shot-scorsese-martin-daughter-francesca-star-lavazzas-new-miniseries/1965409",
    summary: [
      "A Lavazza apresentou “Family Blend”, uma minissérie de cinco episódios dirigida por Francesca Scorsese e estrelada por seu pai, o cineasta Martin Scorsese. Cada episódio, com dois a três minutos de duração, é lançado mensalmente entre julho e novembro nos canais globais da marca e dos próprios talentos envolvidos — o elenco de apoio inclui Jason Biggs, com uma aparição rápida de Adrien Brody no trailer.",
      "A série mistura entrevistas em formato documental com passagens por locais de Nova York significativos para a carreira do diretor, unindo o olhar cinematográfico clássico de Scorsese à sensibilidade contemporânea da filha. O primeiro episódio, “But First… Coffee”, usa tom de comédia leve para acompanhar o ritual de café da dupla antes das entrevistas.",
      "É um exemplo de como marcas de consumo seguem investindo em conteúdo de longa duração e prestígio autoral para construir afinidade emocional, em vez de apostar só em comerciais tradicionais de trinta segundos."
    ]
  }
];

const CATEGORY_META = {
  branding: { label: "Branding", color: "var(--branding)" },
  design: { label: "Design", color: "var(--design)" },
  tecnologia: { label: "Tecnologia/IA", color: "var(--tecnologia)" }
};

/* ---------- ÍCONES ---------- */
function CategoryIcon({ category, color }) {
  if (category === "branding") {
    return (
      <path d="M20 34 L54 22 L54 58 L20 46 Z M20 34 L20 46 M12 36 Q8 40 12 44" fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />
    );
  }
  if (category === "design") {
    return (
      <path d="M18 54 L40 18 L52 26 L30 62 Z M18 54 L14 62 L22 58 Z M34 25 L45 32" fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.85" />
    );
  }
  return (
    <g fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" opacity="0.85">
      <rect x="24" y="24" width="24" height="24" rx="3" />
      <path d="M30 24 V16 M42 24 V16 M30 56 V48 M42 56 V48 M24 30 H16 M24 42 H16 M56 30 H48 M56 42 H48" />
    </g>
  );
}

/* ---------- THUMBNAIL SVG (sem dependência de internet) ---------- */
function Thumb({ article }) {
  const meta = CATEGORY_META[article.category];
  const seed = article.id * 47;
  const cx = 60 + (seed % 60);
  const cy = 40 + ((seed * 3) % 40);
  const r = 70 + (seed % 50);
  const gradId = "grad" + article.id;
  return (
    <svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={meta.color} stopOpacity="0.16" />
          <stop offset="100%" stopColor={meta.color} stopOpacity="0.4" />
        </linearGradient>
      </defs>
      <rect width="320" height="240" fill={meta.color} opacity="0.08" />
      <circle cx={cx} cy={cy} r={r} fill={"url(#" + gradId + ")"} />
      <circle cx={320 - cx * 0.6} cy={240 - cy * 0.5} r={r * 0.45} fill={meta.color} opacity="0.12" />
      <g transform="translate(130,90)">
        <CategoryIcon category={article.category} color={meta.color} />
      </g>
    </svg>
  );
}

/* ---------- ESTRELAS ---------- */
function Stars({ n }) {
  return (
    <span className="stars" aria-label={n + " de 5 estrelas"}>
      {Array.from({ length: 5 }).map((_, i) => (
        <svg key={i} viewBox="0 0 20 20" fill={i < n ? "var(--star)" : "none"} stroke="var(--star)" strokeWidth="1.2">
          <polygon points="10,1.5 12.6,7.2 19,7.9 14.2,12.2 15.6,18.5 10,15.2 4.4,18.5 5.8,12.2 1,7.9 7.4,7.2" />
        </svg>
      ))}
    </span>
  );
}

/* ---------- APP ---------- */
function App() {
  const [filter, setFilter] = useState("todas");
  const [openId, setOpenId] = useState(null);

  const sorted = useMemo(
    () => [...ARTICLES].sort((a, b) => b.stars - a.stars),
    []
  );
  const hero = sorted[0];
  const rest = sorted.slice(1).filter(a => filter === "todas" || a.category === filter);
  const openArticle = ARTICLES.find(a => a.id === openId);

  const dateLabel = "sexta-feira, 7 de agosto de 2026";

  return (
    <div className="wrap">
      <header className="site-header">
        <p className="kicker">Portal da Manhã</p>
        <h1 className="wordmark">Branding, Design<br/>&amp; <em>Tecnologia</em></h1>
        <div className="header-meta">
          <p className="header-date">{dateLabel} — curadoria diária das últimas 24h</p>
          <div className="filters">
            {["todas", "branding", "design", "tecnologia"].map(f => (
              <button
                key={f}
                className={"filter-btn" + (filter === f ? " active" : "")}
                onClick={() => setFilter(f)}
              >
                {f === "todas" ? "Todas" : CATEGORY_META[f].label}
              </button>
            ))}
          </div>
        </div>
      </header>

      <section className="hero" onClick={() => setOpenId(hero.id)}>
        <div>
          <div className="hero-eyebrow">
            <span className={"tag " + hero.category}>{hero.categoryLabel}</span>
            <Stars n={hero.stars} />
          </div>
          <h1>{hero.title}</h1>
          <p className="dek">{hero.dek}</p>
          <span className="read-link">Ler resumo completo <span className="arrow">→</span></span>
        </div>
        <div className="hero-art"><Thumb article={hero} /></div>
      </section>

      <p className="section-label">Mais notícias de hoje</p>
      <div className="grid">
        {rest.length === 0 && (
          <div className="warn">Nenhuma notícia encontrada para este filtro hoje.</div>
        )}
        {rest.map(article => (
          <article key={article.id} className="card" onClick={() => setOpenId(article.id)}>
            <div className="card-art"><Thumb article={article} /></div>
            <div className="card-body">
              <div className="card-top">
                <span className={"tag " + article.category}>{article.categoryLabel}</span>
                <Stars n={article.stars} />
              </div>
              <h3>{article.title}</h3>
              <p className="dek">{article.dek}</p>
              <p className="card-foot">{article.source}</p>
            </div>
          </article>
        ))}
      </div>

      <footer>
        <div className="foot-row">
          <span>Portal da Manhã — curadoria e resumos gerados automaticamente a partir de fontes públicas.</span>
          <span>Atualizado às 7h · {dateLabel}</span>
        </div>
      </footer>

      {openArticle && (
        <div className="overlay" onClick={() => setOpenId(null)}>
          <div className="panel" onClick={e => e.stopPropagation()}>
            <div className="panel-art">
              <Thumb article={openArticle} />
              <button className="close-btn" onClick={() => setOpenId(null)} aria-label="Fechar">✕</button>
            </div>
            <div className="panel-body">
              <div className="panel-eyebrow">
                <span className={"tag " + openArticle.category}>{openArticle.categoryLabel}</span>
                <Stars n={openArticle.stars} />
              </div>
              <h2>{openArticle.title}</h2>
              <div className="summary">
                {openArticle.summary.map((p, i) => <p key={i}>{p}</p>)}
              </div>
              <a className="source-link" href={openArticle.sourceUrl} target="_blank" rel="noopener noreferrer">
                Ler matéria original em {openArticle.source} ↗
              </a>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
