<style>
  :root{
    --bg:#f7f6f3;
    --card:#ffffff;
    --ink:#14161a;
    --ink-2:#4a5058;
    --ink-3:#868d96;
    --line:#e7e5e0;
    --accent:#c2410c;
    --brand:#b4530a;
    --design:#0f766e;
    --tech:#4338ca;
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.06);
    --shadow-lg:0 2px 4px rgba(16,18,22,.05), 0 24px 60px rgba(16,18,22,.12);
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  header.top{padding:56px 0 28px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1.logo{font-family:'Fraunces',Georgia,serif;font-size:clamp(38px,6vw,66px);line-height:1.02;margin:12px 0 10px;font-weight:600;letter-spacing:-.02em}
  .sub{color:var(--ink-2);font-size:15px;max-width:640px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .pill{font-size:12px;font-weight:500;color:var(--ink-2);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}

  .hero{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);
    border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;
    margin-bottom:44px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero-media{position:relative;min-height:340px;background:#eee}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .hero-body{padding:38px 40px;display:flex;flex-direction:column;justify-content:center}
  .hero-body h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(26px,3.2vw,38px);line-height:1.13;margin:14px 0 14px;font-weight:600;letter-spacing:-.015em}
  .hero-body p{color:var(--ink-2);font-size:16px;margin:0 0 22px}

  .tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
  .tag.branding{background:#fdf1e6;color:var(--brand)}
  .tag.design{background:#e6f5f2;color:var(--design)}
  .tag.tecnologia{background:#eceafc;color:var(--tech)}
  .src{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
  .stars{font-size:13px;color:#e0a800;letter-spacing:1px}

  .section-title{display:flex;align-items:baseline;gap:14px;margin:0 0 22px}
  .section-title h3{font-family:'Fraunces',Georgia,serif;font-size:24px;margin:0;font-weight:600}
  .section-title span{font-size:13px;color:var(--ink-3)}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:60px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card-media{position:relative;width:100%;aspect-ratio:16/10;background:#eee;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .card-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card-body h4{font-family:'Fraunces',Georgia,serif;font-size:19px;line-height:1.24;margin:0;font-weight:600;letter-spacing:-.01em}
  .card-body .dek{color:var(--ink-2);font-size:14px;margin:0;flex:1}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:6px;border-top:1px solid var(--line)}

  .overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);backdrop-filter:blur(6px);z-index:60;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;
    animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
  .modal{background:var(--card);max-width:840px;width:100%;border-radius:22px;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.3);animation:rise .35s cubic-bezier(.2,.8,.2,1);margin:auto}
  .modal-media{position:relative;width:100%;aspect-ratio:16/8;background:#eee}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .modal-body{padding:32px 38px 38px}
  .modal-body h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,3.4vw,34px);line-height:1.14;margin:14px 0 8px;font-weight:600;letter-spacing:-.015em}
  .orig{font-size:13px;color:var(--ink-3);font-style:italic;margin:0 0 20px}
  .modal-body .resumo p{font-size:16.5px;color:#26292e;margin:0 0 16px;line-height:1.68}
  .note{font-size:13px;color:var(--ink-3);border-left:3px solid var(--line);padding-left:12px;margin:20px 0 0}
  .modal-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
  .btn{border:0;font-family:inherit;font-size:14px;font-weight:600;padding:12px 20px;border-radius:11px;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .2s}
  .btn:hover{opacity:.85}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-ghost{background:#f1efeb;color:var(--ink)}
  .close-x{position:absolute;top:16px;right:16px;z-index:3;width:38px;height:38px;border-radius:50%;
    border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.16)}

  footer{border-top:1px solid var(--line);padding:34px 0 60px;color:var(--ink-3);font-size:13px}
  footer strong{color:var(--ink-2)}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:230px;position:relative;aspect-ratio:16/9}
    .hero-body{padding:28px 26px}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 18px}
    .modal-body{padding:24px 22px 30px}
    header.top{padding:36px 0 22px}
  }
</style>
</head>

      "O Estúdio Campana assinou a nova loja temporária da Tiffany & Co instalada no térreo do shopping JK Iguatemi, em São Paulo. A fachada, que ocupa quase toda a extensão da vitrine, foi revestida por uma superfície ondulada de vime sintético no azul característico da marca, cortada horizontalmente por faixas em tom caramelo que quebram a leitura monolítica do conjunto.",
      "A trama se abre em pontos específicos: num deles, revela o logotipo iluminado da joalheria apoiado sobre pedra bege; noutro, dobra-se sobre si mesma ao redor de uma porta em arco, criando um nicho que abriga a iluminação de cove que marca a entrada. O mesmo tratamento reaparece no fundo da loja, formando um segundo arco sobre uma área de atendimento semiprivativa.",
      "Segundo Humberto Campana, o projeto nasceu do sucesso da flagship que o estúdio desenhou para a marca em outro shopping Iguatemi da capital no ano passado. A oportunidade agora era reinterpretar aquele conceito em formato mais íntimo — nas palavras dele, uma caixa de joias trançada na qual o visitante pode literalmente entrar e mergulhar no universo onírico da marca.",

      "O Estúdio Campana foi fundado por Humberto e seu irmão Fernando, morto em 2022. Humberto estreou sua primeira coleção solo desde a morte do irmão na galeria nova-iorquina Friedman Benda, em 2024, e desde então o estúdio criou um parque nos arredores de São Paulo com pavilhões feitos de plantas vivas, em terreno antes cultivado pelo avô dos fundadores."

      "Teddy Blanks cofundou em 2009 o estúdio Chips, em Williamsburg, no Brooklyn, ao lado de Adam Squires e Dan Shields. Seu primeiro trabalho de títulos foi para Lena Dunham, ainda nos curtas dela em Oberlin, antes do longa Tiny Furniture.",
      "Apesar do currículo, ele evita qualquer mistificação da própria função. Para Blanks, títulos de filme são, no fim das contas, uma obrigação contratual — existem ótimos filmes com títulos ruins, e ele considera importante não alimentar ilusões grandiosas sobre o peso do trabalho.",
      "Em Barbie, de Greta Gerwig, ele recortou à mão scans em alta resolução das embalagens da Mattel e os animou, enquanto a PowerHouse VFX fornecia fotografia em 360 graus de bonecas reais. Para recuperar um logotipo da Mattel descontinuado havia mais de três décadas, Blanks encomendou revistas da Barbie do fim dos anos 1980 para vetorizar o desenho em alta fidelidade e construir uma fonte completa. Depois comprou bonecas no eBay — Skipper, Ken e outras — para remontar cerca de metade de um alfabeto do lettering usado pela marca entre meados dos anos 1970 e o início dos 1990.",

      "A Bonnie Clyde, marca de óculos de Los Angeles fundada em 2016 por Jon Yuan a partir do negócio familiar de manufatura óptica com quatro décadas de estrada, ganhou visibilidade de massa com os armações Baby e aproveitou o momento para se reposicionar. O trabalho ficou com o Mouthwash Studio, também de LA, responsável por narrativa, estratégia, identidade gráfica, digital, motion e site.",
      "O briefing de Yuan foi tão ambicioso quanto direto: ele pediu, literalmente, para construírem uma Arca de Noé. O objetivo declarado é que, olhando para trás, as pessoas associem as décadas de 2020 e 2030 à estética da marca.",
      "O diretor de estratégia Alex Tan formulou o conceito como um mundo shakespeariano ancorado em amor, brincadeira e autoexpressão, apoiado numa pesquisa que apontava apetite crescente por coisas feitas à mão e com ofício — com referências que iam de mk.gee e Rosalía a Loewe e Burberry.",

      "O posicionamento escolhido é o de coração de St Andrews: um lugar que acolhe moradores e visitantes de fim de semana tanto quanto golfistas. A diretora de desenvolvimento Joanne McBurney explica que o nome parte do termo escocês \"kith\", ligado a familiaridade e amizade, e fala de união, conexão e pertencimento.",

const PALETAS = {
  Branding:   { a:"#fdba74", b:"#c2410c", c:"#fed7aa", d:"#7c2d12" },
  Design:     { a:"#5eead4", b:"#0f766e", c:"#99f6e4", d:"#134e4a" },
  Tecnologia: { a:"#a5b4fc", b:"#4338ca", c:"#c7d2fe", d:"#312e81" }
};

function Ilustracao({ categoria, seed, alt }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const gid = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label={alt}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.c}/>
          <stop offset="55%" stopColor={p.a}/>
          <stop offset="100%" stopColor={p.b}/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={`url(#${gid})`}/>
      <circle cx={60 + r(1)*260} cy={40 + r(2)*140} r={30 + r(3)*55} fill={p.d} opacity="0.16"/>
      <circle cx={80 + r(4)*250} cy={60 + r(5)*130} r={18 + r(6)*40} fill="#ffffff" opacity="0.26"/>
      <rect x={20 + r(7)*260} y={30 + r(8)*140} width={50 + r(9)*90} height={50 + r(10)*70}
            rx="14" fill={p.b} opacity="0.2"
            transform={`rotate(${-25 + r(11)*50} 200 125)`}/>
      <path d={`M0 ${200 + r(12)*30} Q 100 ${140 + r(13)*70} 200 ${190 + r(14)*40} T 400 ${170 + r(15)*50} L400 250 L0 250 Z`}
            fill="#ffffff" opacity="0.3"/>
      <path d={`M0 ${225 + r(16)*15} Q 130 ${180 + r(17)*50} 260 ${215 + r(18)*25} T 400 ${205 + r(19)*30} L400 250 L0 250 Z`}
            fill={p.d} opacity="0.14"/>
    </svg>
  );
}

function Media({ item }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} alt={item.tituloPt} />;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const Estrelas = ({ n }) => (
  <span className="stars" title={`${n} de 5`}>{"★".repeat(n)}<span style={{opacity:.22}}>{"★".repeat(5-n)}</span></span>
);

function Hero({ item, onOpen }) {
  return (
    <article className="hero" onClick={() => onOpen(item)}>
      <div className="hero-media"><Media item={item} /></div>
      <div className="hero-body">
        <div className="tagline">
          <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
          <span className="src">{item.source}</span>
          <Estrelas n={item.estrelas} />
        </div>
        <h2>{item.tituloPt}</h2>
        <p>{item.dek}</p>
        <div><span className="btn btn-primary">Ler o resumo</span></div>
      </div>
    </article>
  );
}

function Card({ item, onOpen }) {
  return (
    <article className="card" onClick={() => onOpen(item)}>
      <div className="card-media"><Media item={item} /></div>
      <div className="card-body">
        <div className="tagline">
          <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
          <Estrelas n={item.estrelas} />
        </div>
        <h4>{item.tituloPt}</h4>
        <p className="dek">{item.dek}</p>
        <div className="card-foot">
          <span className="src">{item.source}</span>
          <span className="src" style={{fontWeight:400}}>{item.data.replace(" de 2026","")}</span>
        </div>
      </div>
    </article>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const esc = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-media">
          <button className="close-x" onClick={onClose} aria-label="Fechar">✕</button>
          <Media item={item} />
        </div>
        <div className="modal-body">
          <div className="tagline">
            <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
            <span className="src">{item.source} · {item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="resumo">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {item.imageUrl === null && (
            <p className="note">Este portal não expõe imagem de destaque acessível, então a capa desta matéria usa uma ilustração gerada pelo Portal da Manhã.</p>
          )}
          <div className="modal-actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a,b) => b.estrelas - a.estrelas || a.id - b.id);
  const [manchete, ...resto] = ordenadas;
  const portais = new Set(NOTICIAS.map(n => n.source)).size;

  return (
    <React.Fragment>
      <header className="top">
        <div className="wrap">
          <div className="kicker">Segunda-feira · 24 de agosto de 2026</div>
          <h1 className="logo">Portal da Manhã</h1>
          <p className="sub">Uma leitura curada do que saiu nas últimas horas em branding, design e tecnologia — resumida em português, com link para a fonte original.</p>
          <div className="meta-row">
            <span className="pill">{NOTICIAS.length} matérias</span>
            <span className="pill">{portais} portais</span>
            <span className="pill">Branding · Design · Tecnologia</span>
          </div>
        </div>
      </header>

      <main className="wrap">
        <Hero item={manchete} onOpen={setAberto} />
        <div className="section-title">
          <h3>Também nesta edição</h3>
          <span>em ordem de relevância</span>
        </div>
        <div className="grid">
          {resto.map(item => <Card key={item.id} item={item} onOpen={setAberto} />)}
        </div>
      </main>

      <footer>
        <div className="wrap">
          <strong>Portal da Manhã</strong> — edição de 24 de agosto de 2026. Resumos escritos em português a partir da leitura das matérias originais; nenhum texto foi reproduzido literalmente. Todos os direitos das imagens e das reportagens pertencem aos respectivos veículos.
        </div>
      </footer>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
