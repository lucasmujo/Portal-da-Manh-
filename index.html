<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#17171a;--mut:#6b6b73;--line:#e8e6e1;--acc:#ff5a36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{margin:0;font-size:34px;letter-spacing:-.02em}
.date{color:var(--mut);font-size:15px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.1)}
.hero .img{min-height:340px}
.hero .txt{padding:30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.card .img{height:180px}
.card .b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px;line-height:1.3}
.img{position:relative;background:#eee;overflow:hidden}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-weight:600;font-size:12px}
.Branding{background:#ffe8df;color:#c2410c}.Design{background:#d9f5ee;color:#0f766e}.Tecnologia{background:#e5e4ff;color:#4338ca}
.stars{color:#f5a524;letter-spacing:1px}
.orig{font-size:13px;color:var(--mut)}
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.5);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px;z-index:10;animation:fade .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:up .3s;position:relative}
.modal .img{height:340px}
.modal .c{padding:26px 30px 32px}
.modal h2{margin:8px 0 12px;font-size:26px;line-height:1.2}
.modal p{font-size:16.5px;margin:0 0 14px}
.note{font-size:13px;color:var(--mut);background:#faf8f3;border-left:3px solid var(--acc);padding:8px 12px;border-radius:6px}
.close{position:absolute;top:14px;right:14px;z-index:2;border:0;background:#fff;border-radius:99px;width:38px;height:38px;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;text-decoration:none;font-weight:600;font-size:14px}
footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:27px}.modal .img{height:220px}}
</style>
</head>

<script type="text/babel">
const { useState, useEffect } = React;

const DATA = [
{
  title: "New Logo and Identity for Newcastle United FC by Futurebrand and In-house",
  tituloPt: "Novo logo e identidade do Newcastle United FC, por Futurebrand e equipe interna",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_newcastle_united_fc_by_futurebrand_and_in_house.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/newcastle_united_logo_before_after.png",
  cat: "Branding", stars: 5, paywall: true,
  resumo: ["O Brand New publicou em 27 de outubro de 2026 a avaliação da nova identidade do Newcastle United, clube inglês de futebol. O trabalho foi conduzido pela consultoria Futurebrand em parceria com a equipe interna do clube, e o post, classificado na categoria Noted, traz comparações de antes e depois do logotipo e um exemplo de aplicação.","O título do texto, um trocadilho com a frase de super-heróis sobre grandes poderes e grandes responsabilidades, brinca com a palavra torre (tower), e as etiquetas do post incluem evolução, futebol, Reino Unido e tower, indicando que a torre do escudo é o elemento central da mudança — uma atualização evolutiva, e não uma ruptura com o símbolo histórico.","Em um segmento em que torcedores reagem com intensidade a qualquer mexida no escudo, a escolha por evoluir o desenho com apoio do time interno sugere cautela e continuidade."]
},
{
  title: "Walmart Brings The Muppets and Walton Goggins Together For Its Own Holiday Carol",
  tituloPt: "Walmart une os Muppets e Walton Goggins em sua própria versão de conto de Natal",
  source: "Adweek",
  url: "https://www.adweek.com/creativity/walmart-brings-the-muppets-and-walton-goggins-together-for-its-own-holiday-carol/",
  imageUrl: "https://static-www.adweek.com/wp-content/uploads/2026/10/WalmartWhoKnewCarol.png",
  cat: "Branding", stars: 5, paywall: true,
  resumo: ["A campanha de fim de ano do Walmart, chamada A Who Knew Carol, reinterpreta o filme de 1992 The Muppet Christmas Carol. Feita em parceria com a Disney e o The Muppets Studio, estreou em 26 de outubro e é a mais recente peça da plataforma Who Knew? da varejista.","O porta-voz da marca, o ator Walton Goggins, faz o papel de Ebenezer Scrooge ao lado do elenco de Muppets. A história original é alterada: em vez dos fantasmas clássicos, Scrooge recebe a visita de três novos espíritos, o Fantasma do Natal Presente (Presents), o Fantasma das Ofertas Futuras e o Fantasma do Natal Expresso, cada um representando uma parte da oferta de fim de ano do Walmart, de produtos a entrega rápida.","A matéria é de Brittaney Kiefer, editora criativa da Adweek."]
},
{
  title: "Hono's label branding for Temper cider animates the last rally of the 2008 Wimbledon final",
  tituloPt: "Rótulos da Hono para a sidra Temper animam o último ponto da final de Wimbledon de 2008",
  source: "It's Nice That",
  url: "https://www.itsnicethat.com/articles/studio-hono-temper-branding-project-261026",
  imageUrl: "https://m.itsnicethat.com/original_images/Temper-Hero-Close_1.gif?class=w1440",
  cat: "Design", stars: 5,
  resumo: ["O estúdio vienense Hono criou a embalagem de uma sidra feita em colaboração entre a Temper, estúdio de objetos e experiências de tênis, e o produtor Luka Zeichmann, lançada em Londres na primeira semana de Wimbledon.","Em vez de retratar os quase cinco horas da final de 2008 entre Nadal e Federer, o estúdio focou no momento decisivo: os últimos quatro segundos, divididos em 60 quadros, com um quadro por garrafa. Alinhados, os rótulos formam uma animação no estilo flip book. A paleta usa as cores do torneio, e uma grade verde e roxa representa a quadra.","O estúdio Herr & Frau Rio, de Munique, imprimiu em risografia uma única base, que a Hono finalizou e numerou à mão. A bola de tênis é vazada em cada rótulo, de modo que, contra a luz, a própria sidra vira a bola. As pequenas variações de registro da risografia deram movimento extra à animação digitalizada.","Como cada rótulo só faz sentido dentro da sequência, a equipe só viu o resultado completo depois de imprimir, escanear e reproduzir os 60 — um erro significaria reimprimir tudo e refazer o trabalho manual."]
},
{
  title: "DutchScot illustrates dream symbolism to give Bar Rêve an ethereal identity",
  tituloPt: "DutchScot usa simbolismo onírico para dar identidade etérea ao Bar Rêve",
  source: "It's Nice That",
  url: "https://www.itsnicethat.com/articles/dutchscots-bar-reve-graphic-design-project-271026",
  imageUrl: "https://m.itsnicethat.com/original_images/DutchScot_Portfolio_BarReve_Postcards.jpg?class=w1440",
  cat: "Branding", stars: 4,
  resumo: ["O estúdio londrino DutchScot desenvolveu a identidade do Bar Rêve, novo bar de coquetéis no Brooklyn inspirado na Belle Époque e em cardápios clássicos franceses, sem apelar para a nostalgia. Segundo o designer Eoin O'Kramer, o cliente queria algo atemporal, não da moda.","A palavra francesa para sonho guia o projeto. O logotipo parte de uma caligrafia europeia, mas se comporta de forma surreal: parece esticar, flutuar e evaporar em peças impressas e digitais. O endereço, 222, vira Zzz no material. A paleta é contida e remete às cores de Joan Miró, e o site brinca com a expectativa — o usuário flutua para cima em vez de rolar para baixo.","As ilustrações, feitas internamente, ecoam as formas caligráficas soltas do logotipo e trazem três animais recorrentes como símbolos de sonho — um cordeiro, um cisne e um touro — usados com parcimônia, como ovos de Páscoa."]
},
{
  title: "New Logo and Identity for Clusia by Together",
  tituloPt: "Novo logo e identidade da Clusia, assinados pela Together",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_clusia_by_together.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/clusia_logo_new.png",
  cat: "Branding", stars: 3, paywall: true,
  resumo: ["O Brand New avaliou em 27 de outubro de 2026 o novo logotipo e a identidade da Clusia, empresa do setor de tecnologia, criados pela agência Together. O texto, intitulado com um trocadilho sobre folhas, foi classificado como Reviewed.","As etiquetas do post — 3D, verde, ícone, ilustração, interface, fotografia, sans serif e software — indicam um sistema visual que combina ícone, ilustração tridimensional e imagens de interface, em tons de verde.","O corpo da análise está atrás de paywall; não há, nas partes públicas, detalhes sobre racional, tipografia ou antes e depois."]
},
{
  title: "Commuters appalled by accidental optical illusion ad",
  tituloPt: "Passageiros ficam chocados com anúncio que causou ilusão de ótica acidental",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/news/commuters-appalled-by-accidental-optical-illusion-ad",
  imageUrl: null,
  cat: "Branding", stars: 4,
  resumo: ["Um cartaz de segurança pública em Londres gerou críticas porque alguns passageiros enxergaram nele uma mulher de hijab, sob o slogan Are they trying to hide something? (Estão tentando esconder algo?). Para os críticos, a peça insinuava suspeita; houve até comparações com a vigilância de 1984.","O texto de Creative Bloq atribui a confusão ao estilo de ilustração conhecido como Corporate Memphis, com figuras sem traços definidos. A intenção era mostrar um homem olhando por cima do ombro, mas a ambiguidade levou muitos a ver outra coisa.","A TfL inicialmente chamou os cartazes de afixação não autorizada e acionou a polícia de transportes britânica, mas a publicação foi apagada depois. Veículos oficiais haviam noticiado o lançamento de versões do mesmo desenho, o que sugere que a campanha pode ter partido da própria polícia; a origem segue indefinida.","O autor conclui que o texto paranoico e a imagem ambígua minaram o anúncio, independentemente de quem o criou."]
},
{
  title: "Just Eat's AI apocalypse raises a glaring question",
  tituloPt: "O apocalipse de IA do Just Eat levanta uma pergunta óbvia",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/news/just-eats-ai-apocalypse-raises-a-pretty-obvious-question",
  imageUrl: null,
  cat: "Branding", stars: 4,
  resumo: ["O gerador de imagens por IA do Just Eat encheu os cardápios do aplicativo no Reino Unido de fotos grotescas e literais demais. A empresa pediu desculpas e disse que estava removendo as imagens.","Entre os exemplos citados estão um coquetel de pão de soda com bacon e ovo, uma jacket potato mostrada como uma jaqueta estampada de batatas, um pão de alho em formato de avião por causa de um erro de digitação, camarões tigre retratados como filhotes de tigre e um sapo de verdade para o prato toad in the hole.","Clientes compartilharam comparações entre IA e realidade, e alguns disseram que o Just Eat negou reembolsos quando a comida diferia da foto. O artigo defende que os restaurantes não têm culpa — o aplicativo criou a falsa impressão.","Joe Foley lembra que o Uber Eats teve problema parecido quase três anos antes, questiona como uma empresa avaliada em US$ 4 bilhões lançou um recurso arriscado sem teste adequado e argumenta que mesmo imagens de IA precisas seriam fotografia de produto falsa."]
},
{
  title: "McDonald's China turns old happy meal toys into a french fry-shaped wireless mouse",
  tituloPt: "McDonald's China transforma brinquedos de Happy Meal em mouse sem fio em formato de batata frita",
  source: "Yanko Design",
  url: "https://www.yankodesign.com/2026/10/27/mcdonalds-china-turns-old-happy-meal-toys-into-a-french-fry-shaped-wireless-mouse/",
  imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/mcdonalds-china-turns-old-happy-meal-toys-into-a-french-fry-shaped-wireless-mouse/McDonalds-French-Fries-8.jpg",
  cat: "Design", stars: 4,
  resumo: ["O McDonald's China desenvolveu com a Lenovo o Fry Mark, um mouse sem fio cujo corpo imita a caixinha de batatas fritas, com botões esquerdo e direito. Mais de 60% da carcaça seria feita de plástico recuperado de brinquedos antigos de Happy Meal.","O design usa o vermelho e amarelo da marca, com as batatas douradas formando a parte superior e o logo dos arcos na base. Faz parte da iniciativa Reimagine Good Things, lançada em 2021, que já gerou bandejas, vasos, pelúcias e uniformes.","Tem cliques silenciosos, bateria de 380 mAh, três níveis de DPI, Bluetooth e 2,4 GHz, e uma bolsa que se abre como mousepad. Foi vendido em 22 e 23 de outubro pelo app e mini programa de WeChat por 99 yuans (cerca de US$ 14) mais 18 pontos de fidelidade; só 4.000 unidades, com limite de duas por cliente, e mais de 6.000 interessados.","É exclusivo da China, sem lançamento internacional anunciado. O artigo nota que não há dados sobre precisão, duração de bateria ou conforto."]
},
{
  title: "Photos reveal walkable Oxford Street as first phase of pedestrianisation begins",
  tituloPt: "Fotos mostram a Oxford Street para pedestres com o início da primeira fase da pedestrianização",
  source: "Dezeen",
  url: "https://www.dezeen.com/2026/10/27/photos-walkable-oxford-street-pedestrianisation-begins/",
  imageUrl: "https://static-2026.dezeen.com/uploads/2026/10/oxford-street-pedestrianisation_dezeen_2364_col_sq.jpg",
  cat: "Design", stars: 4,
  resumo: ["A primeira fase da pedestrianização da Oxford Street, no centro de Londres, começou. Quase um quilômetro dos dois da rua, entre a Orchard Street e a Great Portland Street, está fechado a veículos — carros, ônibus, táxis, aplicativos, bicicletas, patinetes e triciclos —, que serão desviados para ruas laterais.","O projeto é do estúdio local East, com JL Gibbons, Gehl e Publica; o Hawkins\\Brown desenvolve separadamente uma visão de longo prazo para a rua inteira, do Tottenham Court Road ao Marble Arch.","Na fase de transição, a East acrescentará sinalização, bancos e jardineiras. A transformação completa começa em 2027 e termina em 2028, com duas novas praças, perto das ruas Holles e Duke, e árvores plantadas inicialmente em vasos escultóricos.","O prefeito Sadiq Khan propôs a ideia em 2017, mas a prefeitura de Westminster barrou. Para o diretor da East, Julian Lewis, o objetivo é preservar a energia e o caráter das ruas comerciais londrinas."]
},
{
  title: "Flora's Wooden Chess Set Is Actually Shaped for Your Fingers",
  tituloPt: "O jogo de xadrez de madeira Flora é moldado para os seus dedos",
  source: "Yanko Design",
  url: "https://www.yankodesign.com/2026/10/27/floras-wooden-chess-set-is-actually-shaped-for-your-fingers/",
  imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/floras-wooden-chess-set-is-actually-shaped-for-your-fingers/flora-05.jpg",
  cat: "Design", stars: 3,
  resumo: ["Flora é um conjunto de xadrez tátil da designer industrial Lucy Aboonour, pensado para que as peças sejam reconhecidas e manuseadas principalmente pelo toque. O projeto vem de quatro anos de observação em parques e clubes de xadrez de Nova York.","As peças lembram uma coleção botânica em miniatura: peões arredondados como botões, peças alongadas com aberturas profundas e outras altas com projeções finas. Os perfis convexos são feitos para a pegada de pinça com dois dedos, e as bases largas e pesadas baixam o centro de gravidade para evitar tombos.","Foram feitos protótipos impressos em 3D em PLA reciclado e compósitos de madeira entre 2021 e 2025; a versão final é usinada em carvalho e nogueira americanos.","O artigo questiona se as projeções finas resistem a esbarrões e se um novo jogador aprende rápido o vocabulário visual. Não há preço nem informações de compra."]
},
{
  title: "Claire Lavabre's Industrial-Minimalist Lamp for Hay",
  tituloPt: "Luminária industrial-minimalista de Claire Lavabre para a Hay",
  source: "Core77",
  url: "https://www.core77.com/posts/145737/Claire-Lavabres-Industrial-Minimalist-Lamp-for-Hay",
  imageUrl: "https://s3files.core77.com/blog/images/lead_n_spotlight/1855093_lead_400_145737_.jpg",
  cat: "Design", stars: 3,
  resumo: ["A designer industrial e fotógrafa francesa Claire Lavabre criou a luminária de mesa Posto, seu primeiro projeto para a Hay. O briefing girava em torno do alumínio, e ela buscou reduzir a peça ao essencial.","A luminária tem três peças de alumínio bruto unidas por dois parafusos e um soquete. A cabeça repousa levemente sobre a haste, que dá um aspecto arquitetônico, e uma ranhura guarda o cabo para manter a silhueta limpa.","O alumínio fundido tem textura granulada e acabamento jateado que preserva pequenas marcas do processo, o que dá caráter honesto e sem polimento. Serve para mesas, prateleiras ou criados-mudos, com luz focada sem dominar o ambiente.","Rolf Hay, cofundador e diretor criativo de móveis e iluminação da marca, disse gostar de que se sinta o material."]
},
{
  title: "Apple unveils new 14-inch MacBook Pro with M6 chip",
  tituloPt: "Apple apresenta novo MacBook Pro de 14 polegadas com chip M6",
  source: "TechCrunch",
  url: "https://techcrunch.com/2026/10/27/apple-unveils-new-14-inch-macbook-pro-with-m6-chip/",
  imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/Apple-MacBook-Pro-14-in-with-M6-hero-261027_big.jpg.medium_2x.jpg?resize=1200,675",
  cat: "Tecnologia", stars: 3,
  resumo: ["A Apple lançou o MacBook Pro de 14 polegadas com o chip M6, segundo Aisha Malik, do TechCrunch. A empresa promete 24 horas de bateria, Wi-Fi 7 e Bluetooth 6; o preço inicial é US$ 1.999, nas cores preto-espacial e prata. Junto veio um iMac com M6 a partir de US$ 1.499, em sete cores.","Segundo a Apple, o M6 tem CPU e GPU de 12 núcleos, até 30% mais desempenho gráfico e até 25% mais rapidez em cargas de IA que o M5, e processa prompts de LLM até 13 vezes mais rápido que o MacBook Pro M1.","O notebook começa com 16 GB de memória unificada (até 32 GB), largura de banda de até 170 GB/s, HDMI, MagSafe 3, três portas Thunderbolt 4, leitor SDXC, entrada de fone e câmera de 12 MP. Carrega 50% em cerca de 30 minutos com adaptador compatível.","O iMac tem tela Retina 4.5K de 24 polegadas, câmera e áudio melhorados e até quatro Thunderbolt 4. Pré-venda em 28 de outubro; chegada às lojas em 6 de novembro."]
}
];

const PAL = {Branding:[["#ff7a45","#ffb347"],["#f43f5e","#fb923c"],["#f59e0b","#ef4444"]],Design:[["#10b981","#14b8a6"],["#059669","#2dd4bf"],["#0d9488","#84cc16"]],Tecnologia:[["#4f46e5","#a855f7"],["#2563eb","#7c3aed"],["#6366f1","#06b6d4"]]};
function Ilustra({item,idx}){
  const p=PAL[item.cat][idx%3]; const id="g"+idx+item.cat;
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: "+item.tituloPt}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#"+id+")"}/>
    <circle cx={90+idx*17%120} cy="70" r="70" fill="#fff" opacity=".18"/>
    <rect x="210" y="90" width="130" height="130" rx="26" fill="#fff" opacity=".2" transform="rotate(14 275 155)"/>
    <polygon points="40,230 140,120 230,230" fill="#fff" opacity=".15"/>
    <circle cx="320" cy="50" r="26" fill="#fff" opacity=".3"/>
  </svg>);
}
function Imagem({item,idx}){
  const [falhou,setFalhou]=useState(false);
  return (<div className="img">
    {item.imageUrl && !falhou
      ? <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
      : <Ilustra item={item} idx={idx}/>}
  </div>);
}
const Estrelas=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
function Meta({item}){return (<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><span>{item.source}</span><Estrelas n={item.stars}/></div>);}

function Modal({item,idx,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""}},[]);
  return (<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <button className="close" onClick={onClose} aria-label="Fechar">×</button>
    <Imagem item={item} idx={idx}/>
    <div className="c"><Meta item={item}/><h2>{item.tituloPt}</h2>
      {item.resumo.map((t,i)=><p key={i}>{t}</p>)}
      {item.paywall && <p className="note">Resumo escrito a partir dos elementos públicos da página (título, etiquetas, categoria e chamada); o artigo completo está atrás de paywall.</p>}
      <p className="orig">Título original: {item.title}</p>
      <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte — {item.source} ↗</a>
    </div></div></div>);
}

function App(){
  const [sel,setSel]=useState(null);
  const itens=[...DATA].sort((a,b)=>b.stars-a.stars);
  const [h,...resto]=itens;
  return (<div className="wrap">
    <header><div><h1>Portal da Manhã</h1><div className="date">Quarta-feira, 28 de outubro de 2026 · Branding, Design e Tecnologia</div></div><div className="date">{itens.length} notícias selecionadas</div></header>
    <div className="hero" onClick={()=>setSel(0)}>
      <Imagem item={h} idx={0}/>
      <div className="txt"><Meta item={h}/><h2>{h.tituloPt}</h2><p style={{margin:0,color:"var(--mut)"}}>{h.resumo[0].slice(0,190)}…</p><span className="orig">Clique para ler o resumo completo</span></div>
    </div>
    <div className="grid">{resto.map((it,i)=>(
      <div className="card" key={it.url} onClick={()=>setSel(i+1)}>
        <Imagem item={it} idx={i+1}/>
        <div className="b"><Meta item={it}/><h3>{it.tituloPt}</h3></div>
      </div>))}</div>
    {sel!==null && <Modal item={itens[sel]} idx={sel} onClose={()=>setSel(null)}/>}
    <footer>Resumos em português parafraseados a partir das matérias originais. Edição gerada automaticamente.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
