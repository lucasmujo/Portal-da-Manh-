<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 30 de setembro de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e8e6e1;--acc:#e8590c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:32px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:28px}
h1{font-size:34px;margin:0;letter-spacing:-.02em}.date{color:var(--mut);font-size:15px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,0,0,.12)}
.hero .img{min-height:340px}.hero .txt{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(0,0,0,.12)}
.card .img{height:180px}.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px;line-height:1.3;margin:0}
.img{position:relative;overflow:hidden;background:#eee}.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11.5px}
.Branding{background:#ffe8d6;color:#b4460a}.Design{background:#d3f4ec;color:#0b7a63}.Tecnologia{background:#e2e0ff;color:#4338ca}
.stars{color:#f59f00;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(15,17,22,.55);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:32px 16px;z-index:10;animation:fade .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:up .3s;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .img{height:340px}.modal .in{padding:28px 32px 32px}.modal h2{font-size:26px;line-height:1.2;margin:10px 0 4px}
.modal p{font-size:16.5px;margin:14px 0}.close{float:right;border:0;background:#f1efea;border-radius:99px;width:38px;height:38px;font-size:20px;cursor:pointer;margin:14px}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;margin-top:8px}
.note{font-size:13px;color:var(--mut);background:#faf8f3;border-left:3px solid #f0c987;padding:8px 12px;border-radius:6px}
footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:28px}.modal .img{height:220px}.modal .in{padding:20px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const NEWS = [
 {
  title: "\"We went for a Marmite icon\": how Formula E's new logo is made to grow on you",
  tituloPt: "\"Fizemos um ícone estilo Marmite\": como o novo logo da Fórmula E foi feito para crescer em você",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/design/we-went-for-a-marmite-icon-how-formula-es-new-logo-is-made-to-grow-on-you",
  imageUrl: "https://cdn.mos.cms.futurecdn.net/6oD44eDvr6sL5AKPDYiiqe-1920-80.jpg",
  cat: "Branding", stars: 5, data: "29/09",
  resumo: ["A Fórmula E apresentou uma nova identidade visual criada pela agência MOX, pensada para a chegada da era GEN4 do campeonato de carros elétricos. O centro do sistema é um logotipo em que as letras F e E formam um duplo trocadilho visual, inclinadas em 30 graus para transmitir movimento e energia.","O diretor criativo Matt Bolton admite que o desenho foi pensado para provocar reações divididas de início — nas palavras dele, um \"ícone Marmite\", daqueles que se estranham antes de se entranhar, e que \"cresce em você\" com o tempo.","A identidade inclui uma família tipográfica própria, desenvolvida com o All Purpose Studio, com variações como Turbo Mode (para textos dinâmicos) e Micro Mono (para dados técnicos). A paleta troca o esquema anterior por Surge Purple, Signal Orange e Electric Lime, com gradientes batizados de Pulse e Ignite.","A marca quer sinalizar uma Fórmula E \"mais rápida, mais ambiciosa e culturalmente mais relevante\", um salto visual claro em relação à fase GEN3."]
 },
 {
  title: "Vauxhall unveils \"sharper, cleaner\" griffin logo",
  tituloPt: "Vauxhall apresenta grifo \"mais afiado e limpo\": pela primeira vez em 121 anos, some a bandeira com o V",
  source: "Dezeen",
  url: "https://www.dezeen.com/2026/09/30/vauxhall-griffin-logo-streamline/",
  imageUrl: "https://static.dezeen.com/uploads/2026/09/vauxhall-griffin-logo-streamline_dezeen_2364_sq_2.jpg",
  cat: "Branding", stars: 5, data: "30/09",
  resumo: ["A Vauxhall revelou a 13ª versão do seu logotipo: um grifo simplificado que acompanha a virada da marca para os carros elétricos. Pela primeira vez em 121 anos, o emblema abandona a bandeira com a letra V que o grifo segurava.","Segundo o vice-presidente de design, Mark Adams, o novo grifo é \"mais afiado, mais limpo e combina perfeitamente com a próxima evolução da linguagem de design, ousada e pura\" da marca. Os pelos do pescoço foram simplificados e o bico agora aparece fechado, avançando sobre o desenho plano de 2020.","O emblema foi projetado para ser iluminado nos futuros modelos elétricos, ganhando visibilidade. O grifo nasceu em 1915, criado pelo aprendiz Harry Varley em referência ao brasão de Sir Falkes de Bréauté, e sempre esteve no centro da marca.","O novo logo estreia no Salão de Paris, em outubro, no conceito Vauxhall STX, e passa a equipar todos os modelos de série a partir do ano que vem."]
 },
 {
  title: "A hard-hitting ad campaign throws shade at Musk, Bezos and Zuckerberg to highlight the real tech innovators",
  tituloPt: "Campanha da Mozilla Foundation tira sarro de Musk, Bezos e Zuckerberg para destacar quem realmente inova",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/design/logos-icons/new-ad-campaign-throws-shade-at-musk-bezos-and-zuckerberg-to-promote-online-democracy",
  imageUrl: "https://cdn.mos.cms.futurecdn.net/FCe6ttRnyFveAsVy4zNSwE-1920-80.jpg",
  cat: "Branding", stars: 4, data: "29/09",
  resumo: ["A Mozilla Foundation lançou, durante a Climate Week NYC, uma campanha de cartazes colados em muros (wheatpaste) que confronta diretamente a influência dos bilionários da tecnologia.","Os cartazes zombam da compra do Twitter por Elon Musk, do turismo espacial de Jeff Bezos e dos óculos com Meta AI de Mark Zuckerberg, tratando-os como projetos de vaidade e não como inovação de fato.","Em contraponto, a campanha destaca tecnólogos pouco conhecidos apoiados pelo programa de bolsas da Mozilla, como Rose Njeri Tunguru, que criou infraestrutura de verificação eleitoral para o Quênia, e Rudy Fraser, criador da rede social descentralizada Blacksky.","A mensagem central é que \"um futuro melhor não será construído apenas por bilionários\". A tática visual de rua, com um tom provocador, ajuda a divulgar o programa e a missão da Mozilla de manter a internet como um recurso público."]
 },
 {
  title: "How Fishwife's illustrated branding made tinned fish cool",
  tituloPt: "Como a identidade ilustrada da Fishwife fez do peixe em lata algo descolado",
  source: "Creative Review",
  url: "https://www.creativereview.co.uk/fishwife-illustrated-branding-tinned-fish-danny-miller/",
  imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/09/Fishwife-anchovies-tin.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=1920&h=1080",
  cat: "Branding", stars: 4, data: "29/09",
  resumo: ["A Creative Review conta como a Fishwife, marca de frutos do mar em conserva de Los Angeles fundada na pandemia por Becca Millstein e Caroline Goldfarb, mudou a imagem do peixe enlatado por meio de embalagens ilustradas.","O ilustrador Danny Miller, em seu primeiro projeto profissional, buscou inspiração nas latas espanholas e portuguesas antigas, nas aquarelas de Winslow Homer e nos filmes de Wes Anderson para chegar ao traço manual característico, com cores primárias vivas e ilustrações debochadas e minuciosas.","O nome da marca, que resgata o termo histórico para as mulheres vendedoras de peixe, guiou a direção visual ousada. Com a expansão da linha e colaborações que vão de cuidados com a pele a acessórios de cabelo, o desafio passou a ser manter a coesão e dar personalidade própria a cada lata.","Miller também evoluiu de materiais físicos para ferramentas digitais como o Procreate, sem abandonar os métodos tradicionais para preservar a autenticidade."]
 },
 {
  title: "Snøhetta designs Hong Kong clubhouse with undulating playground and rope-climbing tower",
  tituloPt: "Snøhetta cria clube em Hong Kong com playground ondulado e torre de escalada em corda",
  source: "Dezeen",
  url: "https://www.dezeen.com/2026/09/30/snohetta-sky-house-pavilia-farm-hong-kong/",
  imageUrl: "https://static.dezeen.com/uploads/2026/09/snohetta-sky-house-pavilia-farm-playground-community-centre-hong-kong_dezeen_2364_col_2-1704x2560-1.jpg",
  cat: "Design", stars: 4, data: "30/09",
  resumo: ["O escritório Snøhetta concluiu o Sky House, o último clube do condomínio Pavilia Farm, em Tai Wai, Hong Kong. O prédio de dois andares funciona como \"playground e academia para todas as idades\".","Do lado de fora, uma área infantil de paisagem ondulada, com escorregadores e plataformas, avança para o interior, onde há playgrounds em forma de túnel, uma sala de aula e uma sala de música. No andar superior ficam áreas de estar e de ginástica pensadas para os moradores mais velhos.","Uma clarabóia central em cúpula funciona como torre de escalada em corda, ligando os dois pavimentos e inundando o espaço de luz natural.","O Sky House se soma a três edifícios já entregues — Tea House, Well House e Farm House —, todos integrando natureza e convivência, na ideia de um \"bairro em camadas\" que estimula o encontro entre gerações."]
 },
 {
  title: "Two animators reveal the roles, risks and limits of making Don Quixote with AI",
  tituloPt: "Dois animadores revelam papéis, riscos e limites de fazer Dom Quixote com IA",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/ai/two-animators-reveal-the-roles-risks-and-limits-of-making-don-quixote-with-ai",
  imageUrl: "https://cdn.mos.cms.futurecdn.net/yTsiNcv4KpypUTG54t53rU-1600-80.jpg",
  cat: "Tecnologia", stars: 4, data: "29/09",
  resumo: ["Os animadores Guillermo Miranda e Javier de la Chica fizeram um curta de 11 minutos gerado com IA, La Triste Figura, adaptação de Dom Quixote de Cervantes, exibido em estreia em Madri no dia 23 de setembro.","Eles afirmam que a narrativa, e não o espetáculo tecnológico, ancorou a produção, que reuniu storyboarders, dubladores e compositores ao lado de ferramentas de geração de vídeo. Descrevem o processo como um cinema \"multiplayer\", em que os departamentos tradicionais de animação trabalham de forma mais fluida.","Foram criados designs de produção completos antes de gerar cerca de 1.200 planos a partir de prompts escritos, principalmente com o Seedance 2.5. A IA ainda tropeça em cenas cômicas cheias de diálogo e na consistência dos personagens.","A dupla vê o filme como protótipo experimental, reconhece o desconforto de colegas do setor e defende a construção de marcos éticos à medida que a produção com IA se expande."]
 },
 {
  title: "New Logo and Identity for Zero Waste France by PAM!",
  tituloPt: "Novo logo e identidade da Zero Waste France, pela agência PAM!",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_zero_waste_france_by_pam.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/09/zero_waste_france_logo_before_after.png",
  cat: "Branding", stars: 3, data: "29/09",
  paywall: true,
  resumo: ["O Brand New publicou a resenha da nova identidade da Zero Waste France, organização francesa de defesa do meio ambiente, desenvolvida pela agência PAM!. É um caso clássico de antes e depois, na categoria de ativismo e causas ambientais.","Pelas tags públicas do post, o novo sistema trabalha com preto, círculo, tipografia sans serif condensada, monograma e traços em contorno — um vocabulário gráfico enxuto, que sugere uma marca mais direta e reconhecível para uma causa ligada à redução de resíduos."]
 },
 {
  title: "New Logo, Identity, and Packaging for Flynny's by Studio South",
  tituloPt: "Novo logo, identidade e embalagem da Flynny's, pelo Studio South",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_flynnys_by_studio_south.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/09/flynnys_logo_new.png",
  cat: "Branding", stars: 3, data: "29/09",
  paywall: true,
  resumo: ["O Brand New resenhou o novo logo, a identidade e as embalagens da Flynny's, marca de lâminas de barbear, desenhados pelo Studio South. O post está na categoria \"Reviewed\" e na indústria de bens de consumo.","As tags públicas — cachorro, lâminas, Studio South e amarelo — indicam uma identidade com mascote canino e o amarelo como cor de destaque nas embalagens."]
 },
 {
  title: "New Name, Logo, and Packaging for Coach Potato by Echt Brands",
  tituloPt: "Novo nome, logo e embalagem da Coach Potato, pela Echt Brands",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_name_logo_and_packaging_for_coach_potato_by_echt_brands.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/09/coach_potato_logo_new.png",
  cat: "Branding", stars: 3, data: "29/09",
  paywall: true,
  resumo: ["O Brand New registrou, com o título \"Suck it Up\", a mudança de nome, logo e embalagem da Coach Potato, feita pela Echt Brands, da Eslováquia. O post está na categoria \"Noted\", em bens de consumo.","As tags públicas — colorido, mascote, embalagem e rosa — sugerem uma marca extrovertida, com personagem e cor forte nas embalagens."]
 },
 {
  title: "New Balance Quietly Fixed What Makes Tech Sneakers Unwearable",
  tituloPt: "A New Balance resolveu, sem alarde, o que torna tênis tecnológicos difíceis de usar",
  source: "Yanko Design",
  url: "https://www.yankodesign.com/2026/09/30/new-balance-quietly-fixed-what-makes-tech-sneakers-unwearable/",
  imageUrl: "https://www.yankodesign.com/images/design_news/2026/09/new-balance-quietly-fixed-what-makes-tech-sneakers-unwearable/abzorb-00.jpg",
  cat: "Design", stars: 3, data: "30/09",
  resumo: ["A Yanko Design analisa o ABZORB 2000 Luxe, nova versão do tênis da New Balance que ataca uma frustração comum do calçado técnico: obrigar quem usa a escolher entre conforto visível e discrição, com o look inteiro girando em torno do tênis.","A versão Luxe mantém a entressola com amortecimento exposto e os \"pods\", mas troca as cores por tons de marrom e cinza, com cabedais discretos, materiais em contraste e costuras aparentes.","O solado continua chamando atenção enquanto a parte superior não compete com ele. O autor defende que é um refinamento pela contenção, e não uma reinvenção. O lançamento está marcado para 1º de outubro de 2026."]
 },
 {
  title: "McDonald's starts testing ads from other brands on its restaurant menu screens",
  tituloPt: "McDonald's começa a testar anúncios de outras marcas nas telas de cardápio dos restaurantes",
  source: "Campaign",
  url: "https://www.campaignlive.com/article/mcdonalds-starts-testing-ads-brands-its-restaurant-menu-screens/1971094",
  imageUrl: null,
  cat: "Branding", stars: 3, data: "28/09",
  resumo: ["O McDonald's está pilotando anúncios de marcas terceiras nas telas digitais de cardápio de restaurantes próprios selecionados nos EUA. Os anúncios aparecem depois que o cliente conclui o pedido, durante a espera pela retirada, tanto nos totens de autoatendimento quanto nas telas do drive-thru.","Um porta-voz disse que a ideia é \"compartilhar conteúdo pós-compra que os clientes possam achar útil, relevante ou interessante\".","O teste pode abrir uma fonte de receita relevante, transformando a rede numa plataforma de mídia como as redes de varejo do Walmart e da Target. O setor sofre com tráfego fraco e custos em alta, o que torna a diversificação estratégica.","Com cerca de 26 milhões de clientes diários em 13.700 unidades nos EUA, o alcance é grande; o sucesso dependerá de a publicidade melhorar ou piorar a experiência no salão."]
 }
];

const PAL = {Branding:[["#ff9a3c","#e8590c"],["#ffd166","#ef476f"],["#f76b1c","#fad961"]],Design:[["#2dd4bf","#0f766e"],["#86efac","#0d9488"],["#34d399","#155e75"]],Tecnologia:[["#6366f1","#a855f7"],["#3b82f6","#7c3aed"],["#60a5fa","#4f46e5"]]};
function Arte({cat,seed}){
  const p=PAL[cat][seed%3], id="g"+seed, r=(n)=>((seed*37+n*53)%100);
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#"+id+")"}/>
    <circle cx={60+r(1)*3} cy={40+r(2)} r={50+r(3)/2} fill="#fff" opacity=".18"/>
    <rect x={200+r(4)} y={90+r(5)/2} width="140" height="140" rx="28" fill="#fff" opacity=".14" transform={"rotate("+(r(6)-30)+" 270 160)"}/>
    <polygon points={"40,230 "+(120+r(7))+",120 "+(200+r(8))+",230"} fill="#000" opacity=".12"/>
    <circle cx={330-r(9)} cy="50" r="22" fill="#fff" opacity=".3"/>
  </svg>);
}
function Imagem({item,i,alt}){
  const [falhou,setFalhou]=useState(false);
  return (<div className="img">{item.imageUrl && !falhou
    ? <img src={item.imageUrl} alt={alt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
    : <Arte cat={item.cat} seed={i+1}/>}</div>);
}
const Estrelas=({n})=><span className="stars" title={n+" de 5"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Meta({item}){return (<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><span>{item.source}</span><span>·</span><span>{item.data}</span><Estrelas n={item.stars}/></div>);}
function Modal({item,i,onClose}){
  useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
  return (<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <button className="close" onClick={onClose} aria-label="Fechar">×</button>
    <Imagem item={item} i={i} alt={item.tituloPt}/>
    <div className="in"><Meta item={item}/><h2>{item.tituloPt}</h2>
    {item.resumo.map((p,k)=><p key={k}>{p}</p>)}
    {item.paywall && <div className="note">Matéria atrás de paywall: resumo baseado apenas em elementos públicos (título, categoria, indústria e tags).</div>}
    <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a></div>
  </div></div>);
}
function App(){
  const [sel,setSel]=useState(null);
  const [hero,...resto]=NEWS;
  return (<div className="wrap">
    <header><div><h1>Portal da Manhã</h1><div className="date">Quarta-feira, 30 de setembro de 2026 · Branding, Design e Tecnologia</div></div><div className="date">{NEWS.length} notícias</div></header>
    <div className="hero" onClick={()=>setSel(0)}>
      <Imagem item={hero} i={0} alt={hero.tituloPt}/>
      <div className="txt"><Meta item={hero}/><h2>{hero.tituloPt}</h2><p style={{margin:0,color:"#4b5563"}}>{hero.resumo[0]}</p><span style={{color:"var(--acc)",fontWeight:600}}>Ler resumo →</span></div>
    </div>
    <div className="grid">{resto.map((it,k)=>(<div className="card" key={k} onClick={()=>setSel(k+1)}>
      <Imagem item={it} i={k+1} alt={it.tituloPt}/><div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div></div>))}</div>
    <footer>Resumos escritos em português a partir das matérias originais. Clique em qualquer notícia para abrir o resumo completo.</footer>
    {sel!==null && <Modal item={NEWS[sel]} i={sel} onClose={()=>setSel(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
