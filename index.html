<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1c1b1a;--mut:#6b6862;--line:#e8e5df;--br:#e8622c;--de:#0f9b8e;--te:#5b5ce6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}
.date{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff}
.t-Branding{background:var(--br)}.t-Design{background:var(--de)}.t-Tecnologia{background:var(--te)}
.stars{color:#f5a623;letter-spacing:2px;font-size:14px}.stars i{color:#d9d5cc;font-style:normal}
.thumb{width:100%;height:100%;object-fit:cover;display:block}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(30,25,20,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;border:1px solid var(--line);display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(30,25,20,.12)}
.img{aspect-ratio:16/9;background:#eee;overflow:hidden}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.body h3{margin:0;font-size:17px;line-height:1.3}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.4fr 1fr;margin-bottom:26px;border-radius:22px}
.hero .img{aspect-ratio:auto;min-height:340px}
.hero .body{padding:30px;justify-content:center;gap:12px}
.hero h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.hero p{margin:0;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.warn{font-size:12px;background:#fff6e0;color:#8a6200;padding:4px 8px;border-radius:8px}
.ov{position:fixed;inset:0;background:rgba(20,18,16,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:10;animation:f .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .3s}
.modal .img{aspect-ratio:16/9}
.mb{padding:26px 30px 32px}
.mb h2{margin:10px 0 4px;font-size:25px;line-height:1.25}
.mb .sub{color:var(--mut);font-size:14px;margin-bottom:14px}
.mb p{font-size:16px;margin:0 0 14px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:99px;font-size:14px;margin-right:8px;border:0;cursor:pointer;font-family:inherit}
.btn.g{background:#eee;color:var(--ink)}
@keyframes f{from{opacity:0}}@keyframes u{from{opacity:0;transform:translateY(24px)}}
footer{margin-top:36px;color:var(--mut);font-size:12px;text-align:center}
@media(max-width:860px){.hero{grid-template-columns:1fr}.hero .img{min-height:0;aspect-ratio:16/9}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:24px}.hero h2{font-size:22px}.mb{padding:20px}}
</style>
</head>

{
title: "The inside story of Newcastle United's new crest design",
tituloPt: "Por dentro do novo escudo do Newcastle United: primeira reformulação em quase quatro décadas",
source: "Creative Review",
url: "https://www.creativereview.co.uk/newcastle-united-new-crest-design-brand-identity-kenneth-mciver/",
imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/09/Newcastle_United_New_Crest_Holographic.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=1920&h=1080",

resumo: ["O Newcastle United apresentou a primeira revisão de seu escudo em quase 40 anos. Em vez de uma ruptura, o clube optou por uma evolução da versão de 1988, mantendo os elementos que o torcedor reconhece.","Continuam presentes os dois hipocampos (cavalos-marinhos) e o escudo central, derivados do brasão histórico da cidade, que remetem ao passado marítimo e industrial da região. A mudança mais visível está no leão dourado, agora mais afiado e imponente, erguendo uma flâmula de São Jorge.","O trabalho vai além do emblema: inclui um sistema de design completo, com tipografia própria e um novo logotipo secundário, pensados para sustentar as metas esportivas e comerciais do clube pelas próximas décadas e dar mais unidade à marca no mercado global.","A direção criativa ficou com o diretor de criação do clube, Kenneth McIver, que buscou honrar a história do clube para a comunidade de Tyneside ao mesmo tempo em que o posiciona para o reconhecimento internacional."]

{

url: "https://www.creativereview.co.uk/washington-post-journalism-relentless-campaign-uncommon/",

resumo: ["O Washington Post apresentou, em parceria com a Uncommon Creative Studio, a campanha 'Relentless', que destaca a complexidade e a importância do jornalismo investigativo.","A peça central é um filme e uma edição impressa especial dedicados à investigação do jornal sobre o uso indevido de câmeras de vigilância da Flock. A campanha mostra o processo: entrevistas, documentos vazados e coleta de provas.","A reportagem teve impacto concreto, com mudanças em políticas corporativas, restrições em contratos municipais e medidas disciplinares, incluindo prisões. A edição impressa foi enviada a assinantes e a instituições de peso, como a Casa Branca.","A Uncommon também desenhou um troféu em forma de credencial de imprensa 'indestrutível', que será entregue a jornalistas do Post junto com os prêmios Ben Bradlee, ainda este ano."]

resumo: ["Os escritórios Carmody Groarke, Atama e Re-st concluíram a grande reforma do Design Museum Gent. O destaque é uma extensão de 2.200 m² em tijolos brancos, com perfil geométrico e inclinado inspirado nas tradicionais casas de empena da cidade.","Os tijolos calcários foram fabricados a partir de resíduos de construção locais, em um processo de cura com cal de baixo consumo de energia, resultando em carbono incorporado de cerca de um terço do de um tijolo cerâmico belga convencional.","O museu passa a ser o maior de design da Bélgica, com 8.600 m² no total, 3.700 deles para exposições. A nova ala abriga espaços educativos, de eventos e de exposição, além de uma porta de entrada em alumínio impresso em 3D.","O projeto também restaurou três alas históricas e renovou o pátio central. A reabertura ao público está marcada para 3 de outubro, com novo acervo e exposição inaugural."]

{
title: "Freckle phone aims to send kids outside to play and engage with the world",
tituloPt: "Freckle: o celular com IA para crianças que quer mandar os pequenos para fora de casa",

url: "https://www.dezeen.com/2026/10/01/freckle-phone-sends-kids-outside/",
imageUrl: "https://static.dezeen.com/uploads/2026/09/freckle-phone-design_dezeen_2364_hero.jpg",

resumo: ["A startup Freckle, fundada por Sam Terris, lançou um celular com IA para crianças de 7 a 13 anos que prioriza a exploração ao ar livre em vez do vício em telas. O design é do estúdio Body Shop e o sistema, o ClayOS, é próprio.","O aparelho exclui redes sociais, navegador e loja de aplicativos. Em vez disso, traz o app Quests, com missões ao ar livre, uma câmera de descoberta com identificação de objetos por IA, ferramentas de histórias interativas, mapas adaptados e função de walkie-talkie.","Segundo Terris, a perda de independência das crianças é um dos principais motores da ansiedade e da depressão entre os mais jovens. Por isso a vigilância dos pais é limitada: eles só são avisados quando a criança sai de zonas seguras ou menciona temas sensíveis, como bullying.","A privacidade exige consentimento parental verificável e limita o tempo de retenção de dados. O lançamento é em dezembro de 2026, inicialmente nos EUA, com apoio da Seven Seven Six, fundo de Alexis Ohanian."]

imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/GettyImages-2283268140.jpg",
alt: "Rich Silverstein, cofundador da Goodby Silverstein & Partners",
cat: "Branding", stars: 3, paywall: false,
dek: "A despedida vem como infomercial do 'GPT Rich', hotline treinada com a voz do publicitário.",
resumo: ["Rich Silverstein, cofundador da Goodby Silverstein & Partners, deixa a agência de São Francisco após 43 anos. Em 31 de dezembro de 2026 ele passa a fundador e presidente emérito.","Para marcar a saída, a GS&P criou um infomercial bem-humorado do 'GPT Rich', uma linha telefônica com IA treinada nos padrões de fala de Silverstein em entrevistas. O sistema usa a tecnologia de voz da ElevenLabs e uma linha da Twilio, e quem liga recebe feedback criativo na voz dele, com a 'honestidade brutal' que o caracteriza.","Silverstein esteve por trás de campanhas icônicas como 'Got Milk?' e de trabalhos recentes para a BMW, incluindo anúncios de Super Bowl. Jeff Goodby disse que ele 'faz todos ao redor ficarem melhores'. A liderança segue: Goodby como chairman, Margaret Johnson como CCO e Sarah Thompson como CEO."]

tituloPt: "Marriott Bonvoy troca equipes de produção por criadores em campanha global feita em 12 semanas",
source: "Campaign",
url: "https://www.campaignlive.com/article/marriott-bonvoy-swaps-production-crews-creators-rapid-global-campaign-rollout/1971507",
imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/Marriott-Bonvoy-creator-marketing-UWP-CUS.jpg",

resumo: ["A Marriott Bonvoy lançou a campanha global 'Wherever Life's Journey Takes You, We'll See You There', em parceria com a Beautiful Destinations, posicionando a marca como um ecossistema de viagens e não só um programa de fidelidade.","Foram 21 criadores em 23 destinos, com 14 hotéis. O modelo permitiu ir do briefing aos materiais prontos em quatro semanas e ao mercado em 12, segundo Behnaz Ghahramali, vice-presidente sênior de marketing global.","Os criadores foram escolhidos por autenticidade e conexão local, não por número de seguidores. O volume de conteúdo foi reaproveitado em vários canais, incluindo mais de 1.600 anúncios em aeroportos, aviões e carros de aplicativo. Para a empresa, eficiência não precisa custar qualidade nem emoção."]

{

source: "Yanko Design",
url: "https://www.yankodesign.com/2026/09/30/porsches-car-studio-concept-secretly-doubles-as-a-club/",
imageUrl: "https://www.yankodesign.com/images/design_news/2026/09/porsches-car-studio-concept-secretly-doubles-as-a-club/porsche-01.jpg",

resumo: ["A Porsche Design e a Newgard Development Group apresentaram o Concours, conceito que une estúdios privados para carros a um clube exclusivo para membros. As duas primeiras unidades serão em West Palm Beach e Dallas, com abertura prevista para 2028 e 22 estúdios individuais em cada.","A proposta repensa a guarda de veículos como experiência social: um 'lar que vale a visita, mesmo sem planos de dirigir'. O clube tem restaurante, bem-estar, espaços para eventos e terraços externos para colecionadores conviverem.","A marca é Porsche, mas não é preciso ter um Porsche para ser membro, o que favorece coleções variadas. Os projetos são da Gensler (Dallas) e da Urban Robot Associates (West Palm Beach), com o desafio de dar espaço para os carros serem vistos e motivos para as pessoas ficarem. O sucesso depende de gerar comunidade de fato."]

{
title: "Fabrizio Corneli creates dramatic installation for glasses brand Lindberg",

url: "https://www.dezeen.com/2026/10/01/fabrizio-corneli-installation-glasses-brand-lindberg/",

alt: "Instalação Enigma of Vision, de Fabrizio Corneli para a Lindberg",

dek: "'Enigma of Vision' estreou no Armory Show, em Nova York, e segue para Xangai.",
resumo: ["A marca dinamarquesa de óculos Lindberg convidou o artista italiano Fabrizio Corneli para criar 'Enigma of Vision', instalação feita para o local que estreou no Armory Show, em Nova York, em 24 de setembro. Depois ela segue para a West Bund Art and Design, em Xangai, de 10 a 15 de novembro.","São duas obras. 'Seed' é uma escultura interativa com iluminação oculta que revela a imagem de um globo, convidando à reflexão sobre um futuro humano conectado. 'Eyecatcher' transforma as armações da Lindberg em elementos que projetam sombras dramáticas.","A parceria reflete a filosofia da marca de 'retirar o design até o essencial' e explora como a percepção equilibra visibilidade e ocultação, dando continuidade a colaborações anteriores no Armory Show com Letha Wilson e Yuko Nishikawa."]

},
{
title: "What the magic of Harry Potter's Hogwarts letter can teach brands",
tituloPt: "O que a carta de Hogwarts, de Harry Potter, pode ensinar às marcas sobre mídia física",
source: "Creative Bloq",
url: "https://www.creativebloq.com/design/branding/what-brands-can-learn-from-the-magic-of-harry-potters-hogwarts-letter",
imageUrl: "https://cdn.mos.cms.futurecdn.net/weCmeCfbhwd4eYY8UKqjkD-1920-80.jpg",
alt: "Carta de Hogwarts em tinta verde",

dek: "Para o artigo, a experiência tangível vive uma retomada, sobretudo entre a Geração Z.",
resumo: ["O artigo de Cameron Russell usa a famosa carta de aceitação de Hogwarts como lição de branding. A tese é que a mídia física vive uma retomada significativa, principalmente entre a Geração Z.","A experiência tangível de receber a carta, com tinta verde e endereço personalizado, cria um engajamento que o digital não replica. O texto cita que 97% da correspondência é aberta e que ela fica em casa por cerca de 7,4 dias, em média.","Segundo pesquisas citadas, 75% da Geração Z lê livros ao menos uma vez por mês e 71% confia totalmente em correspondência. Exemplos como a campanha de cards do McDonald's ilustram marcas que unem físico e digital, em contraste com a fadiga de fluxos infinitos de conteúdo digital."]

const PAL = {Branding:["#f7a072","#e8622c","#8c2f0f"],Design:["#7fd6c9","#0f9b8e","#06504a"],Tecnologia:["#9a9bff","#5b5ce6","#2a1f7a"]};
function Art({cat,seed}){
  const p=PAL[cat]||PAL.Design;const s=seed*37;
  return (<svg className="thumb" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de "+cat}>
    <defs><linearGradient id={"g"+seed} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[2]}/></linearGradient></defs>
    <rect width="320" height="180" fill={"url(#g"+seed+")"}/>
    <circle cx={60+s%180} cy={50+s%60} r={50+s%30} fill="#fff" opacity=".15"/>
    <rect x={150+s%80} y={70+s%40} width="110" height="110" rx="20" fill={p[1]} opacity=".5" transform={"rotate("+(s%40)+" 200 120)"}/>
    <polygon points="20,180 120,80 200,180" fill="#fff" opacity=".12"/>
  </svg>);
}
function Pic({it,idx}){
  const [falhou,setFalhou]=useState(false);
  if(!it.imageUrl||falhou) return <Art cat={it.cat} seed={idx+1}/>;
  return <img className="thumb" src={it.imageUrl} alt={it.alt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>;
}
function Stars({n}){return <span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}<i>{"★".repeat(5-n)}</i></span>}
function Card({it,idx,onOpen,hero}){
  return (<article className={"card"+(hero?" hero":"")} onClick={()=>onOpen(idx)} tabIndex={0} onKeyDown={e=>e.key==="Enter"&&onOpen(idx)}>
    <div className="img"><Pic it={it} idx={idx}/></div>
    <div className="body">
      <div className="meta"><span className={"tag t-"+it.cat}>{it.cat}</span><Stars n={it.stars}/></div>
      {hero?<h2>{it.tituloPt}</h2>:<h3>{it.tituloPt}</h3>}
      {hero&&<p>{it.dek}</p>}
      <div className="meta"><span>{it.source}</span>{it.paywall&&<span className="warn">resumo parcial</span>}</div>
    </div>
  </article>);
}
function Modal({it,idx,onClose}){
  useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
  return (<div className="ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="img"><Pic it={it} idx={idx}/></div>
    <div className="mb">
      <div className="meta"><span className={"tag t-"+it.cat}>{it.cat}</span><Stars n={it.stars}/></div>
      <h2>{it.tituloPt}</h2>
      <div className="sub">{it.source} · título original: {it.title}</div>
      {it.resumo.map((p,i)=><p key={i}>{p}</p>)}
      {it.paywall&&<p><em>Nota: o artigo original está atrás de paywall; este resumo usa apenas os elementos públicos (título, categoria, tags).</em></p>}
      <a className="btn" href={it.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
      <button className="btn g" onClick={onClose}>Fechar</button>
    </div></div></div>);
}
function App(){
  const [open,setOpen]=useState(null);
  const [first,...rest]=DATA;
  return (<div className="wrap">
    <header><div><h1>☀️ Portal da Manhã</h1><div className="date">Sexta-feira, 2 de outubro de 2026 · {DATA.length} notícias de branding, design e tecnologia</div></div></header>
    <Card it={first} idx={0} onOpen={setOpen} hero/>
    <div className="grid">{rest.map((it,i)=><Card key={i+1} it={it} idx={i+1} onOpen={setOpen}/>)}</div>
    {open!==null&&<Modal it={DATA[open]} idx={open} onClose={()=>setOpen(null)}/>}
    <footer>Resumos parafraseados em português. Imagens pertencem aos respectivos portais.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
