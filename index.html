<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 14 de setembro de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f6f4;
    --surface:#ffffff;
    --ink:#15161a;
    --ink-2:#4a4d57;
    --ink-3:#8b8f9c;
    --line:#e6e5e1;
    --accent:#d4462f;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,20,25,.04), 0 8px 28px rgba(20,20,25,.06);
    --shadow-hover:0 2px 6px rgba(20,20,25,.06), 0 18px 48px rgba(20,20,25,.11);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px 80px}

  header.top{padding:56px 0 34px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1.brand{font-size:clamp(38px,6vw,64px);line-height:1.02;letter-spacing:-.035em;margin:12px 0 10px;font-weight:800}
  .sub{color:var(--ink-2);font-size:15px;margin:0}
  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--ink-2)}

  .hero{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:34px;
    transition:box-shadow .28s ease, transform .28s ease;
  }
  .hero:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  .hero-media{position:relative;min-height:340px;background:#eceae5}
  .hero-media img,.card-media img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center}
  .hero h2{font-size:clamp(24px,2.6vw,34px);line-height:1.16;letter-spacing:-.022em;margin:14px 0 14px;font-weight:750}
  .hero p.dek{color:var(--ink-2);font-size:15.5px;line-height:1.6;margin:0}

  .tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:7px}
  .cat.branding{background:#fdeee9;color:#b83c22}
  .cat.design{background:#e6f4ef;color:#17705a}
  .cat.tech{background:#eaeafb;color:#4038a8}
  .src{font-size:12.5px;color:var(--ink-3);font-weight:600}
  .stars{font-size:12.5px;color:#e0a32b;letter-spacing:1px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:box-shadow .28s ease, transform .28s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
  .card-media{height:178px;background:#eceae5;position:relative;overflow:hidden}
  .card-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:17px;line-height:1.3;letter-spacing:-.012em;margin:0;font-weight:700}
  .card .snippet{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0}
  .card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}

  .section-label{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:0 0 16px}

  /* leitor */
  .overlay{
    position:fixed;inset:0;background:rgba(18,18,22,.42);backdrop-filter:blur(6px);
    z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
    padding:48px 20px;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
  .reader{
    background:#fff;border-radius:24px;max-width:780px;width:100%;overflow:hidden;
    box-shadow:0 30px 90px rgba(0,0,0,.28);animation:rise .32s cubic-bezier(.2,.8,.3,1);
  }
  .reader-media{height:330px;background:#eceae5}
  .reader-media img{width:100%;height:100%;object-fit:cover;display:block}
  .reader-body{padding:34px 40px 40px}
  .reader h2{font-size:clamp(23px,3vw,31px);line-height:1.18;letter-spacing:-.02em;margin:14px 0 18px;font-weight:780}
  .reader p{color:#33353d;font-size:16px;line-height:1.72;margin:0 0 16px}
  .note{font-size:13px;color:var(--ink-3);font-style:italic;border-left:3px solid var(--line);padding-left:12px;margin-top:22px}
  .reader-actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
  .btn{
    display:inline-block;border-radius:999px;padding:11px 22px;font-size:14px;font-weight:650;
    text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    transition:background .2s ease,border-color .2s ease;
  }
  .btn:hover{background:#f2f1ee}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#2b2d34}

  footer.bot{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;line-height:1.7}

  @media (max-width:960px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:250px}
    .hero-body{padding:28px 26px 30px}
  }
  @media (max-width:620px){
    .wrap{padding:0 16px 56px}
    .grid{grid-template-columns:1fr}
    .reader-body{padding:26px 22px 32px}
    .overlay{padding:20px 12px}
    .reader-media{height:220px}
  }
</style>
</head>

  {
    title: "How retro branding is bringing warmth and fun to São Paulo's bars and restaurants",

    tituloPt: "Caixa de fruta flexográfica, rótulo de cachaça e placa pintada à mão: como os bares de São Paulo enterraram o minimalismo e viraram o laboratório gráfico da cidade",

      "Elaine Ramos, designer e correspondente do It's Nice That em São Paulo, assina um panorama sobre a mudança de temperatura do design gráfico paulistano. Durante anos, diz ela, a paisagem visual da cidade foi dominada por identidades minimalistas ditas 'elegantes': lettering geométrico, padronagens feitas de fragmentos de letra, pontos, arcos, hachuras. O designer abria a caixa de ferramentas — simplifica, geometriza, fragmenta — e pronto, nascia mais uma marca. Esse repertório, argumenta o texto, deu lugar a identidades lúdicas, coloridas, ilustradas e abertamente artesanais, que extrapolam o logo e a fachada.",
      "O ponto de partida é o Bar Exquisito, identidade criada pelo Estúdio Caxa a partir de pesquisa em cultura vernacular latino-americana: embalagens baratas de comida de rua, caixas de fruta impressas em flexografia com suas manchas de cor e erros de registro, e a tradição da pintura de letreiros à mão. O projeto inclui uma tipografia desenhada a partir de letreiros de mercado e um conjunto de ilustrações.",
      "O Estúdio Arado, fundado em 2018 por dois designers mineiros e dedicado a pesquisar o 'imaginário rural brasileiro', assinou a marca da Cervejaria Duas Irmãs: um retrato das duas irmãs dentro de uma oval central, lettering feito à mão que abraça distorções, cardápio pintado direto na parede e detalhes de linguagem comercial de outra época, incluindo o clássico 'agradecemos a preferência'.",
      "Na mesma linha, o Estúdio Sarau desenhou o Bar Ovo a partir de rótulos litográficos de cachaça, caixas de fósforo e publicidade da primeira metade do século 20 — molduras, sombras e degradês de linha. Já Flora de Carvalho, para o Suei, em Barra Funda, partiu da ideia de calor implícita no nome do bar para criar um estilo que ela descreve como 'derretido', com contornos irregulares, tipografia de pincel e pretos falhados imitando xerox. Desafiando o manual da marca, o projeto usa três formas completamente diferentes de escrever o nome do bar.",
      "A onda não é só paulistana: no Rio, o Biabum assinou o Salva Bar, restaurante baiano, com textura de risografia, carranca, vapor do Recôncavo, Farol da Barra e um wordmark baseado numa edição de 1968 das obras completas de Jorge Amado. E o PS2, dupla paulistana hoje sediada em Hamburgo, acaba de entregar o Bar Aperitivo, com referência nos verões italianos dos anos 1970 e os 'O' do wordmark transformados em azeitonas.",
      "A conclusão do texto é menos celebratória do que parece. Numa cidade avessa a qualquer ideia de preservação, moldada pela especulação imobiliária e por uma cultura de reforma permanente, onde pouquíssimos bares sobreviveram décadas sem mudar, essa emulação da tradição ganha um contorno irônico: cabe ao designer fabricar os sinais de autenticidade e reconstruir simbolicamente a memória que a cidade engoliu."

    resumo: [
      "O landmark project do London Design Festival deste ano se chama The Pangolin Shield e foi projetado pelo Studio Saar em parceria com os engenheiros estruturais da Atelier One, liderados pelo fundador Neil Thomas. O pavilhão está instalado no trecho recém-pedestrianizado do Strand, em frente à Somerset House e ao lado da India House.",
      "A escolha do lugar não é acidental. Como explicou ao Dezeen o cofundador do Studio Saar, Ananya Singhal, a Somerset House foi a sede administrativa da Marinha britânica durante o período colonial e a India House abriga a Alta Comissão da Índia. O pavilhão ainda fica de frente para um busto de Jawaharlal Nehru, primeiro-ministro da Índia. Para Singhal, cujo escritório é uma prática indo-britânica trabalhando com um engenheiro inglês, o endereço permitia falar da nova relação entre os dois países.",

      "A galeria Brandt, de Amsterdã, apresentou o primeiro grande rebranding de sua história ao completar dez anos, assinado pelo recém-fundado estúdio Bureau Brandt. A casa é conhecida pela programação dinâmica, que mistura exposições e performances no espaço principal, e participa regularmente de feiras internacionais como The Armory Show, Untitled Art, NADA New York e Art Toronto.",

  {

    tituloPt: "O jeito como o cobrador de ônibus dobra a nota na palma da mão virou linguagem visual: como o estúdio Belonwus fez uma fintech nigeriana fugir do azul e do verde",
    categoria: "Branding",

    resumo: [
      "Quando a agência nigeriana Belonwus começou a desenvolver a identidade da Owo, plataforma de pagamentos voltada a nigerianos, a equipe descartou de saída o caminho óbvio: mais uma marca de fintech vestida nos azuis e verdes de sempre. Em vez disso, foi buscar referência na cultura local.",

    resumo: [

const PALETAS = {
  Branding: ["#F7C59F","#E8804B","#C8452A"],
  Design:   ["#A8DCCB","#3FA88B","#12695A"],
  Tecnologia:["#B9BDF2","#6A6BDA","#3B3596"]
};

function Ilustracao({ categoria, seed, alto }) {
  const p = PALETAS[categoria] || PALETAS.Branding;
  const id = "g" + seed;
  const r = (n) => ((seed * 37 + n * 61) % 100) / 100;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
        <linearGradient id={id+"b"} x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={p[2]} stopOpacity="0.85"/>
          <stop offset="100%" stopColor={p[1]} stopOpacity="0.25"/>
        </linearGradient>
      </defs>
      <rect width="400" height="240" fill={"url(#"+id+")"}/>
      <circle cx={70 + r(1)*260} cy={60 + r(2)*120} r={40 + r(3)*55} fill={"url(#"+id+"b)"}/>
      <rect x={20 + r(4)*230} y={30 + r(5)*110} width={70 + r(6)*110} height={70 + r(7)*90}
            rx="18" fill={p[2]} opacity="0.30"
            transform={"rotate(" + Math.round(r(8)*40 - 20) + " 200 120)"}/>
      <path d={"M0," + (150 + r(9)*50) + " C 110," + (70 + r(10)*90) + " 250," + (210 - r(11)*90) + " 400," + (110 + r(12)*70) + " L400,240 L0,240 Z"}
            fill="#ffffff" opacity="0.22"/>
      <circle cx={330 - r(13)*70} cy={190 - r(14)*70} r={12 + r(15)*20} fill="#ffffff" opacity="0.4"/>
    </svg>
  );
}

function Midia({ item, idx, alt }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={idx + 3} />;
  }
  return (
    <img src={item.imageUrl}
         alt={alt || item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)} />
  );
}

const Estrelas = ({ n }) => (
  <span className="stars" title={n + " de 5"}>{"★".repeat(n)}<span style={{color:"#dcdcd6"}}>{"★".repeat(5-n)}</span></span>
);

const Cat = ({ c }) => (
  <span className={"cat " + (c === "Design" ? "design" : c === "Tecnologia" ? "tech" : "branding")}>{c}</span>
);

function Leitor({ item, idx, fechar }) {
  return (
    <div className="overlay" onClick={fechar}>
      <div className="reader" onClick={(e) => e.stopPropagation()}>
        <div className="reader-media"><Midia item={item} idx={idx} /></div>
        <div className="reader-body">
          <div className="tagline">
            <Cat c={item.categoria} />
            <span className="src">{item.source}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          {item.paywall &&
            <div className="note">Matéria atrás de paywall — o resumo acima foi escrito a partir dos elementos públicos da página (título, categoria, indústria, tags e data), sem acesso ao texto completo.</div>}
          <div className="reader-actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={fechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

              </div>
            </div>
          </article>
        ))}
      </div>

      <footer className="bot">
        Portal da Manhã — edição de 14 de setembro de 2026. Os resumos são produzidos e parafraseados em português a partir das matérias originais; nenhum texto é copiado das fontes. Todos os créditos e as imagens pertencem aos portais de origem, e cada item leva ao artigo completo.<br/>
        Fontes desta edição: {portais.join(" · ")}.
      </footer>

      {aberta !== null &&
        <Leitor item={NOTICIAS[aberta]} idx={aberta} fechar={() => setAberta(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
