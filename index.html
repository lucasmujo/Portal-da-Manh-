    resumo: [
      "Ida Torres, do Yanko Design, apresenta a cadeira ergonômica Aery, da EFFYDESK, como uma tentativa de fechar a distância entre um home office bonito e um confortável. A cadeira tem encosto em tela, assento acolchoado e vários ajustes para se adaptar a quem senta.",
      "A autora observa que a tela aberta evita que um encosto alto pareça volumoso ao lado de uma mesa pequena, e que o apoio de cabeça separado a mantém claramente como cadeira de trabalho. Entre os recursos, destaca o assento deslizante, que muda o apoio sob as pernas, e os braços que sobem, descem, deslizam e giram para acompanhar a posição natural dos braços.",
      "Torres ressalva que não sentou na Aery e, portanto, não avalia o conforto do estofado nem a sensação dos controles; gostaria de testar se os braços seguram a posição e se a cadeira entra sob a mesa. No geral, vê uma opção prática para quem quer ajustar a cadeira ao corpo em vez de aceitar um desenho fixo."
    ]
  }
];

const PALETAS = {
  Branding: [["#ff9966","#ff5e62"],["#f6d365","#fda085"],["#fc6076","#ff9a44"]],
  Design: [["#11998e","#38ef7d"],["#0f9b8e","#7be0c3"],["#0ba360","#3cba92"]],
  Tecnologia: [["#4776e6","#8e54e9"],["#5b86e5","#36d1dc"],["#667eea","#764ba2"]]
};
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

function Ilustracao({ item }) {
  const h = hash(item.title);
  const [a,b] = PALETAS[item.cat][h % 3];
  const id = "g"+h;
  const shapes = [0,1,2,3].map(i => {
    const x = (h >> (i*3)) % 100, y = (h >> (i*2+1)) % 100, r = 18 + ((h >> i) % 30);
    return i % 2 ? <circle key={i} cx={x*4} cy={y*2} r={r} fill="#fff" opacity=".18"/> :
      <rect key={i} x={x*3} y={y} width={r*2} height={r*2} rx={r/2} fill="#fff" opacity=".15" transform={`rotate(${(h>>i)%60} ${x*3} ${y})`}/>;
  });
  return (
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={a}/><stop offset="1" stopColor={b}/></linearGradient></defs>
      <rect width="400" height="200" fill={`url(#${id})`}/>
      {shapes}
      <circle cx="330" cy="40" r="60" fill="none" stroke="#fff" strokeOpacity=".25" strokeWidth="2"/>
    </svg>
  );
}

function Imagem({ item }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="img">
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
        : <Ilustracao item={item} />}
    </div>
  );
}

function Estrelas({ n }) { return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>; }

function Meta({ item }) {
  return (
    <div className="meta">
      <span className={"tag " + item.cat}>{item.cat}</span>
      <span>{item.source}</span>
      <Estrelas n={item.stars} />
    </div>
  );
}

function Modal({ item, onClose }) {
  React.useEffect(() => {
    const k = e => e.key === "Escape" && onClose();
    document.addEventListener("keydown", k);
    return () => document.removeEventListener("keydown", k);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <Imagem item={item} />
        <div className="inner">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <div className="orig">Título original: {item.title}</div>
          {item.paywall && <p className="note">Matéria atrás de paywall: resumo feito a partir dos elementos públicos (título, categoria, tags e imagens).</p>}
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
          <button className="btn sec" onClick={onClose}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [filtro, setFiltro] = useState("Todas");
  const ordenadas = [...NEWS].sort((a,b) => b.stars - a.stars);
  const lista = filtro === "Todas" ? ordenadas : ordenadas.filter(n => n.cat === filtro);
  const [manchete, ...resto] = lista;
  return (
    <div className="wrap">
      <header className="top">
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">Sexta-feira, 23 de outubro de 2026 · {NEWS.length} notícias</div>
      </header>
      <div className="filters">
        {["Todas","Branding","Design","Tecnologia"].map(f =>
          <button key={f} className={"chip" + (filtro===f ? " on" : "")} onClick={() => setFiltro(f)}>{f}</button>)}
      </div>
      {manchete && (
        <article className="hero" onClick={() => setAberto(manchete)}>
          <Imagem item={manchete} />
          <div className="body">
            <Meta item={manchete} />
            <h2>{manchete.tituloPt}</h2>
            <p>{manchete.resumo[0].slice(0, 190)}…</p>
            <span style={{color:"var(--accent)",fontWeight:600,fontSize:14}}>Ler resumo →</span>
          </div>
        </article>
      )}
      <section className="grid">
        {resto.map(n => (
          <article key={n.url} className="card" onClick={() => setAberto(n)}>
            <Imagem item={n} />
            <div className="body"><Meta item={n} /><h3>{n.tituloPt}</h3></div>
          </article>
        ))}
      </section>
      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
      <footer>Resumos produzidos em português a partir das matérias originais. Clique em qualquer card para abrir.</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
