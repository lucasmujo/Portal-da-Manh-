*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}

.date{color:var(--mute);font-size:14px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 12px rgba(20,23,31,.06);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid var(--line)}

.hero{display:grid;grid-template-columns:1.3fr 1fr;margin-bottom:24px}
.hero .media{min-height:320px}
.hero .body{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}

.media{position:relative;width:100%;aspect-ratio:16/9;background:#eceef5;overflow:hidden}

.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px 18px 18px}
.body h3{margin:6px 0 8px;font-size:17px;line-height:1.3}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;color:#fff;font-size:11px}
.tag.Branding{background:var(--brand)}.tag.Design{background:var(--design)}.tag.Tecnologia{background:var(--tech)}
.stars{color:#f5a623;letter-spacing:1px}
.lead{color:var(--mute);font-size:14px;margin:0}
.overlay{position:fixed;inset:0;background:rgba(20,23,31,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:10;animation:fade .2s}
.modal{background:#fff;border-radius:20px;max-width:760px;width:100%;overflow:hidden;animation:up .25s;position:relative}
.modal .media{aspect-ratio:16/8}
.modal .body{padding:24px 28px 30px}
.modal h2{margin:8px 0 14px;font-size:26px;line-height:1.2}
.modal p{font-size:16px;color:#2a2f3a}
.close{position:absolute;top:12px;right:12px;z-index:2;border:0;background:rgba(255,255,255,.92);width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.src{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:99px;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.note{font-size:13px;color:var(--mute);background:#f6f7fb;border-radius:10px;padding:8px 12px;margin-top:6px}
footer{margin-top:36px;text-align:center;color:var(--mute);font-size:12px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .media{min-height:200px;aspect-ratio:16/9}.hero h2{font-size:23px}.modal .body{padding:18px}}

      "O autor não testou e afirma que não executaria software “vibe-coded” com acesso ao disco; alerta que código gerado por IA sem auditoria é perigoso. Ele observa que o ArtCraft é construído em torno do Model Context Protocol (MCP), o que o diferencia fundamentalmente do desenho da Adobe, e prevê que os advogados da empresa reagirão e que o projeto pode não sobreviver sem financiamento. O episódio é visto como sinal de que a IA pode replicar software existente, ameaçando empresas que vivem de possuir e alugar seus produtos."
    ]
  },
  {
    title: "Uber and China's Pony.ai plan to launch robotaxis in London",
    tituloPt: "Uber e a chinesa Pony.ai planejam lançar robotáxis em Londres",
    source: "TechCrunch",
    url: "https://techcrunch.com/2026/10/08/uber-and-chinas-pony-ai-plan-to-launch-robotaxis-in-london/",
    imageUrl: "https://techcrunch.com/wp-content/uploads/2025/11/pony.ai-robotaxi.jpg?resize=1200,800",
    cat: "Tecnologia", stars: 2,
    resumo: [
      "A Uber e a fabricante chinesa de veículos autônomos Pony.ai planejam lançar um serviço de robotáxi em Londres, como parte de uma parceria ampliada para levar carros sem motorista à Europa. As empresas disseram que começarão a testar os robotáxis Gen-7 da Pony.ai na cidade “nas próximas semanas”.",
      "A Uber já fez acordos com mais de 30 empresas de veículos autônomos e espera oferecer corridas autônomas em até 15 cidades até o fim de 2026, divididas de forma aproximada entre EUA e exterior. A parceria com a Pony.ai começou em maio de 2025, focada no Oriente Médio, e agora prevê 2.000 robotáxis na Europa, a começar por Zagreb, na Croácia, onde em agosto de 2026 foi lançado um serviço com a startup Verne, de Mate Rimac. A Pony.ai fornece o sistema de direção autônoma e o veículo Arcfox Alpha T5, desenvolvido com a BAIC; a Verne opera a frota; a Uber dá acesso à sua rede.",
      "Em Londres o modelo deve ser semelhante, mas não se sabe quem será dono e operador da frota. A Pony.ai não é a única parceira da Uber na cidade: a empresa também apoia a britânica Wayve, que levantou US$ 1,2 bilhão em fevereiro de 2026 (Microsoft, Nvidia e Uber entre os investidores), com mais US$ 300 milhões da Uber condicionados ao início de operações de robotáxi, começando por Londres. A Pony.ai opera serviços em quatro cidades chinesas e se expande pela Europa e Oriente Médio, incluindo o Catar."
    ]
  }
];

const PALETTES = {
  Branding: ["#ff8a3d", "#e8590c", "#ffd166", "#c2255c"],
  Design: ["#2dd4bf", "#0b8f7a", "#a7f3d0", "#0f766e"],
  Tecnologia: ["#6366f1", "#5b4bdb", "#a78bfa", "#2563eb"]
};

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h);}

function Ilustracao({ item }) {
  const p = PALETTES[item.cat] || PALETTES.Branding;
  const h = hash(item.title);
  const id = "g" + h;
  const shapes = [0,1,2,3].map(i => {
    const x = (h >> (i*3)) % 80 + 10, y = (h >> (i*2+1)) % 70 + 10, r = 8 + ((h >> i) % 22);
    return i % 2 ? <circle key={i} cx={x} cy={y} r={r} fill={p[(i+1)%4]} opacity=".45"/> :
      <rect key={i} x={x-r} y={y-r} width={r*2} height={r*2} rx="6" transform={`rotate(${(h>>i)%60} ${x} ${y})`} fill={p[(i+2)%4]} opacity=".4"/>;
  });
  return (
    <svg viewBox="0 0 100 56" preserveAspectRatio="xMidYMid slice" role="img" aria-label={`Ilustração: ${item.tituloPt}`}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
      <rect width="100" height="56" fill={`url(#${id})`}/>
      <g transform="scale(1,.56)">{shapes}</g>
    </svg>
  );
}

function Imagem({ item }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="media">
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={`Foto da matéria: ${item.tituloPt}`} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
        : <Ilustracao item={item} />}
    </div>
  );
}

const Stars = ({ n }) => <span className="stars" title={`Relevância ${n}/5`}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;

function Meta({ item }) {
  return (
    <div className="meta">
      <span className={"tag " + item.cat}>{item.cat}</span>
      <strong>{item.source}</strong>
      <Stars n={item.stars} />
    </div>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const k = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", k); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <article className="modal" onClick={e => e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <Imagem item={item} />
        <div className="body">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          {item.paywall && <div className="note">Resumo feito a partir dos elementos públicos (título, categoria, tags), pois o texto completo está atrás de paywall.</div>}
          <a className="src" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a>
        </div>
      </article>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [manchete, ...demais] = NEWS;
  return (
    <div className="wrap">
      <header className="top">
        <div><h1>Portal da Manhã</h1><div className="date">quinta-feira, 8 de outubro de 2026 · {NEWS.length} notícias de branding, design e tecnologia</div></div>
      </header>
      <section className="card hero" onClick={() => setAberto(manchete)}>
        <Imagem item={manchete} />
        <div className="body">
          <Meta item={manchete} />
          <h2>{manchete.tituloPt}</h2>
          <p className="lead">{manchete.resumo[0].slice(0, 230)}…</p>
        </div>
      </section>
      <section className="grid">
        {demais.map(it => (
          <article key={it.url} className="card" onClick={() => setAberto(it)}>
            <Imagem item={it} />
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
            </div>
          </article>
        ))}
      </section>
      <footer>Resumos escritos em português a partir das matérias originais. Clique em um cartão para ler mais.</footer>
      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
