  :root{

  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

    line-height:1.55;

  .wrap{max-width:1120px;margin:0 auto;padding:40px 24px 96px}
  header.top{margin-bottom:36px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
  h1.brand{font-size:clamp(32px,5vw,50px);line-height:1.05;letter-spacing:-.03em;margin:10px 0 8px;font-weight:800}
  .sub{color:var(--ink-2);font-size:15px;margin:0}
  .divider{height:1px;background:var(--line);margin:28px 0 32px}

  .star{width:13px;height:13px;display:block}
  .badge{

    padding:5px 10px;border-radius:999px;

  .b-design{background:#e6f6f1;color:#0b6b53}
  .b-tech{background:#eceaff;color:#4632c4}

  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:26px;
    box-shadow:var(--shadow-lg);overflow:hidden;cursor:pointer;
    display:grid;grid-template-columns:1.05fr .95fr;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .hero:hover{transform:translateY(-3px)}
  .hero .art{min-height:300px}
  .hero .body{padding:34px 36px;display:flex;flex-direction:column;justify-content:center;gap:14px}

  .hero p{margin:0;color:var(--ink-2);font-size:15.5px}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;font-weight:600}
  .dot{width:3px;height:3px;border-radius:50%;background:var(--ink-3);display:inline-block}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;

  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#dcdfe5}
  .card .art{height:132px}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{margin:0;font-size:16.5px;line-height:1.3;letter-spacing:-.012em;font-weight:750}
  .card .dek{margin:0;color:var(--ink-2);font-size:13.5px;flex:1}

  .overlay{
    position:fixed;inset:0;background:rgba(18,21,26,.42);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;

  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .modal{
    background:var(--card);border-radius:24px;max-width:760px;width:100%;
    box-shadow:0 30px 70px rgba(16,24,40,.22);overflow:hidden;animation:rise .28s cubic-bezier(.2,.8,.3,1);
  }
  .modal .art{height:190px}
  .modal .inner{padding:30px 34px 34px}
  .modal h2{margin:14px 0 6px;font-size:26px;line-height:1.18;letter-spacing:-.02em;font-weight:800}
  .modal .resumo p{color:#2e343c;font-size:15.5px;margin:0 0 14px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}
  .btn{
    display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 17px;
    font-size:14px;font-weight:650;text-decoration:none;border:1px solid transparent;cursor:pointer;

  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#155ad2}
  .btn-ghost{background:#f2f4f7;color:var(--ink-2)}
  .btn-ghost:hover{background:#e8ebef}

  .note{background:#fffbeb;border:1px solid #fde68a;color:#8a5a00;border-radius:12px;padding:12px 14px;font-size:13px;margin-top:20px}

    .hero{grid-template-columns:1fr}
    .hero .art{min-height:190px}
    .hero .body{padding:26px 24px}
    .grid{grid-template-columns:repeat(2,1fr)}

  @media (max-width:600px){
    .wrap{padding:28px 16px 72px}
    .grid{grid-template-columns:1fr}
    .modal .inner{padding:24px 22px 28px}
  }
</style>
</head>

/* ------------------------- Ilustrações SVG ------------------------- */
const PALETAS = {
  Branding: { a:"#ff9a52", b:"#f4623a", c:"#ffd8b0", d:"#8f2f10" },
  Design:   { a:"#39c39b", b:"#0f8f78", c:"#c5f0e2", d:"#085646" },
  Tecnologia:{ a:"#7b6bf5", b:"#4632c4", c:"#d9d4ff", d:"#241a72" }
};

function Art({ categoria, variante, className }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const gid = "g" + categoria + variante;
  const formas = [
    <g key="0">
      <circle cx="150" cy="90" r="62" fill={p.c} opacity=".85"/>
      <circle cx="230" cy="130" r="40" fill={p.d} opacity=".28"/>
      <rect x="40" y="120" width="110" height="16" rx="8" fill="#fff" opacity=".65"/>
    </g>,
    <g key="1">
      <rect x="48" y="34" width="96" height="96" rx="20" fill={p.c} opacity=".9"/>
      <rect x="150" y="60" width="120" height="70" rx="16" fill="#fff" opacity=".5"/>
      <circle cx="256" cy="46" r="22" fill={p.d} opacity=".3"/>
    </g>,
    <g key="2">
      <path d="M20 150 Q90 40 160 120 T310 90" stroke="#fff" strokeWidth="14" fill="none" opacity=".6" strokeLinecap="round"/>
      <circle cx="90" cy="86" r="34" fill={p.c} opacity=".9"/>
      <rect x="200" y="30" width="70" height="70" rx="35" fill={p.d} opacity=".25"/>
    </g>,
    <g key="3">
      <rect x="30" y="30" width="70" height="120" rx="14" fill="#fff" opacity=".55"/>
      <rect x="112" y="58" width="70" height="92" rx="14" fill={p.c} opacity=".9"/>
      <rect x="194" y="20" width="70" height="130" rx="14" fill={p.d} opacity=".26"/>
    </g>,
    <g key="4">
      <circle cx="100" cy="90" r="52" fill="#fff" opacity=".5"/>
      <circle cx="170" cy="90" r="52" fill={p.c} opacity=".8"/>
      <circle cx="240" cy="90" r="52" fill={p.d} opacity=".26"/>
    </g>,
    <g key="5">
      <polygon points="70,150 130,40 190,150" fill={p.c} opacity=".9"/>
      <polygon points="160,150 220,60 280,150" fill="#fff" opacity=".45"/>
      <rect x="30" y="140" width="260" height="12" rx="6" fill={p.d} opacity=".3"/>
    </g>
  ];
  return (
    <svg className={className} viewBox="0 0 320 170" preserveAspectRatio="xMidYMid slice"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-label={"Ilustração de " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.a}/>
          <stop offset="100%" stopColor={p.b}/>
        </linearGradient>
      </defs>
      <rect width="320" height="170" fill={"url(#" + gid + ")"}/>
      {formas[variante % formas.length]}
    </svg>
  );
}

function Estrelas({ n, cor }) {
  const c = cor || "#f0a500";
  return (
    <span className="stars" aria-label={n + " de 5 estrelas"}>
      {[1,2,3,4,5].map(i => (
        <svg key={i} className="star" viewBox="0 0 24 24" fill={i <= n ? c : "#dfe3e8"}>
          <path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/>
        </svg>
      ))}
    </span>
  );
}

function Badge({ categoria }) {
  const cls = categoria === "Branding" ? "b-branding" : categoria === "Tecnologia" ? "b-tech" : "b-design";
  return <span className={"badge " + cls}>{categoria}</span>;
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", h);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", h); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <Art className="art" categoria={item.categoria} variante={item.variante}/>
        <div className="inner">
          <div className="meta">
            <Badge categoria={item.categoria}/>
            <Estrelas n={item.estrelas}/>
            <span className="dot"></span>
            <span>{item.source}</span>
            <span className="dot"></span>
            <span>{item.data}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="resumo">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          <div className="actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);

  const itens = NOTICIAS
    .map((n, i) => ({ ...n, variante: i }))
    .sort((a, b) => b.estrelas - a.estrelas);

  if (!itens.length) {
    return (
      <div className="wrap">
        <div className="note">Não foi possível carregar notícias hoje. Tente novamente mais tarde.</div>
      </div>
    );
  }

  const manchete = itens[0];
  const resto = itens.slice(1);
  const portais = Array.from(new Set(itens.map(i => i.source)));

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Quinta-feira, 13 de agosto de 2026</div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="sub">
          {itens.length} notícias de Branding, Design e Tecnologia selecionadas em {portais.length} portais internacionais.
          Clique em qualquer card para ler o resumo completo.
        </p>
      </header>

      <div className="divider"></div>

      <article className="hero" onClick={() => setAberta(manchete)}>
        <Art className="art" categoria={manchete.categoria} variante={manchete.variante}/>
        <div className="body">
          <div className="meta">
            <Badge categoria={manchete.categoria}/>
            <Estrelas n={manchete.estrelas}/>
            <span className="dot"></span>
            <span>{manchete.source}</span>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
          <div className="meta" style={{marginTop:"4px"}}>
            <span>{manchete.data}</span>
            <span className="dot"></span>
            <span style={{color:"var(--accent)"}}>Ler resumo →</span>
          </div>
        </div>
      </article>

      <div className="grid">
        {resto.map(item => (
          <article className="card" key={item.id} onClick={() => setAberta(item)}>
            <Art className="art" categoria={item.categoria} variante={item.variante}/>
            <div className="body">
              <div className="meta">
                <Badge categoria={item.categoria}/>
                <Estrelas n={item.estrelas}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="meta">
                <span>{item.source}</span>
                <span className="dot"></span>
                <span>{item.data}</span>
              </div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã · edição de 13/08/2026 · Fontes: {portais.join(" · ")}.
        Resumos escritos e parafraseados a partir das reportagens originais; os links levam à fonte.
        Ilustrações geradas em SVG — nenhuma imagem externa é carregada.
      </footer>

      {aberta && <Modal item={aberta} onClose={() => setAberta(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
