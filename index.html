<style>
  :root{

    --shadow-lg:0 2px 6px rgba(20,20,15,.06), 0 24px 60px rgba(20,20,15,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px 96px}
  header.top{padding:56px 0 32px;border-bottom:1px solid var(--line);margin-bottom:40px}

  .dot{width:4px;height:4px;border-radius:50%;background:var(--line)}
  .stars{color:var(--accent);letter-spacing:2px;font-size:13px}
  .pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#f0efea;color:var(--ink-soft)}

  .pill.design{background:#e3f2ee;color:#0f5f4e}
  .pill.tech{background:#e8e9fb;color:#3a3a8f}

  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .thumb{position:relative;width:100%;aspect-ratio:16/10;background:#eceae4;overflow:hidden}
  .thumb img,.thumb svg{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{margin:0;font-size:17px;line-height:1.32;font-weight:600;letter-spacing:-.01em}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
  .src{font-weight:600;color:var(--ink)}
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:26px;overflow:hidden;cursor:pointer;margin-bottom:44px;box-shadow:var(--shadow);transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease}

  .hero .thumb{aspect-ratio:auto;height:100%;min-height:340px}

  .section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;margin:0 0 20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .overlay{position:fixed;inset:0;background:rgba(20,20,15,.42);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .modal{background:var(--surface);border-radius:24px;max-width:760px;width:100%;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.2,.7,.3,1)}
  .modal .thumb{aspect-ratio:16/9}
  .modal-body{padding:32px 36px 40px}
  .modal-body h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.16;margin:14px 0 18px;letter-spacing:-.015em}

  .modal-body .lead p{margin:0 0 16px}
  .note{font-size:13px;color:var(--ink-soft);font-style:italic;border-left:2px solid var(--line);padding-left:12px;margin-top:20px}
  .actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer;transition:all .18s ease}

  .btn.ghost{border-color:var(--line);color:var(--ink-soft)}
  .btn.ghost:hover{background:#f0efea;color:var(--ink)}
  .close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  footer{margin-top:72px;padding-top:28px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;line-height:1.7}
  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero .thumb{min-height:240px;aspect-ratio:16/10}
    .hero-body{padding:28px}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px 64px}
    .grid{grid-template-columns:1fr}
    .modal-body{padding:24px 22px 32px}
    header.top{padding:36px 0 24px}
  }
</style>

const PALETAS = {
  "Branding": ["#f97316","#ea580c","#fbbf24","#fed7aa"],
  "Design": ["#0d9488","#14b8a6","#5eead4","#99f6e4"],
  "Tecnologia": ["#4f46e5","#7c3aed","#a5b4fc","#c4b5fd"]
};

function Ilustracao({categoria, seed}){
  const p = PALETAS[categoria] || PALETAS["Design"];
  const id = "g" + seed;
  const r = (n) => ((seed * 37 + n * 61) % 100);
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label={"Ilustração decorativa da categoria " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
        <linearGradient id={id+"b"} x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={p[2]}/>
          <stop offset="100%" stopColor={p[3]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#"+id+")"}/>
      <circle cx={60 + r(1)*2.4} cy={40 + r(2)} r={70 + r(3)*0.5} fill={"url(#"+id+"b)"} opacity="0.5"/>
      <circle cx={320 - r(4)} cy={200 - r(5)} r={50 + r(6)*0.4} fill="#ffffff" opacity="0.18"/>
      <rect x={40 + r(7)} y={120 + r(8)*0.4} width={120 + r(9)} height="14" rx="7" fill="#ffffff" opacity="0.42"/>
      <rect x={40 + r(7)} y={150 + r(8)*0.4} width={70 + r(2)} height="14" rx="7" fill="#ffffff" opacity="0.26"/>
      <path d={`M0 ${210 + r(3)*0.3} Q 100 ${160 + r(4)}, 200 ${205 + r(5)*0.4} T 400 ${190 + r(6)*0.3} L400 250 L0 250 Z`} fill="#ffffff" opacity="0.22"/>
    </svg>
  );
}

function Imagem({item, idx}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={idx+3}/>;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.alt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

function Estrelas({n}){
  return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}<span style={{opacity:.28}}>{"★".repeat(5-n)}</span></span>;
}

function classeCat(c){
  if(c === "Branding") return "pill branding";
  if(c === "Design") return "pill design";
  return "pill tech";
}

function Modal({item, idx, onClose}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="thumb" style={{position:"relative"}}>
          <Imagem item={item} idx={idx}/>
          <button className="close" onClick={onClose} aria-label="Fechar">✕</button>
        </div>
        <div className="modal-body">
          <div className="meta">
            <span className={classeCat(item.categoria)}>{item.categoria}</span>
            <span className="src">{item.source}</span>
            <span className="dot"></span>
            <span>{item.data}</span>
            <span className="dot"></span>
            <Estrelas n={item.rank}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="lead">
            {item.resumo.map((p,i) => <p key={i}>{p}</p>)}
          </div>
          {item.source === "Brand New" && (
            <div className="note">O conteúdo integral desta matéria está atrás de assinatura paga. O resumo acima foi produzido a partir dos elementos públicos da página.</div>
          )}
          <div className="actions">
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const manchete = NOTICIAS[0];
  const resto = NOTICIAS.slice(1);

  React.useEffect(() => {
    const h = (e) => { if(e.key === "Escape") setAberto(null); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição diária · Branding, Design e Tecnologia</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="datebar">
          <span>Quinta-feira, 10 de setembro de 2026</span>
          <span className="dot"></span>
          <span>{NOTICIAS.length} notícias</span>
          <span className="dot"></span>
          <span>7 portais</span>
        </div>
      </header>

      <div className="hero" onClick={() => setAberto(0)}>
        <div className="thumb"><Imagem item={manchete} idx={0}/></div>
        <div className="hero-body">
          <div className="meta">
            <span className={classeCat(manchete.categoria)}>{manchete.categoria}</span>
            <span className="src">{manchete.source}</span>
            <span className="dot"></span>
            <Estrelas n={manchete.rank}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0,190)}…</p>
          <div><span className="btn" style={{marginTop:6}}>Ler resumo</span></div>
        </div>
      </div>

      <p className="section-title">Mais da edição</p>
      <div className="grid">
        {resto.map((item, i) => (
          <div className="card" key={i} onClick={() => setAberto(i+1)}>
            <div className="thumb"><Imagem item={item} idx={i+1}/></div>
            <div className="card-body">
              <div className="meta">
                <span className={classeCat(item.categoria)}>{item.categoria}</span>
                <Estrelas n={item.rank}/>
              </div>
              <h3>{item.tituloPt}</h3>
              <div className="meta" style={{marginTop:"auto"}}>
                <span className="src">{item.source}</span>
                <span className="dot"></span>
                <span>{item.data}</span>
              </div>
            </div>
          </div>
        ))}
      </div>

      <footer>
        Portal da Manhã — edição de 10 de setembro de 2026. Fontes: Dezeen, Design Week, Creative Review, Brand New, The Brand Identity, It's Nice That e TechCrunch.<br/>
        Os resumos em português são paráfrases produzidas para esta edição; os textos e imagens originais pertencem aos respectivos portais. Clique em qualquer notícia para ler o resumo e acessar a fonte.
      </footer>

      {aberto !== null && <Modal item={NOTICIAS[aberto]} idx={aberto} onClose={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
