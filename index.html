.media{position:relative;background:#eceef5;overflow:hidden}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:rgba(20,22,31,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 16px;z-index:10;animation:fade .2s}

.modal p{font-size:16px;color:#2a2e3c}

.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;border:0;cursor:pointer}

    <div className="media">
      {item.imageUrl && !falhou ? (
        <img src={item.imageUrl} alt={alt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
      ) : (
        <Ilustracao cat={item.cat} id={item.id} />
      )}
    </div>
  );
}

const Estrelas = ({ n }) => <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;

function Meta({ item }) {
  return (
    <div className="row">
      <span className={"tag " + item.cat}>{item.cat}</span>
      <Estrelas n={item.stars} />
      <span className="src">{item.source}</span>
    </div>
  );
}

function Detalhe({ item, onClose }) {
  useEffect(() => {
    const f = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", f);
    return () => window.removeEventListener("keydown", f);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <Midia item={item} alt={"Imagem da matéria: " + item.tituloPt} />
        <div className="inner">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          {item.paywall && <p className="note">Matéria atrás de paywall: o resumo foi escrito a partir de elementos públicos (título, categoria, tags e imagem de destaque).</p>}
          <div className="row" style={{ marginTop: 18 }}>
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [manchete, ...resto] = ITEMS;
  return (
    <div className="wrap">
      <header>
        <div>
          <h1>Portal da Manhã</h1>
          <div className="src">Branding, design e tecnologia — {ITEMS.length} notícias selecionadas</div>
        </div>
        <div className="date">quinta-feira, 15 de outubro de 2026</div>
      </header>

      <div className="hero" onClick={() => setAberto(manchete)}>
        <Midia item={manchete} alt={manchete.tituloPt} />
        <div className="body">
          <Meta item={manchete} />
          <h2>{manchete.tituloPt}</h2>
          <div className="src">{manchete.resumo[0].slice(0, 190)}…</div>
          <div><span className="btn">Abrir resumo</span></div>
        </div>
      </div>

      <div className="grid">
        {resto.map((it) => (
          <article className="card" key={it.id} onClick={() => setAberto(it)}>
            <Midia item={it} alt={it.tituloPt} />
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
            </div>
          </article>
        ))}
      </div>

      <footer>Resumos parafraseados em português; clique em um card para ler sem sair da página. Imagens carregadas diretamente dos portais.</footer>
      {aberto && <Detalhe item={aberto} onClose={() => setAberto(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
