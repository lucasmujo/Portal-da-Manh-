<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 8 de setembro de 2026</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#14161a; --muted:#6b7280;
    --line:#e7e7e3; --accent:#e0522f; --accent-soft:#fdf1ec;
    --shadow:0 1px 2px rgba(16,18,22,.04), 0 8px 24px rgba(16,18,22,.06);
    --shadow-lg:0 2px 6px rgba(16,18,22,.06), 0 20px 50px rgba(16,18,22,.12);
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header.site{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:32px}
  .brandline{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1.logo{font-size:clamp(30px,5vw,46px);letter-spacing:-.03em;margin:0;font-weight:800}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;margin-bottom:6px}
  .datechip{font-size:13px;color:var(--muted);border:1px solid var(--line);background:#fff;padding:5px 12px;border-radius:999px}
  .subtitle{color:var(--muted);margin:12px 0 0;font-size:15px;max-width:60ch}
  .sectitle{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 16px;font-weight:600}

  /* headline */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow); cursor:pointer; transition:transform .25s ease, box-shadow .25s ease;
    display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:34px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero .media{position:relative;min-height:320px;background:#eee}
  .hero .media img,.hero .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero .body{padding:32px}
  .hero h2{font-size:clamp(22px,2.6vw,32px);line-height:1.2;letter-spacing:-.02em;margin:12px 0 12px;font-weight:750}
  .hero p{color:var(--muted);margin:0 0 18px;font-size:15px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card .media{height:172px;background:#eee;position:relative}
  .card .media img,.card .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-size:16.5px;line-height:1.32;margin:0;letter-spacing:-.01em;font-weight:700}
  .card .excerpt{font-size:13.5px;color:var(--muted);margin:0}

  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
       background:var(--accent-soft);padding:4px 9px;border-radius:7px}
  .cat{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:4px 9px;border-radius:7px}
  .stars{font-size:12.5px;color:#d9a441;letter-spacing:1px;margin-left:auto}

  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(16,18,22,.5);backdrop-filter:blur(6px);
      display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:50;
      animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .sheet{background:#fff;border-radius:22px;max-width:820px;width:100%;overflow:hidden;
         box-shadow:0 30px 80px rgba(0,0,0,.3);animation:rise .28s cubic-bezier(.2,.8,.2,1);
         max-height:calc(100vh - 72px);overflow-y:auto}
  .sheet .media{height:300px;background:#eee}
  .sheet .media img,.sheet .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .sheet .body{padding:30px 34px 36px}
  .sheet h2{font-size:clamp(21px,2.4vw,28px);line-height:1.25;letter-spacing:-.02em;margin:14px 0 6px}
  .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 18px}
  .sheet .text p{font-size:15.5px;line-height:1.72;margin:0 0 15px}
  .note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:16px}
  .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{display:inline-block;padding:11px 18px;border-radius:11px;font-size:14px;font-weight:600;
       text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .close{position:sticky;top:0;float:right;margin:14px 14px 0 0;background:rgba(255,255,255,.92);
         border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer;z-index:2}
  footer{margin:56px 0 40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero .media{min-height:220px}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}.hero .body,.sheet .body{padding:22px}}
</style>
</head>

    categoria: "Branding",

    resumo: [
      "O Manchester City Women passa a ter marca própria — algo inédito na Women's Super League, a primeira divisão do futebol feminino britânico. A identidade continua conversando com a marca-mãe do clube (o escudo segue central em tudo), mas ganha território visual autônomo. O trabalho é do estúdio Nomad, especializado em futebol, que já assinou os universos visuais da própria FA WSL, da Premier League, do time de base feminino Hackney Laces e do jogo Football Manager.",
      "A decisão nasceu de pesquisa interna, não de instinto. O clube mapeou sua base e encontrou três grupos: torcedores 'do masculino primeiro', torcedores 'do feminino primeiro' e uma faixa menor de interessados nos dois igualmente. O perfil do segundo grupo divergia bastante do primeiro — predominantemente mulheres, mais jovens, famílias e com forte presença da comunidade LGBTQ+. Sally Sheppard, diretora de marketing, receita de estádio e experiência do torcedor, diz que a temporada 2025/26, com a dobradinha de liga e FA Cup, foi o que tornou a necessidade inegável: faltava uma forma consistente de contar a história do time.",
      "No centro do sistema está um monograma que amarra as letras M, C e W num traço contínuo, aplicado em azul-celeste, tons neon e acabamentos cromados. Internamente ele é chamado de 'rastro de luz' — a ideia é que a marca seja literalmente feita de luz, abrindo caminho. Natalie Doto, diretora criativa da Nomad, resume a lógica por trás: desde que o estúdio redesenhou a FA WSL em 2017, o futebol feminino deixou de perguntar como espelhar o masculino e passou a definir o que o torna diferente. O símbolo foi desenhado para ser reproduzível por qualquer pessoa — um sinal ao qual se aderir.",

      "Na Área Ecológica de Chanba, em Xi'an, com vista para o rio Ba e para o Centro Esportivo Olímpico, abriu um complexo cultural de 70 mil metros quadrados: a Biblioteca Pública Chang'an Academy. O projeto é assinado pelos escritórios chineses Hong Designworks e China Northwest Architectural Design and Research Institute, e reúne espaços de leitura, exposição e educação sob uma cobertura branca curva inspirada nas páginas de um livro aberto — forma que também acena para os beirais empinados da arquitetura tradicional chinesa.",

    resumo: [
      "A Boots, rede de farmácias britânica, lançou a Modern Chemistry — linha de cuidados com a pele e suplementos formulada por um time interno de farmacêuticos, médicos, nutricionistas, bioquímicos e químicos cosméticos. O estúdio londrino SOCIO ficou com estratégia de marca, identidade, sistema de embalagem e direção de arte. O diretor criativo Brendan Smith conta que a Boots chegou com o nome já definido e um pedido claro: uma marca própria de inspiração histórica, focada em fórmulas de alta performance a preço acessível.",
      "O nome vem da origem da própria empresa. A Boots começou em 1849, quando John Boot abriu uma loja de ervas medicinais em Nottingham; em 1895 já era pioneira no uso de química analítica como método de controle de qualidade. A SOCIO fez viagens ao arquivo da companhia em Nottingham, consultou o historiador da empresa e o time de marca própria, e garimpou formatos de frasco, formas gráficas de anúncios antigos, periódicos e instrumentos de laboratório.",

const PALETAS = {
  "Branding":   ["#F5A623","#E0522F","#C43D2E"],
  "Design":     ["#2FB89A","#1F8F80","#0F5F5C"],
  "Tecnologia": ["#6C7CE0","#8B5CF6","#4338CA"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS["Design"];
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="55%" stopColor={p[1]} />
          <stop offset="100%" stopColor={p[2]} />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`} />
      <circle cx={60 + r(1) * 260} cy={40 + r(2) * 160} r={40 + r(3) * 55} fill="#fff" opacity="0.16" />
      <circle cx={40 + r(4) * 300} cy={30 + r(5) * 190} r={22 + r(6) * 40} fill="#fff" opacity="0.12" />
      <rect x={20 + r(7) * 240} y={30 + r(8) * 150} width={60 + r(9) * 110} height={12 + r(10) * 30}
            rx="8" fill="#fff" opacity="0.2" transform={`rotate(${-25 + r(11) * 50} 200 130)`} />
      <path d={`M0 ${170 + r(12) * 50} Q 110 ${110 + r(13) * 80} 210 ${165 + r(14) * 45} T 400 ${150 + r(15) * 60} V260 H0 Z`}
            fill="#fff" opacity="0.14" />
    </svg>
  );
}

function Media({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={seed} />;
  return (
    <img src={item.imageUrl}
         alt={item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)} />
  );
}

const Estrelas = ({ n }) => <span className="stars">{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;

function Card({ item, idx, onOpen }) {
  return (
    <article className="card" onClick={() => onOpen(idx)}>
      <div className="media"><Media item={item} seed={idx + 3} /></div>
      <div className="body">
        <div className="meta">
          <span className="src">{item.source}</span>
          <span className="cat">{item.categoria}</span>
          <Estrelas n={item.estrelas} />
        </div>
        <h3>{item.tituloPt}</h3>
        <p className="excerpt">{item.resumo[0].slice(0, 130)}…</p>
      </div>
    </article>
  );
}

function Sheet({ item, idx, onClose }) {
  return (
    <div className="ov" onClick={onClose}>
      <div className="sheet" onClick={(e) => e.stopPropagation()}>
        <div className="media"><Media item={item} seed={idx + 3} /></div>
        <div className="body">
          <div className="meta">
            <span className="src">{item.source}</span>
            <span className="cat">{item.categoria}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: {item.title}</p>
          <div className="text">{item.resumo.map((p, i) => <p key={i}>{p}</p>)}</div>
          {item.paywall && (
            <p className="note">Este artigo está atrás de assinatura no portal de origem. O resumo acima foi
            escrito a partir dos elementos públicos da página (título, categoria, indústria, tags e imagem).</p>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [manchete, ...resto] = NOTICIAS;

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") setAberto(null); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  return (
    <div className="wrap">
      <header className="site">
        <div className="brandline">
          <h1 className="logo">Portal da Manhã <span className="dot"></span></h1>
          <span className="datechip">terça-feira, 8 de setembro de 2026</span>
        </div>
        <p className="subtitle">
          Branding, design e tecnologia das últimas 24 horas, garimpados nos portais internacionais
          e resumidos em português.
        </p>
      </header>

      <p className="sectitle">Manchete do dia</p>
      <article className="hero" onClick={() => setAberto(0)}>
        <div className="media"><Media item={manchete} seed={3} /></div>
        <div className="body">
          <div className="meta">
            <span className="src">{manchete.source}</span>
            <span className="cat">{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0, 240)}…</p>
          <span className="btn primary">Ler o resumo completo</span>
        </div>
      </article>

      <p className="sectitle">Mais notícias de hoje</p>
      <div className="grid">
        {resto.map((n, i) => <Card key={n.url} item={n} idx={i + 1} onOpen={setAberto} />)}
      </div>

      <footer>
        Edição de 8 de setembro de 2026 · {NOTICIAS.length} notícias de{" "}
        {new Set(NOTICIAS.map(n => n.source)).size} portais distintos · Resumos em português produzidos
        a partir das matérias originais; os textos integrais permanecem com seus veículos.
      </footer>

      {aberto !== null && (
        <Sheet item={NOTICIAS[aberto]} idx={aberto} onClose={() => setAberto(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
