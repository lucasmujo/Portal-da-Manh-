body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;line-height:1.5}

.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:up .3s}

.modal .in{padding:26px 30px 32px}

.btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
.orig{color:var(--mut);font-size:13px;margin:0}

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;

    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de " + categoria}>
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[3]}/></linearGradient></defs>
      <rect width="400" height="240" fill={"url(#" + id + ")"}/>
      <circle cx={80 + r(2) * 240} cy={60 + r(4) * 100} r={50 + r(6) * 60} fill={p[2]} opacity=".5"/>
      <rect x={20 + r(8) * 200} y={90 + r(10) * 80} width={110 + r(12) * 80} height={110 + r(14) * 60} rx="24" fill={p[1]} opacity=".55" transform={"rotate(" + Math.round(r(16) * 40 - 20) + " 200 120)"}/>
      <polygon points={`${250 + r(18) * 80},20 ${330 + r(20) * 60},150 ${210 + r(22) * 60},140`} fill="#fff" opacity=".28"/>
    </svg>
  );
}

function Imagem({ item }) {
  const [falhou, setFalhou] = useState(false);
  return (
    <div className="thumb" style={{ height: "100%" }}>
      {item.imageUrl && !falhou
        ? <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
        : <Ilustracao categoria={item.categoria} seed={item.title} />}
    </div>
  );
}

function Estrelas({ n }) { return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>; }

function Meta({ item }) {
  return (
    <div className="meta">
      <span className={"tag t-" + item.categoria}>{item.categoria}</span>
      <Estrelas n={item.rank} />
      <span>{item.source}</span>
    </div>
  );
}

function Detalhe({ item, onClose }) {
  useEffect(() => {
    const f = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", f);
    return () => window.removeEventListener("keydown", f);
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <Imagem item={item} />
        <div className="in">
          <button className="close" onClick={onClose} aria-label="Fechar">✕</button>
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: {item.title}</p>
          {item.resumo.map((t, i) => <p key={i}>{t}</p>)}
          {item.aviso && <span className="aviso">{item.aviso}</span>}
          <div><a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a></div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);
  const [manchete, ...resto] = NOTICIAS;
  return (
    <div className="wrap">
      <header>
        <div>
          <h1>☀️ Portal da Manhã</h1>
          <div className="date">Quarta-feira, 4 de novembro de 2026 · {NOTICIAS.length} notícias de branding, design e tecnologia</div>
        </div>
      </header>
      <article className="hero" onClick={() => setAberta(manchete)}>
        <Imagem item={manchete} />
        <div className="body">
          <Meta item={manchete} />
          <h2>{manchete.tituloPt}</h2>
          <p style={{ margin: 0, color: "#44474d" }}>{manchete.resumo[0].slice(0, 190)}…</p>
          <span style={{ fontWeight: 600 }}>Abrir resumo →</span>
        </div>
      </article>
      <section className="grid">
        {resto.map((n) => (
          <article className="card" key={n.url} onClick={() => setAberta(n)}>
            <Imagem item={n} />
            <div className="body">
              <Meta item={n} />
              <h3>{n.tituloPt}</h3>
              {n.aviso && <span className="aviso">Resumo parcial (paywall)</span>}
            </div>
          </article>
        ))}
      </section>
      <footer>Resumos escritos em português a partir das matérias originais. Clique em uma notícia para abrir.</footer>
      {aberta && <Detalhe item={aberta} onClose={() => setAberta(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
