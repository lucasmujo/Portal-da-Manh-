<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 21 de agosto de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#15161a;
    --ink-soft:#5b6069;
    --line:#e7e6e2;
    --accent:#c8452f;
    --radius:20px;
    --shadow:0 1px 2px rgba(16,17,20,.04), 0 8px 28px rgba(16,17,20,.06);
    --shadow-lg:0 2px 6px rgba(16,17,20,.06), 0 22px 60px rgba(16,17,20,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px 90px}
  header.top{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1.brand{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(38px,6vw,66px);line-height:1.02;margin:14px 0 10px;letter-spacing:-.01em}
  .sub{color:var(--ink-soft);font-size:15px;max-width:640px;line-height:1.6;margin:0}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .pill{font-size:12px;font-weight:500;color:var(--ink-soft);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px}

  .lead{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s;
    margin-bottom:38px;
  }
  .lead:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .lead .media{position:relative;min-height:340px;background:#eceae5;overflow:hidden}
  .lead .media img,.lead .media svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  .lead:hover .media img{transform:scale(1.035)}
  .lead .body{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center}
  .lead h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(26px,3.1vw,38px);line-height:1.14;margin:14px 0 14px;letter-spacing:-.005em}
  .lead p.dek{color:var(--ink-soft);font-size:15px;line-height:1.65;margin:0 0 20px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card .media{height:184px;background:#eceae5;overflow:hidden;position:relative}
  .card .media img,.card .media svg{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  .card:hover .media img{transform:scale(1.05)}
  .card .body{padding:18px 19px 20px;display:flex;flex-direction:column;flex:1}
  .card h3{font-size:16.5px;font-weight:650;line-height:1.32;margin:11px 0 9px;letter-spacing:-.008em}
  .card p.dek{color:var(--ink-soft);font-size:13.5px;line-height:1.58;margin:0 0 16px;flex:1}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
  .cat{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px}
  .cat.branding{background:#fdf0e9;color:#b5551f}
  .cat.design{background:#e8f4ef;color:#1f7357}
  .cat.tech{background:#eceaf9;color:#4b45a8}
  .stars{margin-left:auto;font-size:12px;letter-spacing:1px;color:#d8a13a;white-space:nowrap}
  .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:13px;margin-top:auto}
  .readmore{font-size:12.5px;font-weight:600;color:var(--accent)}

  /* overlay */
  .ov{position:fixed;inset:0;background:rgba(20,21,24,.5);backdrop-filter:blur(6px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:38px 20px;overflow-y:auto;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{background:var(--card);border-radius:24px;max-width:800px;width:100%;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.3);animation:rise .35s cubic-bezier(.2,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
  .modal .media{height:330px;background:#eceae5;overflow:hidden}
  .modal .media img,.modal .media svg{width:100%;height:100%;object-fit:cover;display:block}
  .modal .inner{padding:30px 34px 36px}
  .modal h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.16;margin:14px 0 8px}
  .modal .orig{font-size:13px;color:var(--ink-soft);font-style:italic;margin:0 0 20px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .modal .txt p{font-size:15.5px;line-height:1.78;color:#2c2f36;margin:0 0 16px}
  .note{font-size:12.5px;color:var(--ink-soft);background:#f4f3f0;border-left:3px solid var(--line);padding:11px 14px;border-radius:0 10px 10px 0;line-height:1.55;margin-top:6px}
  .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;border:none;cursor:pointer;font-family:inherit;transition:.2s}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.primary:hover{background:#000}
  .btn.ghost{background:#f2f1ee;color:var(--ink)}
  .btn.ghost:hover{background:#e9e8e4}

  footer.bot{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;line-height:1.7}

  @media(max-width:900px){
    .lead{grid-template-columns:1fr}
    .lead .media{min-height:230px}
    .lead .body{padding:26px 24px 28px}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .modal .media{height:220px}
    .modal .inner{padding:24px 22px 30px}
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState} = React;

const NOTICIAS = [
  {
    id: 1,
    title: "Studio Barnes and Ch_studio to convert former KKK building in Texas into arts centre",
    tituloPt: "Um prédio da Ku Klux Klan em Fort Worth vai virar centro de artes — e a equipe diz que demolir seria a saída fácil",
    source: "Dezeen",
    url: "https://www.dezeen.com/2026/08/20/studio-barnes-ch-studio-convert-kkk-building-arts-centre-fort-worth/",

    categoria: "Design",

    resumo: [
      "Um edifício de 1920, de 3.251 m², que serviu de base para a Ku Klux Klan em Fort Worth até 1927 vai se transformar no Transform 1012 Center for Arts and Community Healing. O projeto é assinado pelo Studio Barnes, do arquiteto Germane Barnes, em parceria com o Ch_studio e o escritório GFF, com paisagismo do JIMA Studio.",
      "A decisão de projeto mais delicada foi não apagar o passado. Em comunicado conjunto, a equipe afirmou que o desafio central era descobrir como transformar uma estrutura definida pela violência racial em um catalisador de comunidade e restauração — e que, embora a história sombria do lugar oferecesse argumento forte para a demolição, a abordagem escolhida foi confrontar em vez de apagar. Parte da fachada original em tijolo será preservada e combinada com aço patinável, painéis de concreto estriado e telas de metal perfurado.",
      "O programa ocupa três pavimentos e inclui teatro, oficinas de fabricação, salas de aula, espaços de dança, bar, café e um anfiteatro externo, dedicados a coletivos culturais locais. A lógica espacial inverte a do edifício original, que fora desenhado para intimidar e dividir: agora o terreno é aberto por novas linhas de visão, praças, passagens e caminhos curvos que atravessam todo o lote.",
      "Uma galeria no segundo andar será dedicada à história das relações raciais no norte do Texas e à memória de Fred Rouse, açougueiro negro linchado em Fort Worth em 1921. A programação prioriza grupos historicamente atingidos pela violência e pela exclusão promovidas pela KKK: comunidades negras, católicas, hispânicas, imigrantes, judaicas e LGBTQ+. O paisagismo se apoia em tradições das diásporas africana e mexicana e em referências indígenas.",
      "A frente construtiva também tem contas a prestar: a equipe já desviou mais de 195 toneladas de material de aterros, entre concreto e madeira. O prédio foi comprado em 2021 pela coalizão Transform 1012 N Main Street, que reúne o SOL Ballet Folklórico, o The Welman Project e a ativista Dr. Opal Lee. A obra deve começar no verão de 2027, com inauguração prevista para o inverno de 2028."

  },
  {

    tituloPt: "Um 'M' que também é vela, bússola e onda: a identidade flexível que a Haley Sharpe criou para a reforma de £20,4 milhões do museu marítimo de Hull",
    source: "Design Week",
    url: "https://www.designweek.co.uk/how-haley-sharpe-design-crafted-the-branding-and-visitor-experience-for-hull-maritime-museums-20-4m-revamp/",
    imageUrl: "https://www.designweek.co.uk/content/uploads/2026/08/002_Detail_of_spiral_staircase_Hull_Maritime_Museum_%C2%A9HuftonCrow-1024x852.jpg",
    categoria: "Branding",
    estrelas: 5,
    dek: "A consultoria de Leicester assinou identidade, sinalização e desenho expositivo do museu de Hull, reaberto depois de uma reforma de £20,4 milhões dentro de um programa de regeneração de £70 milhões.",
    resumo: [
      "O Hull Maritime Museum reabriu após uma reforma de £20,4 milhões — pouco mais da metade bancada pela prefeitura de Hull, £7,7 milhões vindos do National Lottery Heritage Fund e quase £1 milhão de doações privadas. A Haley Sharpe Design, sediada em Leicester, foi responsável pela marca e pela experiência do visitante.",
      "A identidade não é uma peça isolada: faz parte de um conjunto de marcas criado para o Hull Maritime, programa de regeneração de £70 milhões que tenta reconectar a cidade de Yorkshire à sua herança marítima quase uma década depois de Hull ter sido Cidade da Cultura do Reino Unido. O trabalho partiu de um estudo de viabilidade da agência CreativeRace, transformado em estratégia pela Haley Sharpe.",
      "O símbolo estiliza formas marítimas — bandeiras, velas — e chega a um triângulo que é, ao mesmo tempo, uma versão do 'M' de Maritime. Esse triângulo virou a peça central da linguagem visual, aplicado em um kit modular e em variações cromáticas para os outros equipamentos do programa, como o estaleiro North End Shipyard e o arrastão dos anos 1960 Arctic Corsair. O logotipo usa a fonte Conduit, escolhida por ser sólida, legível e com efeito de carimbo; o texto corrido é em Helvetica, para que o cliente consiga produzir peças internamente.",
      "O museu ocupa o antigo Dock Offices, prédio tombado grau II inaugurado em 1871 e reformado pelo Purcell Architecture. A área pública dobrou de tamanho, o que permitiu colocar 50% mais objetos em exposição para contar 800 anos de história marítima da cidade. A paleta é historicamente fiel: azuis marinhos contra tetos brancos.",
      "Na curadoria, a virada foi tirar o foco das vitrines e devolver as pessoas ao centro. Segundo Deevyash Vadher, diretor da Haley Sharpe, humanizar a narrativa virou a base da abordagem interpretativa — caso das Headscarf Revolutionaries, mulheres que nos anos 1960 fizeram campanha por condições de trabalho mais seguras para os pescadores. A expografia combina vitrines novas com projeções em paredes e pisos e paisagens sonoras; sobre um esqueleto de 12 metros de baleia-franca-do-atlântico-norte, uma animação de teto projeta baleias em tamanho real, veleiros e navios a vapor."
    ]
  },
  {

    url: "https://www.dezeen.com/2026/08/21/ciel-dubai-marina-worlds-tallest-hotel/",
    imageUrl: "https://static.dezeen.com/uploads/2026/08/ciel-dubai-marina-worlds-tallest-hotel_dezeen_2364_hero_1.jpg",
    categoria: "Design",
    estrelas: 4,
    dek: "O fotógrafo Ahmad Alnaji registrou o Ciel Dubai Marina, arranha-céu do escritório NORR concluído como o mais alto edifício exclusivamente hoteleiro do planeta.",
    resumo: [
      "O Ciel Dubai Marina abriu em novembro do ano passado e chega a 377 metros, superando o Gevora Hotel — também em Dubai, com 356 metros — como o edifício mais alto do mundo dedicado exclusivamente a hotel. O projeto é do escritório NORR, fundado em 1938 e com escritórios no Canadá, nos EUA e no Reino Unido.",
      "As fotos são de Ahmad Alnaji, fundador do estúdio Sarab, contratado por Yahya Jan, líder do projeto na NORR, para registrar a torre como o arquiteto pretendia que ela fosse vista. Alnaji contou ao Dezeen que Jan pediu imagens artísticas que não enganassem o observador sobre o desenho e os elementos reais do edifício — fotos feitas para contar a história de um ícone arquitetônico.",

      "O gesto mais visível é a abertura que atravessa a parte superior da torre — comparada ao buraco de uma agulha — e que abriga uma piscina de borda infinita no 76º andar, voltada para a Dubai Marina. Acima dela há um deque de observação de acesso público; abaixo, um átrio de 300 metros dividido em terraços forma a espinha do edifício.",
      "Segundo Alnaji, a arquitetura interna se organiza em torno desse átrio de 300 metros escavado no núcleo da torre, com jardins suspensos empilhados verticalmente e terraços de ventilação natural distribuídos ao longo da altura — a resposta de Jan à moradia vertical: vazios comunitários iluminados que trazem vegetação e espaço compartilhado para dentro de um hotel supertall, em vez de apenas empilhar quartos."

  },
  {

    resumo: [
      "O Brand New registrou nesta quinta-feira, 20 de agosto, a nova marca do Østfold Teater, teatro público da região de Østfold, no sudeste da Noruega. O projeto é do estúdio Page Black e entrou na categoria editorial 'Noted' — o segundo nível de atenção da publicação, abaixo dos 'Reviewed' e acima dos 'Spotted'.",
      "O título dado por Armin Vit ao post, 'Guiding Light' (luz-guia), aponta a ideia central do trabalho. As tags atribuídas pela publicação confirmam o repertório visual: ângulo (angle), feixe (beam), teatro e Noruega. A leitura mais direta é a de um logotipo construído a partir de um feixe de luz cênica projetado em diagonal — o gesto elementar que separa o palco do escuro.",
      "A publicação classifica o caso como um antes-e-depois completo, com aplicações de amostra, e o arquiva sob a indústria 'Culture'. Até o fechamento desta edição, o post não tinha comentários.",

    categoria: "Branding",

    dek: "O escritório nova-iorquino estreia em embalagem de destilados com a Bowmore Captivo Collection, traduzindo a topografia de Islay e a escuridão dos No. 1 Vaults em gráficos de camadas.",
    resumo: [
      "A Bowmore Captivo Collection marca a primeira incursão do escritório nova-iorquino Snarkitecture em embalagem de uísque. A colaboração leva o repertório do estúdio — experiência espacial e travessia de limiares, normalmente exercido em instalações arquitetônicas imersivas e monocromáticas — para a segunda destilaria licenciada mais antiga da Escócia.",
      "O conceito nasceu de uma viagem do cofundador Alex Mustonen de Nova York até Islay. Ele partiu de duas fontes: a topografia natural da ilha e o interior escuro dos No. 1 Vaults, o armazém de maturação da Bowmore. A arte traduz essas influências em gráficos em camadas, com aspecto de portal, gravados nas garrafas e nas caixas de apresentação.",
      "Mustonen contou que entrar no mundo do uísque é inédito para a Snarkitecture e disse ter encontrado semelhanças entre o modo como o uísque da Bowmore é feito e a forma como ele aborda um ambiente arquitetônico: na arquitetura, espaços e objetos convidam as pessoas a olhar de novo e a questionar suas suposições; ele descobriu que a produção de uísque compartilha filosofia parecida, recompensando tempo, paciência e curiosidade.",

    url: "https://www.dezeen.com/2026/08/21/zha-baku-expo-city-masterplan/",

    dek: "O escritório antes conhecido como Zaha Hadid Architects revelou o plano diretor de 198 hectares para a Baku Expo City, no Azerbaijão, com bairros de casas sobrepostas e telhados verdes.",
    resumo: [
      "A ZHA apresentou o masterplan da Baku Expo City, no Azerbaijão: 198 hectares onde casas empilhadas e sobrepostas, com telhados verdes, vão margear uma ampliação do centro de exposições da cidade.",

const PALETAS = {
  "Branding": [["#f7c59f","#e07a5f"],["#ffd9b3","#d1603d"]],
  "Design": [["#a8e0cd","#2f8f74"],["#bfe6d8","#1f7357"]],
  "Tecnologia": [["#c3c0f0","#5b52c9"],["#d0cdf5","#4b45a8"]]
};

function Ilustra({categoria, seed}){
  const par = PALETAS[categoria] || PALETAS["Design"];
  const [c1,c2] = par[seed % par.length];
  const gid = "g"+categoria.replace(/[^a-z]/gi,"")+seed;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c1}/>
          <stop offset="100%" stopColor={c2}/>
        </linearGradient>
      </defs>
      <rect width="400" height="240" fill={`url(#${gid})`}/>
      <circle cx={70+(seed*37)%210} cy={70+(seed*23)%90} r={54+(seed*11)%26} fill="#fff" opacity=".17"/>
      <rect x={200+(seed*19)%110} y={110+(seed*13)%50} width="120" height="120" rx="24" fill="#fff" opacity=".12" transform={`rotate(${(seed*17)%40-20} 260 170)`}/>
      <path d={`M0 ${190+(seed*7)%30} Q 100 ${140+(seed*9)%40} 200 ${185+(seed*5)%25} T 400 ${170+(seed*3)%40} L400 240 L0 240 Z`} fill="#fff" opacity=".14"/>
      <circle cx={330-(seed*13)%80} cy={60+(seed*7)%40} r={16+(seed*3)%12} fill="#fff" opacity=".22"/>
    </svg>
  );
}

function Figura({item, className}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <div className={className}><Ilustra categoria={item.categoria} seed={item.id}/></div>;
  }
  return (
    <div className={className}>
      <img src={item.imageUrl} alt={item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)}/>
    </div>
  );
}

const Estrelas = ({n}) => <span className="stars">{"★".repeat(n)}<span style={{color:"#e2e0da"}}>{"★".repeat(5-n)}</span></span>;

const classeCat = c => c === "Branding" ? "branding" : c === "Tecnologia" ? "tech" : "design";

function Modal({item, fechar}){
  return (
    <div className="ov" onClick={fechar}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <Figura item={item} className="media"/>
        <div className="inner">
          <div className="row">
            <span className="src">{item.source}</span>
            <span className={"cat "+classeCat(item.categoria)}>{item.categoria}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="txt">
            {item.resumo.map((p,i) => <p key={i}>{p}</p>)}
          </div>
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noreferrer noopener">Ler no {item.source} →</a>
            <button className="btn ghost" onClick={fechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS];
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);
  const portais = [...new Set(NOTICIAS.map(n => n.source))];
  const comFoto = NOTICIAS.filter(n => n.imageUrl).length;

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker"><span className="dot"></span> Edição de sexta-feira, 21 de agosto de 2026</div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="sub">Uma seleção diária do que saiu de mais relevante em branding, design e tecnologia nos principais portais internacionais — resumido em português.</p>
        <div className="meta-row">
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais.length} portais</span>
          <span className="pill">{comFoto} com imagem original</span>
          <span className="pill">Últimas 24–36h</span>
        </div>
      </header>

      <div className="lead" onClick={() => setAberto(manchete)}>
        <Figura item={manchete} className="media"/>
        <div className="body">
          <div className="row">
            <span className="src">{manchete.source}</span>
            <span className={"cat "+classeCat(manchete.categoria)}>{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p className="dek">{manchete.dek}</p>
          <span className="readmore">Abrir resumo completo →</span>
        </div>
      </div>

      <div className="grid">
        {resto.map(item => (
          <div className="card" key={item.id} onClick={() => setAberto(item)}>
            <Figura item={item} className="media"/>
            <div className="body">
              <div className="row">
                <span className="src">{item.source}</span>
                <span className={"cat "+classeCat(item.categoria)}>{item.categoria}</span>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="foot">
                <Estrelas n={item.estrelas}/>
                <span className="readmore">Ler →</span>
              </div>
            </div>
          </div>
        ))}
      </div>

      <footer className="bot">
        <p><strong>Portal da Manhã</strong> — edição de 21 de agosto de 2026. Fontes desta edição: Dezeen, Design Week, Brand New, Creative Review, It’s Nice That e TechCrunch.</p>
        <p>Os resumos são redações próprias em português a partir da leitura das matérias originais; nenhum texto foi copiado. Todos os créditos e as imagens pertencem aos veículos de origem. Clique em qualquer notícia para ler o resumo e seguir para a fonte.</p>
      </footer>

      {aberto && <Modal item={aberto} fechar={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
