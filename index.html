<style>
  :root{
    --bg:#f6f6f4;
    --surface:#ffffff;
    --ink:#141414;
    --ink-2:#4a4a4a;
    --ink-3:#8a8a8a;
    --line:#e6e5e1;
    --accent:#c8452e;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  #root{max-width:1180px;margin:0 auto;padding:32px 20px 80px;}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:34px;}
  .brand{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-0.03em;margin:0;}
  .brand em{font-style:normal;color:var(--accent);}
  .dateline{font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.12em;font-weight:600;}
  .kicker{font-size:14px;color:var(--ink-2);margin-top:6px;}

  .stars{color:var(--accent);letter-spacing:2px;font-size:12px;}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .source{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);
    background:#efeeea;border-radius:999px;padding:4px 10px;}
  .cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#fff;
    border-radius:999px;padding:4px 10px;}
  .cat.branding{background:#c8452e;}
  .cat.design{background:#1f7a6a;}
  .cat.tech{background:#4c4bbd;}

  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;
    box-shadow:0 1px 2px rgba(0,0,0,.03);display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:34px;}
  .hero:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.10);}
  .hero-media{position:relative;min-height:340px;background:#eceae5;}
  .hero-body{padding:34px;display:flex;flex-direction:column;justify-content:center;}
  .hero h2{font-size:clamp(24px,3vw,34px);line-height:1.18;letter-spacing:-0.02em;margin:6px 0 14px;}
  .hero p{color:var(--ink-2);font-size:16px;margin:0;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;display:flex;flex-direction:column;transition:transform .25s ease, box-shadow .25s ease;}
  .card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.09);}
  .card-media{position:relative;height:180px;background:#eceae5;}
  .card-body{padding:18px 18px 22px;flex:1;display:flex;flex-direction:column;}
  .card h3{font-size:18px;line-height:1.3;letter-spacing:-0.01em;margin:4px 0 10px;}
  .card p{color:var(--ink-2);font-size:14px;margin:0;}

  img.shot{width:100%;height:100%;object-fit:cover;display:block;}

  .overlay{position:fixed;inset:0;background:rgba(20,20,20,.45);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:50;
    overflow-y:auto;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal{background:var(--surface);max-width:780px;width:100%;border-radius:22px;overflow:hidden;
    animation:rise .28s cubic-bezier(.2,.8,.2,1);box-shadow:0 30px 70px rgba(0,0,0,.25);}
  .modal-media{height:300px;background:#eceae5;position:relative;}
  .modal-body{padding:30px 32px 36px;}
  .modal h2{font-size:clamp(22px,3vw,30px);line-height:1.2;letter-spacing:-0.02em;margin:8px 0 16px;}
  .modal .text p{color:var(--ink-2);font-size:16px;margin:0 0 14px;}
  .note{font-size:13px;color:var(--ink-3);border-left:3px solid var(--line);padding-left:12px;margin-top:18px;}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;}
  .btn{border:none;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;
    text-decoration:none;display:inline-block;transition:opacity .2s;}
  .btn:hover{opacity:.85;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-ghost{background:#efeeea;color:var(--ink);}
  .closex{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.92);border:none;
    width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;}

  footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);
    font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;}

  @media (max-width:800px){
    .hero{grid-template-columns:1fr;}
    .hero-media{min-height:220px;}
    .hero-body{padding:24px;}
    .modal-media{height:210px;}
    .modal-body{padding:24px;}
  }
</style>
</head>

const PALETAS = {
  Branding: ["#f4a261", "#e76f51", "#c8452e"],
  Design: ["#2a9d8f", "#4cbfa6", "#1f7a6a"],
  Tecnologia: ["#6c63ff", "#4c4bbd", "#8f7bff"]
};

function Ilustracao({ categoria, seed, alto }) {
  const cores = PALETAS[categoria] || PALETAS.Design;
  const gid = "g" + seed;
  const r1 = 30 + ((seed * 37) % 40);
  const r2 = 20 + ((seed * 53) % 30);
  const rot = (seed * 47) % 90;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"
         style={{ width: "100%", height: "100%", display: "block" }} role="img"
         aria-label={"Ilustração abstrata para matéria de " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={cores[0]} />
          <stop offset="100%" stopColor={cores[2]} />
        </linearGradient>
      </defs>
      <rect width="400" height="240" fill={"url(#" + gid + ")"} />
      <circle cx={90 + (seed * 17) % 120} cy={70 + (seed * 23) % 60} r={r1} fill={cores[1]} opacity="0.55" />
      <circle cx={300 - (seed * 11) % 90} cy={170 - (seed * 19) % 70} r={r2} fill="#ffffff" opacity="0.28" />
      <rect x={210} y={40} width={130} height={130} rx="16" fill="#ffffff" opacity="0.16"
            transform={"rotate(" + rot + " 275 105)"} />
      <path d="M0,200 Q100,150 200,195 T400,170 L400,240 L0,240 Z" fill="#ffffff" opacity="0.2" />
    </svg>
  );
}

function Midia({ item, alto }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} alto={alto} />;
  }
  return (
    <img
      className="shot"
      src={item.imageUrl}
      referrerPolicy="no-referrer"
      loading="lazy"
      alt={item.tituloPt}
      onError={() => setFalhou(true)}
    />
  );
}

function Estrelas({ n }) {
  return <span className="stars">{"★".repeat(n) + "☆".repeat(5 - n)}</span>;
}

function Meta({ item }) {
  const classe = item.categoria === "Branding" ? "branding"
    : item.categoria === "Tecnologia" ? "tech" : "design";
  return (
    <div className="meta">
      <span className="source">{item.source}</span>
      <span className={"cat " + classe}>{item.categoria}</span>
      <Estrelas n={item.estrelas} />
    </div>
  );
}

function Modal({ item, aoFechar }) {
  return (
    <div className="overlay" onClick={aoFechar}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-media">
          <Midia item={item} alto />
          <button className="closex" onClick={aoFechar} aria-label="Fechar">×</button>
        </div>
        <div className="modal-body">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <div className="text">
            {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Matéria com conteúdo restrito a assinantes. Este resumo foi escrito a partir dos
              elementos públicos da página — título, categoria editorial, indústria, tags e créditos.
            </div>
          )}
          <div className="note">Publicado em {item.data} · Fonte: {item.source}</div>
          <div className="actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} →
            </a>
            <button className="btn btn-ghost" onClick={aoFechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a, b) => b.estrelas - a.estrelas || a.id - b.id);
  const manchete = ordenadas[0];
  const demais = ordenadas.slice(1);

  return (
    <React.Fragment>
      <header className="topbar">
        <div>
          <h1 className="brand">Portal da <em>Manhã</em></h1>
          <div className="kicker">Branding, design e tecnologia — o que saiu nas últimas 24 horas.</div>
        </div>
        <div className="dateline">Quarta-feira, 26 de agosto de 2026 · {NOTICIAS.length} matérias · 7 portais</div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <div className="hero-media"><Midia item={manchete} alto /></div>
        <div className="hero-body">
          <Meta item={manchete} />
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
        </div>
      </article>

      <div className="grid">
        {demais.map((item) => (
          <article className="card" key={item.id} onClick={() => setAberto(item)}>
            <div className="card-media"><Midia item={item} /></div>
            <div className="card-body">
              <Meta item={item} />
              <h3>{item.tituloPt}</h3>
              <p>{item.dek}</p>
            </div>
          </article>
        ))}
      </div>

      <footer>
        <span>Portal da Manhã · edição de 26 de agosto de 2026</span>
        <span>Resumos em português produzidos para esta edição. Imagens e textos originais pertencem aos respectivos portais.</span>
      </footer>

      {aberto && <Modal item={aberto} aoFechar={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
