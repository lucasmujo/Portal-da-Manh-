<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 20 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#15161a;
    --ink-2:#4a4d57;
    --ink-3:#858895;
    --line:#e7e7e2;
    --accent:#c8452e;
    --radius:20px;
    --shadow:0 1px 2px rgba(18,20,28,.04), 0 8px 24px rgba(18,20,28,.06);
    --shadow-lg:0 2px 6px rgba(18,20,28,.06), 0 24px 60px rgba(18,20,28,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px 80px}

  /* Header */
  header.top{padding:48px 0 28px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1.brand{
    font-family:Fraunces,Georgia,serif;font-weight:600;
    font-size:clamp(40px,7vw,68px);line-height:1;margin:14px 0 10px;letter-spacing:-.02em;
  }
  .subhead{color:var(--ink-3);font-size:15px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-3);display:inline-block}

  /* Section title */
  .sec-title{
    font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:600;
    margin:0 0 20px;display:flex;align-items:center;gap:12px;
  }
  .sec-title:after{content:"";flex:1;height:1px;background:var(--line)}

  /* Hero card */
  .hero{
    background:var(--card);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:grid;grid-template-columns:1.25fr 1fr;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    margin-bottom:40px;border:1px solid var(--line);
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero-media{position:relative;min-height:340px;background:#eceae6}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:38px 38px 34px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .hero-body h2{
    font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(24px,2.6vw,33px);
    line-height:1.16;margin:0;letter-spacing:-.015em;
  }
  .hero-body p{margin:0;color:var(--ink-2);font-size:15.5px;line-height:1.6}

  /* Meta row */
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{
    font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
    background:#f0efec;color:var(--ink-2);padding:5px 10px;border-radius:999px;
  }
  .cat{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .cat.branding{background:#fdeee6;color:#a8431f}
  .cat.design{background:#e4f3ec;color:#1f6b4d}
  .cat.tec{background:#e9ecfb;color:#3a45a0}
  .stars{font-size:13px;color:#d9a441;letter-spacing:1px}
  .date{font-size:12px;color:var(--ink-3)}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card-media{height:184px;background:#eceae6;position:relative}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:11px;flex:1}
  .card-body h3{
    font-family:Fraunces,Georgia,serif;font-weight:600;font-size:18.5px;line-height:1.26;
    margin:0;letter-spacing:-.01em;
  }
  .card-body .dek{margin:0;color:var(--ink-2);font-size:13.8px;line-height:1.55;flex:1}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(20,21,26,.42);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
    z-index:50;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:var(--card);border-radius:24px;max-width:780px;width:100%;
    overflow:hidden;box-shadow:0 40px 100px rgba(10,12,18,.32);animation:rise .3s cubic-bezier(.2,.8,.2,1);
  }
  .modal-media{height:330px;background:#eceae6}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .modal-body{padding:34px 40px 40px}
  .modal-body h2{
    font-family:Fraunces,Georgia,serif;font-weight:600;font-size:29px;line-height:1.18;
    margin:16px 0 8px;letter-spacing:-.015em;
  }
  .orig{font-size:13px;color:var(--ink-3);font-style:italic;margin:0 0 20px}
  .modal-body .txt p{color:var(--ink-2);font-size:16px;line-height:1.72;margin:0 0 16px}
  .note{font-size:13px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:12px;margin:20px 0 0}
  .actions{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  .btn{
    display:inline-block;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;
    text-decoration:none;border:none;cursor:pointer;font-family:inherit;
  }
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:#2c2e36}
  .btn-ghost{background:#f0efec;color:var(--ink-2)}
  .btn-ghost:hover{background:#e6e5e1}

  footer{margin-top:64px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;line-height:1.7}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:240px}
    .hero-body{padding:26px}
  }
  @media (max-width:600px){
    .wrap{padding:0 16px 56px}
    .grid{grid-template-columns:1fr}
    .modal-body{padding:24px}
    .modal-media{height:220px}
  }
</style>
</head>

const PALETAS = {
  branding: ["#F4A261","#E76F51","#FFD9A0"],
  design:   ["#7FC6A4","#2A9D8F","#CDEBDC"],
  tec:      ["#8FA3E8","#6C63C7","#D8DDF7"]
};

function Ilustra({ categoria, seed, className }) {
  const p = PALETAS[categoria] || PALETAS.design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg className={className} viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração decorativa">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`}/>
      <circle cx={60 + r(1)*280} cy={50 + r(2)*160} r={40 + r(3)*50} fill={p[2]} opacity="0.55"/>
      <circle cx={40 + r(4)*320} cy={40 + r(5)*180} r={22 + r(6)*30} fill="#ffffff" opacity="0.28"/>
      <rect x={30 + r(7)*220} y={90 + r(8)*90} width={70 + r(9)*90} height={10} rx="5" fill="#ffffff" opacity="0.45"/>
      <rect x={50 + r(10)*200} y={130 + r(11)*70} width={50 + r(12)*70} height={10} rx="5" fill="#ffffff" opacity="0.32"/>
      <path d={`M0 ${200 + r(13)*30} Q 100 ${150 + r(14)*60} 200 ${200 + r(15)*30} T 400 ${190 + r(16)*40} L400 260 L0 260 Z`} fill={p[2]} opacity="0.5"/>
    </svg>
  );
}

function Figura({ item, idx, className }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustra categoria={item.categoria} seed={idx + 3} className={className}/>;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.alt || item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const LABEL = { branding: "Branding", design: "Design", tec: "Tecnologia" };

function Meta({ item }) {
  return (
    <div className="meta">
      <span className="src">{item.source}</span>
      <span className={"cat " + item.categoria}>{LABEL[item.categoria]}</span>
      <span className="stars">{"★".repeat(item.estrelas)}{"☆".repeat(5 - item.estrelas)}</span>
      <span className="date">{item.data}</span>
    </div>
  );
}

function Modal({ item, idx, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-media"><Figura item={item} idx={idx}/></div>
        <div className="modal-body">
          <Meta item={item}/>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}” — {item.source}</p>
          <div className="txt">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {item.paywall && <p className="note">Resumo produzido a partir dos elementos públicos da página (título, categoria, indústria, tags e linha de apoio), já que o texto completo está atrás de paywall.</p>}
          <div className="actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS];
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") setAberto(null); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de domingo</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="subhead">
          <span>20 de setembro de 2026</span><span className="dot"></span>
          <span>{NOTICIAS.length} notícias</span><span className="dot"></span>
          <span>Branding · Design · Tecnologia</span>
        </div>
      </header>

      <h2 className="sec-title">Notícias</h2>

      <article className="hero" onClick={() => setAberto(0)}>
        <div className="hero-media"><Figura item={manchete} idx={0}/></div>
        <div className="hero-body">
          <Meta item={manchete}/>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0, 200)}…</p>
        </div>
      </article>

      <div className="grid">
        {resto.map((item, i) => (
          <article className="card" key={item.url} onClick={() => setAberto(i + 1)}>
            <div className="card-media"><Figura item={item} idx={i + 1}/></div>
            <div className="card-body">
              <Meta item={item}/>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.resumo[0].slice(0, 130)}…</p>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã — seleção diária de branding, design e tecnologia.<br/>
        Resumos escritos em português a partir da leitura das matérias originais; os textos não reproduzem o conteúdo das fontes. Imagens carregadas diretamente dos servidores dos portais e creditadas a eles. Clique em qualquer card para ler o resumo completo.
      </footer>

      {aberto !== null && (
        <Modal item={ordenadas[aberto]} idx={aberto} onClose={() => setAberto(null)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
