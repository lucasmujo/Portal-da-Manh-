<style>
:root{
  --bg:#f6f5f2;
  --surface:#ffffff;
  --ink:#16161a;
  --ink-soft:#5b5b66;
  --ink-faint:#8f8f9c;
  --line:#e6e4df;
  --accent:#c8461f;
  --radius:18px;
  --shadow:0 1px 2px rgba(20,20,30,.04), 0 8px 24px rgba(20,20,30,.06);
  --shadow-lg:0 2px 6px rgba(20,20,30,.06), 0 24px 60px rgba(20,20,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
}
#root{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* header */
.masthead{padding:56px 0 28px;border-bottom:1px solid var(--line);margin-bottom:34px}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.masthead h1{
  font-family:'Instrument Serif',Georgia,serif;
  font-weight:400;font-size:clamp(44px,7vw,78px);
  line-height:.98;margin:14px 0 10px;letter-spacing:-.02em;
}
.dateline{font-size:14px;color:var(--ink-soft)}
.dot{margin:0 8px;color:var(--ink-faint)}

/* hero */
.hero{
  display:grid;grid-template-columns:1.15fr 1fr;gap:0;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
  cursor:pointer;transition:box-shadow .3s ease, transform .3s ease;margin-bottom:44px;
}
.hero:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.hero-media{position:relative;min-height:400px;background:#eceae5}
.hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.hero-body{padding:42px 42px 38px;display:flex;flex-direction:column;justify-content:center}
.hero-body h2{
  font-family:'Instrument Serif',Georgia,serif;font-weight:400;
  font-size:clamp(28px,3.1vw,40px);line-height:1.1;letter-spacing:-.015em;margin:16px 0 14px;
}
.hero-body p{color:var(--ink-soft);font-size:16px;line-height:1.6;margin:0 0 22px}

/* meta row */
.metarow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;
}
.tag.branding{background:#fdeee6;color:#a63c13}
.tag.design{background:#e4f4ef;color:#1d6b56}
.tag.tech{background:#eaeaff;color:#4340a8}
.source{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:.02em}
.stars{font-size:12px;color:var(--accent);letter-spacing:.12em}

/* grid */
.section-label{
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);
  font-weight:600;margin:0 0 18px;
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
  transition:box-shadow .28s ease, transform .28s ease;display:flex;flex-direction:column;
}
.card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.card-media{position:relative;aspect-ratio:16/10;background:#eceae5;overflow:hidden}
.card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:11px;flex:1}
.card-body h3{
  font-family:'Instrument Serif',Georgia,serif;font-weight:400;
  font-size:21px;line-height:1.2;margin:0;letter-spacing:-.01em;
}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.warn{font-size:11px;color:var(--ink-faint);font-style:italic}

/* modal */
.overlay{
  position:fixed;inset:0;background:rgba(18,18,22,.55);backdrop-filter:blur(6px);
  display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;
  z-index:50;overflow-y:auto;animation:fade .22s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.modal{
  background:var(--surface);border-radius:22px;max-width:760px;width:100%;
  overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.32);animation:rise .3s cubic-bezier(.2,.8,.3,1);
}
.modal-media{aspect-ratio:16/9;background:#eceae5;position:relative}
.modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block}
.modal-body{padding:34px 38px 38px}
.modal-body h2{
  font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:32px;
  line-height:1.14;margin:16px 0 6px;letter-spacing:-.015em;
}
.orig-title{font-size:13px;color:var(--ink-faint);margin:0 0 20px;font-style:italic}
.modal-body p.text{font-size:16.5px;line-height:1.72;color:#2e2e36;margin:0 0 16px}
.note{font-size:13px;color:var(--ink-soft);background:#faf8f4;border-left:3px solid var(--line);padding:11px 14px;border-radius:0 8px 8px 0;margin:20px 0 0;line-height:1.55}
.modal-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{
  font-size:14px;font-weight:600;padding:12px 20px;border-radius:999px;
  text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff;cursor:pointer;
  transition:background .2s ease,border-color .2s ease;
}
.btn:hover{background:#f3f1ec}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#000}
.closebtn{
  position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;
  border:none;background:rgba(255,255,255,.92);font-size:19px;line-height:1;cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.18);color:#333;
}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-faint);line-height:1.7}

@media(max-width:900px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero{grid-template-columns:1fr}
  .hero-media{min-height:250px;position:relative}
  .hero-body{padding:28px 26px 30px}
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  #root{padding:0 16px 60px}
  .masthead{padding:38px 0 22px}
  .modal-body{padding:26px 22px 30px}
  .overlay{padding:0}
  .modal{border-radius:0}
}
</style>
</head>

const PALETAS = {
  Branding: { a: "#f5a05a", b: "#c8461f", c: "#7a2410", d: "#ffd9b8" },
  Design:   { a: "#6fc9ae", b: "#1d6b56", c: "#0d3b2e", d: "#c9f0e3" },
  Tecnologia:{ a: "#8f8bf0", b: "#4340a8", c: "#22205c", d: "#d9d8ff" }
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const gid = "g" + seed;
  const rot = (seed * 47) % 360;
  const cx = 30 + ((seed * 23) % 45);
  const cy = 28 + ((seed * 37) % 40);
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label={"Ilustração gerada para a categoria " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.a} />
          <stop offset="55%" stopColor={p.b} />
          <stop offset="100%" stopColor={p.c} />
        </linearGradient>
        <radialGradient id={gid + "r"} cx="50%" cy="50%" r="60%">
          <stop offset="0%" stopColor={p.d} stopOpacity="0.9" />
          <stop offset="100%" stopColor={p.d} stopOpacity="0" />
        </radialGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#" + gid + ")"} />
      <circle cx={cx * 4} cy={cy * 2} r="86" fill={"url(#" + gid + "r)"} />
      <g transform={"rotate(" + rot + " 200 125)"} opacity="0.32">
        <rect x="120" y="45" width="160" height="160" rx="26" fill="none" stroke={p.d} strokeWidth="2.5" />
        <rect x="155" y="80" width="90" height="90" rx="16" fill={p.d} opacity="0.35" />
      </g>
      <g opacity="0.5">
        <circle cx="330" cy="58" r="30" fill="none" stroke={p.d} strokeWidth="2" />
        <circle cx="66" cy="196" r="44" fill="none" stroke={p.d} strokeWidth="2" />
      </g>
    </svg>
  );
}

function Figura({ item, wrapperClass }) {
  const [falhou, setFalhou] = useState(false);
  const mostrarSvg = !item.imageUrl || falhou;
  return (
    <div className={wrapperClass}>
      {mostrarSvg
        ? <Ilustracao categoria={item.categoria} seed={item.id} />
        : <img
            src={item.imageUrl}
            alt={item.alt}
            referrerPolicy="no-referrer"
            loading="lazy"
            onError={() => setFalhou(true)}
          />
      }
    </div>
  );
}

function Estrelas({ n }) {
  return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n) + "☆".repeat(5 - n)}</span>;
}

function Tag({ categoria }) {
  const cls = categoria === "Branding" ? "branding" : categoria === "Design" ? "design" : "tech";
  return <span className={"tag " + cls}>{categoria}</span>;
}

function Modal({ item, onClose }) {
  return (
    <div className="overlay" onClick={onClose} role="dialog" aria-modal="true">
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div style={{ position: "relative" }}>
          <Figura item={item} wrapperClass="modal-media" />
          <button className="closebtn" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <div className="modal-body">
          <div className="metarow">
            <Tag categoria={item.categoria} />
            <span className="source">{item.source}</span>
            <span className="dot">·</span>
            <span className="source" style={{ fontWeight: 400 }}>{item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig-title">Título original: “{item.title}”</p>
          {item.resumo.map((par, i) => <p className="text" key={i}>{par}</p>)}
          {item.nota && <p className="note">{item.nota}</p>}
          {!item.imageUrl && <p className="note">Este portal não expõe imagem de destaque em metadados públicos — a ilustração acima foi gerada para esta edição.</p>}
          <div className="modal-actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a, b) => b.estrelas - a.estrelas || a.id - b.id);
  const manchete = ordenadas[0];
  const demais = ordenadas.slice(1);

  return (
    <React.Fragment>
      <header className="masthead">
        <div className="kicker">Branding · Design · Tecnologia</div>
        <h1>Portal da Manhã</h1>
        <div className="dateline">
          Terça-feira, 22 de setembro de 2026
          <span className="dot">·</span>
          {NOTICIAS.length} notícias
          <span className="dot">·</span>
          7 portais
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <Figura item={manchete} wrapperClass="hero-media" />
        <div className="hero-body">
          <div className="metarow">
            <Tag categoria={manchete.categoria} />
            <span className="source">{manchete.source}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0, 190)}…</p>
          <div className="metarow">
            <span className="btn primary" style={{ display: "inline-block" }}>Ler resumo completo</span>
          </div>
        </div>
      </article>

      <p className="section-label">Mais da edição</p>
      <div className="grid">
        {demais.map(item => (
          <article className="card" key={item.id} onClick={() => setAberto(item)}>
            <Figura item={item} wrapperClass="card-media" />
            <div className="card-body">
              <div className="metarow">
                <Tag categoria={item.categoria} />
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <div className="card-foot">
                <span className="source">{item.source}</span>
                {item.paywall && <span className="warn">resumo de elementos públicos</span>}
              </div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Edição de 22 de setembro de 2026 · Fontes: Brand New, Dezeen, The Brand Identity, Creative Review, Creative Bloq, It’s Nice That e VentureBeat.<br />
        Todos os resumos foram escritos em português para esta edição, a partir da leitura das matérias originais. As imagens são carregadas diretamente dos servidores de cada portal.
      </footer>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
