<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#17171a;--mut:#6b6b76;--line:#e8e6e1;--brand:#e8590c;--design:#0f9d8a;--tech:#5b5bd6}

.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease;border:1px solid var(--line)}

.hero{display:grid;grid-template-columns:1.25fr 1fr;margin-bottom:26px}.hero .media{aspect-ratio:auto;min-height:340px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}.hero .body{padding:28px;display:flex;flex-direction:column;justify-content:center}
.hero p{color:var(--mut);line-height:1.6;font-size:15px}.cta{margin-top:14px;font-weight:600;color:var(--brand);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.aviso{font-size:12px;background:#fff7e6;border:1px solid #ffe2a8;color:#8a5a00;padding:6px 10px;border-radius:8px;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(20,20,25,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:32px 16px;z-index:10;animation:fade .25s ease}

.btn.p{background:var(--ink);color:#fff}.btn.s{background:#efeeea;color:var(--ink)}
footer{margin-top:36px;color:var(--mut);font-size:12px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero .media{min-height:220px}}

{
title: "Nomad designs identities for new Ultimate Sevens rugby league",
tituloPt: "A Nomad criou seis identidades tipográficas, sem mascotes, para a nova liga Ultimate Sevens de rugby sevens",
source: "Creative Review",
url: "https://www.creativereview.co.uk/nomad-design-identity-ultimate-sevens-rugby-league/",
imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/09/NMD_U7_CS_THUMBNAIL_16x9.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=2000&h=1125",
categoria: "Branding", estrelas: 5, data: "28 set 2026",
resumo: ["A agência londrina Nomad, especializada em branding esportivo, desenvolveu as identidades visuais da Ultimate Sevens, uma nova competição global de rugby sevens com seis clubes, cada um com times masculino e feminino, disputando torneios pela Europa.","O ponto de partida foi a construção dos nomes: prefixo geográfico, um nome central que reflete o caráter do time e o sufixo unificador \"Sevens Club\". Daí saíram Albion Athletic, Atlantic Novas, Clan Taran, Foudre Bleue, Pacific Current e Sol Feroz.","Em vez de recorrer aos mascotes animais tão comuns no rugby, a Nomad apostou em logotipos guiados por letras, com formas tipográficas contemporâneas que traduzem a essência de cada equipe. A paleta usa tons de vermelho, verde e azul para garantir que os seis clubes sejam facilmente distinguíveis.","O pacote inclui manifestos e slogans individuais que refletem a energia em campo e a atitude dos jogadores, além de um sistema de motion design dinâmico. O diretor criativo Callum York resumiu o trabalho como algo \"feito para o jogo moderno: rápido, divertido e a todo vapor\"."]

{
title: "Udder disbelief: The Laughing Cow loses her smile",
tituloPt: "A vaca que ri parou de rir: a Laughing Cow tira o sorriso do mascote em campanha enigmática",
source: "Campaign",
url: "https://www.campaignlive.com/article/udder-disbelief-laughing-cow-loses-smile/1970963",
imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/laughing-cow-not-laughing-UWP-CUS.jpg",
categoria: "Branding", estrelas: 5, data: "25 set 2026",
resumo: ["A marca de queijos Laughing Cow lançou uma campanha propositalmente misteriosa: nas novas embalagens, o rosto do mascote perdeu o sorriso característico e ganhou uma expressão preocupada.","O material direciona o público ao site TheNotLaughingCow.com, que traz a mensagem de que, depois de mais de 100 anos, a vaca parou de rir e que \"precisamos conversar\". A marca divulgou vídeos melancólicos do personagem sozinho em um balcão de lanchonete e num balanço de parque, sem explicar o motivo.","A CMO da Bel Brands, Jamee Pearlstein, disse que ver um ícone tão querido sem a risada característica despertaria curiosidade e conversa nas redes. A empresa sugere que o mascote não ficará calado por muito tempo, indicando uma revelação futura.","Quando um seguidor demonstrou preocupação com o estado da personagem, a marca respondeu em tom enigmático: ela não está triste, só \"não está rindo\"."]

resumo: ["O estúdio TEMPLO desenvolveu a nova identidade visual do DeafCity Hub, um espaço de coworking em Londres voltado à comunidade surda. O Brand New resenhou o trabalho sob o título \"A Lovely Gesture\", indicando recepção positiva.","Pelas tags e imagens públicas, o sistema combina uma estética de matriz de pontos (dot-matrix) com paleta multicolorida em laranja e rosa sobre preto, além de movimento como elemento central, uma abordagem contemporânea e lúdica para uma marca comunitária e inclusiva.","Aviso: a análise completa está atrás de paywall; este resumo se baseia apenas em elementos públicos (título, categoria, tags e imagem)."],

{
title: "2026 is the year of the cancelled ad",
tituloPt: "2026 é o ano do anúncio cancelado: por que tantas campanhas estão sendo retiradas do ar",
source: "Creative Bloq",
url: "https://www.creativebloq.com/design/advertising/2026-is-the-year-of-the-cancelled-ad",
imageUrl: "https://cdn.mos.cms.futurecdn.net/JrcmGQaXbGhjjH7XomDhhN-1204-80.jpg",
categoria: "Branding", estrelas: 4, data: "28 set 2026",
resumo: ["O artigo de Tom May analisa uma tendência de 2026: várias campanhas de grande visibilidade sendo retiradas rapidamente após reação negativa do público. Entre os casos citados estão uma publicação apagada da Pepsi, um anúncio de golfe da Callaway, uma peça de apostas esportivas com Sydney Sweeney, a linha de roupas \"United 93\" do Oxford United e um anúncio da Converse com imagem acidentalmente associada à KKK.","O autor separa descuidos genuínos (Oxford United, Converse) de provocações deliberadas. Em vez de culpar o público por ser sensível demais ou as marcas por serem descuidadas, propõe outra explicação: a irrelevância cultural da publicidade.","Com streaming sem anúncios, bloqueadores e queda da mídia impressa, a publicidade perdeu o lugar central que tinha nos anos 1970. Assim, marcas passariam a fabricar polêmica de propósito, na lógica de que atenção negativa é melhor que nenhuma. Nas palavras do texto, anúncios deixaram de ser coisas que assistimos e viraram coisas sobre as quais discutimos."]

{

url: "https://www.dezeen.com/2026/09/25/meta-debuts-tamagotchi-style-ai-agent/",

categoria: "Tecnologia e IA", estrelas: 4, data: "25 set 2026",
resumo: ["A Meta apresentou o Muse Charm, dispositivo portátil do tamanho de um chaveiro criado para abrigar seu agente de IA. O projeto vem do time de design da empresa, liderado por Alan Dye, ex-chefe de design da Apple.","O aparelho tem tela de duas polegadas com um personagem de desenho animado personalizável, lembrando os antigos bichinhos virtuais. Traz sensor de digital para ativar a voz, conectividade 5G e câmera integrada. Segundo Mark Zuckerberg, é uma forma de interagir com o assistente Muse sem usar óculos.","O avatar pode assumir vários personagens, incluindo \"Jolly\", o mascote da Meta, uma manga antropomórfica. O alvo é a geração Z, que curte bag charms e pelúcias colecionáveis.","O texto lembra que o histórico da Meta preocupa: o Muse já foi acusado de acessar mensagens privadas e pressionar usuários a revelar dados financeiros, e defensores da privacidade temem que isso se agrave num aparelho com áudio e imagem integrados."]

{

url: "https://www.yankodesign.com/2026/09/29/nothings-399-headphones-take-aim-at-sony-bose-and-apple-at-once/",

categoria: "Design", estrelas: 4, data: "29 set 2026",
resumo: ["A Nothing apresentou o Headphones (1) Pro, por US$ 399, com a linguagem transparente que resgata a estética de eletrônicos antigos e o posiciona contra Sony, Bose e Apple.","Cada concha tem três drivers: um dinâmico de 40 mm para graves, um driver de precisão para médios e uma unidade xMEMS de estado sólido para agudos. São 10 microfones para cancelamento de ruído adaptativo de até 46 dB, e um botão de EQ plano.","No design, hastes de titânio e painéis de vidro mantêm o peso em 327 g. A faixa é 10% mais larga, com mais acolchoamento e uma vedação de silicone de 8 mm. Os painéis de vidro resistem a testes de queda, têm película de proteção e podem ser removidos para reparo com calor externo.","A autonomia vai de 30 a 68 horas conforme o uso do cancelamento de ruído, e cinco minutos de carga rendem cerca de quatro horas de música."]

{
title: "Viral AI agent Instinct raises $1B Series C at a $10B valuation",
tituloPt: "Instinct, agente de IA viral, capta US$ 1 bi em rodada Série C e chega a US$ 10 bi de avaliação",

url: "https://techcrunch.com/2026/09/28/viral-ai-agent-instinct-raises-1b-series-c-at-a-10b-valuation/",

categoria: "Tecnologia e IA", estrelas: 4, data: "28 set 2026",
resumo: ["A startup de agentes de IA para consumidores Instinct levantou US$ 1 bilhão em rodada Série C, avaliada em US$ 10 bilhões, apenas um mês depois de captar US$ 350 milhões a US$ 2,5 bilhões. Entre os investidores estão Sequoia, Benchmark e Coatue.","O serviço, lançado por convite em agosto de 2026, faz parte de uma nova categoria de agentes que executam tarefas, como reservar viagens, fazer compras, pagar contas e pesquisar. O Instinct usa telefone e computador próprios para agir e recentemente ganhou um serviço de concierge que liga para marcar compromissos e uma rede de pessoas de confiança para coordenar agentes de diferentes usuários.","A empresa enfrenta pressão do Muse, da Meta, que oferece funções parecidas com integração mais profunda a Instagram e Facebook e já soma milhões de downloads. Preocupações antigas de privacidade levaram a ajustes nas políticas. O fundador Noah Shinn disse que o dinheiro levará o Instinct a mais pessoas."]

{
title: "Quest is a highly designed sci-fi and fantasy magazine built for web fiction",
tituloPt: "Quest é uma revista de ficção científica e fantasia feita para a web, com design próprio para cada conto",
source: "It's Nice That",
url: "https://www.itsnicethat.com/articles/ross-gendels-zane-miller-quest-magazine-graphic-design-publication-project-280926",
imageUrl: "https://m.itsnicethat.com/original_images/quest-publication-itsnicethat--Issue-01-Alexa-Velasquez.png?class=w1440",
categoria: "Design", estrelas: 3, data: "28 set 2026",
resumo: ["Quest é uma publicação digital de ficção científica e fantasia criada por Ross Gendels e Zane Miller, que trata cada história como uma experiência visual única, com tipografia sob medida, arte encomendada e paleta própria por peça.","A segunda edição, lançada em agosto de 2026, reúne nove contos, ensaios e despachos, escolhidos entre 1.154 submissões, o dobro da primeira edição. A revista usa 11 famílias tipográficas diferentes.","O modelo é gratuito para ler e financiado pelos leitores via Patreon. A interface traz elementos de jogo, como geração de nome de usuário, níveis de progressão e chat da comunidade, que superaram as expectativas de engajamento dos criadores. Há suporte a vídeo e áudio, e as edições impressas das duas primeiras edições estão em desenvolvimento."]

resumo: ["O Brand New registrou, na categoria \"Spotted\", a atualização do logo da Carter's, marca americana de roupas para bebês e crianças. O post mostra uma comparação de antes e depois.","As tags públicas (baby, blue, script, star) indicam que as mudanças envolvem o tratamento em letra cursiva, a cor azul e o elemento de estrela da marca.","Aviso: o conteúdo completo está atrás de paywall e os créditos não são públicos; este resumo usa apenas título, categoria, indústria e tags. Nenhum detalhe além disso foi inferido."],

{
title: "Farshid Moussavi wins 2026 Soane Medal for architecture",

url: "https://www.dezeen.com/2026/09/28/farshid-moussavi-2026-soane-medal/",
imageUrl: "https://static.dezeen.com/uploads/2026/09/farshid-moussavi-2026-soane-medal_dezeen_2364_col_1.jpg",
categoria: "Design", estrelas: 3, data: "28 set 2026",
resumo: ["A arquiteta britânico-iraniana Farshid Moussavi foi a décima premiada com a Medalha Soane, criada em 2017, em reconhecimento a uma contribuição \"contínua e rigorosa\" à arquitetura, ao ensino e à pesquisa.","Fundadora do Farshid Moussavi Architects (2011) e professora na Graduate School of Design de Harvard, foi elogiada por mostrar que a ética da arquitetura nasce da prática, e não do discurso. O presidente do júri, Amin Taha, disse que ela traça um \"terceiro caminho: a atenção\", projetando com humildade e cuidado com a experiência dos usuários, e não em busca de espetáculo.","Entre os projetos concluídos estão o Museu de Arte Contemporânea de Cleveland, o Ismaili Center em Houston, a loja principal de Victoria Beckham em Londres e o terminal de Yokohama (feito no Foreign Office Architects). A medalha será entregue na Royal Academy, em Londres, em 24 de novembro de 2026."]

resumo: ["O estúdio Rezen converteu um antigo estábulo e adega sob o Royal George Hotel (1903), em Fremantle, na Austrália, no Alchemy Saunas, espaço de bem-estar inspirado nas casas de banho romanas.","A reforma valoriza o tijolo vermelho e o calcário local Tamala, com acréscimos utilitários de aço e revestimentos cerâmicos. O diretor Rhys Bowring descreve a linguagem como \"pragmática, crua e direta\", com materiais novos discretos para destacar a arquitetura original.","O layout compacto abriga duas piscinas, uma de gelo e outra morna com magnésio, no antigo estábulo de pé-direito duplo, iluminado por grandes janelas em arco. Saunas, chuveiros e vestiários ocupam os andares superiores, com paredes de aço inox em contraste com o calcário envelhecido. Bancos de concreto contornam as piscinas e sustentam as paredes de tijolo."]

const {useState,useEffect}=React;
const CORES={"Branding":["#e8590c","#f59f00","#c92a2a"],"Design":["#0f9d8a","#12b886","#087f5b"],"Tecnologia e IA":["#5b5bd6","#7950f2","#3b5bdb"]};
function Ilustracao({categoria,seed}){
  const c=CORES[categoria]||CORES.Design;const id="g"+seed;
  const f=(n)=>((seed*37+n*53)%100);
  return(<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de "+categoria}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={c[0]}/><stop offset="1" stopColor={c[2]}/></linearGradient></defs>
    <rect width="400" height="225" fill={"url(#"+id+")"}/>
    <circle cx={60+f(1)*2.5} cy={40+f(2)} r={70+f(3)/2} fill={c[1]} opacity=".45"/>
    <rect x={200+f(4)} y={90+f(5)/2} width="120" height="120" rx="24" fill="#fff" opacity=".18" transform={"rotate("+(f(6)-50)+" 260 150)"}/>
    <polygon points={"40,225 "+(120+f(7))+",120 "+(200+f(8))+",225"} fill="#fff" opacity=".14"/>
    <circle cx={330-f(9)} cy={50+f(10)/2} r="28" fill="none" stroke="#fff" strokeWidth="6" opacity=".5"/>
  </svg>);
}
function Media({item,seed}){
  const [falhou,setFalhou]=useState(false);
  if(!item.imageUrl||falhou) return <Ilustracao categoria={item.categoria} seed={seed}/>;
  return <img src={item.imageUrl} referrerPolicy="no-referrer" loading="lazy" alt={"Imagem da matéria: "+item.tituloPt} onError={()=>setFalhou(true)}/>;
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
const Tag=({c})=><span className="tag" style={{background:(CORES[c]||CORES.Design)[0]}}>{c}</span>;
function Modal({item,seed,onClose}){
  useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",h);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",h);document.body.style.overflow=""}},[]);
  return(<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <div className="media"><Media item={item} seed={seed}/></div>
    <div className="in">
      <div className="meta"><Tag c={item.categoria}/><Stars n={item.estrelas}/><span>{item.source} · {item.data}</span></div>
      <h2>{item.tituloPt}</h2><div className="orig">Título original: {item.title}</div>
      {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
      {item.paywall&&<div className="aviso">Matéria com paywall: resumo baseado apenas em elementos públicos.</div>}
      <div className="btns"><a className="btn p" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a><button className="btn s" onClick={onClose}>Fechar</button></div>
    </div></div></div>);
}
function Card({item,seed,onOpen}){
  return(<article className="card" onClick={()=>onOpen(item)} tabIndex={0} onKeyDown={e=>e.key==="Enter"&&onOpen(item)}>
    <div className="media"><Media item={item} seed={seed}/></div>
    <div className="body"><div className="meta"><Tag c={item.categoria}/><Stars n={item.estrelas}/><span>{item.source}</span></div><h3>{item.tituloPt}</h3></div></article>);
}
function App(){
  const [aberto,setAberto]=useState(null);
  const lista=[...NOTICIAS].sort((a,b)=>b.estrelas-a.estrelas);
  const [h,...resto]=lista;
  const idx=i=>NOTICIAS.indexOf(i)+1;
  return(<div className="wrap">
    <header><div><h1>Portal da Manhã</h1><div className="sub">Terça-feira, 29 de setembro de 2026 · Branding, design e tecnologia</div></div><span className="badge">{NOTICIAS.length} notícias</span></header>
    <article className="card hero" onClick={()=>setAberto(h)} tabIndex={0} onKeyDown={e=>e.key==="Enter"&&setAberto(h)}>
      <div className="media"><Media item={h} seed={idx(h)}/></div>
      <div className="body"><div className="meta"><Tag c={h.categoria}/><Stars n={h.estrelas}/><span>{h.source} · {h.data}</span></div>
        <h2>{h.tituloPt}</h2><p>{h.resumo[0]}</p><div className="cta">Abrir resumo completo →</div></div>
    </article>
    <div className="grid">{resto.map(i=><Card key={i.url} item={i} seed={idx(i)} onOpen={setAberto}/>)}</div>
    <footer>Resumos parafraseados em português a partir das fontes originais. Imagens pertencem aos respectivos portais.</footer>
    {aberto&&<Modal item={aberto} seed={idx(aberto)} onClose={()=>setAberto(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
