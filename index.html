<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 5 de novembro de 2026</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e8e6e1;--acc:#e8590c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{font-size:30px;margin:0;letter-spacing:-.02em}
.date{color:var(--mut);font-size:14px;text-transform:capitalize}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(20,20,30,.08);cursor:pointer;transition:transform .25s,box-shadow .25s}
.hero:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(20,20,30,.12)}
.hero .media{min-height:340px}
.hero .body{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:24px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(20,20,30,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,20,30,.12)}
.card .media{height:180px}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px;line-height:1.3;margin:0}
.media{position:relative;background:#eee;overflow:hidden}
.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11px}
.Branding{background:#fff0e6;color:#c2410c}.Design{background:#e3f6f1;color:#0f766e}.Tecnologia{background:#ece9ff;color:#5b3fd1}
.stars{color:#f59e0b;letter-spacing:1px}
.orig{font-size:12px;color:var(--mut);font-style:italic}
.overlay{position:fixed;inset:0;background:rgba(15,17,22,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:f .2s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;animation:u .25s}
.modal .media{height:320px}
.modal .in{padding:26px 30px 32px}
.modal h2{font-size:26px;line-height:1.2;margin:8px 0 14px}
.modal p{margin:0 0 14px;font-size:16px}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px}
.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:99px;font-size:14px;margin-right:8px;border:0;cursor:pointer;font-family:inherit}
.btn.alt{background:#eee;color:var(--ink)}
.warn{font-size:12px;color:#b45309;background:#fffbeb;padding:6px 10px;border-radius:8px}
footer{margin-top:40px;color:var(--mut);font-size:12px;text-align:center}
@keyframes f{from{opacity:0}to{opacity:1}}@keyframes u{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .media{min-height:220px}.hero h2{font-size:23px}.modal .media{height:210px}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const NEWS=[
{
title: "Levi's stop-motion masterpiece is a lesson in Christmas advertising",
tituloPt: "A obra-prima em stop-motion da Levi's é uma aula de publicidade de Natal",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/levis-stop-motion-masterpiece-is-a-lesson-in-christmas-advertising",
imageUrl: null,
cat:"Branding",stars:5,
resumo:[
"A Levi's lançou o filme de fim de ano \"Let's Get Fuzzy\", produzido pelo estúdio londrino Blinkink inteiramente em stop-motion, e o Creative Bloq o usa como exemplo de publicidade artesanal num momento em que a indústria discute o uso de IA generativa nas campanhas de Natal.",
"O filme começa como uma paródia de terror ambientada numa cabana nevada, na qual um monstro chamado Fuzzyeti acaba se tornando festivo ao descobrir suéteres de festas. Os personagens usam réplicas em miniatura de roupas da marca.",
"Uma equipe de seis pessoas dedicou mais de 2.000 horas ao longo de seis semanas e meia para construir cenários, 400 árvores em miniatura e vários rostos para os personagens. Cada quadro foi ajustado à mão, o que exigiu cerca de quatro horas de trabalho por segundo de animação final.",
"O artigo lembra que, no ano passado, várias grandes marcas apostaram em anúncios gerados por IA: o da Coca-Cola gerou forte polêmica e o McDonald's retirou sua campanha após a reação negativa. Neste ano, o filme desenhado à mão da Prada, dirigido pelo ex-animador da Disney John Pomeroy, já sinalizava uma contratendência em direção ao trabalho humano.",
"A Levi's tem histórico de animação, como um curta psicodélico em 2D de 1971 e um videoclipe em massinha de 1995. A tese do texto é que a prova visível do trabalho humano — vídeos de bastidores, créditos às equipes criativas — virou um sinal de marca premium e um diferencial frente ao conteúdo sintético."]
},
{
title: "40 years after Andy Warhol and Keith Haring, Montreux Jazz Festival's new poster is a dream creative double act",
tituloPt: "40 anos depois de Warhol e Haring, o novo pôster do Montreux Jazz Festival é uma dupla criativa dos sonhos",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/40-years-after-andy-warhol-and-keith-haring-montreux-jazz-festivals-new-poster-is-a-dream-creative-double-act",
imageUrl: null,
cat:"Branding",stars:5,
resumo:[
"O Montreux Jazz Festival revelou o pôster da edição de 2027, criado pela ilustradora francesa Malika Favre em colaboração com a artista escultórica cingalesa Kumkum Fernando. A parceria repete a abordagem de 1986, quando Keith Haring e Andy Warhol assinaram juntos o cartaz do festival.",
"O estilo gráfico e geométrico de Favre encontra o retrofuturismo colorido de Fernando, resultando num design maximalista que apresenta a música como uma \"jornada alegre e espiritual\". Como o pôster de Favre para o festival em 2017 era minimalista, o novo trabalho segue na direção oposta, com cores densas e formas que compõem uma figura que lembra um robô, um altar e uma jukebox.",
"Os motivos florais remetem ao lago de Montreux e ao flower power dos anos 1960, já que o festival nasceu em 1967, no Verão do Amor. As flores também desenham sutilmente lábios, beijos e rostos femininos, em sintonia com os temas de amor, prazer e sensualidade presentes na obra de Favre.",
"O pôster ganha ainda uma versão objeto: um armário escultórico de vinil, feito sob encomenda, com compartimento para toca-discos e gavetas para discos. Entre artistas que já assinaram cartazes do festival estão David Bowie, Jean Tinguely, Woodkid, Lakwena e Christian Marclay. A 61ª edição acontece de 2 a 17 de julho de 2027, às margens do Lago Genebra."]
},
{
title: "New Logo and Identity for Tartu Punch by Stepan Solodkov",
tituloPt: "Novo logo e identidade da Tartu Punch, assinados por Stepan Solodkov",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_tartu_punch_by_stepan_solodkov.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/11/Tartu_Punch_logo_new.png",
cat:"Branding",stars:4,
resumo:[
"O Brand New publicou em 4 de novembro a análise \"The One-Tu Punch\" sobre a nova identidade da Tartu Punch, desenvolvida pelo designer Stepan Solodkov. O projeto está classificado na indústria de entretenimento e as tags (Estônia, festival, música) indicam que se trata de um festival musical em Tartu.",
"Segundo as tags da publicação, o sistema visual se apoia em formas robustas (\"chunky\"), movimento, padrões, tipografia proprietária e uma sans serif. Ou seja, a identidade combina um logotipo de peso visual alto com uma linguagem animada e gráfica, adequada ao universo de festivais.",
"O texto completo da análise fica atrás do paywall do Brand New; por isso este resumo se limita aos elementos públicos da página (título, categoria, indústria e tags)."],
paywall:true
},
{
title: "New Packaging for CVS Health's Private Label by Pearlfisher",
tituloPt: "Nova embalagem das marcas próprias da CVS Health, assinada pela Pearlfisher",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_packaging_for_cvs_private_label_by_pearlfisher.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/11/cvs_private_label_packaging_before_after.jpg",
cat:"Branding",stars:4,
resumo:[
"A agência Pearlfisher redesenhou a embalagem das marcas próprias (private label) da CVS Health, uma das maiores redes de farmácias dos Estados Unidos. O Brand New classificou o projeto como \"Noted\" na categoria de produtos de consumo, com o título \"All Health Broke Loose\" e publicação em 4 de novembro.",
"A página mostra imagens de antes e depois das embalagens, e as tags do projeto mencionam coração, embalagem, Pearlfisher e private label — pistas de que o símbolo do coração, já associado à CVS, segue central na linguagem visual.",
"O texto de análise está atrás do paywall, então não é possível detalhar as mudanças específicas nem a justificativa do estúdio; este resumo usa apenas os elementos públicos da página."],
paywall:true
},
{
title: "Polar's logo for bakery P.A.C. is just typed out, and all the better for it",
tituloPt: "O logo da Polar para a padaria P.A.C. é só o nome digitado — e fica melhor assim",
source: "It's Nice That",
url: "https://www.itsnicethat.com/articles/polar-pac-graphic-design-project-041126",
imageUrl: "https://m.itsnicethat.com/original_images/pac-polar-graphic-design-project-itsnicethat-13.gif?class=w1440",
cat:"Branding",stars:4,
resumo:[
"O estúdio paulistano Polar criou a identidade da padaria P.A.C., da qual dois dos quatro sócios do estúdio também são sócios. O projeto permitiu testar, num contexto mais pessoal, o foco da Polar em sistemas visuais escaláveis.",
"A identidade usa um kit tipográfico deliberadamente enxuto, com Gronland e Rublena, e o logotipo é simplesmente o nome digitado. Segundo Bruno Ribeiro, sócio da Polar, o nome de três letras já tem personalidade suficiente para se sustentar sozinho.",
"Por estar próximo da operação diária, o estúdio pôde responder rapidamente a novas necessidades, como a mudança da padaria para um espaço maior, sem recomeçar do zero. A ilustradora Beatriz Batisteli, parte da comunidade da padaria, adiciona traços bem-humorados que dão ao conjunto um caráter manual e analógico.",
"Ferramentas cotidianas, como a impressora de recibos, foram reaproveitadas nos cardápios, e suas limitações alimentam o tom da marca. O sistema é intencionalmente inacabado e vai evoluir com o negócio, valorizando a novidade acima da consistência. A meta, nas palavras de Ribeiro, é que o design pareça feito por gente que gosta do ofício, e não por uma marca que se esforça demais para dizer o que é."]
},
{
title: "A lived-in approach to sportswear shapes Figur's graphic systems for brands like Hoka, Sap and Unna",
tituloPt: "Abordagem vivida do esporte molda os sistemas gráficos da Figur para marcas como Hoka, Sap e Unna",
source: "It's Nice That",
url: "https://www.itsnicethat.com/articles/figur-graphic-design-discover-041126",
imageUrl: "https://m.itsnicethat.com/original_images/Fig10_UNNA_3.jpg?class=w1440",
cat:"Branding",stars:4,
resumo:[
"O perfil publicado em 4 de novembro apresenta a Figur, estúdio de Estocolmo fundado por Lukas Nässil em 2019. O nome significa \"figura\" em sueco, e os projetos são numerados como \"Fig.\", reforçando a ideia de que o estúdio é o próprio trabalho que produz.",
"Em oito anos, a Figur construiu reputação com identidades e sistemas gráficos para marcas esportivas, com um estilo utilitário e sistemático que atravessa objetos, impressos, animação e instalações. Nässil pratica esportes de resistência — já correu ultramaratonas e escalou montanhas — e essa vivência molda o olhar sobre as marcas de aventura para as quais trabalha.",
"O estúdio atendeu Hoka, Asics e Unna e é sócio fundador de Unna, Raide Research e Sap, ajudando a definir princípios, narrativas e estratégias de longo prazo. Uma regra da casa é não retocar estudos de caso no Photoshop: \"Se é ficção, não é um Fig\", diz Nässil, para manter conversas com clientes e produção ancoradas na realidade."]
},
{
title: "'Puddles' is the gorgeous British Airways poster series I needed on this grey, wintery day",
tituloPt: "'Puddles', a bela série de pôsteres da British Airways para um dia cinzento de inverno",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/puddles-is-the-gorgeous-british-airways-poster-campaign-that-will-make-you-book-a-holiday-right-now",
imageUrl: null,
cat:"Branding",stars:3,
resumo:[
"A agência Uncommon criou para a British Airways \"Puddles\", uma campanha de mídia exterior em que reflexos românticos em poças d'água são acompanhados do slogan \"It's Always Sunny Somewhere\" e do nome de um destino ensolarado. Em todas as imagens aparece um avião no céu.",
"A campanha foi programada para coincidir com o aumento anual das buscas por férias em lugares mais quentes, funcionando como convite para quem enfrenta o frio. A autora elogia a fotografia escura e melancólica, que captura o clima úmido do outono e inverno britânicos.",
"As imagens recompensam um segundo olhar: a figura nítida em primeiro plano impacta pela forma antes de os detalhes aparecerem. A série foi fotografada por Daniel Benson na Making Pictures, em estilo de reportagem sem roteiro, e está em painéis Rail D6 por Londres, com compra de mídia da MG OMD."]
},
{
title: "This AirPods Open concept puts Apple's famous stem behind your ear",
tituloPt: "Conceito de AirPods Open coloca a famosa haste da Apple atrás da orelha",
source: "Yanko Design",
url: "https://www.yankodesign.com/2026/11/04/this-airpods-open-concept-puts-apples-famous-stem-behind-your-ear/",
imageUrl: "https://www.yankodesign.com/images/design_news/2026/11/657762/airpods_open_1.jpeg",
cat:"Design",stars:3,
resumo:[
"O designer industrial de Helsinque Anurag Sarda imaginou o \"AirPods Open\": um fone AirPods 4 combinado com uma haste branca e brilhante que contorna a orelha, deslocando a icônica haste da Apple para a ponta do gancho, atrás do lóbulo.",
"O fone fica inclinado acima do canal auditivo, permitindo ouvir o ambiente. A haste reposicionada também faz o papel de contrapeso, função que normalmente cabe às baterias em fones de gancho. O estojo usa laços espelhados que acomodam os dois ganchos.",
"O artigo compara o conceito a modelos como Nothing Ear (open), Bose Ultra Open Earbuds, Huawei FreeArc e Beats Powerbeats Pro 2, e lembra que a Shokz quase dobrou suas remessas em um ano. Cita ainda a previsão da Omdia de 90,5 milhões de unidades anuais de fones abertos até 2030.",
"O texto deixa claro que é apenas um conceito, não um produto anunciado pela Apple."]
},
{
title: "DA1 Camera Prints Photos to Give Away Without a Screen or App",
tituloPt: "Câmera DA1 imprime fotos para distribuir, sem tela nem aplicativo",
source: "Yanko Design",
url: "https://www.yankodesign.com/2026/11/04/da1-camera-prints-photos-to-give-away-without-a-screen-or-app/",
imageUrl: "https://www.yankodesign.com/images/design_news/2026/11/da1-camera-prints-photos-to-give-away-without-a-screen-or-app/da1-02.jpg",
cat:"Design",stars:3,
resumo:[
"A DA1, da Twogather, é uma câmera instantânea eletrônica que imprime fotos em papel térmico, sem tela, galeria ou aplicativo. A proposta é tornar o ato de fotografar e entregar a imagem imediato, pensando em festas, encontros de família e diários visuais.",
"Há duas versões com o mesmo corpo quadrado arredondado e lente circular proeminente: a Neon, de US$ 98, com acabamento colorido, e a Clear, de US$ 110, que deixa à mostra os componentes internos. O pacote inclui pulseira, clipe de cinto, visor de rosquear e cinco marcadores coloridos para escrever nas impressões em preto e branco.",
"A impressão térmica dispensa cartuchos de tinta, mas exige rolos de papel, com estimativa de 50 ou mais fotos por rolo. A marca diz que a câmera \"não tem memória\", e sem tela não é possível ver a foto antes de imprimir. A pré-venda é nos EUA, com envio prometido para novembro de 2026."]
},
{
title: "A Table that Goes from Round to Square",
tituloPt: "Uma mesa que passa de redonda a quadrada",
source: "Core77",
url: "https://www.core77.com/posts/145828/A-Table-that-Goes-from-Round-to-Square",
imageUrl: "https://s3files.core77.com/blog/images/lead_n_spotlight/1856053_lead_400_145828_.jpg",
cat:"Design",stars:2,
resumo:[
"O Core77 apresenta, em post de 4 de novembro na categoria de design de mobiliário, uma mesa transformável da empresa polonesa Bauhausly, cujo tampo muda de redondo para quadrado.",
"As fotos e um vídeo incorporado mostram a mesa em movimento, e imagens de detalhe revelam as dobradiças ocultas que viabilizam a transformação.",
"O autor, Rain Noe, sugere que o design pode não ser original. A Bauhausly é uma startup que não cita um designer nem pessoas por trás da empresa, informando apenas que a mesa é fabricada no Vietnã."]
},
{
title: "Nothing CEO says company's mysterious AI-first device is dropping next month",
tituloPt: "CEO da Nothing diz que o misterioso dispositivo focado em IA chega no mês que vem",
source: "TechCrunch",
url: "https://techcrunch.com/2026/11/04/nothing-ceo-says-companys-mysterious-ai-first-device-is-dropping-next-month/",
imageUrl: "https://techcrunch.com/wp-content/uploads/2024/02/2560x2040_5fe778b6-8919-4143-bf11-8d86af754f52_2192x.webp?resize=1200,956",
cat:"Tecnologia",stars:4,
resumo:[
"A Nothing, fabricante dos celulares Nothing Phone, está desenvolvendo um produto de IA cuja natureza segue incerta. Na quarta-feira, o CEO Carl Pei escreveu no X que o primeiro \"produto nativo de IA\" da empresa será lançado em dezembro.",
"Pei o descreveu como uma ferramenta com a personalidade e o cuidado que definem os produtos da Nothing, sem nova tela e que não poderia ter sido um aplicativo. Ele chamou o produto de ferramenta de produtividade e pareceu se afastar da ideia de wearable de IA.",
"A empresa já havia dito que planeja óculos inteligentes e fones ligados à IA. Pei criticou a corrida do setor: \"Toda a indústria está caçando seu momento iPhone\". Não há data de lançamento firme."]
},
{
title: "Meta acquires AI coding startup Conductor",
tituloPt: "Meta adquire a startup de programação com IA Conductor",
source: "TechCrunch",
url: "https://techcrunch.com/2026/11/04/meta-acquires-ai-coding-startup-conductor/",
imageUrl: "https://techcrunch.com/wp-content/uploads/2026/09/mark-zuckerberg-ray-bans.png?resize=1200,653",
cat:"Tecnologia",stars:3,
resumo:[
"A Meta adquiriu a Conductor, startup que permite a engenheiros de software acionar vários agentes de IA em espaços de trabalho paralelos para atuar em partes diferentes de um projeto. O negócio foi noticiado primeiro pelo Axios e confirmado pela Conductor em seu blog.",
"O fundador e CEO, Charlie Holtz, disse ter \"planos grandes e malucos para a próxima interface\" e que lançará algo novo no início de 2027, trabalhando com Alexandr Wang, chief AI officer da Meta, e Nat Friedman, que lidera produto no Superintelligence Labs.",
"Fundada em 2024, a Conductor usa agentes de laboratórios como Anthropic e OpenAI. Seus recursos principais seguem funcionando até o começo do ano que vem, mas o serviço em nuvem será encerrado em 20 de novembro, quando os dados de usuários na nuvem serão apagados.",
"A aquisição ocorre enquanto a Meta tenta alcançar rivais em programação com IA, após lançar o Muse Code em agosto."]
}
];
const PAL={Branding:["#f97316","#fbbf24","#ef4444"],Design:["#0d9488","#34d399","#065f46"],Tecnologia:["#4f46e5","#a78bfa","#2563eb"]};
function Art({cat,seed}){
 const p=PAL[cat],id="g"+seed,r=n=>((seed*37+n*53)%100);
 return(<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração">
 <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[2]}/></linearGradient></defs>
 <rect width="400" height="240" fill={`url(#${id})`}/>
 <circle cx={80+r(1)*2.5} cy={60+r(2)} r={70+r(3)/2} fill={p[1]} opacity=".55"/>
 <rect x={200+r(4)} y={90+r(5)/2} width="150" height="150" rx="28" fill={p[1]} opacity=".35" transform={`rotate(${r(6)/2} 275 165)`}/>
 <polygon points={`40,240 ${150+r(7)},${100+r(8)} 260,240`} fill="#fff" opacity=".18"/>
 <circle cx={320} cy={50} r="26" fill="#fff" opacity=".3"/></svg>);
}
function Media({item,seed}){
 const [falhou,setFalhou]=useState(false);
 return(<div className="media">{item.imageUrl&&!falhou
  ?<img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
  :<Art cat={item.cat} seed={seed}/>}</div>);
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
function Meta({item}){return(<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><strong>{item.source}</strong><Stars n={item.stars}/></div>);}
function Modal({item,seed,onClose}){
 useEffect(()=>{const h=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",h);return()=>document.removeEventListener("keydown",h)},[]);
 return(<div className="overlay" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
  <Media item={item} seed={seed}/>
  <div className="in"><Meta item={item}/><h2>{item.tituloPt}</h2>
  {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
  {item.paywall&&<p className="note">Artigo com paywall: resumo feito a partir dos elementos públicos da página (título, categoria, indústria e tags).</p>}
  <p className="orig">Título original: {item.title}</p>
  <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) ↗</a>
  <button className="btn alt" onClick={onClose}>Fechar</button></div></div></div>);
}
function App(){
 const [sel,setSel]=useState(null);
 const items=[...NEWS].sort((a,b)=>b.stars-a.stars);
 const [h,...rest]=items;
 return(<div className="wrap">
  <header><h1>☀️ Portal da Manhã</h1><div className="date">quinta-feira, 5 de novembro de 2026</div></header>
  <div className="hero" onClick={()=>setSel(0)}><Media item={h} seed={0}/><div className="body"><Meta item={h}/><h2>{h.tituloPt}</h2><p style={{margin:0,color:"#4b5563"}}>{h.resumo[0].slice(0,190)}…</p><span className="orig">Clique para ler o resumo completo</span></div></div>
  <div className="grid">{rest.map((it,i)=>(<div className="card" key={it.url} onClick={()=>setSel(i+1)}><Media item={it} seed={i+1}/><div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div></div>))}</div>
  {sel!==null&&<Modal item={items[sel]} seed={sel} onClose={()=>setSel(null)}/>}
  <footer>Resumos em português parafraseados pelo Portal da Manhã · Imagens pertencem aos respectivos portais</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
