<html lang="pt-BR">
<head>

<title>Portal da Manhã — 13 de setembro de 2026</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#14161a;
    --ink-2:#4a5058;
    --ink-3:#868d97;
    --line:#e6e5e1;
    --accent:#c2410c;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --shadow-lg:0 2px 4px rgba(20,22,26,.05), 0 24px 60px rgba(20,22,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* ---------- Cabeçalho ---------- */
  header.top{padding:56px 0 32px;border-bottom:1px solid var(--line);margin-bottom:40px}
  .kicker{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:14px;
  }
  h1.brand{
    font-family:'Instrument Serif',Georgia,serif;
    font-weight:400;font-size:clamp(44px,7vw,78px);line-height:1;
    margin:0 0 16px;letter-spacing:-.02em;
  }
  .sub{color:var(--ink-2);font-size:15px;line-height:1.6;max-width:620px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .chip{
    font-size:12px;font-weight:500;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  }

  /* ---------- Manchete ---------- */
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
    display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:44px;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .hero-media{position:relative;min-height:380px;background:#eceae5}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:40px 40px 36px;display:flex;flex-direction:column;justify-content:center}
  .hero h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(28px,3.2vw,40px);line-height:1.12;letter-spacing:-.015em;margin:16px 0 14px;
  }
  .hero p.dek{color:var(--ink-2);font-size:15px;line-height:1.65;margin:0}

  /* ---------- Cards ---------- */
  .section-label{
    display:flex;align-items:center;gap:14px;margin:0 0 22px;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600;
  }
  .section-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px;padding-bottom:60px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .25s cubic-bezier(.2,.7,.3,1), box-shadow .25s;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card-media{height:186px;background:#eceae5;position:relative;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
  .card h3{font-size:17px;line-height:1.32;font-weight:600;margin:12px 0 10px;letter-spacing:-.01em}
  .card p{color:var(--ink-2);font-size:13.5px;line-height:1.6;margin:0 0 16px;flex:1}

  /* ---------- Micro-elementos ---------- */
  .tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{
    font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    padding:4px 9px;border-radius:6px;
  }
  .tag.branding{background:#fdf1e7;color:#b4490d}
  .tag.design{background:#e7f5f1;color:#0f6b58}
  .tag.tech{background:#eceaff;color:#4b3fb0}
  .source{font-size:11.5px;color:var(--ink-3);font-weight:500}
  .stars{font-size:12px;color:#d97706;letter-spacing:1px}
  .stars .off{color:#dcd9d2}
  .foot-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}

  /* ---------- Leitor ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,22,26,.5);backdrop-filter:blur(6px);
    z-index:100;display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  .reader{
    background:var(--card);border-radius:24px;max-width:760px;width:100%;
    box-shadow:0 40px 90px rgba(0,0,0,.28);overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.3,1);
  }
  .reader-media{height:300px;background:#eceae5}
  .reader-media img,.reader-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .reader-body{padding:34px 40px 40px}
  .reader h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(26px,3.4vw,36px);line-height:1.15;letter-spacing:-.015em;margin:14px 0 8px;
  }
  .reader .orig{font-size:13px;color:var(--ink-3);font-style:italic;margin:0 0 22px;line-height:1.5}
  .reader .text p{font-size:16px;line-height:1.75;color:#2b3038;margin:0 0 18px}
  .reader .note{
    font-size:13px;color:var(--ink-2);background:#faf9f6;border:1px solid var(--line);
    border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 16px;line-height:1.6;
  }
  .reader-actions{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
  .btn{
    font-family:inherit;font-size:13.5px;font-weight:600;border-radius:999px;
    padding:11px 20px;cursor:pointer;border:1px solid var(--line);text-decoration:none;
    display:inline-block;transition:.18s;
  }
  .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn-primary:hover{background:#000}
  .btn-ghost{background:#fff;color:var(--ink-2)}
  .btn-ghost:hover{background:#f2f1ed}

  footer.bot{border-top:1px solid var(--line);padding:32px 0 60px;color:var(--ink-3);font-size:12.5px;line-height:1.7}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:230px;height:230px}
    .hero-body{padding:26px 24px 30px}
    .reader-body{padding:26px 24px 32px}
    .reader-media{height:210px}
    header.top{padding:36px 0 26px;margin-bottom:30px}
  }
</style>
</head>

/* ---------- Ilustração de fallback ---------- */
function Ilustracao({ categoria, seed }) {
  const paletas = {
    "Branding": ["#f7b267", "#f4845f", "#e05b3a", "#fde8d4"],
    "Design":   ["#5eead4", "#14b8a6", "#0f766e", "#dcf5ef"],
    "Tecnologia": ["#a5b4fc", "#6366f1", "#4338ca", "#e7e6ff"]
  };
  const p = paletas[categoria] || paletas["Design"];
  const id = "g" + seed;
  const r = (n) => ((seed * 37 + n * 91) % 100) / 100;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" role="img"
         aria-label={"Ilustração gerada para a categoria " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[3]} />
          <stop offset="100%" stopColor={p[0]} />
        </linearGradient>
        <linearGradient id={id + "b"} x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stopColor={p[1]} />
          <stop offset="100%" stopColor={p[2]} />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#" + id + ")"} />
      <circle cx={70 + r(1) * 200} cy={60 + r(2) * 120} r={50 + r(3) * 45}
              fill={"url(#" + id + "b)"} opacity="0.75" />
      <rect x={30 + r(4) * 190} y={110 + r(5) * 80} width={70 + r(6) * 90} height={40 + r(7) * 60}
            rx="14" fill={p[2]} opacity="0.32" transform={"rotate(" + (r(8) * 30 - 15) + " 200 160)"} />
      <path d={"M0 " + (200 + r(9) * 40) + " Q 100 " + (150 + r(10) * 60) + " 200 " + (195 + r(11) * 40) +
               " T 400 " + (185 + r(12) * 45) + " L400 260 L0 260 Z"}
            fill={p[1]} opacity="0.4" />
      <circle cx={300 + r(13) * 70} cy={50 + r(14) * 50} r={12 + r(15) * 16} fill="#fff" opacity="0.5" />
    </svg>
  );
}

function Midia({ item, idx }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={idx + 3} />;
  return (
    <img src={item.imageUrl}
         alt={item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)} />
  );
}

function Estrelas({ n }) {
  return (
    <span className="stars" aria-label={n + " de 5 estrelas"}>
      {[1,2,3,4,5].map(i =>
        <span key={i} className={i <= n ? "" : "off"}>★</span>
      )}
    </span>
  );
}

function TagCat({ categoria }) {
  const cls = categoria === "Branding" ? "branding" : categoria === "Design" ? "design" : "tech";
  return <span className={"tag " + cls}>{categoria}</span>;
}

function Leitor({ item, idx, fechar }) {
  return (
    <div className="overlay" onClick={fechar} role="dialog" aria-modal="true">
      <div className="reader" onClick={(e) => e.stopPropagation()}>
        <div className="reader-media"><Midia item={item} idx={idx} /></div>
        <div className="reader-body">
          <div className="tagline">
            <TagCat categoria={item.categoria} />
            <span className="source">{item.source} · {item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="text">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {item.paywall &&
            <p className="note">
              Boa parte do conteúdo desta matéria está restrita a assinantes do {item.source}.
              O resumo acima foi escrito apenas a partir dos elementos públicos da página — título,
              categoria editorial, data, indústria e tags.
            </p>}
          <div className="reader-actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn btn-ghost" onClick={fechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

                <div className="tagline">
                  <TagCat categoria={item.categoria} />
                  <span className="source">{item.source} · {item.data}</span>
                </div>
                <h3>{item.tituloPt}</h3>
                <p>{item.resumo[0].slice(0, 150)}…</p>
                <div className="foot-row">
                  <Estrelas n={item.estrelas} />
                  <span className="source">Ler resumo →</span>
                </div>
              </div>
            </div>
          ))}
        </div>

        <footer className="bot">
          Portal da Manhã · edição de 13 de setembro de 2026. Todos os resumos são versões
          em português escritas a partir da leitura das matérias originais — nenhum texto foi
          copiado das fontes. Imagens de destaque carregadas diretamente dos servidores dos
          respectivos portais e pertencentes aos seus detentores de direitos. Clique no título
          de qualquer item para acessar a reportagem completa na fonte.
        </footer>
      </div>

      {aberto !== null &&
        <Leitor item={itens[aberto]} idx={aberto} fechar={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
