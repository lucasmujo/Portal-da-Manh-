const PALETAS = {
  "Branding": ["#F6C177","#E0533D","#B33F28"],
  "Design":   ["#8FD3B6","#2E9E7E","#14614C"],
  "Tecnologia":["#A5A0F0","#6C5CE7","#3B2E9E"]
};

function Ilustracao({categoria, seed}){
  const p = PALETAS[categoria] || PALETAS["Design"];
  const id = "g"+seed;
  const r = (n)=> ((seed*37 + n*61) % 100);
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label={"Ilustração gerada para a categoria "+categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="55%" stopColor={p[1]}/>
          <stop offset="100%" stopColor={p[2]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#"+id+")"}/>
      <circle cx={60+r(1)*2.4} cy={40+r(2)*1.3} r={54+r(3)*0.5} fill="#fff" opacity="0.13"/>
      <circle cx={300-r(4)*1.2} cy={190-r(5)*0.8} r={38+r(6)*0.4} fill="#fff" opacity="0.10"/>
      <rect x={40+r(7)} y={150-r(8)*0.5} width="120" height="120" rx="18" fill="#fff" opacity="0.10" transform={"rotate("+(r(9)/4-12)+" 100 200)"}/>
      <path d={"M0 "+(210-r(10)*0.6)+" C 100 "+(150+r(11))+", 220 "+(250-r(12))+", 400 "+(180-r(13)*0.4)+" L400 260 L0 260 Z"} fill="#fff" opacity="0.12"/>
      <g opacity="0.22" fill="#fff">
        <circle cx="330" cy="50" r="5"/><circle cx="350" cy="50" r="5"/><circle cx="370" cy="50" r="5"/>
        <circle cx="330" cy="70" r="5"/><circle cx="350" cy="70" r="5"/><circle cx="370" cy="70" r="5"/>
      </g>
    </svg>
  );
}

function Midia({item, idx}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={idx+1}/>;
  }
  return (
    <img src={item.imageUrl}
         referrerPolicy="no-referrer"
         loading="lazy"
         alt={item.tituloPt}
         onError={()=>setFalhou(true)} />
  );
}

const Estrelas = ({n}) => <span className="stars" title={n+" de 5"}>{"★".repeat(n)}<span style={{color:"#ddd"}}>{"★".repeat(5-n)}</span></span>;
const Tag = ({c}) => <span className={"tag "+(c==="Branding"?"branding":c==="Design"?"design":"tech")}>{c}</span>;

function Modal({item, idx, onClose}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-media"><Midia item={item} idx={idx}/></div>
        <div className="closebar"><button className="xbtn" onClick={onClose} aria-label="Fechar">✕</button></div>
        <div className="modal-body" style={{paddingTop:6}}>
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <Tag c={item.categoria}/><Estrelas n={item.estrelas}/>
            <span style={{fontSize:13,color:"var(--muted)"}}>{item.source} · {item.data}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p,i)=><p className="body" key={i}>{p}</p>)}
          {item.paywall && <div className="note">Este artigo está atrás de assinatura. O resumo acima foi escrito a partir dos elementos públicos da página — título, categoria editorial, indústria e tags.</div>}
          {!item.imageUrl && <div className="note">O portal não expôs imagem de destaque nesta matéria; a ilustração acima foi gerada para esta edição.</div>}
          <div className="modal-actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} →</a>
            <button className="btn btn-ghost" onClick={onClose}>Voltar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const ordenadas = NOTICIAS.slice().sort((a,b)=>b.estrelas-a.estrelas);
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);
  const portais = Array.from(new Set(NOTICIAS.map(n=>n.source)));

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de quinta-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="datelabel">17 de setembro de 2026 · branding, design e tecnologia das últimas 24 horas</div>
        <div className="meta-row">
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais.length} portais</span>
          {portais.map(p=><span className="pill" key={p}>{p}</span>)}
        </div>
      </header>

      <div className="lede" onClick={()=>setAberto(0)}>
        <div className="lede-media"><Midia item={manchete} idx={0}/></div>
        <div className="lede-body">
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <Tag c={manchete.categoria}/><Estrelas n={manchete.estrelas}/>
          </div>
          <h2 className="lede-title">{manchete.tituloPt}</h2>
          <p className="dek">{manchete.resumo[0].slice(0,190)}…</p>
          <div className="srcline"><strong style={{color:"var(--ink)"}}>{manchete.source}</strong> · {manchete.data} · clique para ler o resumo</div>
        </div>
      </div>

      <div className="grid">
        {resto.map((item,i)=>(
          <div className="card" key={item.url} onClick={()=>setAberto(i+1)}>
            <div className="card-media"><Midia item={item} idx={i+1}/></div>
            <div className="card-body">
              <div><Tag c={item.categoria}/></div>
              <h3 className="card-title">{item.tituloPt}</h3>
              <div className="card-foot">
                <span><strong style={{color:"var(--ink)"}}>{item.source}</strong> · {item.data}</span>
                <Estrelas n={item.estrelas}/>
              </div>
            </div>
          </div>
        ))}
      </div>

      <footer>
        Portal da Manhã · edição automática de 17 de setembro de 2026 · resumos em português escritos para esta edição, sem reprodução do texto original.
      </footer>

      {aberto!==null && <Modal item={ordenadas[aberto]} idx={aberto} onClose={()=>setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
