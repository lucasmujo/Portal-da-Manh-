<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 30 de outubro de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#17171a;--mut:#6b6b73;--line:#e8e6e1;--acc:#e8590c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:26px}
h1{margin:0;font-size:34px;letter-spacing:-.02em}
.date{color:var(--mut);font-size:15px;text-transform:capitalize}
.hero{display:grid;grid-template-columns:1.25fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.07);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:26px}
.hero:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(0,0,0,.1)}
.hero .img{min-height:340px}
.hero .body{padding:30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 14px rgba(0,0,0,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.card .img{height:190px}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:18px;line-height:1.3}
.img{position:relative;background:#eee;overflow:hidden}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.tag{padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px}
.Branding{background:#fff0e6;color:#c2410c}.Design{background:#e0f5f0;color:#0f766e}.Tecnologia{background:#ebe9ff;color:#4338ca}
.stars{color:#f59f00;letter-spacing:1px}
.ov{position:fixed;inset:0;background:rgba(20,20,25,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px;z-index:10;animation:f .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .3s}
.modal .img{height:340px}
.modal .in{padding:26px 30px 32px}
.modal h2{margin:8px 0 12px;font-size:26px;line-height:1.25}
.modal p{font-size:16.5px;margin:0 0 14px}
.btn{display:inline-block;background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px;margin-right:8px;border:0;cursor:pointer}
.btn.l{background:#eee;color:var(--ink)}
.note{font-size:13px;color:var(--mut);font-style:italic;margin-top:10px}
.aviso{font-size:12px;color:#b45309}
@keyframes f{from{opacity:0}to{opacity:1}}@keyframes u{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
footer{margin-top:36px;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:27px}.modal .img{height:210px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
const DATA = [
{
 title: "New Logo and Identity for London Film School by Rabbithole",
 tituloPt: "Novo logo e identidade da London Film School, assinados pela Rabbithole",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_london_film_school_by_rabbithole.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/LFS_Logo_before_after.jpg",
 cat: "Branding", stars: 5, paywall: true,
 resumo: ["A tradicional London Film School, uma das escolas de cinema mais conhecidas do Reino Unido, apresentou um novo logo e uma nova identidade visual criados pela agência Rabbithole. O projeto foi analisado pelo Brand New sob o título “The Reel Deal”, em um trocadilho com o universo do cinema, e foi publicado em 29 de outubro.","Pelos elementos públicos da análise, a identidade gira em torno de uma paleta de preto e vermelho e de uma tipografia sem serifa, com referências temáticas a cinema e a Londres. A página mostra a comparação do antes e depois do logotipo e um exemplo de aplicação da marca.","O caso é relevante porque instituições de ensino criativo costumam equilibrar tradição e contemporaneidade, e a mudança reposiciona a escola para uma nova geração de cineastas."]
},
{
 title: "New Logo and Identity for CrazyGames by DixonBaxi",
 tituloPt: "Novo logo e identidade da CrazyGames, assinados pela DixonBaxi",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_crazygames_by_dixonbaxi.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/crazy_games_logo_before_after.png",
 cat: "Branding", stars: 4, paywall: true,
 resumo: ["A plataforma de jogos online CrazyGames ganhou um novo logo e uma nova identidade desenvolvidos pela consultoria de design DixonBaxi, em post do Brand New de 28 de outubro intitulado “When They Zig, You Ziggy”.","As categorias e tags do post (entretenimento, 3D, mascote, ícone e games) indicam uma identidade apoiada em elementos tridimensionais e em um personagem, algo comum em marcas de jogos que buscam afeto e reconhecimento imediato.","A análise completa está atrás de paywall; por isso, o texto se limita a esses elementos públicos, com a comparação visual entre o logo antigo e o novo."]
},
{
 title: "AI is compounding branding's bullshit problem",
 tituloPt: "Rob Meyerson: a IA está agravando o problema de besteiras do branding",
 source: "The Drum",
 url: "https://www.thedrum.com/opinion/ai-is-compounding-branding-s-bullshit-problem",
 imageUrl: "https://thedrum-media.imgix.net/thedrum-user-assets-prod/s3/images/original/adobestock-1204407270.jpg?w=1280&ar=default&fit=crop&crop=faces&auto=format",
 cat: "Branding", stars: 4, paywall: false,
 resumo: ["Em artigo de opinião publicado em 29 de outubro, Rob Meyerson, consultor de marcas e fundador da agência de naming e estratégia Heirloom, argumenta que ferramentas de IA estão espalhando velhos mitos do branding com uma confiança que não merecem.","Segundo ele, o setor tem pouca formação formal e licenciamento, de modo que muitos frameworks repetidos à exaustão se apoiam em anedotas e pseudociência. Os exemplos são a ideia de que toda marca precisa encontrar seu “porquê”, a de que cores carregam emoções fixas e a de que personalidades de marca cabem em doze arquétipos atribuídos a Jung.","Ele cita três respostas de chatbots: uma endossa a tese de Simon Sinek sobre propósito, apesar de pesquisadores como Byron Sharp e Mark Ritson a contestarem; outra repete tabelas de psicologia das cores; e outra atribui a Jung os arquétipos Herói, Sábio e Cuidador, quando eles vêm de um livro de marketing de 2001.","Meyerson admite ter usado esses modelos no início da carreira e pede que profissionais baseiem a estratégia em pesquisa acadêmica e nas particularidades de cada cliente, e que questionem os mitos, inclusive avaliando mal as respostas da IA que os repetem."]
},
{
 title: "New Logo and Packaging for Biela by Elmwood",
 tituloPt: "Novo logo e embalagem da Biela, assinados pela Elmwood",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_packaging_for_biela_by_elmwood.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/biela_logo_before_after.png",
 cat: "Branding", stars: 3, paywall: true,
 resumo: ["A agência Elmwood redesenhou o logo e a embalagem da Biela, marca equatoriana de bens de consumo, em post do Brand New de 29 de outubro chamado “Out with the Old, in with the Cold”.","As tags do projeto apontam para um esquema de cores dourado, um motivo espinhoso e a ligação com o Equador. O post traz comparações do antes e depois tanto do logotipo quanto da embalagem.","O conteúdo completo da crítica está sob paywall, então este resumo se restringe ao que é público."]
},
{
 title: "Herzog & de Meuron to convert former Birkenstock warehouse into the Eames Institute museum",
 tituloPt: "Herzog & de Meuron vai converter antigo galpão da Birkenstock no museu do Eames Institute",
 source: "Designboom",
 url: "https://www.designboom.com/architecture/herzog-de-meuron-eames-institute-museum-birkenstock-warehouse-novato/",
 imageUrl: "https://www.designboom.com/twitterimages/uploads/2026/10/herzog-de-meuron-eames-institute-museum-birkenstock-warehouse-novato-designboom-5.jpg",
 cat: "Design", stars: 5, paywall: false,
 resumo: ["O escritório Herzog & de Meuron vai transformar o antigo campus da Birkenstock em Novato, no condado de Marin, na Califórnia, na futura sede do museu do Eames Institute. A ideia é preservar a cobertura de concreto escultural, formada por cascas repetidas em paraboloide hiperbólico, projetada originalmente por Jan Lubicz-Nycz para a editora McGraw-Hill, com engenharia estrutural de Raj Desai.","A EHDD, de San Francisco, atua como arquiteta executiva, e a Field Operations desenha a paisagem de cerca de 88 acres. O programa inclui galerias, oficinas, teatro e jardins, com um acervo que cobre design industrial, pintura, escultura e outras áreas, tendo o legado dos Eames como ponto de partida.","Por dentro, um grande salão central mantém a geometria da cobertura visível. Um pátio de entrada recortado em um talude leva ao edifício, e uma passarela de aço refletivo cria um percurso elevado. Estúdios de madeira e cerâmica ficam ao lado de galerias flexíveis para que o público veja o trabalho criativo acontecendo.","As fachadas de vidro recuadas criam áreas externas cobertas, e dez jardins serão ligados por caminhos com espécies nativas como carvalho, manzanita e papoula-da-Califórnia. O Instituto comprou o terreno em 2025, o masterplan foi enviado à prefeitura de Novato, as obras principais começam em 2028 e a inauguração é prevista para 2030."]
},
{
 title: "This Disposable Camera is made from Mycelium not Single-use Plastic",
 tituloPt: "Esta câmera descartável é feita de micélio, não de plástico de uso único",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/29/this-disposable-camera-is-made-from-mycelium-not-single-use-plastic/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/draft-soft-pixel/soft_pixel_camera_1.jpeg",
 cat: "Design", stars: 4, paywall: false,
 resumo: ["A Soft-pixel é uma câmera digital conceitual do designer Sree Krishna Pillarisetti, um produtor de cogumelos do Brooklyn. A carcaça combina micélio, cânhamo e o bioplástico PHA, e a proposta é ser uma espécie de sucessora espiritual das câmeras descartáveis, mas com a eletrônica feita para durar e apenas a casca pensada para ser descartada.","As fotos ficam guardadas localmente em um cartão microSD, não na nuvem. O projeto vem da tese Soft-Drive, feita na Parsons com uma casca semelhante em PLA, e a Soft-pixel recebeu o prêmio de melhor eco-design no European Product Design Award 2026 e um Top Design na categoria câmeras digitais.","O artigo faz ressalvas: a compostabilidade do PHA depende da formulação e das condições, então a casca não é automaticamente segura para compostagem doméstica. Visualmente, há uma camada externa translúcida que deixa ver o interior fibroso, tela quadrada, quatro botões direcionais e parafusos expostos, indicando que o usuário pode abrir o aparelho.","Não há dados de sensor, resolução, bateria, preço ou lançamento, então o produto segue como conceito."]
},
{
 title: "Nike ACG x Helinox's 1.2-Pound Chair Refuses to Blend In",
 tituloPt: "Cadeira de 540 g da Nike ACG com Helinox se recusa a passar despercebida",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/29/nike-acg-x-helinoxs-1-2-pound-chair-refuses-to-blend-in/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/nike-acg-x-helinoxs-1-2-pound-chair-refuses-to-blend-in/helinox-01.jpg",
 cat: "Design", stars: 3, paywall: false,
 resumo: ["Nike ACG e Helinox lançam uma versão da Chair Zero LT, cadeira de camping ultraleve. O desenho deixa a estrutura à mostra, com acabamento laranja nas varetas e assento translúcido. O peso embalado é de 534 gramas e a capacidade é de cerca de 120 kg.","A cadeira usa a plataforma existente da Helinox, com varetas de alumínio DAC TH72M e conectores de resina de nylon. O tecido Ghostgrid é uma malha monofilamento translúcida com grade de ripstop que, segundo a marca, impede a propagação de pequenos rasgos. Uma faixa X-Strap sob as pernas amplia a base em areia, terra ou grama.","O autor aponta limites: a Helinox recomenda superfície plana e firme e carga bem distribuída, e a altura de assento de cerca de 18 cm é pensada para pessoas de até 1,75 m, o que pode incomodar quem tem dificuldade para levantar.","O preço de teaser nos EUA é US$ 169,95 (contra US$ 159,95 do modelo comum), com revelação completa em 2 de novembro de 2026 e envio ainda não confirmado."]
},
{
 title: "An Italian Folding Bicycle Design that Fits Into a Suitcase",
 tituloPt: "Uma bicicleta dobrável italiana que cabe dentro de uma mala",
 source: "Core77",
 url: "https://www.core77.com/posts/145766/An-Italian-Folding-Bicycle-Design-that-Fits-Into-a-Suitcase",
 imageUrl: "https://s3files.core77.com/blog/images/lead_n_spotlight/1855426_lead_400_145766_.jpg",
 cat: "Design", stars: 3, paywall: false,
 resumo: ["O Core77 resgata a T&C Pocket Bici, bicicleta dobrável de 1963 fabricada pela metalúrgica italiana Tresoldi & Casiraghi. Ao contrário das dobráveis atuais, que se separam em duas metades, este projeto recolhe todos os componentes dentro de um quadro alongado em formato de laço.","Depois de dobrada, a bicicleta cabe dentro de uma mala própria, combinando com ela. As fotos mostram uma Brompton ao lado para dar escala.","A origem do modelo é nebulosa: um leilão diz que foi feita para o mercado chinês, com 2.500 unidades vendidas, enquanto o BikeFlip conta que um comprador chinês encomendou 2.000, mas o pagamento não chegou depois das primeiras 1.000 e o projeto foi cancelado. O autor achou apenas um vídeo da bicicleta sendo desdobrada, de um canal chinês, o que sugere que algumas unidades chegaram ao destino."]
},
{
 title: "Granola crunches up a dictation feature to compete with Wispr",
 tituloPt: "Granola lança recurso de ditado para competir com a Wispr",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/29/granola-crunches-up-a-dictation-feature-to-compete-with-wispr/",
 imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/Granola.jpg?resize=1200,675",
 cat: "Tecnologia", stars: 3, paywall: false,
 resumo: ["A Granola, conhecida pelo assistente de IA que faz anotações de reuniões, adicionou um recurso de ditado para concorrer com a Wispr, que nasceu no ditado e recentemente incluiu notas de reunião. O recurso está disponível no Mac: o usuário segura a tecla Fn, fala, e a ferramenta limpa e formata o texto antes de inseri-lo.","Como funciona em qualquer app, serve para notas, prompts de IA e respostas a e-mails e mensagens. Versões para iOS e Windows devem chegar em breve.","A Granola é avaliada em US$ 1,5 bilhão e a Wispr em US$ 2 bilhões. A matéria vê uma convergência entre apps de voz: Fireflies, Speechify e Monologue também uniram notas de reunião e ditado, depois de um período em que startups preferiam ferramentas de função única."]
},
{
 title: "Meta quietly launches an AI fashion app called Style Sketch",
 tituloPt: "Meta lança discretamente Style Sketch, app de moda com IA",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/29/meta-quietly-launches-an-ai-fashion-app-called-style-sketch/",
 imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/meta-style-sketch.png?resize=1200,625",
 cat: "Tecnologia", stars: 2, paywall: false,
 resumo: ["A Meta lançou sem alarde o Style Sketch, app de estilo com IA que sugere looks a partir das roupas que o usuário já tem. O guarda-roupa digital é montado com fotos de posts do Instagram ou com itens adicionados por foto, vídeo curto ou rolo da câmera.","O app propõe combinações no estilo da pessoa, oferece provador virtual em um modelo que deve corresponder ao corpo e ao tom de pele do usuário e permite partir de uma peça para gerar ideias. Para viagens, cria um plano de looks dia a dia conforme destino, duração, atividades e previsão do tempo.","Foi descoberto pelo consultor Matt Navarra e está disponível só na Indonésia, Singapura e Tailândia, em iOS e Android. A Meta não comentou. A matéria lembra que concorrentes como Alta e Google Fotos já oferecem algo parecido, e que a vantagem da Meta seria a integração com o Instagram."]
}
];
DATA.sort((a,b)=>b.stars-a.stars);

const PAL={Branding:["#f97316","#fbbf24","#e11d48"],Design:["#0d9488","#34d399","#0e7490"],Tecnologia:["#4f46e5","#8b5cf6","#38bdf8"]};
function Ilustra({cat,seed}){
  const p=PAL[cat]||PAL.Design; const s=[...seed].reduce((a,c)=>a+c.charCodeAt(0),0);
  const r=n=>((s*(n+7))%97)/97;
  const id="g"+s;
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração de "+cat}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[2]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#"+id+")"}/>
    <circle cx={80+r(1)*240} cy={60+r(2)*100} r={50+r(3)*50} fill={p[1]} opacity=".55"/>
    <rect x={20+r(4)*200} y={110+r(5)*60} width={120+r(6)*80} height={90} rx="18" fill="#fff" opacity=".25" transform={"rotate("+(r(7)*30-15)+" 200 150)"}/>
    <polygon points={`${300+r(8)*60},20 ${380},${120+r(9)*40} ${260},${140}`} fill="#fff" opacity=".2"/>
    <circle cx={330} cy={200} r={34+r(10)*20} fill="none" stroke="#fff" strokeWidth="6" opacity=".4"/>
  </svg>);
}
function Imagem({item}){
  const [falhou,setFalhou]=useState(false);
  return (<div className="img">
    {item.imageUrl && !falhou
      ? <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
      : <Ilustra cat={item.cat} seed={item.title}/>}
  </div>);
}
const Estrelas=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
function Meta({item}){return (<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><strong>{item.source}</strong><Estrelas n={item.stars}/></div>);}
function Modal({item,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);return()=>document.removeEventListener("keydown",k)},[]);
  return (<div className="ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <Imagem item={item}/>
    <div className="in"><Meta item={item}/>
      <h2>{item.tituloPt}</h2>
      {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
      {item.paywall && <div className="note">Observação: a matéria original está atrás de paywall; o resumo foi escrito a partir dos elementos públicos (título, categoria, tags e imagens).</div>}
      <p style={{marginTop:18}}><a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a><button className="btn l" onClick={onClose}>Fechar</button></p>
    </div></div></div>);
}
function App(){
  const [sel,setSel]=useState(null);
  const [h,...resto]=DATA;
  const hoje=new Date(2026,9,30).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  return (<div className="wrap">
    <header><h1>☀️ Portal da Manhã</h1><div className="date">{hoje}</div></header>
    <div className="hero" onClick={()=>setSel(h)}>
      <Imagem item={h}/>
      <div className="body"><Meta item={h}/><h2>{h.tituloPt}</h2><span style={{color:"var(--mut)"}}>{h.resumo[0].slice(0,190)}…</span><span style={{color:"var(--acc)",fontWeight:600}}>Abrir resumo →</span></div>
    </div>
    <div className="grid">{resto.map(it=>(
      <div className="card" key={it.url} onClick={()=>setSel(it)}>
        <Imagem item={it}/>
        <div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div>
      </div>))}</div>
    <footer>Resumos escritos em português a partir das matérias originais. Clique em um card para abrir.</footer>
    {sel && <Modal item={sel} onClose={()=>setSel(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
