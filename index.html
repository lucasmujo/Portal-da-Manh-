.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.05);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}

.card h3{font-size:17px;line-height:1.3;margin:0}
.img{position:relative;width:100%;overflow:hidden;background:#eee}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.tag{padding:2px 10px;border-radius:99px;font-weight:600;font-size:12px;color:#fff}
.tag.Branding{background:#e4572e}.tag.Design{background:#14a38b}.tag.Tecnologia{background:#5b5bd6}
.stars{color:#f0a500;letter-spacing:1px}
.sub{color:var(--mute);font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(20,18,15,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 14px;z-index:10;animation:fade .25s}
.modal{background:var(--card);border-radius:24px;max-width:760px;width:100%;overflow:hidden;animation:up .3s ease;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .img{height:320px}
.modal .in{padding:26px 30px 32px}
.modal h2{font-size:26px;line-height:1.2;margin:8px 0 4px}
.modal p{font-size:16px;color:#34322e}
.close{position:sticky;float:right;top:12px;margin:12px;border:0;background:rgba(255,255,255,.92);border-radius:99px;width:38px;height:38px;font-size:20px;cursor:pointer;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 20px;border-radius:99px;font-weight:600;font-size:14px}
.note{font-size:13px;color:var(--mute);font-style:italic}
footer{margin-top:36px;text-align:center;color:var(--mute);font-size:13px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:26px}.modal .img{height:210px}.modal .in{padding:20px}}

const PALETAS = {
  Branding: [["#ff9a5a","#e4572e"],["#ffd36e","#d9480f"],["#ff7e8b","#b5179e"]],
  Design: [["#5ee0c0","#0b7a6b"],["#9be37a","#14a38b"],["#6bd6e6","#0f766e"]],
  Tecnologia: [["#7aa7ff","#4c3fd1"],["#b08cff","#2f2a9c"],["#6fd0ff","#5b5bd6"]]
};

function Ilustracao({ item, idx }) {
  const p = PALETAS[item.categoria][idx % 3];
  const id = "g" + idx;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração: " + item.tituloPt}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stopColor={p[0]} /><stop offset="1" stopColor={p[1]} />
        </linearGradient>
      </defs>
      <rect width="400" height="240" fill={`url(#${id})`} />
      <circle cx={80 + (idx * 37) % 200} cy="70" r="90" fill="#fff" opacity=".14" />
      <circle cx={300 - (idx * 23) % 120} cy="190" r="70" fill="#fff" opacity=".18" />
      <rect x="150" y="60" width="130" height="130" rx="26" fill="#fff" opacity=".2" transform={`rotate(${15 + idx * 9} 215 125)`} />
      <polygon points="40,220 120,120 200,220" fill="#000" opacity=".12" />
    </svg>
  );
}

function Imagem({ item, idx, className }) {
  const [falhou, setFalhou] = useState(false);
  const mostrarSvg = !item.imageUrl || falhou;
  return (
    <div className={"img " + (className || "")}>
      {mostrarSvg
        ? <Ilustracao item={item} idx={idx} />
        : <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />}
    </div>
  );
}

const Estrelas = ({ n }) => <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;

function Meta({ item }) {
  return (
    <div className="meta">
      <span className={"tag " + item.categoria}>{item.categoria}</span>
      <Estrelas n={item.estrelas} />
      <span>{item.source} · {item.data}</span>
    </div>
  );
}

function Detalhe({ item, idx, onClose }) {
  useEffect(() => {
    const h = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    document.body.style.overflow = "hidden";
    return () => { window.removeEventListener("keydown", h); document.body.style.overflow = ""; };
  }, []);
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <Imagem item={item} idx={idx} />
        <div className="in">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <div className="sub">{item.title}</div>
          <div style={{ marginTop: 14 }}>{item.resumo.map((t, i) => <p key={i}>{t}</p>)}</div>
          {item.paywall && <p className="note">Matéria atrás de paywall: resumo feito a partir dos elementos públicos (título, indústria e tags).</p>}
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);
  const lista = [...NOTICIAS].sort((a, b) => b.estrelas - a.estrelas);
  const [top, ...resto] = lista;
  return (
    <div className="wrap">
      <header>
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">sexta-feira, 9 de outubro de 2026 · {lista.length} notícias</div>
      </header>
      <div className="hero" onClick={() => setAberta(0)}>
        <Imagem item={top} idx={0} />
        <div className="txt">
          <Meta item={top} />
          <h2>{top.tituloPt}</h2>
          <div className="sub">{top.resumo[0].slice(0, 190)}…</div>
        </div>
      </div>
      <div className="grid">
        {resto.map((n, i) => (
          <article className="card" key={n.url} onClick={() => setAberta(i + 1)}>
            <Imagem item={n} idx={i + 1} />
            <div className="body"><Meta item={n} /><h3>{n.tituloPt}</h3></div>
          </article>
        ))}
      </div>
      <footer>Resumos escritos em português a partir das matérias originais. Clique em um card para ler.</footer>
      {aberta !== null && <Detalhe item={lista[aberta]} idx={aberta} onClose={() => setAberta(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
