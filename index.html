<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 25 de agosto de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#14161a;
    --ink-soft:#5b6169;
    --line:#e6e5e1;
    --accent:#d8452e;
    --radius:20px;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 28px rgba(20,22,26,.06);
    --shadow-lg:0 2px 6px rgba(20,22,26,.06), 0 24px 60px rgba(20,22,26,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  a{color:inherit}
  .hdr{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:32px}
  .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .logo{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,58px);letter-spacing:-.02em;margin:10px 0 8px;line-height:1}
  .sub{color:var(--ink-soft);font-size:15px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:.18s}
  .chip:hover{border-color:#c9c7c1}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .lead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.25s;margin-bottom:34px;display:grid;grid-template-columns:1.15fr 1fr}
  .lead:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .lead-media{position:relative;min-height:340px;background:#eceae5}
  .lead-body{padding:34px}
  .lead h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,3vw,36px);line-height:1.15;margin:12px 0 14px;letter-spacing:-.01em}
  .lead p{color:var(--ink-soft);font-size:15.5px;line-height:1.6;margin:0}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.25s;display:flex;flex-direction:column}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
  .card-media{position:relative;height:186px;background:#eceae5}
  .card-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-size:17.5px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.01em}
  .card p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.55}

  img.ph{width:100%;height:100%;object-fit:cover;display:block}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
  .src{font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-size:11.5px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft);font-weight:500}
  .stars{color:#e0a32e;letter-spacing:1px;font-size:12.5px}
  .dim{color:#c8c6c1}
  .foot{margin-top:auto;padding-top:6px}

  .ov{position:fixed;inset:0;background:rgba(20,22,26,.42);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;z-index:50;overflow-y:auto;animation:fade .2s ease}
  .modal{background:#fff;max-width:820px;width:100%;border-radius:24px;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
  .modal-media{height:330px;background:#eceae5;position:relative}
  .modal-body{padding:34px}
  .modal h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(23px,3.4vw,33px);line-height:1.16;margin:14px 0 18px;letter-spacing:-.01em}
  .modal .txt p{font-size:16px;line-height:1.72;color:#2c3037;margin:0 0 15px}
  .note{font-size:13px;color:var(--ink-soft);background:#f6f6f4;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}
  .btn{display:inline-block;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;transition:.18s}
  .btn:hover{opacity:.86}
  .btn.ghost{background:#fff;color:var(--ink)}
  .x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:18px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.14);line-height:1}
  .footer{margin-top:56px;padding-top:26px;border-top:1px solid var(--line);color:var(--ink-soft);font-size:13px;line-height:1.7}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @media(max-width:820px){
    .lead{grid-template-columns:1fr}
    .lead-media{min-height:230px}
    .lead-body{padding:24px}
    .modal-media{height:220px}
    .modal-body{padding:24px}
  }
</style>
</head>

      "Há também uma correção estratégica. Numa atualização de 2019, a Walkers rebrandou a Monster Munch junto com Quavers, Wotsits e Squares, plantando um logo grande da Walkers na frente da embalagem e ligando visualmente a linha a um portfólio mais amplo. Na prática, isso roubava espaço de uma marca legada que já se sustentava sozinha. A nova versão reverte o movimento: não há mais logo da Walkers na frente do pacote.",

    resumo: [

    paywall: false,
    resumo: [
      "O designer Simon Weckert criou uma camisa colorida que, segundo ele, não é detectada por sistemas de vídeo baseados em inteligência artificial. O projeto, batizado de Digital Camouflage, nasceu como resposta direta ao piloto de vigilância por IA que a polícia começa a operar neste mês no Kottbusser Tor, em Berlim.",
      "O raciocínio parte de uma leitura crítica de como esses sistemas funcionam. Para Weckert, modelos de detecção nunca aprenderam o que é um ser humano — aprenderam com que aparência humanos costumam surgir, estatisticamente, em milhões de imagens de treino. Nas camadas iniciais da rede há bordas, contrastes e gradientes de textura; mais fundo, padrões parciais: a silhueta de cabeça e ombros, a proporção dos membros contra um tronco, a continuidade do contorno do corpo contra o fundo. 'Uma pessoa, para a máquina, é um pacote de estatísticas visuais — e é exatamente aí que está a fraqueza dela.'",
      "A camisa combina cores saturadas e formas sobrepostas, e o designer insiste que o efeito depende da interação entre as duas coisas, não de uma isolada. As transições de cor disparam forte nas camadas iniciais da rede, enquanto as formas sobrepostas quebram a continuidade do contorno corporal, impedindo o detector de amarrar as partes numa única figura. Nas palavras dele, o padrão 'grita por cima do sussurro estatístico que diz: pessoa'. Para o olho humano, é um têxtil quase hipnótico; para o modelo, não é nada.",

    resumo: [

const PALETAS = {
  "Branding":   {a:"#f3b64c", b:"#d8452e", c:"#8c2f6b"},
  "Design":     {a:"#3fbf9a", b:"#1f8f7e", c:"#0e4f57"},
  "Tecnologia": {a:"#6ea8ff", b:"#4a5bd8", c:"#5b2f9e"}
};

function Ilustracao({categoria, seed, alt}){
  const p = PALETAS[categoria] || PALETAS["Design"];
  const s = (seed * 37) % 100;
  const gid = "g" + seed;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} role="img" aria-label={alt}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.a}/>
          <stop offset="55%" stopColor={p.b}/>
          <stop offset="100%" stopColor={p.c}/>
        </linearGradient>
        <radialGradient id={gid+"r"} cx="0.3" cy="0.25" r="0.8">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#ffffff" stopOpacity="0"/>
        </radialGradient>
      </defs>
      <rect width="400" height="240" fill={`url(#${gid})`}/>
      <rect width="400" height="240" fill={`url(#${gid}r)`}/>
      <circle cx={70 + s} cy={70 + (s%40)} r={62 - (s%22)} fill="#fff" opacity="0.16"/>
      <circle cx={310 - (s%60)} cy={180 - (s%50)} r={46 + (s%26)} fill="#000" opacity="0.10"/>
      <path d={`M0 ${180 + (s%30)} Q 100 ${120 + (s%50)} 200 ${175 - (s%35)} T 400 ${150 + (s%40)} L400 240 L0 240 Z`}
            fill="#fff" opacity="0.14"/>
      <rect x={230 - (s%40)} y={40 + (s%30)} width="96" height="96" rx="18"
            fill="none" stroke="#fff" strokeOpacity="0.32" strokeWidth="2"
            transform={`rotate(${(s%40)-20} 278 88)`}/>
    </svg>
  );
}

function Foto({item, alt}){
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} alt={alt}/>;
  }
  return (
    <img className="ph" src={item.imageUrl} alt={alt} loading="lazy"
         referrerPolicy="no-referrer" onError={() => setFalhou(true)}/>
  );
}

function Estrelas({n}){
  return (
    <span className="stars" title={`Relevância ${n} de 5`}>
      {"★".repeat(n)}<span className="dim">{"★".repeat(5-n)}</span>
    </span>
  );
}

function Modal({item, onClose}){
  if(!item) return null;
  return (
    <div className="ov" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-media">
          <Foto item={item} alt={item.tituloPt}/>
          <button className="x" onClick={onClose} aria-label="Fechar">✕</button>
        </div>
        <div className="modal-body">
          <div className="meta">
            <span className="src">{item.source}</span>
            <span className="tag">{item.categoria}</span>
            <span className="tag">{item.data}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="txt">
            {item.resumo.map((p,i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Conteúdo integral restrito a assinantes: este resumo foi construído a partir dos elementos
              públicos da página (título, categoria, indústria, tags e material de apresentação).
            </div>
          )}
          <div className="actions">
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const [filtro, setFiltro] = useState("Tudo");

  const categorias = ["Tudo", "Branding", "Design", "Tecnologia"];
  const lista = NOTICIAS.filter(n => filtro === "Tudo" || n.categoria === filtro);
  const manchete = lista[0];
  const resto = lista.slice(1);

  return (
    <React.Fragment>
      <header className="hdr">
        <div className="kicker">Terça-feira · 25 de agosto de 2026</div>
        <h1 className="logo">Portal da Manhã</h1>
        <div className="sub">
          Branding, design e tecnologia — {NOTICIAS.length} matérias das últimas 24 horas,
          reunidas de 6 portais internacionais.
        </div>
        <div className="chips">
          {categorias.map(c => (
            <button key={c} className={"chip" + (filtro === c ? " on" : "")} onClick={() => setFiltro(c)}>
              {c}{c !== "Tudo" ? ` · ${NOTICIAS.filter(n => n.categoria === c).length}` : ` · ${NOTICIAS.length}`}
            </button>
          ))}
        </div>
      </header>

      {manchete && (
        <article className="lead" onClick={() => setAberto(manchete)}>
          <div className="lead-media"><Foto item={manchete} alt={manchete.tituloPt}/></div>
          <div className="lead-body">
            <div className="meta">
              <span className="src">{manchete.source}</span>
              <span className="tag">{manchete.categoria}</span>
              <Estrelas n={manchete.estrelas}/>
            </div>
            <h2>{manchete.tituloPt}</h2>
            <p>{manchete.resumoCurto}</p>
          </div>
        </article>
      )}

      <div className="grid">
        {resto.map(n => (
          <article className="card" key={n.id} onClick={() => setAberto(n)}>
            <div className="card-media"><Foto item={n} alt={n.tituloPt}/></div>
            <div className="card-body">
              <div className="meta">
                <span className="src">{n.source}</span>
                <span className="tag">{n.categoria}</span>
              </div>
              <h3>{n.tituloPt}</h3>
              <p>{n.resumoCurto}</p>
              <div className="foot meta"><Estrelas n={n.estrelas}/><span className="tag">{n.data}</span></div>
            </div>
          </article>
        ))}
      </div>

      <div className="footer">
        Edição de 25 de agosto de 2026 · Fontes: Brand New, Dezeen, Creative Bloq, Design Week,
        The Brand Identity e TechCrunch.<br/>
        Todos os resumos são redações originais em português a partir da leitura das matérias.
        Direitos das imagens pertencem aos respectivos portais e autores.
      </div>

      <Modal item={aberto} onClose={() => setAberto(null)}/>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
