<title>Portal da Manhã — 5 de setembro de 2026</title>

<style>
  :root{
    --bg:#f7f6f3;
    --surface:#ffffff;
    --ink:#14161a;
    --ink-2:#41474f;
    --ink-3:#7b838d;
    --line:#e6e3dd;
    --accent:#c8452f;
    --brand:#c2703a;
    --design:#1f8a70;
    --tech:#5b56d6;
    --shadow:0 1px 2px rgba(20,22,26,.04), 0 8px 24px rgba(20,22,26,.06);
    --shadow-lg:0 2px 6px rgba(20,22,26,.06), 0 24px 60px rgba(20,22,26,.12);
    --r:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}

  header.top{padding:44px 0 12px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1.brand{
    font-family:'Instrument Serif',Georgia,serif;
    font-size:clamp(40px,7vw,74px);
    line-height:1;
    margin:14px 0 10px;
    letter-spacing:-.02em;
    font-weight:400;
  }
  .subline{color:var(--ink-2);font-size:15px;max-width:640px;margin:0 0 26px;line-height:1.6}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}

  .lead{
    display:grid;grid-template-columns:1.15fr .85fr;gap:0;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    overflow:hidden;box-shadow:var(--shadow-lg);cursor:pointer;
    transition:transform .28s cubic-bezier(.2,.7,.3,1), box-shadow .28s;
    margin-bottom:36px;
  }
  .lead:hover{transform:translateY(-3px)}
  .lead-media{position:relative;min-height:340px;background:#eceae5;overflow:hidden}
  .lead-media img,.card-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
  .lead:hover .lead-media img{transform:scale(1.03)}
  .lead-body{padding:34px 34px 32px;display:flex;flex-direction:column;justify-content:center}
  .lead-title{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(26px,3.1vw,38px);line-height:1.14;letter-spacing:-.01em;margin:14px 0 14px}
  .lead-dek{color:var(--ink-2);font-size:15px;line-height:1.65;margin:0 0 20px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:56px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .26s cubic-bezier(.2,.7,.3,1), box-shadow .26s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card:hover .card-media img{transform:scale(1.04)}
  .card-media{height:180px;background:#eceae5;overflow:hidden;position:relative}
  .card-body{padding:18px 20px 22px;display:flex;flex-direction:column;flex:1}
  .card-title{font-size:17px;font-weight:700;line-height:1.32;letter-spacing:-.01em;margin:10px 0 10px}
  .card-dek{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 16px;flex:1}

  .tagline{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:6px;color:#fff}
  .tag.branding{background:var(--brand)}
  .tag.design{background:var(--design)}
  .tag.tecnologia{background:var(--tech)}
  .src{font-size:11.5px;font-weight:600;color:var(--ink-3);letter-spacing:.03em}
  .stars{font-size:12px;letter-spacing:.12em;color:#d9a441;margin-left:auto}

  .foot{border-top:1px solid var(--line);padding:30px 0 60px;color:var(--ink-3);font-size:12.5px;line-height:1.7}

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,19,22,.42);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:100;
    overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.99)}to{opacity:1;transform:none}}
  .modal{
    background:var(--surface);border-radius:22px;max-width:800px;width:100%;
    box-shadow:0 40px 90px rgba(0,0,0,.28);overflow:hidden;animation:rise .3s cubic-bezier(.2,.7,.3,1);
  }
  .modal-media{height:330px;background:#eceae5;overflow:hidden}
  .modal-media img{width:100%;height:100%;object-fit:cover;display:block}
  .modal-body{padding:32px 38px 38px}
  .modal-title{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.16;margin:14px 0 18px}
  .modal-text p{font-size:15.5px;line-height:1.78;color:var(--ink-2);margin:0 0 16px}
  .note{font-size:13px;color:var(--ink-3);font-style:italic;border-left:3px solid var(--line);padding-left:14px;margin-top:18px}
  .modal-actions{display:flex;gap:12px;align-items:center;margin-top:26px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;text-decoration:none;
    padding:11px 20px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
    transition:background .18s,border-color .18s;
  }
  .btn:hover{background:#f4f2ee}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{background:#2a2e35}
  .closeX{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.92);border:none;border-radius:50%;width:34px;height:34px;font-size:18px;cursor:pointer;color:#333;line-height:1}
  .modal-shell{position:relative}

  @media (max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .lead{grid-template-columns:1fr}
    .lead-media{min-height:240px;height:240px}
    .lead-body{padding:26px 24px 28px}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .modal-body{padding:24px 22px 30px}
    .modal-media{height:220px}
    header.top{padding-top:30px}
  }
</style>
</head>

const CORES = {
  Branding:   { a:"#f3b27a", b:"#c8452f", c:"#8c2d1c" },
  Design:     { a:"#7fd6bd", b:"#1f8a70", c:"#0f5347" },
  Tecnologia: { a:"#a3a0f0", b:"#5b56d6", c:"#332f8f" }
};

function Ilustracao({ categoria, seed, alto }) {
  const c = CORES[categoria] || CORES.Branding;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c.a}/>
          <stop offset="55%" stopColor={c.b}/>
          <stop offset="100%" stopColor={c.c}/>
        </linearGradient>
        <linearGradient id={id+"s"} x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="0.34"/>
          <stop offset="100%" stopColor="#ffffff" stopOpacity="0.02"/>
        </linearGradient>
      </defs>
      <rect width="400" height="240" fill={"url(#"+id+")"} />
      <circle cx={70 + r(1)*220} cy={60 + r(2)*110} r={40 + r(3)*54} fill={"url(#"+id+"s)"} />
      <circle cx={300 - r(4)*180} cy={180 - r(5)*110} r={26 + r(6)*40} fill="#ffffff" opacity="0.14" />
      <rect x={40 + r(7)*180} y={30 + r(8)*90} width={70 + r(9)*90} height={70 + r(9)*90}
            rx="16" fill="#ffffff" opacity="0.10"
            transform={"rotate("+Math.round(r(10)*50-25)+" 200 120)"} />
      <path d={"M0,"+(190+r(11)*30)+" C110,"+(140+r(12)*60)+" 250,"+(210+r(13)*20)+" 400,"+(150+r(14)*50)+" L400,240 L0,240 Z"}
            fill="#ffffff" opacity="0.13"/>
    </svg>
  );
}

function Media({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={seed} />;
  }
  return (
    <img src={item.imageUrl}
         alt={"Imagem da matéria: " + item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)} />
  );
}

function Estrelas({ n }) {
  return <span className="stars">{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
}

function Tags({ item }) {
  return (
    <div className="tagline">
      <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
      <span className="src">{item.source} · {item.data}</span>
      <Estrelas n={item.rank} />
    </div>
  );
}

function Modal({ item, seed, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-shell">
          <div className="modal-media"><Media item={item} seed={seed} /></div>
          <button className="closeX" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <div className="modal-body">
          <Tags item={item} />
          <h2 className="modal-title">{item.tituloPt}</h2>
          <div className="modal-text">
            {item.resumo.map((p, i) => (
              <p key={i} dangerouslySetInnerHTML={{ __html: p }} />
            ))}
          </div>
          <p className="note">
            Resumo produzido e parafraseado em português a partir da reportagem original.
            Título original: “{item.title}”.
          </p>
          <div className="modal-actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberta, setAberta] = useState(null);
  const itens = [...NOTICIAS].sort((a, b) => b.rank - a.rank);
  const [manchete, ...resto] = itens;

  return (
    <div>
      <div className="wrap">
        <header className="top">
          <div className="kicker"><span className="dot"></span> Edição de sábado · 5 de setembro de 2026</div>
          <h1 className="brand">Portal da Manhã</h1>
          <p className="subline">
            Uma leitura diária do que aconteceu em branding, design e tecnologia nas últimas 24 horas —
            selecionada, ranqueada e resumida em português. Clique em qualquer matéria para ler o resumo completo.
          </p>
          <div className="meta-row">
            <span className="pill">{itens.length} notícias</span>
            <span className="pill">6 portais</span>
            <span className="pill">Branding · Design · Tecnologia</span>
          </div>
        </header>

        <article className="lead" onClick={() => setAberta(0)}>
          <div className="lead-media"><Media item={manchete} seed={1} /></div>
          <div className="lead-body">
            <Tags item={manchete} />
            <h2 className="lead-title">{manchete.tituloPt}</h2>
            <p className="lead-dek">{manchete.dek}</p>
            <span className="btn" style={{alignSelf:"flex-start"}}>Ler o resumo →</span>
          </div>
        </article>

        <section className="grid">
          {resto.map((n, i) => (
            <article className="card" key={i} onClick={() => setAberta(i + 1)}>
              <div className="card-media"><Media item={n} seed={i + 2} /></div>
              <div className="card-body">
                <Tags item={n} />
                <h3 className="card-title">{n.tituloPt}</h3>
                <p className="card-dek">{n.dek}</p>
                <span className="btn" style={{alignSelf:"flex-start",padding:"8px 14px",fontSize:"13px"}}>Ler o resumo →</span>
              </div>
            </article>
          ))}
        </section>

        <footer className="foot">
          Portal da Manhã · edição de 5 de setembro de 2026. Fontes desta edição: The Brand Identity,
          Creative Bloq, Dezeen, It’s Nice That, Yanko Design e TechCrunch. As imagens são carregadas
          diretamente dos servidores dos veículos originais e permanecem sob copyright de seus respectivos
          detentores. Os resumos são paráfrases em português produzidas para esta edição.
        </footer>
      </div>

      {aberta !== null && (
        <Modal item={itens[aberta]} seed={aberta + 1} onClose={() => setAberta(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
