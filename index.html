<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mut:#667085;--line:#e6e8f0;--brand:#e8590c;--design:#0f9d8a;--tech:#5b5bd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
header h1{font-size:34px;margin:0;letter-spacing:-.03em}header p{color:var(--mut);margin:4px 0 24px}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;color:#fff}
.t-Branding{background:var(--brand)}.t-Design{background:var(--design)}.t-Tecnologia{background:var(--tech)}
.stars{color:#f5a524;letter-spacing:2px;font-size:13px}
.card{background:var(--card);border-radius:18px;box-shadow:0 2px 14px rgba(20,22,31,.07);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px rgba(20,22,31,.12)}
.media{aspect-ratio:16/10;background:#eee;overflow:hidden}.media img,.media svg{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px 18px 18px}.body h3{margin:10px 0 6px;font-size:18px;line-height:1.28}.meta{font-size:12.5px;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.25fr 1fr;margin-bottom:24px;cursor:pointer}.hero .media{aspect-ratio:auto;min-height:340px}.hero h2{font-size:30px;line-height:1.15;margin:12px 0 10px;letter-spacing:-.02em}.hero .body{padding:30px;display:flex;flex-direction:column;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.overlay{position:fixed;inset:0;background:rgba(15,17,26,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px;z-index:9;animation:f .25s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .3s}
.modal .media{aspect-ratio:16/9}.modal .in{padding:26px 30px 30px}.modal h2{font-size:27px;line-height:1.2;margin:12px 0 4px}.modal p{font-size:16.5px;color:#2a2e3d}
.x{float:right;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.src{display:inline-block;margin-top:10px;padding:10px 18px;background:var(--ink);color:#fff;border-radius:10px;text-decoration:none;font-weight:600}
.aviso{font-size:13px;color:#a15c07;background:#fff6e5;padding:8px 12px;border-radius:10px;margin-top:12px}
footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(24px);opacity:0}}
@media(max-width:780px){.hero{grid-template-columns:1fr}.hero .media{min-height:220px}.hero h2{font-size:24px}header h1{font-size:27px}}
</style>
</head>

<script type="text/babel">
const { useState, useEffect } = React;
const NOTICIAS = [
{
 title: "\"Welcoming and inclusive\" London housing wins RIBA Stirling Prize 2026",
 tituloPt: "Conjunto habitacional “acolhedor e inclusivo” de Londres vence o Prêmio Stirling 2026 do RIBA",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/15/lion-green-road-riba-stirling-prize-2026/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/lion-green-road-mary-duggan-ruff-architects-london-riba-stirling-prize-2026-winner_dezeen_2364_hero.jpg",
 categoria: "Design", estrelas: 5,
 resumo: ["O conjunto Lion Green Road, no sul de Londres, projetado pelo escritório Mary Duggan Architects em parceria com a Ruff Architects, venceu o Prêmio Stirling 2026 do RIBA, que reconhece o melhor edifício novo do Reino Unido. Encomendado pela prefeitura de Croydon, em Coulsdon, o projeto reúne 157 moradias distribuídas em cinco blocos ligados por espaços verdes compartilhados.","Os blocos escalonados ocupam um terreno bastante inclinado, antes usado como estacionamento. As plantas facetadas, em formato de estrela, garantem vistas amplas e fazem com que todas as unidades tenham ventilação e luz em duas orientações. Três tipos de tijolo unificam visualmente o conjunto.","O júri elogiou o projeto por responder à urgente necessidade nacional de habitação e por oferecer casas ambientalmente cuidadosas. O presidente do RIBA, Chris Williamson, afirmou que é possível fazer habitação de alta densidade sem abrir mão da qualidade. É apenas o quarto conjunto habitacional a ganhar o prêmio, depois de Accordia, Goldsmith Street e Appleby Blue Almshouse. A cerimônia aconteceu no Old Billingsgate, onde o RIBA também entregou cinco prêmios especiais."]
},
{
 title: "\"Less bank, more life\": Barkas gives Nigerian digital bank Kuda an identity with the pace of Lagos",
 tituloPt: "“Menos banco, mais vida”: Barkas dá ao banco digital nigeriano Kuda uma identidade com o ritmo de Lagos",
 source: "It's Nice That",
 url: "https://www.itsnicethat.com/articles/barkas-kuda-graphic-design-project-131026",
 imageUrl: "https://m.itsnicethat.com/original_images/barkas-kuda-itsnicethat-2.jpeg?class=w1440",
 categoria: "Branding", estrelas: 5,
 resumo: ["O estúdio Barkas criou a nova identidade do Kuda, banco digital nigeriano, cobrindo posicionamento estratégico, identidade visual, site e implementação nas frentes pessoal e empresarial. O conceito gira em torno de “More Life”, expressão de origem jamaicana que traduz o desejo de abundância e dialoga com o público jovem do banco.","Visualmente, a marca foge dos gradientes suaves e das ilustrações em tons pastel comuns entre os bancos desafiantes. Em vez disso, aposta em letras geométricas e robustas, inspiradas na arte e na arquitetura nigerianas, com um logotipo empilhado (KU sobre DA). O roxo profundo marca o banco pessoal e o preto identifica o Kuda Business.","O sistema inclui ainda um símbolo próprio para o naira, tipografia sob medida, layouts modulares, fotografia de estilo documental feita por fotógrafos locais, ilustrações desenhadas à mão e motion design. Fundado em 2019 como o “banco dos livres”, o Kuda quer agora se posicionar como marca consolidada para uma geração digital. A vice-presidente de marketing relata aumento de contas abertas, transações e depósitos desde o relançamento."]
},
{
 title: "Tesla launches flying Roadster concept car",
 tituloPt: "Tesla lança conceito do Roadster voador",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/16/tesla-launches-flying-roadster-concept-car/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/tesla-roadster-flying-car_dezeen_2364_sq.jpg",
 categoria: "Design", estrelas: 4,
 resumo: ["A Tesla revelou uma versão voadora da segunda geração do Roadster, um elétrico de dois lugares, em um evento transmitido ao vivo no Texas. A demonstração mostrou o carro rodando de cabeça para baixo, subindo uma rampa em meia-calha e voando brevemente antes de pousar. Ele também saltou sobre uma fileira de veículos estacionados e decolou do repouso.","Propulsores de ar comprimido sob o carro e na traseira dão sustentação, amortecem os pousos e reforçam a aceleração. A Tesla afirma que o modelo vai de 0 a 96 km/h em 0,81 segundo. Um sistema de sucção por ventoinhas manteve o carro preso à rampa invertida, e os tanques de ar podem ser reabastecidos sem combustível.","Projetado em conjunto por Tesla e SpaceX, o carro tem carroceria angular de supercarro, portas tipo tesoura e aerofólio retrátil. Elon Musk disse que será o “único manual” da empresa a longo prazo, embora a demonstração tenha usado uma sequência pré-programada, sem motorista. Musk reconheceu que a legalidade do voo em vias públicas é incerta. A produção está prevista para 2028."]
},
{
 title: "Andrej & Andrej gives Pohoda Festival an identity refresh, complete with 3D babies and a futuristic typeface",
 tituloPt: "Andrej & Andrej renova a identidade do Pohoda Festival, com bebês em 3D e tipografia futurista",
 source: "It's Nice That",
 url: "https://www.itsnicethat.com/articles/andrej-and-andrej-pohoda-festival-30th-anniversary-graphic-design-project-141026",
 imageUrl: "https://m.itsnicethat.com/original_images/andrej-andrej-pohoda-graphic-design-itsnicethat-13.jpg?class=w1440",
 categoria: "Branding", estrelas: 4,
 resumo: ["O Pohoda Festival, maior festival de música e artes ao ar livre da Eslováquia, completa 30 anos em 2026. Fundado em 1997, leva o nome de uma palavra eslovaca e tcheca que significa tranquilidade e bem-estar; não tem áreas VIP e limita o público para evitar aglomeração.","Para o aniversário, o estúdio de Bratislava Andrej & Andrej, formado por Andrej Barčák e Andrej Čanecký, criou a terceira grande identidade do festival, com novo logotipo, tipografia e paleta. A fonte de exibição, arredondada e geométrica, parte das letras usadas antes de 2010, de modo que o nome de cada atração funciona como uma peça de lettering.","O visual bebe nas imagens da música dançante dos anos 1990: logotipo em gradiente que simboliza liberdade, cores de bala e o retorno da camiseta listrada de edições passadas. O merchandising, desenvolvido com Linda Straková, é produzido em fábrica certificada GOTS em Portugal. A peça central é o logo dos bebês gêmeos, reconstruído em 3D com o artista Matej Martinec; eles surgiram como fotografia em 1997, viraram gráfico em 2001 e agora ganham versão inflável e chaveiro."]
},
{
 title: "Frank Lloyd Wright's only planetarium restored in Florida",
 tituloPt: "Único planetário de Frank Lloyd Wright é restaurado na Flórida",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/15/florida-southern-college-frank-lloyd-wright-planetarium-restoration/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/planetarium-frank-lloyd-wright-florida-southern-college_dezeen_2364_hero.jpg",
 categoria: "Design", estrelas: 4,
 resumo: ["O Florida Southern College restaurou e reabriu o único planetário projetado e construído por Frank Lloyd Wright. Ele fica em uma extremidade do Polk County Science Building, no campus planejado pelo arquiteto, e estava praticamente fechado desde 2004, quando o sistema de projeção falhou. A obra foi liderada pelo arquiteto do campus, Jeff Baker, da MCWB Architects, dentro de um esforço mais longo, iniciado em 2007, para atualizar os edifícios de Wright da faculdade.","O trabalho externo começou em 2021 e incluiu novo telhado, rufos, estuque na fachada superior e mais de 280 ladrilhos moldados à mão ao longo do perímetro. A parte interna foi iniciada em 2023: removeram um armário de computadores dos anos 1980, modernizaram tecnologia e áudio e repintaram as paredes em azul profundo. Os assentos originais de compensado e vinil voltaram ao layout circular, a pintura e o reboco originais foram reinstalados e o piso recebeu acabamento avermelhado.","Baker disse que a construção elementar de Wright, sem espaços ocultos para sistemas modernos, foi o maior desafio. O planetário está aberto ao campus e ao público para visitas e sessões."]
},
{
 title: "Meta launches an open-weight AI model that runs on Macs",
 tituloPt: "Meta lança modelo de IA de pesos abertos que roda em Macs",
 source: "TechCrunch",
 url: "https://techcrunch.com/2026/10/15/meta-launches-an-open-weight-model-that-runs-on-macs/",
 imageUrl: "https://techcrunch.com/wp-content/uploads/2026/09/GettyImages-2296215726.jpg?resize=1200,799",
 categoria: "Tecnologia", estrelas: 4,
 resumo: ["A Meta lançou o Muse Spark Open, que a empresa descreve como o modelo de pesos abertos “mais capaz” dos Estados Unidos. Ele tem 816 bilhões de parâmetros e janela de contexto de 1 milhão de tokens, e a Meta diz que seus resultados superam os de outros modelos abertos populares. É nativamente multimodal e voltado a programação complexa e trabalho com agentes.","O modelo foi pensado para rodar localmente em computadores Apple, mas exige ao menos 1 terabyte de RAM, segundo o Engadget, e rende melhor no Mac Studio com chip M5 Ultra. A Meta o acompanhou do Muse Code, seu terminal de programação com IA, e o testou em tarefas como correção de bugs e novas funções em um cliente de Mastodon. A empresa também afirmou que ele consegue revisar e cortar vídeos no DaVinci Resolve.","A matéria lembra que modelos de pesos abertos podem ser mais econômicos e transparentes que os fechados. O modelo já está disponível em várias plataformas de API."]
},
{
 title: "Figma finally answers the question of what design feels like – using dance",
 tituloPt: "Figma finalmente responde como é a sensação de projetar — usando dança",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/news/figma-finally-answers-the-question-of-what-design-feels-like-using-dance",
 imageUrl: "https://cdn.mos.cms.futurecdn.net/zyNLeTxPsz25zYRsjEpJQT-1920-80.jpg",
 categoria: "Design", estrelas: 3,
 resumo: ["A Figma lançou um vídeo para o seu agente de IA, o Figma Agent, que sai da fase beta. Em vez de uma demonstração de recursos, o filme tenta transmitir “a sensação não só de um produto, mas do próprio processo de design”. A produtora IVERSON fez o filme, com roteiro e direção do fundador David Dinetz.","Ele usou a dança para expressar as etapas mentais invisíveis do trabalho criativo: da página em branco à pesquisa, das primeiras ideias às revisões e ao feedback, até o momento em que o trabalho flui. O coreógrafo Tony Testa, com créditos ao lado de Janet Jackson, Britney Spears e Jennifer Lopez, ajudou a construir a linguagem de movimento. O filme foi rodado quase todo em câmera, com performance ao vivo, cenários móveis e efeitos práticos, ao som de uma faixa de Fred Again.","A matéria o apresenta como sequência do premiado filme do Figma Slides, também da IVERSON, e o contrasta com anúncios de IA que explicam o produto de forma literal. O Figma Agent trabalha dentro de arquivos, camadas e frames para explorar layouts, montar fluxos, gerar telas a partir de texto e remixar designs existentes."]
},
{
 title: "Why brands are rethinking packaging norms",
 tituloPt: "Por que as marcas estão repensando as convenções de embalagem",
 source: "Creative Review",
 url: "https://www.creativereview.co.uk/rethinking-packaging-norms-graphic-design-branding/",
 imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/10/One-Trick-Pony_Hued-486_HR_V3feat.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=1200&h=1200",
 categoria: "Branding", estrelas: 3,
 resumo: ["O artigo de Rebecca Fulleylove examina por que as marcas estão questionando as convenções de embalagem. A embalagem precisa proteger o produto, comunicar o que ele é e convencer o consumidor a pegá-lo, tudo isso em um mercado saturado.","Como alerta, o texto descreve como Fenty Beauty, Glow Recipe e Huda Beauty lançaram em setembro potes de adesivos para os olhos com sistema giratório de dispensa muito parecidos, embora a coreana Wonder Bath tenha apresentado formato semelhante em julho. A fundadora da Huda Beauty, Huda Kattan, culpou um fornecedor de embalagens compartilhado, que segundo ela teria falseado a exclusividade.","A tese é que marcas distintivas estão redesenhando o próprio objeto físico, com foco em como ele funciona, como é tocado e como se torna reconhecível com o tempo. Os exemplos são a embalagem da One Trick Pony, pela Polygraph Creative, e a do bálsamo desodorante AKT, pela Two Times Elliott. A conclusão: a melhor embalagem molda a experiência do produto, em vez de apenas chamar atenção."]
},
{
 title: "The $20,000 MrBeast logo auction isn't as ridiculous as it seems",
 tituloPt: "O leilão de US$ 20 mil do logo do MrBeast não é tão absurdo quanto parece",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/news/the-usd20-000-mrbeast-logo-auction-isnt-as-ridiculous-as-it-seems",
 imageUrl: "https://cdn.mos.cms.futurecdn.net/ao4tjt439ZfPsDC3TiYR55-1920-80.jpg",
 categoria: "Branding", estrelas: 3,
 resumo: ["A Heritage Auctions colocou preço-guia de US$ 20 mil em um esboço a lápis original da sessão de ideias que originou o logo do MrBeast. O desenho, de cerca de 10 x 10 cm, está em papel amassado e manchado. A casa de leilões diz que ele saiu de uma sessão de uns dez minutos em que a equipe de design rabiscou um conceito de felino, aprovado por MrBeast (Jimmy Donaldson).","Nas redes, muita gente achou a estimativa exagerada, mas o artigo defende que o tempo gasto não define o valor de um desenho: seu peso está no papel do logo na ascensão da marca. A listagem cita apenas um “artista” e uma “equipe de design”, sem nomear o criador, o que contrasta com logos famosos como o swoosh da Nike. MrBeast não participaria da venda e já admitiu ter dado pouca atenção ao logo.","O texto lembra ainda que um esboço não carrega direitos de propriedade intelectual e compara os US$ 35 pagos a Carolyn Davidson pela Nike com o US$ 1 milhão que a Pepsi teria gasto em seu redesign de 2008. O esboço integra o leilão Fall Sports Catalog, de 23 a 25 de outubro."]
},
{
 title: "Fairbuds 2 Earbuds Let You Swap Worn Batteries Instead of Buying a New Pair",
 tituloPt: "Fairbuds 2 permitem trocar baterias gastas em vez de comprar um novo par",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/15/fairbuds-2-earbuds-let-you-swap-worn-batteries-instead-of-buying-a-new-pair/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/fairbuds-2-earbuds-let-you-swap-worn-batteries-instead-of-buying-a-new-pair/fairbuds-2-11.jpg",
 categoria: "Design", estrelas: 3,
 resumo: ["Os Fairbuds 2, da Fairphone, foram projetados para que as baterias possam ser trocadas tanto nos fones quanto no estojo, evitando descartar o conjunto inteiro quando a autonomia cai. Cada fone tem uma capa de silicone removível que expõe o compartimento da bateria sem ferramentas; já o estojo exige uma chave Torx T5. A Fairphone lista sete peças substituíveis, incluindo o corpo do estojo e cada fone.","O som vem de drivers de biocelulose de 0,43 polegada, com predefinições e equalizador de cinco bandas; o LDAC só funciona em celulares Android compatíveis. O cancelamento de ruído chega a 45 dB, com seis microfones, e o multipoint conecta dois aparelhos ao mesmo tempo.","A autonomia declarada é de até oito horas (seis com cancelamento), mais 40 horas com o estojo. A recarga é só por USB-C e a certificação IP54 protege contra poeira e respingos. O preço nos EUA é de US$ 119,99, com lançamento em 2 de novembro de 2026 e até três anos de garantia."]
},
{
 title: "New Logo and Identity for Salt Lick on Salt Creek by Order",
 tituloPt: "Novo logo e identidade para o Salt Lick on Salt Creek, assinados pela Order",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_salt_lick_on_salt_creek_by_order.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/slsc_logo_new.png",
 categoria: "Branding", estrelas: 3,
 aviso: "O texto completo do Brand New está atrás de paywall; este resumo se baseia apenas nos elementos públicos (título, categoria, indústria e tags).",
 resumo: ["O Brand New publicou em 15 de outubro de 2026 a análise do novo logo e identidade do Salt Lick on Salt Creek, projeto assinado pela agência Order. A matéria, intitulada “Made to Border”, está na categoria “Reviewed” e na indústria de hospitalidade.","As tags indicam os elementos envolvidos: border (borda), hotel, menu, order, packaging, restaurant e sans serif — o que sugere um sistema que alcança cardápios, embalagens e a comunicação do estabelecimento, com tipografia sem serifa. A página mostra imagens do novo logo e de uma aplicação.","A análise detalhada da crítica não é pública, por isso este resumo se limita ao que a página expõe."]
},
{
 title: "New Logo and Packaging for KINGS by BrandOpus",
 tituloPt: "Novo logo e embalagens da KINGS, assinados pela BrandOpus",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_packaging_for_kings_by_brandopus.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/kings_jerky_logo_before_after.png",
 categoria: "Branding", estrelas: 2,
 aviso: "O texto completo do Brand New está atrás de paywall; este resumo se baseia apenas nos elementos públicos (título, categoria, indústria e tags).",
 resumo: ["O Brand New publicou em 15 de outubro de 2026 o novo logo e embalagens da KINGS, projeto da BrandOpus, com o título “Bite off Less than you can Chew” (algo como “Morda menos do que consegue mastigar”). A matéria está na categoria “Noted” e na indústria de bens de consumo.","As imagens trazem comparações de antes e depois do logo e das embalagens, e o nome do arquivo sugere que o produto é carne seca (jerky). As tags citam brandopus, chunky (formas robustas), colorful (colorido), rob clarke e uk.","A análise completa do autor, com a justificativa de design, é restrita a assinantes e por isso não foi lida para este resumo."]
}
];
const PAL={Branding:["#ff9a3c","#e8590c","#ffd166"],Design:["#2dd4bf","#0f9d8a","#a7f3d0"],Tecnologia:["#818cf8","#5b5bd6","#c4b5fd"]};
function Ilustra({cat,seed}){
 const p=PAL[cat],id="g"+seed;
 return (<svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração "+cat}>
  <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
  <rect width="400" height="250" fill={"url(#"+id+")"}/>
  <circle cx={80+seed*17%240} cy="70" r="70" fill={p[2]} opacity=".35"/>
  <rect x={200+seed*11%120} y="110" width="120" height="120" rx="24" fill="#fff" opacity=".22" transform={"rotate("+(12+seed*7%30)+" 260 170)"}/>
  <polygon points="40,230 140,120 230,230" fill="#fff" opacity=".18"/>
 </svg>);
}
function Img({n,i,eager}){
 const [falhou,setFalhou]=useState(false);
 if(!n.imageUrl||falhou) return <Ilustra cat={n.categoria} seed={i+1}/>;
 return <img src={n.imageUrl} alt={"Imagem da matéria: "+n.tituloPt} referrerPolicy="no-referrer" loading={eager?"eager":"lazy"} onError={()=>setFalhou(true)}/>;
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Modal({n,i,fechar}){
 useEffect(()=>{const h=e=>e.key==="Escape"&&fechar();document.addEventListener("keydown",h);return()=>document.removeEventListener("keydown",h)},[]);
 return (<div className="overlay" onClick={fechar}><div className="modal" onClick={e=>e.stopPropagation()}>
  <div className="media"><Img n={n} i={i} eager/></div>
  <div className="in"><button className="x" onClick={fechar} aria-label="Fechar">✕</button>
   <span className={"tag t-"+n.categoria}>{n.categoria}</span> <Stars n={n.estrelas}/>
   <h2>{n.tituloPt}</h2><div className="meta">{n.source}</div><div style={{height:14}}/>
   {n.resumo.map((p,k)=><p key={k}>{p}</p>)}
   {n.aviso&&<div className="aviso">{n.aviso}</div>}
   <a className="src" href={n.url} target="_blank" rel="noopener noreferrer">Ler na fonte original ↗</a>
  </div></div></div>);
}
function App(){
 const [sel,setSel]=useState(null);
 const ord=[...NOTICIAS].sort((a,b)=>b.estrelas-a.estrelas);
 const [h,...resto]=ord;
 return (<div className="wrap">
  <header><h1>Portal da Manhã</h1><p>Sexta-feira, 16 de outubro de 2026 · Branding, design e tecnologia em {ord.length} notícias</p></header>
  <article className="card hero" onClick={()=>setSel(0)}>
   <div className="media"><Img n={h} i={0} eager/></div>
   <div className="body"><div><span className={"tag t-"+h.categoria}>{h.categoria}</span> <Stars n={h.estrelas}/></div>
    <h2>{h.tituloPt}</h2><div className="meta">{h.source} · clique para ler o resumo</div></div>
  </article>
  <section className="grid">
   {resto.map((n,k)=>(<article className="card" key={n.url} onClick={()=>setSel(k+1)}>
    <div className="media"><Img n={n} i={k+1}/></div>
    <div className="body"><div><span className={"tag t-"+n.categoria}>{n.categoria}</span> <Stars n={n.estrelas}/></div>
     <h3>{n.tituloPt}</h3><div className="meta">{n.source}</div></div>
   </article>))}
  </section>
  {sel!==null&&<Modal n={ord[sel]} i={sel} fechar={()=>setSel(null)}/>}
  <footer>Resumos produzidos em português a partir das matérias originais. Clique em qualquer card para ler.</footer>
 </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
