<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 4 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#16150f; --muted:#6c6a63;
    --line:#e6e4de; --accent:#c8452b; --accent-soft:#fdf1ee;
    --br:#e2762f; --de:#1f8a70; --te:#4c5fd7;
    --radius:20px; --shadow:0 1px 2px rgba(20,18,12,.04), 0 8px 28px rgba(20,18,12,.06);
    --shadow-lg:0 2px 4px rgba(20,18,12,.05), 0 18px 50px rgba(20,18,12,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 22px}
  header.top{padding:52px 0 30px;border-bottom:1px solid var(--line);margin-bottom:38px}
  .kicker{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1.brand{
    font-family:'Instrument Serif',Georgia,serif; font-weight:400;
    font-size:clamp(44px,7vw,78px); line-height:1.02; letter-spacing:-.02em;
    margin:14px 0 10px;
  }
  .sub{color:var(--muted);font-size:15px;max-width:640px}
  .meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}

  .stars{color:var(--accent);font-size:12.5px;letter-spacing:2px;line-height:1}
  .stars .off{color:#d8d5cd}

  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .tag.branding{background:#fdf0e7;color:#a8511a}
  .tag.design{background:#e8f6f2;color:#146853}
  .tag.tech{background:#eceefc;color:#3b4bb5}

  /* HERO */
  .hero{
    display:grid;grid-template-columns:1.15fr 1fr;gap:0;background:var(--card);
    border:1px solid var(--line);border-radius:calc(var(--radius) + 6px);overflow:hidden;
    box-shadow:var(--shadow-lg);cursor:pointer;margin-bottom:44px;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .hero:hover{transform:translateY(-3px);box-shadow:0 3px 8px rgba(20,18,12,.06),0 26px 64px rgba(20,18,12,.13)}
  .hero-media{position:relative;min-height:420px;background:#eeece6}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
  .hero-body{padding:40px 42px;display:flex;flex-direction:column;justify-content:center;gap:16px}
  .hero-body h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;
    font-size:clamp(28px,3.1vw,40px);line-height:1.13;letter-spacing:-.015em;margin:0;
  }
  .hero-dek{color:var(--muted);font-size:15.5px;margin:0}
  .srcline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
  .srcline b{color:var(--ink);font-weight:700}

  /* GRID */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
  .card-media{position:relative;aspect-ratio:16/10;background:#eeece6;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .card-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:11px;flex:1}
  .card-body h3{font-size:17.5px;font-weight:700;line-height:1.32;letter-spacing:-.01em;margin:0}
  .card-dek{color:var(--muted);font-size:13.5px;margin:0;flex:1}
  .rank{
    position:absolute;top:12px;left:12px;z-index:2;background:rgba(255,255,255,.94);
    backdrop-filter:blur(6px);border-radius:999px;padding:5px 11px;font-size:11px;font-weight:800;
    letter-spacing:.05em;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.10)
  }
  .warn{font-size:11.5px;color:#9a7b2e;background:#fdf6e3;border-radius:8px;padding:6px 9px}

  /* OVERLAY */
  .overlay{
    position:fixed;inset:0;background:rgba(22,21,15,.42);backdrop-filter:blur(5px);
    z-index:100;display:flex;align-items:flex-start;justify-content:center;
    padding:40px 20px;overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .sheet{
    background:var(--card);border-radius:26px;max-width:800px;width:100%;
    box-shadow:0 30px 90px rgba(0,0,0,.28);overflow:hidden;animation:rise .3s cubic-bezier(.2,.8,.2,1);
  }
  .sheet-media{position:relative;aspect-ratio:16/9;background:#eeece6}
  .sheet-media img,.sheet-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .close{
    position:absolute;top:16px;right:16px;z-index:3;width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(255,255,255,.94);cursor:pointer;font-size:19px;line-height:1;
    color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.16);
  }
  .close:hover{background:#fff}
  .sheet-body{padding:32px 38px 38px}
  .sheet-body h2{
    font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(26px,3.4vw,36px);
    line-height:1.14;letter-spacing:-.015em;margin:14px 0 6px;
  }
  .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 20px}
  .prose p{font-size:16px;line-height:1.72;margin:0 0 16px;color:#2c2a22}
  .sheet-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    border-top:1px solid var(--line);margin-top:26px;padding-top:22px}
  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;
    text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;border-radius:999px;
    transition:opacity .2s
  }
  .btn:hover{opacity:.85}
  .note{font-size:12.5px;color:#9a7b2e;background:#fdf6e3;border-radius:10px;padding:10px 13px;margin-top:18px}

  footer{margin:70px 0 60px;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
  footer a{color:var(--muted)}

  @media(max-width:960px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:280px;position:relative;aspect-ratio:16/9}
    .hero-body{padding:28px 26px}
  }
  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    .sheet-body{padding:24px 22px 30px}
    header.top{padding:34px 0 24px}
  }
</style>
</head>

<div id="root"></div>

    tituloPt: "“Brazilcore não é a história, é o sintoma”: o diretor criativo global da Tátil diz que o mundo cansou de marcas que poderiam ter vindo de qualquer lugar",

    resumo: [
      "Neste inverno do hemisfério norte o mundo abraçou a cultura brasileira — camisas de futebol e o verde-e-amarelo apareceram em passarelas e nas ruas sob o rótulo de “brazilcore”, e a Vogue e outras publicações passaram a perguntar como marcas internacionais deveriam “entrar no Brasil”. Para Ricardo Bezerra, recém-empossado como diretor criativo global da Tátil Design, ler isso como mais uma tendência passageira é perder completamente o ponto.",
      "O argumento dele é que o brazilcore não é a história: é o sintoma. O que existe, diz, é um cansaço generalizado da indústria criativa com universos de marca que poderiam pertencer a qualquer lugar — e que, por isso mesmo, não pertencem a lugar nenhum. A resposta, porém, não seria mais cor nem mais “Brasil”. Seria mais originalidade, e originalidade se alcança acessando histórias de origem.",
      "Bezerra chama isso de paradoxo da proximidade. Ele passou um ano em Manhattan como o primeiro diretor de criação executivo latino-americano de uma grande agência global de design, cercado pelas redes e oportunidades que as capitais criativas prometem, e encontrou algo inesperado: estar perto de tudo pode significar não estar conectado a nada que seja inteiramente seu. A globalização dá acesso extraordinário, mas achata — as mesmas referências circulam por todos os estúdios, as mesmas agências disputam os mesmos briefings globais, e o trabalho começa a soar como se tivesse vindo de lugar nenhum.",
      "A distância, diz ele, o tornou mais consciente da origem, não menos. Daí a proposta de uma “diáspora criativa reversa”: um movimento de volta às origens que não é nostalgia, mas recuperação de potencial criativo. A trajetória tradicional — sair do Brasil, construir credibilidade em Londres ou Nova York, trazer a experiência de volta — teria a causalidade invertida.",
      "O Brasil já tem uma palavra centenária para isso. Em 1928 o poeta modernista Oswald de Andrade publicou o Manifesto Antropófago, que usava a canibalização como metáfora para o modo como a cultura brasileira absorve influência externa: em vez de rejeitar ou imitar, ela devora e produz algo novo e próprio. Esse instinto de digerir, remixar e transformar, e não copiar, é o que Bezerra aponta como o motor real do trabalho da Tátil — e nada tem a ver com bandeira ou paleta de cores.",
      "Origem, na definição dele, não é sinônimo de nacionalidade, geografia ou atalho visual para “brasileiro”. Pode ser história, crença, experiência vivida, ambiente, memória coletiva ou simplesmente uma maneira particular de enxergar o mundo — comprovada e enraizada, não inventada para efeito. A pergunta deixa de ser “como fazemos isso parecer brasileiro?” e passa a ser “qual é o ponto de origem genuíno desta ideia?”.",
      "Como prova, ele cita a identidade da Tátil para os Jogos Olímpicos e Paralímpicos Rio 2016, que nunca precisou abandonar sua origem brasileira para alcançar relevância global, e o trabalho para o Carnaval carioca, cujo briefing só fez sentido quando passistas, artistas e as comunidades que tocam os desfiles entraram no processo junto com o estúdio. Isso, argumenta, é originação — não localização.",
      "A conclusão vai além do Brasil: a oportunidade não é ser notado quando o ciclo de tendências vira a seu favor, mas questionar como a indústria define de onde boas ideias têm permissão para vir. E Londres e Nova York teriam a sua própria oportunidade — reconhecer que as relações criativas mais valiosas daqui para frente talvez não sejam as que puxam todo estúdio para o mesmo centro, e sim as que deixam origens diferentes permanecerem visíveis, distintas e inteiras."

    tituloPt: "Mais de 1.200 painéis curvos e nenhuma linha reta: o MAD entrega o Lucas Museum of Narrative Art, a nave “onírica” que pousou em Los Angeles",

    paywall: false,
    resumo: [
      "O Lucas Museum of Narrative Art, em Los Angeles, chegou ao fim da obra. O escritório chinês MAD, em parceria com a Stantec, aplicou mais de 1.200 painéis curvos sobre o volume que a Dezeen descreve como “onírico” — uma massa contínua, sem fachada frontal reconhecível, que se comporta menos como edifício e mais como algo que pousou no parque.",
      "A escolha de forma é coerente com o repertório do MAD e de seu fundador, Ma Yansong, que vem construindo uma carreira inteira em cima da recusa à ortogonalidade. É o mesmo estúdio que converteu um armazém em Roterdã no Fenix, museu da migração, que projeta agora o Danshuis na mesma cidade e que entregou recentemente um museu de ciências em espiral em Haikou e um conjunto de galerias bulbosas sobre um museu em Shenzhen.",
      "O museu é dedicado à arte narrativa — a ideia de que ilustração, quadrinhos, storyboards, cartazes e cinema formam uma linhagem visual legítima, e não uma subcategoria menor das belas-artes. É essa tese que dá ao prédio a licença para não parecer um museu convencional.",
      "A quantidade de painéis é o dado técnico que carrega o projeto: mais de mil peças de curvatura individual precisam ser compatibilizadas para que a superfície leia como uma pele única, sem juntas visíveis interrompendo o movimento. É o tipo de proeza que só se sustenta com engenharia de fachada pesada por trás — daí a presença da Stantec.",
      "Esta edição do Portal da Manhã resume a matéria a partir dos elementos públicos disponíveis (título, dek, autoria e crédito de imagem da Dezeen, assinada por Ben Dreith em 3 de setembro de 2026) e do histórico verificável do MAD noutras reportagens do mesmo veículo. Detalhes de área, custo, programa interno e data de abertura ao público não foram confirmados e por isso não são afirmados aqui — vale abrir a fonte original."

  {

    title: "rbl rebrands University of East Anglia around ‘Original By Nature’ ethos",

    url: "https://www.designweek.co.uk/rbl-rebrands-university-of-east-anglia-around-original-by-nature-ethos/",
    imageUrl: "https://www.designweek.co.uk/content/uploads/2026/09/07_University_of_East_Anglia_Prospectus-1024x673.jpg",
    tituloPt: "Cem stakeholders ouvidos, oitocentas pessoas consultadas e uma estrela de quatro pontas: a rbl não redesenhou a UEA, fez a universidade se lembrar do que era",
    dek: "A antiga estrela magenta vira um farol curvo em verde-junco, e o nome da cidade entra no logotipo.",
    data: "3 de setembro de 2026",
    alt: "Cartões-postais pretos empilhados sobre superfície rosa com grafismo de estrela de quatro pontas da nova identidade da UEA",
    paywall: false,
    resumo: [
      "A University of East Anglia foi fundada em 1963 justamente para contrariar o ensino superior convencional: criou o primeiro curso de graduação em escrita criativa do Reino Unido e construiu reputação sólida em pesquisa de ciência do clima. Com o tempo, porém, atualizações sucessivas de marca produziram uma presença visual fragmentada, que já não comunicava esse caráter distinto num mercado saturado.",
      "A agência de marca estratégica rbl foi contratada para criar uma plataforma capaz de sustentar as ambições nacionais e internacionais da instituição. Para definir a direção, consultou mais de 100 stakeholders e coletou percepções de mais de 800 integrantes da comunidade universitária. O resultado é uma ideia organizadora — “Original by nature” — que tenta amarrar num só fio o histórico de pensamento independente da universidade, sua localização física e seu compromisso ambiental.",
      "Rhiannon Lowe, diretora de estratégia da rbl, resume a lógica do projeto de forma incomum para o setor: a UEA não precisava de mais um refresh, precisava redescobrir o que a tornava diferente em primeiro lugar. A história, segundo ela, já existia — só não estava sendo contada.",
      "No sistema visual, o logotipo principal foi refinado para incorporar a localização no próprio wordmark, passando a assinar “University of East Anglia, Norwich”. O antigo símbolo do glint, um brilho que a instituição carregava havia anos, evoluiu para um grafismo curvo de farol, pensado para funcionar como marca visual primária tanto em impresso quanto em digital. A estrela magenta que morava dentro da letra E deu lugar a uma estrela de quatro pontas em verde-limão.",
      "A paleta vem diretamente da paisagem de Norfolk, priorizando calor visual e acessibilidade digital. O verde-junco (bulrush green) assume como cor líder, em referência ao entorno natural do campus. Os layouts são limpos e a tipografia é a Inter, escolhida para manter estrutura clara entre as diversas mídias.",
      "Junto com o sistema visual, a rbl reestruturou a identidade verbal em torno de quatro traços: otimismo corajoso, individualidade confiante, coração compassivo e espírito colaborativo. Antes do lançamento, testes com estudantes, funcionários e stakeholders indicaram que 95% dos respondentes viam a nova marca como original e confiante, e 100% afirmaram que ela refletia a estratégia geral da universidade.",
      "Charlene Katuwawala, guardiã da marca na UEA, diz que a agência entregou mais do que uma identidade nova: ouviu com profundidade, desafiou com cuidado e trouxe a comunidade junto no processo, deixando a instituição com um senso renovado de confiança, conexão e direção. Adam Concar, diretor criativo executivo e cossócio da rbl, defende que marcas que significam mais conquistam mais.",
      "A identidade já está sendo aplicada nas campanhas de captação, na comunicação interna, na sinalização e nos canais digitais da universidade."

  {

    url: "https://www.itsnicethat.com/features/in-house-monzo-vuokko-aro-coral-garvey-creative-industry-020926",

    alt: "Peça-chave da campanha Get busy living do Monzo, na cor coral característica da marca",

    resumo: [
      "Os famosos cartões “hot coral” do Monzo começaram como um simples teste em protótipos iniciais. Só depois a empresa percebeu o quanto aquele desenho chamativo e instantaneamente reconhecível construía marca sozinho. É um bom resumo de como o banco britânico trata design: como diferencial de negócio, não como acabamento.",
      "O Monzo bateu um recorde mundial ao levantar 1 milhão de libras em 96 segundos no lançamento, em 2015. Onze anos depois, tem mais de 16 milhões de clientes e já não é o disruptor desalinhado do começo. O It’s Nice That conversou com duas das pessoas que comandam a criação interna: Vuokko Aro, chief design officer desde 2017, e Coral Garvey, diretora criativa que entrou em 2024.",
      "O que fica é o coral, a centralidade obsessiva no cliente, o design de produto simples e moderno e a insistência em que o produto tenha dimensão emocional, não apenas funcional. O que mudou foi a escala: orçamentos maiores, campanhas maiores, novos tipos de mídia — neste verão europeu o banco tomou Piccadilly Circus inteira, o tipo de coisa que marca desafiante nenhuma faz. Também deu para contratar especialistas e definir coisas como o branding sonoro.",
      "Garvey trata as diretrizes de marca como entidade viva — “meu maior amor e a desgraça da minha existência” — e desafia o time constantemente a testar até onde a marca flexiona e até onde consegue encolher, tirando camadas até achar clareza suficiente para expandir com segurança.",
      "O ponto mais duro da entrevista é organizacional: pesquisa de usuário, design de produto e marca vivem num único time. Aro diz que nunca abriu mão de um nível consistente de qualidade e encanto em tudo o que a pessoa vê e usa — peça de marketing ou tela do app, tudo precisa parecer feito pela mesma mão, ainda que o time já passe de cem pessoas. E é explícita: já viu o que acontece quando design vira função de entrega. No Monzo, design é par, é parceiro, não fornecedor interno.",

      "O aparelho vem com case protetor transparente construído para emoldurar o design em vez de escondê-lo — detalhe que importa mais do que parece, já que a maioria das capas existe para proteger ao custo de ocultar justamente aquilo que tornava o produto desejável. Aqui a capa se comporta mais como vitrine de museu do que como carcaça de borracha.",
      "Nada disso vem às custas do hardware. A tela Extreme AMOLED de 6,9 polegadas se desdobra para o uso diário, apoiada por um sistema de câmera dupla de 50 MP e bateria de 4.800 mAh avaliada em mais de 36 horas por carga. A tela externa de 3,6 polegadas continua rodando aplicativos completos e resolvendo notificações sem exigir que o aparelho seja aberto.",
      "A Motorola enquadra a Brilliant Collection como prova de que tecnologia pode ser bonita e inteligente ao mesmo tempo — e este razr sustenta o discurso com hardware que se seguraria sozinho mesmo sem um único cristal. O preço fica em US$ 899,99, com chegada ao Motorola.com e à Amazon em 10 de setembro e à Verizon a partir de 24 de setembro."

  },
  {
    rank: 11,
    estrelas: 3,
    categoria: "Tecnologia",
    title: "Crusoe reportedly raises $3B at a $30B valuation",
    source: "TechCrunch",
    url: "https://techcrunch.com/2026/09/03/crusoe-reportedly-raises-3b-at-a-30b-valuation/",
    imageUrl: "https://techcrunch.com/wp-content/uploads/2026/08/GettyImages-2245923419.jpg?resize=1200,800",
    tituloPt: "De mineradora de cripto movida a gás queimado a US$ 30 bilhões em oito anos: a Crusoe levanta US$ 3 bilhões logo depois de fechar contrato de US$ 13 bilhões com a Jane Street",
    dek: "A desenvolvedora de data centers que atende Meta, Microsoft e OpenAI triplicou de valor em dez meses e já conversa com bancos sobre IPO.",
    data: "3 de setembro de 2026",
    alt: "Interior de um data center com corredores de servidores iluminados",
    paywall: false,
    resumo: [
      "A Crusoe, desenvolvedora de data centers que tem Meta, Microsoft e OpenAI entre seus clientes, levantou uma nova rodada de US$ 3 bilhões a uma avaliação de US$ 30 bilhões, segundo apuração da Bloomberg reproduzida pelo TechCrunch.",
      "O negócio é coliderado pela Atreides Management e pela Valor Equity Partners, com participação da Mubadala Capital, subsidiária de gestão de ativos do fundo soberano Mubadala, de Abu Dhabi.",

      "A rodada chega dez meses depois de a Crusoe ter captado US$ 1,38 bilhão a uma avaliação de US$ 10 bilhões, em outubro. Em menos de um ano, portanto, a companhia triplicou de valor.",
      "A trajetória da empresa é uma das mais improváveis do setor. Lançada em 2018 como uma operação de mineração de criptomoedas alimentada por gás natural queimado em flare — aquele gás desperdiçado em campos de petróleo —, a Crusoe pivotou para se tornar uma grande provedora de infraestrutura e nuvem de IA, hoje mais conhecida por desenvolver campi de data centers em hiperescala para clientes como Oracle e OpenAI.",
      "O próximo capítulo pode ser a bolsa: segundo o Axios, a empresa se reuniu recentemente com bancos de investimento, incluindo Goldman Sachs e Morgan Stanley, para discutir um possível IPO no curto prazo."

  }
];

const PALETAS = {
  Branding:   { a:"#f4a259", b:"#e2762f", c:"#c8452b", d:"#fff3e6" },
  Design:     { a:"#5fc2a6", b:"#1f8a70", c:"#12604f", d:"#e8f7f2" },
  Tecnologia: { a:"#8f9ff0", b:"#4c5fd7", c:"#2f3d9e", d:"#eef0fe" }
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const s = (seed * 37) % 100;
  const gid = "g" + seed;
  return (
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração gerada para a categoria " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.d} />
          <stop offset="55%" stopColor={p.a} />
          <stop offset="100%" stopColor={p.c} />
        </linearGradient>
        <linearGradient id={gid + "b"} x1="1" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="0.55" />
          <stop offset="100%" stopColor="#ffffff" stopOpacity="0" />
        </linearGradient>
      </defs>
      <rect width="800" height="500" fill={"url(#" + gid + ")"} />
      <circle cx={160 + s * 2.2} cy={130 + s} r={130 + s * 0.6} fill={p.b} opacity="0.34" />
      <circle cx={620 - s * 1.4} cy={370 - s * 0.8} r={100 + s * 0.9} fill={p.c} opacity="0.28" />
      <rect x={330 + s} y={70} width={190} height={190} rx="28" fill="#fff" opacity="0.20"
            transform={"rotate(" + (s * 0.35 - 12) + " " + (425 + s) + " 165)"} />
      <path d={"M0 " + (420 - s * 1.1) + " Q200 " + (330 - s) + " 400 " + (400 - s * 0.5) + " T800 " + (360 + s * 0.4) + " L800 500 L0 500 Z"}
            fill={p.c} opacity="0.42" />
      <rect width="800" height="500" fill={"url(#" + gid + "b)"} />
    </svg>
  );
}

function Figura({ item, className }) {
  const [falhou, setFalhou] = useState(false);
  const mostrarSvg = !item.imageUrl || falhou;
  return (
    <div className={className}>
      {mostrarSvg
        ? <Ilustracao categoria={item.categoria} seed={item.rank} />
        : <img src={item.imageUrl} alt={item.alt} loading="lazy" referrerPolicy="no-referrer"
               onError={() => setFalhou(true)} />}
    </div>
  );
}

function Estrelas({ n }) {
  return (
    <span className="stars" aria-label={n + " de 5 estrelas de relevância"}>
      {"★".repeat(n)}<span className="off">{"★".repeat(5 - n)}</span>
    </span>
  );
}

function TagCat({ c }) {
  const cls = c === "Branding" ? "branding" : c === "Design" ? "design" : "tech";
  return <span className={"tag " + cls}>{c}</span>;
}

function Sheet({ item, onClose }) {
  return (
    <div className="overlay" onClick={onClose} role="dialog" aria-modal="true">
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div style={{ position: "relative" }}>
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Figura item={item} className="sheet-media" />
        </div>
        <div className="sheet-body">
          <div className="srcline">
            <TagCat c={item.categoria} />
            <b>{item.source}</b>
            <span>{item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="prose">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {item.paywall && (
            <div className="note">
              Esta matéria está atrás de paywall. O resumo acima foi escrito a partir dos elementos
              públicos disponíveis (título, dek, categoria, indústria e tags) — nenhum detalhe do
              corpo do texto foi inferido.
            </div>
          )}
          {!item.imageUrl && (
            <div className="note">
              O portal não expôs imagem de destaque acessível; a ilustração acima foi gerada
              para esta edição.
            </div>
          )}
          <div className="sheet-foot">
            <span style={{ fontSize: 12.5, color: "var(--muted)" }}>
              Resumo original em português, produzido para o Portal da Manhã.
            </span>
            <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = useMemo(() => [...NOTICIAS].sort((a, b) => a.rank - b.rank), []);
  const manchete = ordenadas[0];
  const resto = ordenadas.slice(1);
  const portais = useMemo(() => [...new Set(NOTICIAS.map(n => n.source))], []);
  const comFoto = NOTICIAS.filter(n => n.imageUrl).length;

  React.useEffect(() => {
    const h = e => { if (e.key === "Escape") setAberto(null); };
    window.addEventListener("keydown", h);
    document.body.style.overflow = aberto ? "hidden" : "";
    return () => window.removeEventListener("keydown", h);
  }, [aberto]);

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker"><span className="dot"></span> Sexta-feira, 4 de setembro de 2026</div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="sub">
          Uma leitura diária de branding, design e tecnologia. {NOTICIAS.length} matérias das últimas 24 a 48 horas,
          ranqueadas por relevância, resumidas em português e sempre com link para a fonte.
        </p>
        <div className="meta-row">
          <span className="pill">{portais.length} portais</span>
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{comFoto} com foto original</span>
          {portais.map(p => <span className="pill" key={p}>{p}</span>)}
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <Figura item={manchete} className="hero-media" />
        <div className="hero-body">
          <div className="srcline">
            <TagCat c={manchete.categoria} />
            <b>{manchete.source}</b>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p className="hero-dek">{manchete.dek}</p>
          <div className="srcline"><span>{manchete.data}</span><span>· Clique para ler o resumo completo</span></div>
        </div>
      </article>

      <div className="grid">
        {resto.map(item => (
          <article className="card" key={item.rank} onClick={() => setAberto(item)}>
            <div style={{ position: "relative" }}>
              <span className="rank">#{item.rank}</span>
              <Figura item={item} className="card-media" />
            </div>
            <div className="card-body">
              <div className="srcline">
                <TagCat c={item.categoria} />
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="card-dek">{item.dek}</p>
              <div className="srcline"><b>{item.source}</b><span>{item.data}</span></div>
            </div>
          </article>
        ))}
      </div>

      {aberto && <Sheet item={aberto} onClose={() => setAberto(null)} />}

      <footer>
        <p>
          <b>Portal da Manhã</b> — edição de 4 de setembro de 2026. Os resumos em português são
          originais, escritos a partir da leitura das matérias, e não reproduzem o texto das fontes.
          Imagens carregadas diretamente dos servidores dos veículos originais, com todos os direitos
          de seus respectivos detentores. Quando não há imagem disponível, uma ilustração é gerada
          automaticamente.
        </p>
        <p>Nota da edição: o Brand New está em pausa de fim de verão até 8 de setembro, sem publicações novas no período.</p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
