<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Portal da Manhã — 20 de agosto de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9;
    --card:#ffffff;
    --ink:#12151a;
    --ink-2:#4a5361;
    --ink-3:#7b8697;
    --line:#e6e9ee;
    --accent:#1b6bff;
    --radius:18px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06);
    --shadow-hover:0 2px 6px rgba(16,24,40,.06), 0 18px 46px rgba(16,24,40,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 80px}
  header.top{padding:28px 0 22px;border-bottom:1px solid var(--line);margin-bottom:32px}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1.logo{
    font-size:clamp(30px,4.6vw,46px);
    letter-spacing:-.03em;
    margin:0;font-weight:800;
  }
  .dot{color:var(--accent)}
  .data{color:var(--ink-3);font-size:14px;text-transform:capitalize}
  .sub{color:var(--ink-2);font-size:15px;margin-top:10px;max-width:660px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .chip{
    font-size:12.5px;font-weight:600;color:var(--ink-2);
    background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  }
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    border-radius:999px;padding:4px 10px;
  }
  .tag-branding{background:#fff1e6;color:#b04a12}
  .tag-design{background:#e4f6f1;color:#0f7a63}
  .tag-tec{background:#ecebff;color:#4438c4}
  .stars{color:#f2b134;font-size:13px;letter-spacing:1px}
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .28s ease, transform .28s ease;
    display:grid;grid-template-columns:1.15fr 1fr;margin-bottom:38px;
  }
  .hero:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
  .hero-media{position:relative;min-height:340px;background:#eef1f5}
  .hero-media img,.card-media img{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
  .hero-body h2{font-size:clamp(23px,2.6vw,31px);line-height:1.22;margin:4px 0 0;letter-spacing:-.02em}
  .hero-body p{color:var(--ink-2);margin:0;font-size:15.5px}
  .meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .source{font-size:13px;font-weight:700;color:var(--ink)}
  .sep{color:var(--ink-3)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:box-shadow .28s ease, transform .28s ease;
  }
  .card:hover{box-shadow:var(--shadow-hover);transform:translateY(-3px)}
  .card-media{height:186px;background:#eef1f5;position:relative}
  .card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card-body h3{font-size:17px;line-height:1.32;margin:2px 0 0;letter-spacing:-.01em}
  .card-body p{color:var(--ink-2);font-size:13.6px;margin:0}
  .rank{
    position:absolute;top:12px;left:12px;background:rgba(18,21,26,.82);color:#fff;
    width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;backdrop-filter:blur(4px);
  }
  .aviso{font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:8px;margin-top:auto}
  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(14,17,22,.52);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:38px 18px;z-index:60;
    overflow-y:auto;animation:fade .22s ease;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
  .modal{
    background:#fff;border-radius:24px;max-width:820px;width:100%;overflow:hidden;
    box-shadow:0 30px 80px rgba(10,14,20,.32);animation:rise .3s cubic-bezier(.2,.8,.3,1);
  }
  .modal-media{height:320px;background:#eef1f5}
  .modal-media img{width:100%;height:100%;object-fit:cover;display:block}
  .modal-body{padding:30px 34px 34px}
  .modal-body h2{font-size:clamp(21px,2.4vw,28px);line-height:1.25;margin:10px 0 6px;letter-spacing:-.02em}
  .modal-body .resumo p{color:var(--ink-2);font-size:15.5px;margin:0 0 14px}
  .modal-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:22px}
  .btn{
    border:0;border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;
    text-decoration:none;display:inline-flex;align-items:center;gap:8px;
  }
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:#f1f3f7;color:var(--ink)}
  .nota{font-size:12.5px;color:var(--ink-3);margin-top:16px;font-style:italic}
  footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
  @media (max-width:900px){
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:240px}
    .grid{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .hero-body{padding:24px}
    .modal-body{padding:22px}
    .modal-media{height:220px}
  }
</style>
</head>

const PALETAS = {
  Branding: ["#ff9a5a", "#f2653f", "#ffd6a5"],
  Design: ["#3fbfa0", "#0f8a72", "#bdf0e2"],
  Tecnologia: ["#7a6bff", "#3f4fd6", "#d5d3ff"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const gid = "g" + categoria + seed;
  const off = (seed * 37) % 60;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} role="img"
         aria-label={"Ilustração gerada para a categoria " + categoria}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[1]} />
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={"url(#" + gid + ")"} />
      <circle cx={80 + off} cy={70} r={78} fill={p[2]} opacity="0.42" />
      <circle cx={310 - off} cy={200} r={104} fill="#ffffff" opacity="0.16" />
      <rect x={210 - off / 2} y={30} width="130" height="130" rx="26" fill="#ffffff" opacity="0.2"
            transform={"rotate(" + (off / 4 + 8) + " 275 95)"} />
      <path d={"M0 " + (200 + off / 3) + " Q120 " + (140 + off) + " 240 " + (196 - off / 4) + " T400 170 L400 260 L0 260 Z"}
            fill="#ffffff" opacity="0.14" />
    </svg>
  );
}

function Foto({ item, alt }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao categoria={item.categoria} seed={item.id} />;
  }
  return (
    <img
      src={item.imageUrl}
      alt={alt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

function classeTag(cat) {
  if (cat === "Branding") return "tag tag-branding";
  if (cat === "Tecnologia") return "tag tag-tec";
  return "tag tag-design";
}

function Estrelas({ n }) {
  return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n) + "☆".repeat(5 - n)}</span>;
}

function Modal({ item, fechar }) {
  return (
    <div className="overlay" onClick={fechar} role="dialog" aria-modal="true">
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="modal-media"><Foto item={item} alt={item.tituloPt} /></div>
        <div className="modal-body">
          <div className="meta">
            <span className={classeTag(item.categoria)}>{item.categoria}</span>
            <Estrelas n={item.estrelas} />
            <span className="sep">·</span>
            <span className="source">{item.source}</span>
            <span className="sep">·</span>
            <span className="data">{item.data}</span>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="resumo">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {item.paywall && (
            <p className="nota">Matéria com acesso restrito no portal de origem — resumo redigido apenas a partir dos elementos públicos.</p>
          )}
          <div className="modal-actions">
            <a className="btn btn-primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn btn-ghost" onClick={fechar}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const manchete = NOTICIAS[0];
  const demais = NOTICIAS.slice(1);
  const portais = Array.from(new Set(NOTICIAS.map(n => n.source)));

  return (
    <div className="wrap">
      <header className="top">
        <div className="brand">
          <h1 className="logo">Portal da Manhã<span className="dot">.</span></h1>
          <span className="data">quinta-feira, 20 de agosto de 2026</span>
        </div>
        <p className="sub">
          Uma seleção diária do que saiu de mais relevante em branding, design e tecnologia
          nas últimas 24 horas. Clique em qualquer notícia para ler o resumo completo em português.
        </p>
        <div className="chips">
          <span className="chip">{NOTICIAS.length} notícias</span>
          <span className="chip">{portais.length} portais</span>
          {portais.map(p => <span className="chip" key={p}>{p}</span>)}
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <div className="hero-media">
          <Foto item={manchete} alt={manchete.tituloPt} />
        </div>
        <div className="hero-body">
          <div className="meta">
            <span className={classeTag(manchete.categoria)}>{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.chamada}</p>
          <div className="meta">
            <span className="source">{manchete.source}</span>
            <span className="sep">·</span>
            <span className="data">{manchete.data}</span>
          </div>
        </div>
      </article>

      <div className="grid">
        {demais.map((item, i) => (
          <article className="card" key={item.id} onClick={() => setAberto(item)}>
            <div className="card-media">
              <span className="rank">{i + 2}</span>
              <Foto item={item} alt={item.tituloPt} />
            </div>
            <div className="card-body">
              <div className="meta">
                <span className={classeTag(item.categoria)}>{item.categoria}</span>
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <p>{item.chamada}</p>
              <div className="aviso">{item.source} · {item.data}</div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã — edição de 20 de agosto de 2026. Resumos redigidos em português a partir
        das reportagens originais; todos os créditos e direitos pertencem aos portais de origem.
      </footer>

      {aberto && <Modal item={aberto} fechar={() => setAberto(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
