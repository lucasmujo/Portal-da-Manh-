      <circle cx={60+r(3)*2.5} cy={60+r(5)} r={50+r(7)/2} fill="#fff" opacity=".18"/>
      <rect x={200+r(2)} y={100+r(4)/2} width="140" height="140" rx="28" fill="#fff" opacity=".16" transform={"rotate("+(r(6)-20)+" 270 170)"}/>
      <polygon points={`${20+r(1)},240 ${120+r(8)},${120+r(9)} ${220},240`} fill="#000" opacity=".1"/>
      <circle cx={330-r(4)} cy={50+r(2)/2} r="26" fill="#fff" opacity=".3"/>
    </svg>
  );
}

function Imagem({item}){
  const [falhou,setFalhou]=useState(false);
  return (
    <div className="img">
      {(!item.imageUrl||falhou)
        ? <Ilustracao titulo={item.title} cat={item.cat}/>
        : <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>}
    </div>
  );
}
const Estrelas=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
const Meta=({item})=>(
  <div className="meta"><span className={"tag t-"+item.cat}>{item.cat}</span><Estrelas n={item.stars}/><span>{item.source} · {item.data}</span></div>
);

function Modal({item,onClose}){
  useEffect(()=>{
    const k=e=>e.key==="Escape"&&onClose();
    document.addEventListener("keydown",k);document.body.style.overflow="hidden";
    return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""};
  },[]);
  return (
    <div className="overlay" onClick={onClose}>
      <article className="modal" onClick={e=>e.stopPropagation()}>
        <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        <Imagem item={item}/>
        <div className="body">
          <Meta item={item}/>
          <h2>{item.tituloPt}</h2>
          {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
          {item.paywall&&<p className="aviso">Matéria atrás de paywall: resumo feito a partir dos elementos públicos (título, categoria, setor e tags).</p>}
          {!item.imageUrl&&<p className="aviso">Imagem de destaque indisponível nesta matéria; ilustração gerada.</p>}
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a>
        </div>
      </article>
    </div>
  );
}

function App(){
  const [aberto,setAberto]=useState(null);
  const lista=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [top,...resto]=lista;
  return (
    <div className="wrap">
      <header>
        <div><h1>Portal da Manhã</h1><div className="date">domingo, 18 de outubro de 2026</div></div>
        <div className="date" style={{textTransform:"none"}}>{NEWS.length} notícias · Branding, Design e Tecnologia</div>
      </header>
      <section className="hero" onClick={()=>setAberto(top)}>
        <Imagem item={top}/>
        <div className="body"><Meta item={top}/><h2>{top.tituloPt}</h2><p style={{margin:0,color:"#4b4b55"}}>{top.resumo[0].slice(0,230)}…</p><span style={{fontWeight:600,color:"var(--acc)"}}>Abrir resumo →</span></div>
      </section>
      <div className="grid">
        {resto.map(it=>(
          <div key={it.url} className="card" onClick={()=>setAberto(it)}>
            <Imagem item={it}/>
            <div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3></div>
          </div>
        ))}
      </div>
      <footer>Resumos escritos em português a partir das matérias originais. Clique em qualquer notícia para ler.</footer>
      {aberto&&<Modal item={aberto} onClose={()=>setAberto(null)}/>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
