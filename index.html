.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}

.ov{position:fixed;inset:0;background:rgba(15,17,30,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px;z-index:10;animation:f .2s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .25s}
.modal .img{height:320px}
.modal .in{padding:26px 30px 32px}
.modal h2{margin:8px 0 14px;font-size:26px;line-height:1.2}
.modal p{font-size:16px;color:#2b2f40}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin-top:14px}
.btn{display:inline-block;margin-top:16px;background:var(--acc);color:#fff;padding:10px 18px;border-radius:12px;text-decoration:none;font-weight:600;font-size:14px}
.x{float:right;border:0;background:#f0f1f6;border-radius:99px;width:36px;height:36px;font-size:18px;cursor:pointer}

const PALETAS = {
  Branding: [["#ff9a5a","#ff5f6d"],["#ffd36e","#ff8a4c"],["#ff7e67","#c94b8a"]],
  Design: [["#34d3a8","#0e8f8a"],["#7be0c3","#1b9aaa"],["#4fd1a5","#2b7a78"]],
  Tecnologia: [["#6c8cff","#7b3fe4"],["#4facfe","#6a3fd8"],["#8e7bff","#3b5bdb"]]
};

function Ilustracao({ cat, seed }) {
  const ps = PALETAS[cat] || PALETAS.Design;
  const [a, b] = ps[seed % ps.length];
  const id = "g" + seed;
  const r = (n) => ((seed * 37 + n * 53) % 100);
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração " + cat}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={a}/><stop offset="1" stopColor={b}/></linearGradient>
      </defs>
      <rect width="400" height="240" fill={`url(#${id})`}/>
      <circle cx={80 + r(1) * 2} cy={60 + r(2)} r={50 + r(3) / 2} fill="#fff" opacity=".18"/>
      <rect x={200 + r(4)} y={90 + r(5) / 2} width="120" height="120" rx="26" fill="#fff" opacity=".16" transform={`rotate(${r(6) - 20} 260 150)`}/>
      <polygon points={`${40 + r(7)},230 ${140 + r(8)},120 ${240 + r(9)},230`} fill="#fff" opacity=".14"/>
      <circle cx={330} cy={50} r="22" fill="#fff" opacity=".3"/>
    </svg>
  );
}

function Imagem({ item, idx }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <div className="img"><Ilustracao cat={item.categoria} seed={idx + 1} /></div>;
  return (
    <div className="img">
      <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />
    </div>
  );
}

function Estrelas({ n }) { return <span className="stars" aria-label={n + " de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>; }

function Meta({ item }) {
  return (
    <div className="meta">
      <span className={"tag " + item.categoria}>{item.categoria}</span>
      <strong>{item.source}</strong><span>· {item.data}</span><Estrelas n={item.stars} />
    </div>
  );
}

function Detalhe({ item, idx, fechar }) {
  useEffect(() => {
    const h = (e) => e.key === "Escape" && fechar();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);
  return (
    <div className="ov" onClick={fechar}>
      <article className="modal" onClick={(e) => e.stopPropagation()}>
        <Imagem item={item} idx={idx} />
        <div className="in">
          <button className="x" onClick={fechar} aria-label="Fechar">✕</button>
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          {item.resumo.map((p, i) => <p key={i}>{p}</p>)}
          {item.paywall && <div className="note">Matéria atrás de paywall: o resumo foi escrito apenas a partir dos elementos públicos (título, categoria, indústria e tags).</div>}
          <div className="orig">Título original: {item.title}</div>
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a>
        </div>
      </article>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const itens = [...NEWS].sort((a, b) => b.stars - a.stars);
  const [hero, ...resto] = itens;
  const hoje = new Date(2026, 9, 7).toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const abrir = (it) => setAberto(it);
  return (
    <div className="wrap">
      <header>
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">{hoje}</div>
      </header>
      <section className="hero" onClick={() => abrir(hero)}>
        <Imagem item={hero} idx={0} />
        <div className="body">
          <Meta item={hero} />
          <h2>{hero.tituloPt}</h2>
          <p style={{ margin: 0, color: "#4a4f63" }}>{hero.resumo[0]}</p>
          <span style={{ color: "var(--acc)", fontWeight: 600 }}>Ler resumo completo →</span>
        </div>
      </section>
      <section className="grid">
        {resto.map((it, i) => (
          <div className="card" key={it.url} onClick={() => abrir(it)}>
            <Imagem item={it} idx={i + 1} />
            <div className="body">
              <Meta item={it} />
              <h3>{it.tituloPt}</h3>
            </div>
          </div>
        ))}
      </section>
      <footer>Resumos produzidos em português a partir das matérias originais · Edição de 7 de outubro de 2026</footer>
      {aberto && <Detalhe item={aberto} idx={NEWS.indexOf(aberto)} fechar={() => setAberto(null)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
