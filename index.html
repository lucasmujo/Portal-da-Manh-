<head>

<title>Portal da Manhã — 9 de setembro de 2026</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  :root{
    --bg:#f6f6f4; --card:#ffffff; --ink:#15161a; --muted:#6b6f76;
    --line:#e6e5e1; --accent:#c9482f; --accent-soft:#fdf1ee;
    --radius:20px; --shadow:0 1px 2px rgba(16,17,20,.04), 0 8px 28px rgba(16,17,20,.06);
    --shadow-lg:0 2px 6px rgba(16,17,20,.05), 0 24px 60px rgba(16,17,20,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  header.top{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1.brand{font-family:Fraunces,Georgia,serif;font-size:clamp(38px,6vw,64px);line-height:1.02;margin:12px 0 10px;font-weight:600;letter-spacing:-.02em}
  .datestr{color:var(--muted);font-size:15px}
  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .pill{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px}

  .lead{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s ease, box-shadow .25s ease;margin-bottom:34px}
  .lead:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .lead .thumb{position:relative;min-height:340px;background:#eee}
  .lead .body{padding:34px}
  .lead h2{font-family:Fraunces,Georgia,serif;font-size:clamp(24px,2.6vw,34px);line-height:1.14;margin:14px 0 14px;font-weight:600;letter-spacing:-.01em}
  .lead p.dek{color:var(--muted);font-size:15px;line-height:1.6;margin:0}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s ease, box-shadow .25s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .card .thumb{position:relative;aspect-ratio:16/10;background:#eee}
  .card .body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.24;margin:0;font-weight:600}
  .card p.dek{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}
  img.ph{width:100%;height:100%;object-fit:cover;display:block}
  .srcline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .src{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--accent)}
  .cat{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-left:1px solid var(--line);padding-left:10px}
  .stars{margin-left:auto;font-size:12px;color:#d8a02a;letter-spacing:1px}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(20,20,22,.5);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;z-index:50;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal{background:var(--card);border-radius:24px;max-width:800px;width:100%;overflow:hidden;box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.2,.8,.3,1)}
  .modal .hero{aspect-ratio:16/9;background:#eee;position:relative}
  .modal .content{padding:34px}
  .modal h2{font-family:Fraunces,Georgia,serif;font-size:clamp(23px,3vw,32px);line-height:1.15;margin:14px 0 18px;font-weight:600}
  .modal .txt p{font-size:16px;line-height:1.72;color:#2c2e33;margin:0 0 16px}
  .note{font-size:13px;color:var(--muted);background:var(--accent-soft);border:1px solid #f3ddd7;border-radius:12px;padding:12px 14px;margin-top:6px}
  .actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .closex{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.94);border:none;border-radius:999px;width:36px;height:36px;font-size:18px;cursor:pointer;line-height:1;box-shadow:var(--shadow)}
  footer{border-top:1px solid var(--line);padding:26px 0 60px;color:var(--muted);font-size:13px}
  @media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.lead{grid-template-columns:1fr}.lead .thumb{min-height:220px;aspect-ratio:16/9}}
  @media(max-width:620px){.grid{grid-template-columns:1fr}.modal .content,.lead .body{padding:24px}}
</style>
</head>

      "A Royal Society of Arts, instituição britânica fundada em 1754, apresentou nesta quarta-feira uma identidade visual completamente nova assinada pela produtora criativa Baby Teeth. Mais do que um logo novo, o trabalho marca um reposicionamento: aos 272 anos, a RSA passa a se definir como a casa da criatividade para o bem comum — uma afirmação deliberadamente política, feita num momento em que o Reino Unido corta financiamento para as artes e reduz a presença do ensino criativo nas escolas.",

const PALETAS = {
  "Branding": ["#f7b267","#c9482f","#f4845f"],
  "Design":   ["#3fb59a","#186f5f","#7fd6bd"],
  "Tecnologia": ["#7c7ce8","#3b3ba8","#a9a6f2"]
};

function Ilustra({ categoria, seed }){
  const p = PALETAS[categoria] || PALETAS["Design"];
  const id = "g" + seed;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" style={{width:"100%",height:"100%",display:"block"}} role="img" aria-label={"Ilustração decorativa da categoria " + categoria}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="100%" stopColor={p[1]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={"url(#"+id+")"}/>
      <circle cx={70 + (seed*37)%180} cy={70 + (seed*23)%90} r={58} fill={p[2]} opacity="0.55"/>
      <rect x={200 + (seed*13)%80} y={120 - (seed*11)%60} width="120" height="120" rx="16" fill="#ffffff" opacity="0.18"
            transform={"rotate(" + ((seed*17)%40 - 20) + " 260 180)"}/>
      <path d={"M0 " + (200 - (seed*9)%60) + " Q 100 " + (140 + (seed*7)%50) + " 200 " + (190 - (seed*5)%40) + " T 400 " + (170 + (seed*3)%40) + " L400 250 L0 250 Z"} fill="#ffffff" opacity="0.22"/>
      <circle cx={330} cy={60} r={26} fill="#ffffff" opacity="0.25"/>
    </svg>
  );
}

function Foto({ item, seed }){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou) return <Ilustra categoria={item.categoria} seed={seed}/>;
  return (
    <img className="ph" src={item.imageUrl} referrerPolicy="no-referrer" loading="lazy"
         alt={item.tituloPt} onError={() => setFalhou(true)} />
  );
}

function Estrelas({ n }){
  return <span className="stars" title={n + " de 5"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
}

function Modal({ item, onClose, seed }){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="hero">
          <Foto item={item} seed={seed}/>
          <button className="closex" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <div className="content">
          <div className="srcline">
            <span className="src">{item.source}</span>
            <span className="cat">{item.categoria}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <div className="txt">
            {item.resumo.map((p,i) => <p key={i}>{p}</p>)}
          </div>
          {item.paywall && <div className="note">Matéria com acesso restrito a assinantes. O resumo foi escrito a partir dos elementos públicos da página.</div>}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn" onClick={onClose}>Voltar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberta, setAberta] = useState(null);
  const [manchete, ...resto] = NOTICIAS;
  const portais = Array.from(new Set(NOTICIAS.map(n => n.source)));

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de quarta-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="datestr">9 de setembro de 2026 · branding, design e tecnologia das últimas 24 horas</div>
        <div className="meta-row">
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais.length} portais</span>
          <span className="pill">Clique em qualquer card para ler o resumo</span>
        </div>
      </header>

      <article className="lead" onClick={() => setAberta(0)}>
        <div className="thumb"><Foto item={manchete} seed={1}/></div>
        <div className="body">
          <div className="srcline">
            <span className="src">{manchete.source}</span>
            <span className="cat">{manchete.categoria}</span>
            <Estrelas n={manchete.estrelas}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p className="dek">{manchete.dek}</p>
        </div>
      </article>

      <section className="grid">
        {resto.map((n,i) => (
          <article className="card" key={n.url} onClick={() => setAberta(i+1)}>
            <div className="thumb"><Foto item={n} seed={i+2}/></div>
            <div className="body">
              <div className="srcline">
                <span className="src">{n.source}</span>
                <Estrelas n={n.estrelas}/>
              </div>
              <h3>{n.tituloPt}</h3>
              <p className="dek">{n.dek}</p>
            </div>
          </article>
        ))}
      </section>

      {aberta !== null && <Modal item={NOTICIAS[aberta]} seed={aberta+1} onClose={() => setAberta(null)}/>}

      <footer>
        Portal da Manhã · edição de 9 de setembro de 2026. Resumos em português escritos a partir da leitura das reportagens originais; todos os créditos e direitos são dos veículos e fotógrafos citados. As imagens são carregadas diretamente dos servidores dos portais.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
