<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mut:#667085;--line:#e6e8ef;--acc:#4f46e5;--br:#f97316;--ds:#0d9488;--tc:#6366f1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{margin:0;font-size:30px;letter-spacing:-.02em}.date{color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff}
.Branding{background:var(--br)}.Design{background:var(--ds)}.Tecnologia{background:var(--tc)}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.05);overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;border:0;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(16,24,40,.12)}
.img{aspect-ratio:16/9;background:#eee;overflow:hidden}.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.hero{display:grid;grid-template-columns:1.3fr 1fr;margin-bottom:24px}.hero .body{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.02em}.hero .img{aspect-ratio:auto;min-height:300px;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.body{padding:16px 18px 20px}.body h3{margin:10px 0 8px;font-size:17px;line-height:1.3}
.meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--mut);flex-wrap:wrap}.stars{color:#f5a623;letter-spacing:1px}
.warn{font-size:12px;color:#b54708;background:#fffaeb;border-radius:8px;padding:4px 8px;margin-top:8px;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 14px;z-index:10;animation:fade .2s}

.modal .img{aspect-ratio:16/9}.modal .in{padding:24px 28px 30px}.modal h2{font-size:25px;line-height:1.25;margin:10px 0 12px;letter-spacing:-.02em}
.modal p{font-size:16px;color:#2b2f3a;margin:0 0 14px}.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:2}
.src{display:inline-block;margin-top:6px;background:var(--acc);color:#fff;text-decoration:none;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px}
@keyframes fade{from{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(20px)}}
footer{margin-top:36px;color:var(--mut);font-size:13px;text-align:center}

<script type="text/babel">

const ITEMS = [
{
 title: "Kiwibank sheep went viral for all the wrong reasons, and there's something every brand can learn from it",
 tituloPt: "A ovelha do Kiwibank viralizou pelos motivos errados — e toda marca pode aprender com isso",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/news/the-kiwibank-sheep-controversy-suggests-brands-should-give-up-trying-to-control-ai-mascots",
 imageUrl: "https://cdn.mos.cms.futurecdn.net/QnZ64XSk25kRmz56YoYCeS-1920-80.jpg",
 cat: "Branding", stars: 5, aviso: null,
 resumo: ["O banco estatal neozelandês Kiwibank lançou uma campanha com Buck, uma ovelha animada com IA que aparece tomando um flat white e convida o público a escolher um banco “nascido para desafiar o sistema”. A peça passou quase despercebida fora da Nova Zelândia — até um usuário do X publicar um comentário sexualizado sobre a personagem, o que fez imagens explícitas geradas por IA se espalharem por fóruns e memes antigos do país ressurgirem.","A reação do banco foi pedir remoções por direitos autorais, o que foi lido como censura e provocou o efeito Streisand: a conversa deixou de ser sobre a campanha e passou a ser sobre liberdade de expressão. O texto lembra que tribunais dos EUA já decidiram que arte feita por IA não é protegível por copyright, e que o Kiwibank afirma que a personagem foi criada por artistas, usando IA apenas na animação.","O autor, Joe Foley, usa o caso para defender que marcas aceitem perder parte do controle sobre seus mascotes. Exemplos positivos incluem o McDonald's com o Grimace Shake, o Duolingo abraçando a versão ameaçadora da coruja Duo e a Reddit e o GitHub, que incentivam remixes de Snoo e Octocat. A linha proposta é agir apenas contra conteúdo realmente nocivo (assédio, ódio, golpes) e deixar a paródia inofensiva circular. Quando a marca usa IA para criar o próprio mascote, o público tende a tratá-lo ainda mais como material cultural livre."]
},
{
 title: "\"Connect the Dots\" — New Logo and Identity for Design Doha Biennial 2026 by Pentagram",
 tituloPt: "Novo logo e identidade da Design Doha Biennial 2026, assinados pela Pentagram",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_design_doha_biennial_2026_by_pentagram.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/DesignDohaBiennial2026_Logo_New.png",
 cat: "Branding", stars: 5, aviso: "Artigo atrás de paywall: resumo baseado em título, categoria, indústria e tags públicas.",
 resumo: ["O Brand New publicou hoje a análise do novo logo e da identidade visual da Design Doha Biennial 2026, projeto desenvolvido pelo escritório Pentagram. O texto recebeu o título “Connect the Dots” (algo como “ligue os pontos”) e está na categoria “Reviewed”, voltada a trabalhos concluídos e analisados em profundidade, no setor de cultura.","As tags públicas — árabe, azul, laranja, conferência, design, evento, Pentagram e Catar — indicam um sistema bilíngue, com escrita árabe e latina e uma paleta que combina azul e laranja. O próprio Design Week havia descrito a identidade, na semana passada, como dinâmica e bilíngue.","A página mostra imagens do novo logo e de aplicações de exemplo, mas o corpo do texto, com a justificativa do conceito, a tipografia e o sistema gráfico, fica restrito a assinantes e, por isso, não é detalhado aqui."]
},
{
 title: "Logistics fiasco or clever marketing? Apple's iPhone Duo sellout might not be such a big blunder",
 tituloPt: "Fiasco logístico ou marketing esperto? Esgotar o iPhone Duo talvez não seja um erro tão grande",
 source: "Creative Bloq",
 url: "https://www.creativebloq.com/news/logistics-fiasco-or-clever-marketing-apples-iphone-duo-sellout-might-not-be-such-a-mistake",
 imageUrl: null,
 cat: "Tecnologia", stars: 4, aviso: "Imagem de destaque não encontrada nos metadados; usando ilustração.",
 resumo: ["O iPhone Duo, dobrável de US$ 1.999 e o celular mais caro e de venda mais rápida da Apple, abriu pré-venda em 16 de outubro, com lançamento em 23. O estoque inicial esgotou, e a loja da Apple já indica entrega apenas em 25 de janeiro de 2027. Operadoras citam datas anteriores (Verizon em 5 de novembro, Xfinity em 13 de novembro, AT&T no início de dezembro) e revendedores pedem mais de US$ 4.000 no eBay.","Mark Gurman, da Bloomberg, chamou o lançamento de “grande erro”, argumentando que foi apressado para entrar no resultado do trimestre mesmo sem capacidade de produção, e que a Apple insistiu em mais de 70 países após considerar limitar a EUA e China.","Joe Foley contrapõe que a escassez gera buzz e manchetes, que um lançamento escalonado faz sentido para um produto de demanda imprevisível, num mercado em que Samsung e Google já estão estabelecidas e com escassez de chips. A Apple diz atender os pedidos o mais rápido possível, e já antecipou datas antes. Também marcou um evento “Pro and tell” para 28 de outubro, onde se espera um MacBook com tela OLED sensível ao toque."]
},
{
 title: "Made Thought and SODA Studio create new pod hotel chain",
 tituloPt: "Made Thought e SODA Studio criam nova rede de hotéis-cápsula em Londres",
 source: "Design Week",
 url: "https://www.designweek.co.uk/made-thought-and-soda-studio-create-new-pod-hotel-chain/",
 imageUrl: "https://www.designweek.co.uk/content/uploads/2026/10/SODA_Otherwander_Ruth-Ward_01-1024x768.jpg",
 cat: "Design", stars: 4, aviso: null,
 resumo: ["A Otherwander é um hotel de 566 cápsulas ao lado da entrada da linha Elizabeth, na estação Tottenham Court Road, em Soho. O CEO Fredrik Korallus pretende expandir a marca pelo Reino Unido e além, com modelos próprios, administrados e de franquia. A SODA Studio restaurou dois edifícios históricos na Dean Street e acrescentou um prédio novo atrás deles.","A Made Thought cuidou de estratégia, identidade, direção de arte, site, tom de voz, campanha de lançamento, mídia exterior, embalagens e pontos de contato dentro das cápsulas. O logo usa um O e um W arredondados, como bolhas, e o sistema se inspira em sinalização urbana e marcadores de rota, com paleta ousada e propositalmente descombinada.","No espaço, há recepção branca brilhante com tela de seis metros, o lounge Huddle com bancos verdes e rosa, parede de máquinas de venda e bar de neon. Uma escada em fita de cinco andares muda de vermelho profundo a amarelo e funciona como orientação e ponto de encontro. As cápsulas, a partir de £70 por noite, foram projetadas com a UberDutch e fabricadas pela Umdasch, com ventilação individual filtrada e um chuveiro para cada seis hóspedes. Alunos da Central Saint Martins e jovens viajantes ajudaram a calibrar privacidade e sociabilidade. Um segundo endereço, em Covent Garden, já está em desenvolvimento."]
},
{
 title: "How the NCAA turned its website from a digital information dump to a brand marketing touchpoint",
 tituloPt: "Como a NCAA transformou seu site de depósito de informação em ponto de contato de marca",
 source: "Campaign",
 url: "https://www.campaignlive.com/article/ncaa-turned-its-website-digital-information-dump-brand-marketing-touchpoint/1972925",
 imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/ncaa-GettyImages-RM-1210820897-CUS.jpg",
 cat: "Branding", stars: 4, aviso: null,
 resumo: ["O site NCAA.org tinha mais de 3.000 páginas acumuladas por atualizações pontuais e era difícil de navegar. A entidade lançou a reformulação em julho, com a agência Borshoff, de Indianápolis, e o parceiro digital Crafted. A Borshoff já havia auditado o site em 2025 e venceu a concorrência para o projeto.","A equipe cruzou conteúdo, desempenho de SEO e tráfego com os objetivos de comunicação e com pesquisas de usuários que pediam orientação mais clara. O site antigo era pesado em texto e links para PDF, com pouca marca ou narrativa; o novo é mais enérgico, próximo de um folheto de marca, e organizado por públicos: atletas atuais e futuros, pais, técnicos, funcionários de campus, administradores e jornalistas.","Cerca de 4.000 páginas antigas foram reduzidas a 400, com textos novos para as páginas principais, CMS de autosserviço e painel de análise. Há busca com IA baseada em comportamento em tempo real e um hub de carreira, já que só cerca de 2% dos atletas universitários chegam ao profissional. Entre 6 de julho e o fim de setembro, comparado a 2025, o tempo médio de engajamento subiu 97%, as sessões engajadas por usuário 40% e a conversão de eventos-chave 44%."]
},
{
 title: "Does brand design have a longevity problem?",
 tituloPt: "O design de marca tem um problema de longevidade?",
 source: "Design Week",
 url: "https://www.designweek.co.uk/does-brand-design-have-a-longevity-problem/",
 imageUrl: "https://imagescdn.designweek.co.uk/uploads/2026/10/shutterstock_2777479683.jpg?fit=crop&crop=faces&q=45&auto=compress,format&cs=origin&w=1024&h=622",
 cat: "Branding", stars: 4, aviso: null,
 resumo: ["Em artigo de opinião, Bud Rodecker, sócio e diretor de design da Span, argumenta que o design de marca vem sendo tratado como descartável. Ele cita a HBO Max, que abandonou o nome HBO, e a Jaguar, que deixou o felino saltando de lado, como sinais de uma corrida por novidade e crescimento rápido na economia da atenção.","Seguir tendências gera sameness, e produtos virais perdem força rápido — como a Stanley, de 1915, que teve explosão em 2023 e agora precisa se perguntar se aquele momento ainda fortalece a marca. Instituições culturais, que trabalham em escalas de tempo mais longas, mostram outro caminho: o IIT College of Architecture adapta a herança de Mies van der Rohe e as grades rígidas ao digital, e o Intuit Art Museum digitaliza texturas feitas à mão para alcançar jovens.","Marcas centenárias como Coca-Cola, Heinz, John Deere, Louis Vuitton e GE sobreviveram evoluindo, não congelando; o recente refresh da Coca-Cola pela JKR reorganizou ativos existentes em um sistema. Seis princípios fecham o texto: construir sobre princípios e não tendências, projetar sistemas e não peças isoladas, deixar espaço para evolução, priorizar clareza sobre novidade, investir em fundamentos duráveis como tipografia, proporção e acabamento, e equilibrar consistência com relevância."]
},
{
 title: "Why Oatly is pouring its marketing efforts into coffee shop culture",
 tituloPt: "Por que a Oatly está investindo seu marketing na cultura das cafeterias",
 source: "Campaign",
 url: "https://www.campaignlive.com/article/why-oatly-pouring-its-marketing-efforts-coffee-shop-culture/1972895",
 imageUrl: "https://cached.imagescaler.hbpl.co.uk/resize/scaleHeight/150/cached.offlinehbpl.hbpl.co.uk/news/SUC/oatly-cafe-UWP-CUS.jpg",
 cat: "Branding", stars: 4, aviso: null,
 resumo: ["Conhecida pelos outdoors cheios de texto e humor, a Oatly quer agora ser parte central da cultura do café e das bebidas. Em entrevista à Campaign US, o diretor executivo de criação Jeremy Elias diz que é uma evolução: os outdoors serviram para apresentar a marca na América do Norte, e a fase de introdução está em grande parte concluída, de modo que o foco passa a ser aprofundar a relação com fãs.","A marca montou um time de ex-baristas em várias regiões para integrar o produto às cafeterias, vistas como o melhor “terceiro espaço”. As ações cruzam café com música, moda, esporte e vida noturna: o Losers Café, durante a Copa do Mundo na Cidade do México; o evento Aftertaste com o comediante Hasan Minhaj; um pop-up com a artista Yaeji, com latte gelado de gochujang; a plataforma noturna Barista; e uma parceria no Reino Unido com a Gigs ligando dieta vegetal e hip hop.","Elias também aponta a ascensão do matcha e de bebidas mais experimentais, e quer liderar em produto e pensamento. O desafio é escalar além de um único café: a rede sul-coreana Tous Les Jours adaptou o latte da Yaeji e o vende em 210 lojas de outubro a novembro. Ativações de nicho servirão de faísca para campanhas maiores."]
},
{
 title: "OMA dresses faceted French courthouse in coloured glass",
 tituloPt: "OMA reveste fórum facetado na França com vidro colorido",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/19/oma-palais-de-justice-de-lille/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/palais-de-justice-de-lille-oma-architecture-france_dezeen_2364_hero2.jpg",
 cat: "Design", stars: 4, aviso: null,
 resumo: ["O escritório holandês OMA concluiu o Palais de Justice de Lille, um tribunal hexagonal no norte da França, com fachada facetada revestida de vidro colorido. Encomendado pelo Ministério da Justiça, o prédio abriga os tribunais de grande e de pequena instância da cidade.","Ele fica num parque ao lado de uma fortificação em forma de estrela construída em 1667 pelo engenheiro militar Vauban, e a silhueta pontiaguda ecoa a fortaleza. Cada fachada tem acabamento próprio em vidro colorido. O programa se organiza em três volumes sobre uma base pública: o pódio, com as salas de audiência principais; uma torre triangular central, com as menores; e um anel facetado de escritórios que envolve a torre e leva luz natural ao interior.","Cada volume tem expressão material e caráter espacial próprios, unidos por acabamentos claros, mobiliário e a intenção de criar um ambiente acolhedor. Há praça pública no térreo e jardim na cobertura com vista da cidade. O OMA ganhou o concurso em 2018 e a entrega estava prevista para 2023. Fotos de François-Xavier Gbré."]
},
{
 title: "Design Academy Eindhoven students protest overcrowded facilities",
 tituloPt: "Estudantes da Design Academy Eindhoven protestam contra instalações superlotadas",
 source: "Dezeen",
 url: "https://www.dezeen.com/2026/10/20/design-academy-eindhoven-student-protests-overcrowding/",
 imageUrl: "https://static.dezeen.com/uploads/2026/10/design-academy-eindhoven-student-protest-2026_dezeen_2364_hero.jpg",
 cat: "Design", stars: 3, aviso: null,
 resumo: ["Estudantes de mestrado da Design Academy Eindhoven protestaram na abertura da mostra anual de formandos, reunidos na entrada com o grito “sem espaço hoje, sem trabalho para mostrar” e uma faixa dizendo que a escola está superlotada e sem espaço. Segundo eles, a falta de áreas de trabalho cria “segregação econômica”.","A escola ocupa desde 1997 o edifício Witte Dame, antiga fábrica da Philips. A mudança para a nova sede na Kanaalzone foi adiada de 2026 para setembro de 2028, e parte do prédio, incluindo o quinto andar dos mestrandos, foi devolvida ao proprietário no início do ano letivo. Os alunos relatam menos de uma mesa por pessoa, poucas salas de aula, ausência de oficina para trabalhos grandes e biblioteca fechada desde o fim de setembro por falta de pessoal; alguns desistiram e outros pagam ateliês externos.","Exigem espaços externos, transparência financeira, comunicação clara e representação nas decisões. O presidente do conselho, Raf De Keninck, reconhece que a escola “perdeu um terço do prédio”, diz priorizar o ensino e se diz confiante em uma solução. O caso ocorre em meio a protestos estudantis na França e em outros países europeus."]
},
{
 title: "New Logo and Identity for Neveo by Nemesis Studio",
 tituloPt: "Novo logo e identidade da Neveo, assinados pela Nemesis Studio",
 source: "Brand New",
 url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_neveo_by_nemesis_studio.php",
 imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/neveo_logo_before_after.png",
 cat: "Branding", stars: 3, aviso: "Artigo atrás de paywall: resumo baseado em título, categoria, indústria e tags públicas.",
 resumo: ["O Brand New publicou hoje, na seção “Noted”, uma comparação de antes e depois do logo da Neveo, serviço web, redesenhado pela Nemesis Studio. O texto leva o título “All Smiles”, e a página exibe o logo anterior e o novo lado a lado.","As tags disponíveis — handwritten, lowercase, sans serif, smile, wordmark — sugerem um logotipo apenas tipográfico, em minúsculas e sem serifa, com toque manuscrito e um sorriso como motivo central. O texto, porém, não está acessível sem assinatura, então a justificativa do conceito e a extensão da identidade não são detalhadas aqui."]
},
{
 title: "Kenko's 18-Gram Pieni III Camera Shoots Without a Screen",
 tituloPt: "Pieni III, da Kenko, pesa 18 gramas e fotografa sem tela",
 source: "Yanko Design",
 url: "https://www.yankodesign.com/2026/10/20/kenkos-18-gram-pieni-iii-camera-shoots-without-a-screen/",
 imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/kenkos-18-gram-pieni-iii-camera-shoots-without-a-screen/pieni-01.jpg",
 cat: "Design", stars: 3, aviso: null,
 resumo: ["A Kenko Tokina apresentou a Pieni III, câmera digital de brinquedo com pouco mais de cinco centímetros de largura e cerca de 18 gramas, pensada para ser usada como colar ou acessório; acompanha cordão. O estilo clássico de câmera também a torna um objeto decorativo, e o texto a descreve como complemento, não substituta, de uma câmera tradicional.","Os sensores têm cerca de 0,32 megapixel, com fotos de 1440 × 960 por interpolação e vídeos com áudio de 720 × 480 a 30 fps — resultados adequados para uso casual, não para grandes impressões. Não há tela nem visor: o usuário não vê o enquadramento nem revisa as fotos, o que o texto apresenta como forma de capturar momentos sem perfeccionismo, ao custo de erros de enquadramento.","São dois botões (liga/disparo e troca de foto/vídeo), LEDs de modo e um ímã traseiro para fixar em superfícies metálicas. Não há armazenamento interno, e é preciso um cartão microSDHC de 4 a 32 GB; a transferência e a carga usam USB-C, incluindo cabo para celulares compatíveis. Vem em Soda, Strawberry, Milk e Black, além de linha Sanrio com Hello Kitty, My Melody, Kuromi, Cinnamoroll e Hangyodon."]
}
];
ITEMS.sort((a,b)=>b.stars-a.stars);

function Art({cat,seed}){
  const pal={Branding:["#f97316","#ef4444","#fde68a"],Design:["#0d9488","#14b8a6","#a7f3d0"],Tecnologia:["#4f46e5","#7c3aed","#c7d2fe"]}[cat];
  const r=(n)=>{const x=Math.sin(seed*97+n*13.7)*10000;return x-Math.floor(x)};
  const id="g"+seed;
  return (<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração decorativa">
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={pal[0]}/><stop offset="1" stopColor={pal[1]}/></linearGradient></defs>
    <rect width="320" height="180" fill={`url(#${id})`}/>
    {[0,1,2,3,4].map(i=>(i%2? <circle key={i} cx={r(i)*320} cy={r(i+9)*180} r={20+r(i+3)*50} fill={pal[2]} opacity=".35"/> : <rect key={i} x={r(i)*260} y={r(i+9)*130} width={40+r(i+3)*90} height={40+r(i+5)*70} rx="14" fill="#fff" opacity=".22" transform={`rotate(${r(i+2)*50-25} 160 90)`}/>))}
  </svg>);
}
function Pic({item,i,alt}){
  const [falhou,setFalhou]=useState(false);
  return (<div className="img">{item.imageUrl && !falhou
    ? <img src={item.imageUrl} alt={alt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
    : <Art cat={item.cat} seed={i+1}/>}</div>);
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Meta({item}){return (<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><strong>{item.source}</strong><Stars n={item.stars}/></div>)}

function Modal({item,i,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",k);document.body.style.overflow=""}},[]);
  return (<div className="overlay" onClick={onClose}><article className="modal" onClick={e=>e.stopPropagation()}>
    <button className="close" onClick={onClose} aria-label="Fechar">✕</button>
    <Pic item={item} i={i} alt={"Imagem da matéria: "+item.tituloPt}/>
    <div className="in"><Meta item={item}/><h2>{item.tituloPt}</h2>
      {item.resumo.map((p,k)=><p key={k}>{p}</p>)}
      {item.aviso && <p className="warn">{item.aviso}</p>}
      <div><a className="src" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte original ({item.source}) →</a></div>
    </div></article></div>);
}
function App(){
  const [sel,setSel]=useState(null);
  const [hero,...rest]=ITEMS;
  return (<div className="wrap">
    <header><div><h1>☀️ Portal da Manhã</h1><div className="date">Terça-feira, 20 de outubro de 2026 · {ITEMS.length} notícias selecionadas</div></div></header>
    <button className="card hero" onClick={()=>setSel(0)}>
      <Pic item={hero} i={0} alt={"Imagem da matéria: "+hero.tituloPt}/>
      <div className="body"><Meta item={hero}/><h2>{hero.tituloPt}</h2><div style={{color:"#475467"}}>{hero.resumo[0].slice(0,230)}…</div><span style={{color:"#4f46e5",fontWeight:600}}>Abrir resumo →</span></div>
    </button>
    <div className="grid">{rest.map((it,k)=>(
      <button key={it.url} className="card" onClick={()=>setSel(k+1)}>
        <Pic item={it} i={k+1} alt={"Imagem da matéria: "+it.tituloPt}/>
        <div className="body"><Meta item={it}/><h3>{it.tituloPt}</h3>{it.aviso && <span className="warn">⚠ {it.aviso.includes("paywall")?"Conteúdo parcial (paywall)":"Sem foto da fonte"}</span>}</div>
      </button>))}</div>
    {sel!==null && <Modal item={ITEMS[sel]} i={sel} onClose={()=>setSel(null)}/>}
    <footer>Resumos produzidos em português a partir das matérias originais. Clique em um card para ler sem sair da página.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
