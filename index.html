<style>
  :root{
    --bg:#f6f5f2;
    --surface:#ffffff;
    --ink:#15130f;
    --ink-soft:#5c5850;
    --ink-faint:#8d887e;
    --line:#e6e2da;
    --accent:#c8452b;
    --radius:18px;
    --shadow:0 1px 2px rgba(21,19,15,.04), 0 8px 24px rgba(21,19,15,.06);
    --shadow-lg:0 2px 4px rgba(21,19,15,.05), 0 20px 60px rgba(21,19,15,.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
  header.top{padding:44px 0 28px;border-bottom:1px solid var(--line);margin-bottom:36px}
  .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1.brand{font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:clamp(34px,6vw,54px);margin:10px 0 6px;letter-spacing:-.02em}
  .date{color:var(--ink-faint);font-size:14px}
  .lead{margin-bottom:34px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .22s cubic-bezier(.2,.7,.3,1), box-shadow .22s ease, border-color .22s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#d8d2c7}
  .lead .card{flex-direction:row}
  .lead .thumb{width:56%;min-height:340px}
  .lead .body{width:44%;padding:32px}
  .lead h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(24px,3.2vw,34px);line-height:1.15;margin:12px 0 12px;letter-spacing:-.01em}
  .thumb{position:relative;background:#efece6;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .grid .thumb{height:190px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .body{padding:20px 22px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px}
  .source{font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
  .tag{padding:3px 9px;border-radius:999px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;font-size:10.5px}
  .tag.branding{background:#fdeee7;color:#b23f22}
  .tag.design{background:#e6f4ef;color:#1e6b52}
  .tag.tecnologia{background:#eceaff;color:#4a3fb0}
  .stars{color:#d8a520;letter-spacing:1px;font-size:12px}
  .grid h3{font-family:'Fraunces',Georgia,serif;font-size:19px;line-height:1.25;margin:0;font-weight:600}
  .dek{color:var(--ink-soft);font-size:13.5px;line-height:1.55;margin:0}
  .more{margin-top:auto;padding-top:6px;font-size:12px;font-weight:600;color:var(--accent)}
  .sec-title{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin:0 0 16px}
  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(21,19,15,.42);backdrop-filter:blur(3px);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;overflow-y:auto;
    animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .modal{background:var(--surface);max-width:760px;width:100%;border-radius:22px;overflow:hidden;
    box-shadow:var(--shadow-lg);animation:rise .28s cubic-bezier(.2,.7,.3,1)}
  .modal .hero{height:300px;background:#efece6}
  .modal .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .modal .inner{padding:30px 34px 34px}
  .modal h2{font-family:'Fraunces',Georgia,serif;font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:14px 0 6px}
  .modal .orig{color:var(--ink-faint);font-size:12.5px;font-style:italic;margin:0 0 18px}
  .modal p.txt{font-size:15.5px;line-height:1.72;color:#2b2823;margin:0 0 15px}
  .note{font-size:12.5px;color:var(--ink-faint);border-left:2px solid var(--line);padding-left:12px;line-height:1.55}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
  .btn{border:none;border-radius:999px;padding:11px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{background:#f1efea;color:var(--ink)}
  footer{margin-top:56px;padding-top:24px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:12.5px;line-height:1.7}
  @media(max-width:760px){
    .lead .card{flex-direction:column}
    .lead .thumb,.lead .body{width:100%}
    .lead .thumb{min-height:220px;height:220px}
    .lead .body{padding:24px}
    .modal .hero{height:210px}
    .modal .inner{padding:24px}
  }
</style>
</head>

    categoria: "tecnologia",
    estrelas: 3,
    dek: "As conversas para levar o PayPal a Stripe e ao fundo Advent teriam esquentado nos últimos dias.",
    resumo: [
      "As conversas para a venda do PayPal à Stripe, em conjunto com o fundo de private equity Advent, ganharam tração, segundo apuração do TechCrunch. Seria um dos maiores movimentos de consolidação já vistos no setor de pagamentos.",
      "O simbolismo pesa. O PayPal foi a empresa que ensinou a internet a pagar por coisas e serviu de berço para uma geração inteira de fundadores do Vale do Silício. A Stripe chegou mais de uma década depois, com uma abordagem centrada em desenvolvedores, e acabou capturando o mercado de infraestrutura de pagamentos que o PayPal ajudou a criar.",
      "Uma operação desse porte enfrentaria escrutínio antitruste considerável, já que juntaria dois dos maiores processadores de pagamento ocidentais. Por ora, trata-se de negociação em andamento — nada foi confirmado pelas partes."
    ]
  }
];

const PALETAS = {
  branding: ["#f7b267","#e2703a","#c8452b"],
  design:   ["#7fd1ae","#2e9c7e","#166b55"],
  tecnologia:["#8fa7f5","#5a5fd6","#3b2f9c"]
};

function Ilustracao({categoria, seed, alt}){
  const p = PALETAS[categoria] || PALETAS.branding;
  const gid = "g" + categoria + seed;
  const r = (n) => ((seed * 37 + n * 61) % 100) / 100;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} role="img" aria-label={alt}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]}/>
          <stop offset="55%" stopColor={p[1]}/>
          <stop offset="100%" stopColor={p[2]}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${gid})`}/>
      <circle cx={60 + r(1)*260} cy={40 + r(2)*160} r={38 + r(3)*46}
              fill="#ffffff" opacity="0.16"/>
      <circle cx={90 + r(4)*250} cy={60 + r(5)*150} r={22 + r(6)*30}
              fill="#ffffff" opacity="0.12"/>
      <rect x={20 + r(7)*230} y={30 + r(8)*140} width={70 + r(9)*90} height={70 + r(2)*70}
            rx="16" fill="#ffffff" opacity="0.13"
            transform={`rotate(${-24 + r(3)*48} 200 130)`}/>
      <path d={`M0 ${190 + r(4)*40} Q 100 ${140 + r(5)*70} 200 ${180 + r(6)*40} T 400 ${170 + r(7)*50} L400 260 L0 260 Z`}
            fill="#ffffff" opacity="0.15"/>
    </svg>
  );
}

function Foto({item, alt}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} seed={item.id} alt={alt}/>;
  }
  return (
    <img src={item.imageUrl} alt={alt} loading="lazy" referrerPolicy="no-referrer"
         onError={() => setFalhou(true)}/>
  );
}

const Estrelas = ({n}) => <span className="stars">{"★".repeat(n)}{"☆".repeat(5-n)}</span>;

function Manchete({item, onOpen}){
  return (
    <section className="lead">
      <p className="sec-title">Manchete do dia</p>
      <article className="card" onClick={() => onOpen(item)}>
        <div className="thumb"><Foto item={item} alt={item.tituloPt}/></div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + item.categoria}>{item.categoria}</span>
            <span className="source">{item.source}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="dek">{item.dek}</p>
          <span className="more">Ler resumo completo →</span>
        </div>
      </article>
    </section>
  );
}

function Card({item, onOpen}){
  return (
    <article className="card" onClick={() => onOpen(item)}>
      <div className="thumb"><Foto item={item} alt={item.tituloPt}/></div>
      <div className="body">
        <div className="meta">
          <span className={"tag " + item.categoria}>{item.categoria}</span>
          <span className="source">{item.source}</span>
          <Estrelas n={item.estrelas}/>
        </div>
        <h3>{item.tituloPt}</h3>
        <p className="dek">{item.dek}</p>
        <span className="more">Ler resumo →</span>
      </div>
    </article>
  );
}

function Modal({item, onClose}){
  if(!item) return null;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="hero"><Foto item={item} alt={item.tituloPt}/></div>
        <div className="inner">
          <div className="meta">
            <span className={"tag " + item.categoria}>{item.categoria}</span>
            <span className="source">{item.source}</span>
            <Estrelas n={item.estrelas}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p,i) => <p className="txt" key={i}>{p}</p>)}
          {item.paywall && (
            <p className="note">
              Resumo produzido a partir dos elementos públicos da página (título, chamada,
              categoria e tags), sem acesso ao texto integral.
            </p>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Abrir no {item.source}
            </a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a,b) => b.estrelas - a.estrelas || a.id - b.id);
  const [manchete, ...resto] = ordenadas;
  const fontes = [...new Set(NOTICIAS.map(n => n.source))];

  return (
    <div className="wrap">
      <header className="top">
        <p className="kicker">Branding · Design · Tecnologia</p>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="date">Sábado, 15 de agosto de 2026 · {NOTICIAS.length} notícias de {fontes.length} portais</p>
      </header>

      <Manchete item={manchete} onOpen={setAberto}/>

      <p className="sec-title">Mais notícias</p>
      <div className="grid">
        {resto.map(n => <Card key={n.id} item={n} onOpen={setAberto}/>)}
      </div>

      <footer>
        Edição de 15 de agosto de 2026 · Fontes: {fontes.join(" · ")}<br/>
        Todos os resumos são paráfrases produzidas para esta edição. Os textos originais
        pertencem aos respectivos veículos — clique em cada notícia para ler na fonte.
      </footer>

      <Modal item={aberto} onClose={() => setAberto(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
