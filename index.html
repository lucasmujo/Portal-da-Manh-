<style>
  :root{

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{

  .pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted)}

  .lead{display:grid;grid-template-columns:1.15fr .85fr;gap:0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}

  .lead .media{position:relative;min-height:340px;background:#eceae5}

  .lead .body{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .lead h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(26px,3vw,38px);line-height:1.12;margin:0}
  .lead p{margin:0;color:var(--muted);font-size:15.5px;line-height:1.6}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:26px 0 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease}
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi)}
  .card .media{position:relative;aspect-ratio:16/10;background:#eceae5}

  .card .dek{color:var(--muted);font-size:13.5px;line-height:1.55;margin:0}

  .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .src{font-weight:600;color:var(--ink);letter-spacing:.02em}
  .tag{border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
  .tag.branding{background:#fdeee9;color:#b1401f}
  .tag.design{background:#e6f3ee;color:#1f6b52}
  .tag.tec{background:#eceaf9;color:#4a41a8}
  .stars{color:var(--accent);letter-spacing:2px;font-size:12px}
  .dim{color:#d6d3cd}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(24,24,26,.5);backdrop-filter:blur(4px);z-index:50;
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .modal{background:var(--surface);border-radius:24px;max-width:820px;width:100%;overflow:hidden;

  .modal .text p{font-size:16px;line-height:1.72;color:#2b2d33;margin:0 0 16px}
  .modal .note{font-size:13px;color:var(--muted);background:#f4f3f0;border-left:3px solid var(--line);padding:10px 14px;border-radius:8px}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:600;

  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}

  .close{position:absolute;top:14px;right:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:none;

  @media (max-width:960px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .lead{grid-template-columns:1fr}
    .lead .media{min-height:230px;aspect-ratio:16/9;position:relative}
  }
  @media (max-width:620px){
    .grid{grid-template-columns:1fr}
    .wrap{padding:0 16px}
    .modal .body{padding:24px 20px 30px}
  }
</style>

const PALETAS = {
  branding: ["#f4b27a", "#e0714a", "#c0472c", "#fbe3d2"],
  design:   ["#8fd3bd", "#3f9e82", "#1f6b52", "#dff0e9"],
  tec:      ["#a9a5ee", "#6f66cf", "#4a41a8", "#e6e4f8"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[2]} />
        </linearGradient>
        <linearGradient id={id + "b"} x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stopColor={p[3]} stopOpacity="0.9" />
          <stop offset="100%" stopColor={p[1]} stopOpacity="0.5" />
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={`url(#${id})`} />
      <circle cx={70 + r(1) * 200} cy={60 + r(2) * 100} r={50 + r(3) * 55} fill={`url(#${id}b)`} opacity="0.75" />
      <rect x={200 + r(4) * 120} y={-20 + r(5) * 90} width="150" height="150" rx="26"
            fill={p[3]} opacity="0.45" transform={`rotate(${r(6) * 40 - 20} 275 55)`} />
      <path d={`M0 ${180 + r(7) * 40} Q 100 ${120 + r(8) * 70} 200 ${170 + r(9) * 40} T 400 ${150 + r(10) * 50} V250 H0 Z`}
            fill={p[2]} opacity="0.55" />
      <circle cx={40 + r(11) * 60} cy={200 - r(12) * 60} r={14 + r(13) * 16} fill="#fff" opacity="0.28" />
    </svg>
  );
}

function Figura({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={seed} />;
  return (
    <img
      src={item.imageUrl}
      alt={item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const LABEL = { branding: "Branding", design: "Design", tec: "Tecnologia" };

function Estrelas({ n }) {
  return (
    <span className="stars">
      {"★".repeat(n)}<span className="dim">{"★".repeat(5 - n)}</span>
    </span>
  );
}

function Modal({ item, seed, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="media">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Figura item={item} seed={seed} />
        </div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + item.categoria}>{LABEL[item.categoria]}</span>
            <span className="src">{item.source}</span>
            <span>·</span><span>{item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="text">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">
              Ler no {item.source} ↗
            </a>
            <button className="btn" onClick={onClose}>Voltar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS].sort((a, b) => b.estrelas - a.estrelas);
  const manchete = ordenadas[0];
  const demais = ordenadas.slice(1);
  const portais = new Set(NOTICIAS.map(n => n.source)).size;
  const comFoto = NOTICIAS.filter(n => n.imageUrl).length;

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">Edição de terça-feira</div>
        <h1 className="brand">Portal da Manhã</h1>
        <div className="subline">
          <span>1 de setembro de 2026</span>
          <span className="pill">{NOTICIAS.length} notícias</span>
          <span className="pill">{portais} portais</span>
          <span className="pill">{comFoto} com foto original</span>
        </div>
      </header>

      <div className="lead" onClick={() => setAberto(0)}>
        <div className="media"><Figura item={manchete} seed={1} /></div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + manchete.categoria}>{LABEL[manchete.categoria]}</span>
            <span className="src">{manchete.source}</span>
            <span>·</span><span>{manchete.data}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.resumo[0].slice(0, 240)}…</p>
        </div>
      </div>

      <div className="grid">
        {demais.map((item, i) => (
          <article className="card" key={item.url} onClick={() => setAberto(i + 1)}>
            <div className="media"><Figura item={item} seed={i + 2} /></div>
            <div className="body">
              <div className="meta">
                <span className={"tag " + item.categoria}>{LABEL[item.categoria]}</span>
                <span className="src">{item.source}</span>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.resumo[0].slice(0, 150)}…</p>
              <div className="meta" style={{ marginTop: "auto", paddingTop: "8px" }}>
                <Estrelas n={item.estrelas} />
                <span>{item.data}</span>
              </div>
            </div>
          </article>
        ))}
      </div>

      {aberto !== null && (
        <Modal item={ordenadas[aberto]} seed={aberto + 1} onClose={() => setAberto(null)} />
      )}

      <footer>
        Portal da Manhã · seleção diária de branding, design e tecnologia a partir de portais internacionais.
        Todos os resumos são escritos em português e parafraseados; os textos e as imagens originais
        pertencem aos respectivos veículos. Clique em qualquer card para ler o resumo completo e acessar a fonte.
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
