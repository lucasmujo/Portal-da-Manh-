<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 14 de outubro de 2026</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mut:#6a7085;--line:#e6e8f0;--acc:#4f46e5;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{font-size:30px;margin:0;letter-spacing:-.02em}
.date{color:var(--mut);font-size:14px;text-transform:capitalize}
.hero{display:grid;grid-template-columns:1.4fr 1fr;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 10px 40px rgba(20,22,40,.08);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(20,22,40,.13)}
.hero .img{min-height:340px;position:relative}
.hero .txt{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:28px;line-height:1.2;margin:0;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 14px rgba(20,22,40,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(20,22,40,.12)}
.card .img{height:180px;position:relative}
.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px;line-height:1.3;margin:0}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.tag{padding:3px 10px;border-radius:99px;font-weight:600;font-size:11px}
.Branding{background:#ffe9dc;color:#b4491a}.Design{background:#d9f5ee;color:#0b7a62}.Tecnologia{background:#e4e3ff;color:#4338ca}
.stars{color:#f5a623;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(20,22,40,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;animation:fade .2s}
.modal{background:#fff;border-radius:24px;max-width:760px;width:100%;max-height:92vh;overflow:auto;animation:up .3s}
.modal .img{height:300px;position:relative}
.modal .in{padding:24px 28px 30px}
.modal h2{margin:8px 0 12px;font-size:26px;line-height:1.2}
.modal p{font-size:16px;color:#2c3040}
.note{font-size:13px;color:var(--mut);font-style:italic}
.btn{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:12px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600;font-size:14px;border:0;cursor:pointer}
.btn.g{background:#eef0f6;color:var(--ink);margin-left:8px}
footer{margin-top:40px;color:var(--mut);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:24px}}
</style>
</head>
<body>
<div id="root"></div>

const NEWS = [
  {

    imageUrl: "https://cdn.mos.cms.futurecdn.net/snRyKcpKech8ahRn6A8uLR-2000-80.jpg",
    cat: "Design", stars: 5,
    resumo: "A Microsoft lançou a Michelangelus, uma tipografia de estilo manuscrito inspirada nos manuscritos de Michelangelo, para marcar os 400 anos da consagração da Basílica de São Pedro. A Fabbrica di San Pietro, instituição responsável pela manutenção da basílica, encomendou o projeto ao estúdio italiano Studiogusto. O objetivo não era copiar a letra do artista de forma exata, mas adaptá-la em um script moderno e funcional, usado na sinalização interna da basílica e em materiais digitais e impressos. A equipe estudou os manuscritos originais nos arquivos do Vaticano; o diretor criativo Stefano Caliandro destacou a geometria e o equilíbrio entre cheios e vazios na escrita do mestre. Alguns floreios originais foram mantidos, como o pontinho sobre o 'h', e os numerais precisaram ser inventados, já que não há registros de Michelangelo escrevendo números modernos — o algarismo 1, por exemplo, parte da letra I. Ao todo foram criados mais de 500 caracteres em quatro estilos: regular, itálico, negrito e negrito itálico. A fonte está disponível no Microsoft 365 e para download, e a Fabbrica espera que ela desperte interesse pela basílica e pelo artista."

  {

    resumo: "A agência Pablo London criou, para a MND Association, a campanha “Life Stripped Away”, que mostra como a doença do neurônio motor vai retirando, aos poucos, as coisas que mais importam às pessoas. A ação acompanha quatro pessoas que vivem com a condição no Reino Unido e inclui um filme de 90 segundos, rádio e mídia exterior. O filme, dirigido por Ben Liam Jones, da Merman, usa câmera em primeira pessoa para seguir Jaki Jackson, cantora de Brighton, que descreve seu declínio e o cuidado constante do parceiro, Steve. Na rádio, uma versão em voz sintetizada a partir do banco de voz de Jaki, criada com a associação, evidencia como a doença lhe tirou o canto e a capacidade de engolir. Os cartazes retratam Lorraine Redmond, Tahira Chaudhry e Steve Williams, fotografados por Emma Hardy em cenários ligados às suas paixões; os designers aplicaram um efeito que desfoca o entorno e mantém só a expressão do rosto em foco, em referência ao fato de os olhos serem muitas vezes a última coisa que a pessoa consegue mover. Os diretores criativos descrevem a abordagem como terna e, ao mesmo tempo, visceral."

  {

    resumo: "O estúdio vienense STUDIO HERRSTRÖM criou a nova identidade visual da Milkshake, gravadora e agência de artistas sediada em Estocolmo e parte da Sony Music Entertainment. Fundada em 2019 como alternativa aos contratos tradicionais, a casa aposta em pop comercial, alternativo e fora do óbvio, e representa nomes como Molly Sandén, Felix Sandman e Dunalia. O briefing pedia uma estrutura visual mais refinada para sustentar o crescimento comercial sem tirar os artistas do centro das campanhas. O estúdio buscou referências nas origens do selo — o nome surgiu durante uma viagem de carro, e os veículos serviam para ouvir demos inéditas. A marca original em forma de respingo foi redesenhada como um emblema arredondado, mais estruturado. A paleta combina rosas neon e amarelos de alta visibilidade com pretos de asfalto e lilases suaves, enquanto os layouts tomam emprestadas as licenças de janela de carro e as tabelas nutricionais de embalagens de leite para organizar informações secundárias. A tipografia principal é a Gates, neogrotesca da Context Type. O sistema se estende a lançamentos, ativos digitais e comunicação corporativa, como em um cartaz de metrô para o novo single de Tove Lo."

  {

    resumo: "O Brand New registrou, em 13 de outubro, uma nova marca de consumo para a Basketball Australia, entidade nacional do basquete no país, criada pelo estúdio Hulsbosch. A publicação aparece na categoria “Spotted” (identidades flagradas e ainda sem análise completa) e está classificada no setor de esportes. O projeto é rotulado como novo, ou seja, não é uma simples atualização de um sistema anterior, e o título indica que a marca foi pensada para a relação da entidade com o público consumidor — torcedores, praticantes e produtos — e não apenas para o uso institucional.",

    url: "https://techcrunch.com/2026/10/13/cerebras-ceo-pushes-back-on-ai-doomsday-warnings/",

const PAL = {
  Branding: [["#ff9a5a","#ff5e62"],["#ffd36e","#f0764a"]],
  Design: [["#34d3b0","#0e8f7a"],["#7be0c2","#1c6f8a"]],
  Tecnologia: [["#6c7bff","#8a4fe0"],["#4aa3ff","#5a3fd0"]]
};

function Art({ cat, seed }) {
  const p = PAL[cat][seed % 2];
  const id = "g" + seed;
  return (
    <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
      <rect width="400" height="240" fill={`url(#${id})`}/>
      <circle cx={80 + seed * 17 % 120} cy="70" r="90" fill="#fff" opacity=".14"/>
      <rect x={220 - seed * 7 % 60} y="110" width="170" height="170" rx="30" fill="#fff" opacity=".16" transform="rotate(18 300 190)"/>
      <polygon points="40,240 160,120 280,240" fill="#000" opacity=".1"/>
      <circle cx="330" cy="50" r="26" fill="#fff" opacity=".25"/>
    </svg>
  );
}

function Pic({ item, i }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Art cat={item.cat} seed={i} />;
  return <img src={item.imageUrl} alt={"Imagem da matéria: " + item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={() => setFalhou(true)} />;
}

const Stars = ({ n }) => <span className="stars" title={n + " de 5"}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;
const Meta = ({ item }) => (
  <div className="meta"><span className={"tag " + item.cat}>{item.cat}</span><strong>{item.source}</strong><Stars n={item.stars} /></div>
);

function Modal({ item, i, onClose }) {
  useEffect(() => {
    const h = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="img"><Pic item={item} i={i} /></div>
        <div className="in">
          <Meta item={item} />
          <h2>{item.tituloPt}</h2>
          <p>{item.resumo}</p>
          {item.nota && <p className="note">{item.nota}</p>}
          <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ({item.source}) →</a>
          <button className="btn g" onClick={onClose}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [sel, setSel] = useState(null);
  const [first, ...rest] = NEWS;
  return (
    <div className="wrap">
      <header>
        <h1>☀️ Portal da Manhã</h1>
        <div className="date">quarta-feira, 14 de outubro de 2026</div>
      </header>
      <div className="hero" onClick={() => setSel(0)}>
        <div className="img"><Pic item={first} i={0} /></div>
        <div className="txt">
          <Meta item={first} />
          <h2>{first.tituloPt}</h2>
          <p style={{ color: "#6a7085", margin: 0 }}>{first.resumo.slice(0, 190)}…</p>
          <span style={{ color: "#4f46e5", fontWeight: 600 }}>Ler resumo →</span>
        </div>
      </div>
      <div className="grid">
        {rest.map((it, k) => (
          <div className="card" key={it.url} onClick={() => setSel(k + 1)}>
            <div className="img"><Pic item={it} i={k + 1} /></div>
            <div className="body"><Meta item={it} /><h3>{it.tituloPt}</h3></div>
          </div>
        ))}
      </div>
      {sel !== null && <Modal item={NEWS[sel]} i={sel} onClose={() => setSel(null)} />}
      <footer>Resumos produzidos em português a partir das matérias originais · Edição de 14/10/2026</footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
