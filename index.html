const PALETAS = {
  Branding: ["#f9c06a", "#e8703a", "#c2410c"],
  Design: ["#7fd4c8", "#0f9b8e", "#0b6f66"],
  Tecnologia: ["#a5b4fc", "#4f6ef7", "#3730a3"]
};

function Ilustracao({ categoria, seed }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const id = "g" + seed;
  const r = (n) => ((seed * 9301 + n * 49297) % 233280) / 233280;
  return (
    <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p[0]} />
          <stop offset="100%" stopColor={p[1]} />
        </linearGradient>
      </defs>
      <rect width="400" height="250" fill={`url(#${id})`} />
      <circle cx={60 + r(1) * 260} cy={40 + r(2) * 120} r={40 + r(3) * 55} fill={p[2]} opacity="0.35" />
      <circle cx={80 + r(4) * 240} cy={90 + r(5) * 120} r={25 + r(6) * 45} fill="#ffffff" opacity="0.22" />
      <rect x={30 + r(7) * 200} y={130 + r(8) * 60} width={70 + r(9) * 120} height={16 + r(10) * 40} rx="10" fill="#ffffff" opacity="0.28" />
      <path d={`M0 ${200 + r(11) * 30} Q 100 ${150 + r(12) * 60}, 200 ${195 + r(13) * 30} T 400 ${180 + r(14) * 40} L400 250 L0 250 Z`} fill={p[2]} opacity="0.4" />
    </svg>
  );
}

function Figura({ item, seed }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) return <Ilustracao categoria={item.categoria} seed={seed} />;
  return (
    <img
      src={item.imageUrl}
      alt={item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      onError={() => setFalhou(true)}
    />
  );
}

const Estrelas = ({ n }) => <span className="stars" title={`${n} de 5`}>{"★".repeat(n)}{"☆".repeat(5 - n)}</span>;

function Modal({ item, seed, onClose }) {
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <div className="media">
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
          <Figura item={item} seed={seed} />
        </div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
            <span className="src">{item.source}</span>
            <span>{item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          <div className="text">
            {item.resumo.map((par, i) => <p key={i}>{par}</p>)}
          </div>
          {!item.imageUrl && (
            <div className="note">Este portal não expõe uma imagem de destaque acessível — a arte acima é uma ilustração gerada para esta edição.</div>
          )}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const ordenadas = [...NOTICIAS];
  const [manchete, ...resto] = ordenadas;

  return (
    <div className="wrap">
      <header className="top">
        <div className="kicker">
          <span className="pill">Branding</span>
          <span className="pill">Design</span>
          <span className="pill">Tecnologia</span>
        </div>
        <h1 className="brand">Portal da Manhã</h1>
        <p className="datestr">Domingo, 16 de agosto de 2026 · {NOTICIAS.length} matérias selecionadas de 6 portais internacionais</p>
      </header>

      <h2 className="sec-title">Manchete</h2>
      <div className="hero" onClick={() => setAberto(0)}>
        <div className="media"><Figura item={manchete} seed={1} /></div>
        <div className="body">
          <div className="meta">
            <span className={"tag " + manchete.categoria.toLowerCase()}>{manchete.categoria}</span>
            <span className="src">{manchete.source}</span>
            <Estrelas n={manchete.estrelas} />
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
        </div>
      </div>

      <h2 className="sec-title">Notícias do dia</h2>
      <div className="grid">
        {resto.map((item, i) => (
          <article className="card" key={item.url} onClick={() => setAberto(i + 1)}>
            <div className="media"><Figura item={item} seed={i + 2} /></div>
            <div className="body">
              <div className="meta">
                <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
                <span className="src">{item.source}</span>
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="meta" style={{ marginTop: "auto" }}><Estrelas n={item.estrelas} /></div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã · edição de 16 de agosto de 2026. Resumos escritos em português a partir da leitura das reportagens originais — nenhum texto é reprodução da fonte. Imagens carregadas diretamente dos servidores dos portais; quando indisponíveis, uma ilustração é gerada localmente.<br />
        Portais desta edição: Dezeen, Yanko Design, Creative Bloq, The Brand Identity, Brand New e TechCrunch.
      </footer>

      {aberto !== null && (
        <Modal item={ordenadas[aberto]} seed={aberto + 1} onClose={() => setAberto(null)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
