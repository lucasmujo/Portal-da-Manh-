<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 19 de setembro de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3; --card:#ffffff; --ink:#15161a; --muted:#6b6f76;
    --line:#e7e5e0; --accent:#d4573a; --accent-soft:#fdf2ee;
    --brand:#c8663f; --design:#2f8a7a; --tech:#5b5fd6;
    --shadow:0 1px 2px rgba(16,17,20,.04), 0 8px 24px rgba(16,17,20,.06);
    --shadow-lg:0 2px 6px rgba(16,17,20,.06), 0 24px 60px rgba(16,17,20,.12);
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  a{color:inherit}

  /* Header */
  .hdr{padding:44px 0 26px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .hdr-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .logo{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:clamp(32px,5vw,48px);letter-spacing:-.02em;margin:0;line-height:1}
  .logo span{color:var(--accent)}
  .dateline{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
  .kicker{margin-top:14px;font-size:15px;color:var(--muted);max-width:620px;line-height:1.55}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
  .stat{font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;font-weight:500}

  /* Stars */
  .stars{display:inline-flex;gap:2px;align-items:center}
  .star{width:13px;height:13px;display:block}

  /* Tag */
  .tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;color:#fff}
  .tag.branding{background:var(--brand)}
  .tag.design{background:var(--design)}
  .tag.tecnologia{background:var(--tech)}

  /* Hero */
  .hero{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);
    cursor:pointer;transition:box-shadow .3s ease, transform .3s ease;margin-bottom:38px}
  .hero:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
  .hero-media{position:relative;min-height:380px;background:#eee}
  .hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .hero-body{padding:34px 34px 30px;display:flex;flex-direction:column;justify-content:center;gap:14px}
  .hero h2{font-family:Fraunces,Georgia,serif;font-size:clamp(26px,3vw,36px);line-height:1.15;
    margin:0;letter-spacing:-.015em}
  .hero .dek{color:var(--muted);font-size:15px;line-height:1.6;margin:0}
  .meta-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .source{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
  .date{font-size:12px;color:var(--muted)}

  .section-label{display:flex;align-items:center;gap:14px;margin:0 0 20px;
    font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .section-label::after{content:"";flex:1;height:1px;background:var(--line)}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;
    transition:box-shadow .3s ease, transform .3s ease}
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px)}
  .card-media{height:190px;background:#eee;overflow:hidden}
  .card-media img,.card-media svg{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .5s ease}
  .card:hover .card-media img{transform:scale(1.04)}
  .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;flex:1}
  .card h3{font-family:Fraunces,Georgia,serif;font-size:19px;line-height:1.25;margin:0;letter-spacing:-.01em}
  .card .dek{font-size:13.5px;color:var(--muted);line-height:1.55;margin:0;flex:1}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding-top:10px;border-top:1px solid var(--line)}
  .warn{font-size:11px;color:#a8802b;background:#fdf7e6;border:1px solid #f0e2b8;
    padding:4px 8px;border-radius:6px;display:inline-block}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(18,19,22,.5);backdrop-filter:blur(6px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;
    overflow-y:auto;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .modal{background:var(--card);max-width:780px;width:100%;border-radius:22px;overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.3);animation:rise .3s cubic-bezier(.2,.8,.3,1)}
  .modal-media{height:320px;background:#eee;position:relative}
  .modal-media img,.modal-media svg{width:100%;height:100%;object-fit:cover;display:block}
  .close{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;
    border:none;background:rgba(255,255,255,.92);cursor:pointer;font-size:20px;line-height:1;
    color:#15161a;display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.18);transition:background .2s}
  .close:hover{background:#fff}
  .modal-body{padding:30px 36px 36px}
  .modal-body h2{font-family:Fraunces,Georgia,serif;font-size:clamp(24px,3.4vw,32px);
    line-height:1.18;margin:14px 0 6px;letter-spacing:-.015em}
  .orig{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 20px}
  .modal-body p.txt{font-size:16px;line-height:1.72;color:#2b2d33;margin:0 0 16px}
  .src-btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;
    background:var(--ink);color:#fff;text-decoration:none;padding:12px 20px;border-radius:999px;
    font-size:14px;font-weight:600;transition:opacity .2s}
  .src-btn:hover{opacity:.85}
  .note{margin-top:18px;padding:12px 14px;background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:8px;font-size:13px;color:#7a4433;line-height:1.55}

  footer{margin-top:60px;padding-top:26px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);line-height:1.7}

  @media(max-width:980px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero-media{min-height:260px;height:260px}
  }
  @media(max-width:620px){
    .grid{grid-template-columns:1fr}
    #root{padding:0 16px 60px}
    .modal-body{padding:24px 22px 30px}
    .modal-media{height:220px}
    .hero-body{padding:24px}
  }
</style>
</head>

const PALETAS = {
  Branding:   { a:"#f6b26b", b:"#d4573a", c:"#8c2f22", d:"#fde8dc" },
  Design:     { a:"#7fd6c0", b:"#2f8a7a", c:"#16534a", d:"#e2f6f1" },
  Tecnologia: { a:"#a5a8f2", b:"#5b5fd6", c:"#2f327f", d:"#e8e9fd" }
};

function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return Math.abs(h); }

function Ilustracao({ titulo, categoria }) {
  const p = PALETAS[categoria] || PALETAS.Design;
  const h = hashStr(titulo || "x");
  const gid = "g" + h;
  const r1 = 30 + (h % 40), r2 = 50 + ((h >> 3) % 60);
  const cx1 = 60 + (h % 180), cy1 = 40 + ((h >> 5) % 90);
  const rot = (h % 60) - 30;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração gerada para: " + titulo}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={p.a}/>
          <stop offset="55%" stopColor={p.b}/>
          <stop offset="100%" stopColor={p.c}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={p.d}/>
      <rect width="400" height="260" fill={"url(#"+gid+")"} opacity="0.92"/>
      <circle cx={cx1} cy={cy1} r={r2} fill="#fff" opacity="0.16"/>
      <circle cx={340 - (h % 90)} cy={200 - ((h>>7) % 60)} r={r1} fill="#fff" opacity="0.22"/>
      <g transform={"rotate("+rot+" 200 130)"}>
        <rect x="150" y="96" width="100" height="68" rx="10" fill="#fff" opacity="0.2"/>
        <rect x="170" y="116" width="60" height="28" rx="6" fill="#fff" opacity="0.28"/>
      </g>
      <path d={"M0 "+(210 + (h%20))+" Q 100 "+(150+(h%50))+" 200 200 T 400 "+(170+(h%40))+" L400 260 L0 260 Z"} fill="#fff" opacity="0.14"/>
    </svg>
  );
}

function Foto({ item, className }) {
  const [falhou, setFalhou] = useState(false);
  if (!item.imageUrl || falhou) {
    return <Ilustracao titulo={item.title} categoria={item.categoria} />;
  }
  return (
    <img
      src={item.imageUrl}
      alt={item.tituloPt}
      referrerPolicy="no-referrer"
      loading="lazy"
      className={className}
      onError={() => setFalhou(true)}
    />
  );
}

function Estrelas({ n }) {
  return (
    <span className="stars" title={n + " de 5"}>
      {[1,2,3,4,5].map(i => (
        <svg key={i} className="star" viewBox="0 0 24 24"
             fill={i <= n ? "#e0a53f" : "none"} stroke={i <= n ? "#e0a53f" : "#cfcdc7"} strokeWidth="2">
          <polygon points="12 2 15.1 8.6 22 9.6 17 14.5 18.2 21.4 12 18.1 5.8 21.4 7 14.5 2 9.6 8.9 8.6 12 2"/>
        </svg>
      ))}
    </span>
  );
}

function Modal({ item, onClose }) {
  useEffect(() => {
    const esc = e => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", esc);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", esc); document.body.style.overflow = ""; };
  }, [onClose]);

  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-media">
          <Foto item={item} />
          <button className="close" onClick={onClose} aria-label="Fechar">×</button>
        </div>
        <div className="modal-body">
          <div className="meta-row">
            <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
            <span className="source">{item.source}</span>
            <span className="date">{item.data}</span>
            <Estrelas n={item.estrelas} />
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p, i) => <p className="txt" key={i}>{p}</p>)}
          {item.paywall && (
            <div className="note">
              Esta matéria está atrás de paywall. O resumo acima foi redigido a partir dos elementos
              públicos da página — título, categoria editorial, indústria e tags. Nenhum detalhe do
              texto completo foi presumido.
            </div>
          )}
          <a className="src-btn" href={item.url} target="_blank" rel="noopener noreferrer">
            Ler no {item.source} →
          </a>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [aberto, setAberto] = useState(null);
  const [hero, ...resto] = NOTICIAS;
  const portais = new Set(NOTICIAS.map(n => n.source)).size;
  const comFoto = NOTICIAS.filter(n => n.imageUrl).length;

  return (
    <React.Fragment>
      <header className="hdr">
        <div className="hdr-top">
          <h1 className="logo">Portal da <span>Manhã</span></h1>
          <div className="dateline">Sábado, 19 de setembro de 2026</div>
        </div>
        <p className="kicker">
          O que aconteceu nas últimas 24 horas em branding, design e tecnologia.
          Seleção diária a partir dos principais veículos internacionais do setor.
        </p>
        <div className="stats">
          <span className="stat">{NOTICIAS.length} notícias</span>
          <span className="stat">{portais} portais</span>
          <span className="stat">{comFoto} com imagem original</span>
          <span className="stat">Clique em qualquer card para ler o resumo</span>
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(hero)}>
        <div className="hero-media"><Foto item={hero} /></div>
        <div className="hero-body">
          <div className="meta-row">
            <span className={"tag " + hero.categoria.toLowerCase()}>{hero.categoria}</span>
            <Estrelas n={hero.estrelas} />
          </div>
          <h2>{hero.tituloPt}</h2>
          <p className="dek">{hero.resumo[0].slice(0, 210)}…</p>
          <div className="meta-row">
            <span className="source">{hero.source}</span>
            <span className="date">{hero.data}</span>
          </div>
        </div>
      </article>

      <div className="section-label">Mais da edição de hoje</div>

      <div className="grid">
        {resto.map((item, i) => (
          <article className="card" key={i} onClick={() => setAberto(item)}>
            <div className="card-media"><Foto item={item} /></div>
            <div className="card-body">
              <div className="meta-row">
                <span className={"tag " + item.categoria.toLowerCase()}>{item.categoria}</span>
                <Estrelas n={item.estrelas} />
              </div>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.resumo[0].slice(0, 130)}…</p>
              {item.paywall && <span className="warn">Conteúdo parcial · paywall</span>}
              <div className="card-foot">
                <span className="source">{item.source}</span>
                <span className="date">{item.data}</span>
              </div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã · edição de 19 de setembro de 2026.<br/>
        Fontes: Brand New, Creative Bloq, Design Week, Dezeen, It’s Nice That e TechCrunch.
        Todos os resumos são paráfrases originais em português; os textos e imagens pertencem
        aos seus respectivos veículos. Imagens carregadas diretamente dos servidores de origem.
      </footer>

      {aberto && <Modal item={aberto} onClose={() => setAberto(null)} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
