<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--mut:#6b7280;--line:#e8e6e1;--acc:#ff6a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;flex-wrap:wrap;gap:8px}
h1{margin:0;font-size:34px;letter-spacing:-.02em}.date{color:var(--mut);font-size:15px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:#eee}
.tag.Branding{background:#ffe9e0;color:#c2410c}.tag.Design{background:#d9f5ee;color:#0f766e}.tag.Tecnologia{background:#e5e7ff;color:#4338ca}
.stars{color:#f5a524;letter-spacing:1px;font-size:14px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 12px rgba(20,20,30,.06);cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid var(--line)}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(20,20,30,.12)}
.img{width:100%;aspect-ratio:16/10;background:#ddd;display:block;object-fit:cover}
.hero{display:grid;grid-template-columns:1.3fr 1fr;margin-bottom:22px}
.hero .img{height:100%;aspect-ratio:auto;min-height:320px}
.body{padding:20px}.hero .body{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.hero h2{font-size:30px;line-height:1.15;margin:4px 0;letter-spacing:-.02em}
.card h3{font-size:18px;line-height:1.25;margin:10px 0 6px}
.meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mut);flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.lead{color:var(--mut);font-size:14px;margin:0}
.ov{position:fixed;inset:0;background:rgba(15,17,22,.55);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 16px;z-index:10;animation:f .2s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:u .25s}
.modal .body{padding:28px}.modal h2{font-size:28px;line-height:1.2;margin:10px 0}
.modal p{font-size:16px;color:#2b2f38}.x{float:right;border:0;background:#f0eeea;border-radius:99px;width:36px;height:36px;font-size:18px;cursor:pointer}
a.btn{display:inline-block;margin-top:10px;background:var(--ink);color:#fff;text-decoration:none;padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px}
.note{font-size:13px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px;margin-top:14px}
@keyframes f{from{opacity:0}}@keyframes u{from{transform:translateY(24px);opacity:0}}
footer{margin-top:36px;color:var(--mut);font-size:13px;text-align:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.hero h2{font-size:24px}h1{font-size:28px}}
</style>
</head>

const NEWS=[
{
title: "Abu Dhabi reveals design for youth concert hall by the late Frank Gehry",
tituloPt: "Abu Dhabi revela sala de concertos para jovens projetada pelo falecido Frank Gehry",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/27/youth-orchestra-abu-dhabi-frank-gehry/",
imageUrl: "https://static-2026.dezeen.com/uploads/2026/10/youth-orchestra-abu-dhabi-frank-gehry_dezeen_2364_hero_0.jpg",
cat:"Design",stars:5,
dek:"Projeto póstumo de Gehry abre em janeiro de 2027 com abordagem surpreendentemente contida.",
resumo:["O Departamento de Cultura e Turismo de Abu Dhabi apresentou os planos de uma sala de concertos para jovens músicos, desenhada por Frank Gehry antes de sua morte, em dezembro do ano passado. O edifício, chamado Youth Orchestra Abu Dhabi, fica no distrito portuário de Mina Zayed e tem inauguração prevista para janeiro de 2027.","Em comparação com as formas fluidas e escultóricas que marcaram a carreira do arquiteto, a proposta é mais sóbria: as imagens mostram uma estrutura em dois níveis, com linhas de cobertura longas e retas e altas fachadas de vidro divididas por painéis brancos. Por dentro, escadas e passarelas de balcão são revestidas de madeira, e o último pavimento se abre para terraços na cobertura.","O programa inclui uma sala com 600 lugares e 18 salas de ensaio. A instituição oferecerá educação musical gratuita para crianças de seis a nove anos, começando com uma primeira turma de 100 alunos. O presidente do departamento, Mohamed Khalifa Al Mubarak, chamou o projeto de \"um investimento importante em nosso futuro\".","A obra se soma a outros projetos de Gehry na cidade: o Dar al Funoon, em construção, e o Guggenheim Abu Dhabi, com abertura prevista para 11 de dezembro."]
},
{
title: "Royal Designers for Industry rebrands as it turns 90",
tituloPt: "Royal Designers for Industry ganha nova identidade ao completar 90 anos",
source: "Creative Review",
url: "https://www.creativereview.co.uk/royal-designers-for-industry-rebrands-90-birthday/",
imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/10/RDI_2026_Books_web.jpg?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=1600&h=1067",
cat:"Branding",stars:5,
dek:"Margaret Calvert celebra os 90 anos liderando o rebranding da maior honraria do design britânico.",
resumo:["Ao completar 90 anos, Margaret Calvert apresentou uma nova identidade para a Royal Designers for Industry (RDI), instituição que também comemora 90 anos. Fundada pela Royal Society of Arts em 1936, a RDI é a maior distinção para designers do Reino Unido e tem no máximo 200 membros ao mesmo tempo.","Com a diversificação dos integrantes, a faculdade decidiu que era hora de renovar a marca e convidou dois membros, Calvert e Ian Cartlidge, para liderar o trabalho. A dupla criou uma estrutura tipográfica flexível baseada na New Rail Alphabet, fonte de Calvert, refinada na mesa de cozinha dela, eliminando ornamentos e ajustando o espaçamento entre letras.","A identidade posiciona \"Royal Designers\" em linhas separadas e em corpo grande, usa a sigla RDI dentro de um círculo ciano nas redes sociais e traz uma marca comemorativa dos 90 anos com um 9 e um 0 sobrepostos. O azul escuro deu lugar ao ciano, que, segundo Cartlidge, tem apelo contemporâneo, atrai designers mais jovens e dá mais visibilidade à faculdade entre estudantes.","Cartlidge defende que a RDI é uma comunidade de designers, e não uma instituição corporativa, por isso um sistema flexível faz mais sentido do que um logo fixo e permite adaptações. O resultado é mais vivo e ousado, refletindo a diversidade de disciplinas dos 200 membros e o objetivo de \"conectar gerações e apoiar designers emergentes\"."]
},
{
title: "New Logo and Identity for White & Case by Uncommon Creative Studio",
tituloPt: "Novo logo e identidade da White & Case, assinados pela Uncommon Creative Studio",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_white_case_by_uncommon_creative_studio.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/white_case_logo_before_after.png",
cat:"Branding",stars:4,
dek:"\"Legally Bold\": escritório global de advocacia renova a marca com estúdio londrino.",
resumo:["A Brand New analisou, em 26 de outubro, o novo logo e a nova identidade do escritório de advocacia White & Case, desenvolvidos pela Uncommon Creative Studio. O post, assinado por Armin Vit, está na categoria Corporativo e tem o título \"Legally Bold\".","As tags da publicação — ampersand, ligadura, serifa, fonte proprietária e azul — sugerem um logotipo tipográfico com serifa personalizada e um \"&\" em ligadura, na cor azul. A página inclui comparações de antes e depois e exemplos de aplicação.","O conteúdo completo da análise está atrás de paywall; este resumo se baseia apenas nos elementos públicos (título, categoria, tags e imagem de destaque) e não detalha o raciocínio do crítico."],
paywall:true
},
{
title: "New Logo and Packaging for Jergens",
tituloPt: "Novo logo e embalagem da Jergens",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_packaging_for_jergens.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/jergens_logo_before_after.png",
cat:"Branding",stars:3,
dek:"Marca clássica de cuidados com o corpo atualiza logo e embalagens.",
resumo:["A Brand New publicou em 26 de outubro uma análise do novo logo e das novas embalagens da Jergens, tradicional marca de produtos para o corpo, classificada na indústria de bens de consumo e com a tag Body Care.","As tags indicam o uso de azul, serifa e mudanças de embalagem. O texto público não informa qual estúdio fez o trabalho, e as imagens de antes e depois não são descritas na parte aberta da página.","A matéria completa está atrás de paywall; este resumo se baseia somente nos elementos públicos da página."],
paywall:true
},
{
title: "MVRDV designs Essen Central Library as public \"living room\" in Germany",
tituloPt: "MVRDV projeta a Biblioteca Central de Essen como uma \"sala de estar\" pública na Alemanha",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/27/mvrdv-essen-central-library/",
imageUrl: "https://static-2026.dezeen.com/uploads/2026/10/essen-central-library-mvrdv-germany-architectre-public-leisure_dezeen_2364_hero2.jpg",
cat:"Design",stars:4,
dek:"Antiga loja de departamentos vira \"terceiro lugar\" com estantes vermelhas e makerspaces.",
resumo:["O estúdio holandês MVRDV, em parceria com a Meyer Architekten, projetou a Biblioteca Central de Essen, na Alemanha, instalada no antigo edifício de departamentos Boeckerhaus, na Kennedyplatz. São 11 mil metros quadrados distribuídos em seis andares, em um local mais central que o da biblioteca anterior.","Os arquitetos a descrevem como um centro cultural e educacional que vai além do arquivo tradicional. A ideia se apoia na teoria dos \"terceiros lugares\" do sociólogo Ray Oldenburg: um espaço informal e inclusivo, frequentado por quem vai com um objetivo ou apenas passa.","Faixas largas de vidro na fachada revelam áreas de estudo no perímetro de cada andar, de modo que a atividade interna vira parte do rosto público do prédio. Aglomerados de estantes vermelhas, as \"vilas de mídia\", organizam as zonas de acervo, brincadeiras infantis, jogos e hobbies, com o vermelho ficando mais claro a cada pavimento.","O projeto ainda inclui café no térreo, espaço para eventos na cobertura com vista da cidade, makerspaces, salas de música e áreas com impressoras 3D, realidade virtual e robótica."]
},
{
title: "The Body Shop returns the Pod to its packaging",
tituloPt: "The Body Shop devolve a \"Pod\" ao centro de suas embalagens",
source: "Design Week",
url: "https://www.designweek.co.uk/the-body-shop-returns-the-pod-to-its-packaging/",
imageUrl: "https://www.designweek.co.uk/content/uploads/2026/10/Together-Design-London-TBS-Before-and-After-1024x654.png",
cat:"Branding",stars:4,
dek:"Together Design London reorganiza a linha Body Butter em torno do gráfico histórico da marca.",
resumo:["A Together Design London redesenhou as embalagens do Body Butter e da linha Bath & Body da The Body Shop, colocando o gráfico histórico da marca, a \"Pod\", como elemento central. O trabalho acompanha o relançamento do Body Butter, criado em 1992, e busca devolver distinção à marca e construir um sistema de design coerente para uma nova geração de consumidores.","A Pod, associada a natureza, crescimento e mudança positiva, passou de dispositivo de apoio a principal estrutura visual, sobre o verde tradicional da marca. Cada produto mantém sua personalidade com ilustrações coloridas e sensoriais de ingredientes feitas por Sally Caulwell.","Segundo a diretora criativa Bryony Meyrick, o desafio foi fazer o sistema funcionar em formatos, nomes e ingredientes variados, e não apenas em um produto principal. O diretor de marketing Victor Sabbe ligou a mudança à nova fórmula, mais cremosa, desenvolvida a pedido dos clientes. A agência já trabalha em outras linhas que chegam em 2027 e 2028."]
},
{
title: "OMA turns potato head's bali store into creative workshop for recycled materials and traditional craft",
tituloPt: "OMA transforma loja do Potato Head em Bali em oficina criativa de materiais reciclados e artesanato tradicional",
source: "Designboom",
url: "https://www.designboom.com/architecture/oma-potato-head-good-times-general-store-bali-indonesia/",
imageUrl: "https://www.designboom.com/twitterimages/uploads/2026/10/oma-potato-head-good-times-general-store-bali-indonesia-designboom-1.jpg",
cat:"Design",stars:4,
dek:"Good Times General Store, em Seminyak, une varejo, oficinas e economia circular.",
resumo:["A OMA e o Potato Head inauguraram em Seminyak, Bali, a Good Times General Store, primeira loja permanente da marca de hospitalidade, que também funciona como centro de artesanato. Lá se vendem objetos, moda, móveis e livros feitos na Indonésia, além de oficinas que mostram como os itens são feitos e de onde vêm os materiais.","Projetada com Ade Herkarisma, do Potato Head, a construção usa técnicas balinesas como palha alang-alang, paredes de taipa com argila local, madeira reaproveitada e piso de terrazzo com sobras de bambu reciclado.","Cinco módulos interligados seguem as etapas da vida de um objeto, de souvenirs artesanais e roupas de viagem à coleção Wasted, de Max Lamb, com móveis feitos de plástico descartado. Os dois últimos módulos são ateliês: um de tingimento natural com plantas e resíduos de alimentos e outro de moldagem de plástico com HDPE triturado coletado em Bali e Java.","Para 2027 estão previstos ateliês de tecelagem, reaproveitamento e costura. O fundador Ronald Akili resume: \"O varejo pode ser mais do que uma transação\"."]
},
{
title: "\"Things start in really simple gestures\" says Es Devlin of her Design Museum retrospective",
tituloPt: "\"Tudo começa em gestos muito simples\", diz Es Devlin sobre sua retrospectiva no Design Museum",
source: "Dezeen",
url: "https://www.dezeen.com/2026/10/27/other-worlds-es-devlin-exhibition-retrospective-design-museum-london-interview-video/",
imageUrl: "https://static-2026.dezeen.com/uploads/2026/10/other-worlds-es-devlin-exhibition-retrospective-design-museum-london-video-sq_dezeen_2364_col_0.jpg",
cat:"Design",stars:3,
dek:"Entrevista em vídeo com a artista durante \"Other Worlds\", em Londres. Conteúdo em parceria com o museu.",
resumo:["A Dezeen publicou uma entrevista em vídeo com a artista e designer britânica Es Devlin, gravada na exposição \"Es Devlin: Other Worlds\", sua primeira retrospectiva europeia, no Design Museum de Londres. Ela diz que o livro que acompanha a mostra é seu projeto favorito: levou sete anos e reúne tudo o que já criou.","A exposição cobre três décadas de trabalho em teatro, ópera, shows e instalações públicas. A mostra começa com a recriação do estúdio dela em Peckham, seguida de uma versão reconfigurada de \"Come Home Again\" (2022), com silhuetas iluminadas de animais sob um teto espelhado.","Entre os destaques estão \"A 30-Year Desk\", mesas circulares concêntricas com material de arquivo, e \"An Infinite Library\", escultura giratória de oito metros com mais de 2 mil livros. Devlin diz organizar montanhas de material em uma linha do tempo para que o público acompanhe, e que projetos complexos começam com gestos simples.","A exposição vai até 4 de abril de 2027. O vídeo foi produzido como conteúdo em parceria com o Design Museum."]
},
{
title: "New Logo and Identity for Farmer Gracy by Tobias Hall and Bolden",
tituloPt: "Novo logo e identidade da Farmer Gracy, assinados por Tobias Hall e Bolden",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_farmer_gracy_by_tobias_hall_and_bolden.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/10/farmer_gracy_logo_before_after.png",
cat:"Branding",stars:3,
dek:"\"So Gracy it Might Just Work\": evolução da marca de varejo de flores.",
resumo:["A Brand New publicou, em 26 de outubro, o novo logo e identidade da Farmer Gracy, com trabalho creditado a Tobias Hall e Bolden. O post foi classificado como \"Noted\" e intitulado \"So Gracy it Might Just Work\".","A empresa está na categoria Varejo e as tags (flores, Países Baixos, Reino Unido, ícone, evolução) indicam uma marca ligada a flores, com um ícone e uma evolução da identidade existente, e não uma criação do zero.","O texto completo está atrás de paywall; este resumo usa apenas os elementos públicos e não descreve as mudanças visuais em detalhe."],
paywall:true
},
{
title: "Watch out, YouTube — Instagram goes from short-form to 90-minute videos",
tituloPt: "Atenção, YouTube: o Instagram passa dos vídeos curtos para vídeos de 90 minutos",
source: "TechCrunch",
url: "https://techcrunch.com/2026/10/26/watch-out-youtube-instagram-goes-from-short-form-to-90-minute-videos/",
imageUrl: "https://techcrunch.com/wp-content/uploads/2025/10/adam-mosseri-at-bloomberg-screentime.png?resize=1200,675",
cat:"Tecnologia",stars:4,
dek:"Teste \"Features\" permite uploads longos e mira a monetização de criadores.",
resumo:["O Instagram testa um novo tipo de upload chamado \"Features\", que permite a criadores postar vídeos de até 90 minutos, uma mudança importante após anos de foco em vídeo curto. O teste começou no Brasil e agora chega aos EUA.","Hoje os criadores ganham principalmente com parcerias de marcas. Adam Mosseri disse que o programa de bônus por desempenho custa à Meta muito mais do que retorna. Já o YouTube repassa 55% da receita de anúncios e afirma ter pago mais de US$ 100 bilhões em quatro anos.","Clipes curtos são mais difíceis de monetizar, e muitos criadores usam Instagram e TikTok como vitrine para o YouTube. Mosseri era contra vídeos longos, mas foi convencido por Tessa Lyons a tentar de novo, para manter o público dentro do Instagram.","A rede também testa \"Clips as Reels\", que transforma vídeos longos em Reels com link para a versão completa. A Meta não anunciou modelo de monetização, e a matéria levanta a possibilidade de anúncios em vídeos longos."]
},
{
title: "Getty Images is bankrupt but, still in business thanks to massive Koch deal",
tituloPt: "Getty Images pede falência, mas segue operando graças a um acordo bilionário com os Koch",
source: "Design Week",
url: "https://www.designweek.co.uk/getty-images-is-bankrupt-but-still-in-business-thanks-to-massive-koch-deal/",
imageUrl: "https://imagescdn.designweek.co.uk/uploads/2026/10/shutterstock_1444728653-Design-Week.jpg?fit=crop&crop=faces&q=45&auto=compress,format&cs=origin&w=1024&h=683",
cat:"Design",stars:3,
dek:"Artigo de opinião de David Coveney convida designers a repensar fornecedores de imagem.",
resumo:["Em artigo de opinião na Design Week, David Coveney relata que a Getty Images entrou com pedido de falência pelo Capítulo 11 nos EUA, com a família Getty e a Koch Equity Development assumindo o controle e fechando o capital da empresa.","Ele argumenta que se trata de uma reestruturação financeira, e não de uma venda forçada, já que o negócio ainda tem receitas altas apesar de cerca de US$ 2,1 bilhões em dívidas. Parte dos problemas viria da fusão fracassada com a Shutterstock, bloqueada por reguladores britânicos.","A Getty apresentou o acordo como sinal de \"potencial de crescimento de longo prazo\". O autor vê o movimento como típico de comportamento rentista e de private equity, lembrando que fotógrafos que licenciam pela Getty costumam receber apenas de 15% a 25% da receita, e critica a influência política da família Koch.","O texto termina incentivando designers a escolher fornecedores independentes, já que decisões de licenciamento têm peso político."]
},
{
title: "Apple unveils new iPad mini with OLED display and faster A20 Pro chip",
tituloPt: "Apple apresenta novo iPad mini com tela OLED e chip A20 Pro mais rápido",
source: "TechCrunch",
url: "https://techcrunch.com/2026/10/26/apple-unveils-new-ipad-mini-with-oled-display-and-faster-a20-pro-chip/",
imageUrl: "https://techcrunch.com/wp-content/uploads/2026/10/Screenshot-2026-10-26-at-9.44.29-AM.png?resize=1200,792",
cat:"Tecnologia",stars:3,
dek:"Tela de 8,5 polegadas, 5,4 mm de espessura e preço inicial de US$ 699.",
resumo:["A Apple anunciou um novo iPad mini com tela OLED de 8,5 polegadas e chip A20 Pro. O tablet é mais fino e leve que o antecessor, com 5,4 mm de espessura, e vem em duas cores.","O preço começa em US$ 699 (Wi-Fi) e US$ 849 (Wi-Fi + celular). A tela chega a 1.200 nits de brilho máximo, mais que o dobro do modelo anterior, com opção nano-texture contra reflexos e suporte à gama P3. Um \"Acoustic Display\" com woofers integrados promete melhorar o áudio.","O chip traz GPU de 7 núcleos com Neural Accelerators, com IA até 4,5 vezes mais rápida, e CPU de 6 núcleos. Há também câmera frontal de 12 MP, conectividade mais rápida e carregamento rápido. O aparelho chega com a nova geração do Apple Intelligence e da Siri; pré-venda em 28 de outubro e lançamento em 6 de novembro."]
}

const PAL={Branding:["#ff9a5a","#ff4d6d","#ffd166"],Design:["#2dd4bf","#0f766e","#a7f3d0"],Tecnologia:["#6366f1","#8b5cf6","#38bdf8"]};
function Art({cat,seed}){const p=PAL[cat],r=(i)=>((seed*37+i*53)%100);
return <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" className="img" role="img" aria-label={"Ilustração "+cat}>
<defs><linearGradient id={"g"+seed} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
<rect width="320" height="200" fill={"url(#g"+seed+")"}/>
<circle cx={60+r(1)*2} cy={50+r(2)} r={50+r(3)/3} fill={p[2]} opacity=".45"/>
<rect x={150+r(4)} y={60+r(5)/2} width="110" height="110" rx="24" fill="#fff" opacity=".22" transform={"rotate("+(r(6)/3)+" 200 110)"}/>
<polygon points={"40,190 "+(110+r(7))+",110 190,190"} fill="#fff" opacity=".18"/></svg>;}
function Img({item,i}){const[f,setF]=useState(false);
if(!item.imageUrl||f)return <Art cat={item.cat} seed={i+1}/>;
return <img className="img" src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setF(true)}/>;}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
function Modal({item,i,close}){useEffect(()=>{const h=e=>e.key==="Escape"&&close();window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h)},[]);
return <div className="ov" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}>
<Img item={item} i={i}/><div className="body"><button className="x" onClick={close} aria-label="Fechar">×</button>
<div className="meta"><span className={"tag "+item.cat}>{item.cat}</span><Stars n={item.stars}/><span>{item.source}</span></div>
<h2>{item.tituloPt}</h2>{item.resumo.map((p,k)=><p key={k}>{p}</p>)}
{item.paywall&&<div className="note">Matéria atrás de paywall: resumo escrito a partir dos elementos públicos (título, categoria, tags e imagem).</div>}
<a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte original ↗</a></div></div></div>;}
function App(){const[sel,setSel]=useState(null);const[h,...rest]=NEWS;
return <div className="wrap"><header><div><h1>Portal da Manhã</h1><div className="date">Terça-feira, 27 de outubro de 2026 · Branding, Design e Tecnologia</div></div><div className="date">{NEWS.length} matérias · {new Set(NEWS.map(n=>n.source)).size} portais</div></header>
<div className="card hero" onClick={()=>setSel(0)}><Img item={h} i={0}/><div className="body"><div className="meta"><span className={"tag "+h.cat}>{h.cat}</span><Stars n={h.stars}/><span>{h.source}</span></div><h2>{h.tituloPt}</h2><p className="lead">{h.dek}</p></div></div>
<div className="grid">{rest.map((n,k)=><div className="card" key={k} onClick={()=>setSel(k+1)}><Img item={n} i={k+1}/><div className="body"><div className="meta"><span className={"tag "+n.cat}>{n.cat}</span><Stars n={n.stars}/></div><h3>{n.tituloPt}</h3><p className="lead">{n.dek}</p><div className="meta" style={{marginTop:8}}>{n.source}</div></div></div>)}</div>
<footer>Resumos parafraseados em português. Clique em uma matéria para ler o resumo completo.</footer>
{sel!==null&&<Modal item={NEWS[sel]} i={sel} close={()=>setSel(null)}/>}</div>;}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
