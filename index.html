<style>
  :root{
    --bg:#f6f6f4;
    --card:#ffffff;
    --ink:#14161a;
    --muted:#6b7280;
    --line:#e6e6e1;
    --accent:#c2410c;
    --radius:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1120px;margin:0 auto;padding:32px 20px 80px}
  header.top{padding:24px 0 8px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .brand{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-0.03em;margin:0}
  .brand span{color:var(--accent)}
  .sub{color:var(--muted);font-size:14px;margin-top:8px;display:flex;gap:14px;flex-wrap:wrap}
  .pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:5px 10px;border-radius:999px;background:#eef0ee;color:#4b5563}
  .pill.branding{background:#fdece2;color:#9a3412}
  .pill.design{background:#e2f5ef;color:#0f6b53}
  .pill.tecnologia{background:#e8e9fd;color:#3730a3}
  .stars{color:#e0a300;font-size:13px;letter-spacing:1px}
  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:grid;grid-template-columns:1.15fr 1fr;
    box-shadow:0 1px 2px rgba(16,20,24,.04),0 12px 30px rgba(16,20,24,.05);
    transition:transform .25s ease, box-shadow .25s ease;margin-bottom:34px;
  }
  .hero:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(16,20,24,.06),0 22px 44px rgba(16,20,24,.09)}
  .hero .media{min-height:340px;position:relative;background:#eee}
  .hero .media img,.card .media img{width:100%;height:100%;object-fit:cover;display:block}
  .hero .body{padding:32px}
  .hero h2{font-size:clamp(24px,3vw,34px);line-height:1.15;letter-spacing:-0.02em;margin:14px 0 12px}
  .hero p{color:#374151;line-height:1.6;margin:0 0 18px;font-size:15px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(16,20,24,.04);
    transition:transform .22s ease, box-shadow .22s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 4px 10px rgba(16,20,24,.06),0 18px 34px rgba(16,20,24,.08)}
  .card .media{height:180px;background:#eee}
  .card .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:9px;flex:1}
  .card h3{font-size:17px;line-height:1.3;margin:0;letter-spacing:-0.01em}
  .card .dek{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0}
  .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px}
  .src{font-size:12px;font-weight:600;color:#4b5563}
  .overlay{
    position:fixed;inset:0;background:rgba(15,17,20,.5);backdrop-filter:blur(4px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 18px;z-index:50;
    animation:fade .2s ease;overflow-y:auto;
  }
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal{
    background:var(--card);max-width:780px;width:100%;border-radius:22px;overflow:hidden;
    animation:rise .28s cubic-bezier(.2,.7,.3,1);box-shadow:0 30px 70px rgba(0,0,0,.28);
  }
  .modal .media{height:320px;background:#eee}
  .modal .body{padding:30px 34px 36px}
  .modal h2{font-size:clamp(22px,3.4vw,30px);line-height:1.2;letter-spacing:-0.02em;margin:14px 0 6px}
  .modal .orig{color:var(--muted);font-size:13px;font-style:italic;margin:0 0 18px}
  .modal p.txt{line-height:1.75;font-size:15.5px;color:#22262c;margin:0 0 14px}
  .note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;margin-top:18px}
  .actions{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
  .btn{border:none;cursor:pointer;font-size:14px;font-weight:600;padding:11px 18px;border-radius:12px;text-decoration:none;display:inline-block}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{background:#f1f1ee;color:#22262c}
  footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.6}
  @media(max-width:900px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .hero{grid-template-columns:1fr}
    .hero .media{min-height:230px}
  }
  @media(max-width:600px){
    .grid{grid-template-columns:1fr}
    .modal .media{height:210px}
    .modal .body{padding:24px 22px 30px}
    .hero .body{padding:24px}
  }
</style>
</head>

function corDaCategoria(cat){
  if(cat === "branding") return ["#f97316","#c2410c","#fbbf24"];
  if(cat === "tecnologia") return ["#6366f1","#7c3aed","#38bdf8"];
  return ["#10b981","#0d9488","#a7f3d0"];
}

function Ilustracao({categoria, semente, alto}){
  const [c1,c2,c3] = corDaCategoria(categoria);
  const id = "g" + semente;
  const r = (semente * 37) % 60;
  return (
    <svg viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice"
         style={{width:"100%",height:"100%",display:"block"}} aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor={c1}/>
          <stop offset="100%" stopColor={c2}/>
        </linearGradient>
      </defs>
      <rect width="400" height="260" fill={`url(#${id})`}/>
      <circle cx={90 + r} cy={80} r={70} fill={c3} opacity="0.35"/>
      <circle cx={310 - r} cy={190} r={95} fill="#ffffff" opacity="0.14"/>
      <rect x={200 - r} y={30} width="130" height="130" rx="26" fill="#ffffff" opacity="0.16"
            transform={`rotate(${(semente*17)%40 - 20} 265 95)`}/>
      <path d={`M0 ${210 - r/2} Q 120 ${150 + r} 220 ${210 - r/3} T 400 ${190}`}
            stroke="#ffffff" strokeWidth="10" fill="none" opacity="0.22"/>
    </svg>
  );
}

function Media({item, indice, alto}){
  const [falhou, setFalhou] = useState(false);
  if(!item.imageUrl || falhou){
    return <Ilustracao categoria={item.categoria} semente={indice+1} alto={alto}/>;
  }
  return (
    <img src={item.imageUrl}
         alt={item.tituloPt}
         referrerPolicy="no-referrer"
         loading="lazy"
         onError={() => setFalhou(true)}/>
  );
}

function Estrelas({n}){
  return <span className="stars" title={`${n} de 5`}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
}

function Modal({item, indice, onClose}){
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="media"><Media item={item} indice={indice} alto/></div>
        <div className="body">
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <span className={"pill " + item.categoria}>{item.categoria}</span>
            <span className="src">{item.source}</span>
            <Estrelas n={item.rank}/>
          </div>
          <h2>{item.tituloPt}</h2>
          <p className="orig">Título original: “{item.title}”</p>
          {item.resumo.map((p,i) => <p className="txt" key={i}>{p}</p>)}
          {item.obs && <p className="note">{item.obs}</p>}
          <div className="actions">
            <a className="btn primary" href={item.url} target="_blank" rel="noopener noreferrer">Ler no {item.source} ↗</a>
            <button className="btn ghost" onClick={onClose}>Fechar</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [aberto, setAberto] = useState(null);
  const ordenadas = NOTICIAS.map((n,i) => ({...n, _i:i}));
  const manchete = ordenadas[0];
  const demais = ordenadas.slice(1);

  return (
    <div className="wrap">
      <header className="top">
        <h1 className="brand">Portal da <span>Manhã</span></h1>
        <div className="sub">
          <span>Sexta-feira, 28 de agosto de 2026</span>
          <span>·</span>
          <span>{NOTICIAS.length} notícias · 6 portais</span>
          <span>·</span>
          <span>Branding, design e cultura visual</span>
        </div>
      </header>

      <article className="hero" onClick={() => setAberto(manchete)}>
        <div className="media"><Media item={manchete} indice={manchete._i} alto/></div>
        <div className="body">
          <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
            <span className={"pill " + manchete.categoria}>{manchete.categoria}</span>
            <span className="src">{manchete.source}</span>
            <Estrelas n={manchete.rank}/>
          </div>
          <h2>{manchete.tituloPt}</h2>
          <p>{manchete.dek}</p>
          <span className="btn primary" style={{pointerEvents:"none"}}>Ler resumo</span>
        </div>
      </article>

      <div className="grid">
        {demais.map(item => (
          <article className="card" key={item._i} onClick={() => setAberto(item)}>
            <div className="media"><Media item={item} indice={item._i}/></div>
            <div className="body">
              <span className={"pill " + item.categoria} style={{alignSelf:"flex-start"}}>{item.categoria}</span>
              <h3>{item.tituloPt}</h3>
              <p className="dek">{item.dek}</p>
              <div className="meta">
                <span className="src">{item.source}</span>
                <Estrelas n={item.rank}/>
              </div>
            </div>
          </article>
        ))}
      </div>

      <footer>
        Portal da Manhã — edição de 28 de agosto de 2026. Curadoria automática a partir de Dezeen, Brand New,
        Creative Review, The Brand Identity, It’s Nice That e Yanko Design. Os resumos são paráfrases em português
        escritas para esta edição; os textos e imagens originais pertencem aos respectivos veículos. Clique em qualquer
        cartão para ler o resumo completo e acessar a fonte.
      </footer>

      {aberto && <Modal item={aberto} indice={aberto._i} onClose={() => setAberto(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
