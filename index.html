  resumo: [
   "Segundo Anthony Ha, do TechCrunch, o economista-chefe da Apollo Global Management, Torsten Slok, não vê benefício financeiro mensurável da IA em grandes empresas americanas fora do setor de tecnologia.",
   "Ele analisa o 'S&P 493', ou seja, o S&P 500 sem sete gigantes de tecnologia: Alphabet, Amazon, Apple, Meta, Microsoft, Nvidia e Tesla. Nesse grupo, margens de lucro e receita por funcionário parecem estáveis, sem sinal de ganho de produtividade.",
   "Slok duvida que negócios tradicionais consigam converter inteligência de máquina cada vez mais barata em crescimento mais rápido de receita e margens maiores.",
   "Ele compara a IA a uma calculadora muito capaz e argumenta que a inteligência empresarial depende em boa parte de julgamento humano. A IA não lida com responsabilização, confiança, cultura corporativa, normas informais, dilemas éticos e justiça, fatores que afetam o risco de reputação e, portanto, o lucro.",
   "O texto acrescenta que outros estudos recentes também não encontraram grandes ganhos de produtividade e apresenta a ausência de retorno fora da tecnologia como sinal de que as expectativas superaram os resultados mensuráveis."
  ]
 }
];

const PAL = { Branding:["#ff9a3c","#e8590c","#ffd166"], Design:["#14b8a6","#0f766e","#a7f3d0"], Tecnologia:["#6366f1","#7c3aed","#93c5fd"] };
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}
function Ilustra({ seed, cat }){
  const p = PAL[cat]||PAL.Branding, h = hash(seed), id = "g"+h;
  const sh = [0,1,2,3].map(i=>({x:(h>>(i*3))%100*4,y:(h>>(i*2+1))%60*4,r:40+(h>>(i+2))%90,c:p[i%3],o:.35+((h>>i)%4)*.12}));
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label={"Ilustração "+cat}>
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#"+id+")"}/>
    {sh.map((s,i)=> i%2? <circle key={i} cx={s.x} cy={s.y} r={s.r} fill={s.c} opacity={s.o}/> : <rect key={i} x={s.x-s.r} y={s.y-s.r/2} width={s.r*1.6} height={s.r} rx="14" fill="#fff" opacity={s.o*.5} transform={"rotate("+((h>>i)%40-20)+" "+s.x+" "+s.y+")"}/>)}
  </svg>);
}
function Media({ item }){
  const [falhou,setFalhou]=useState(false);
  return (<div className="media">{item.imageUrl && !falhou
    ? <img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
    : <Ilustra seed={item.title} cat={item.cat}/>}</div>);
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>;
function Modal({ item, onClose }){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)},[]);
  return (<div className="overlay" onClick={onClose}><div className="modal" style={{position:"relative"}} onClick={e=>e.stopPropagation()}>
    <button className="close" onClick={onClose} aria-label="Fechar">×</button>
    <Media item={item}/>
    <div className="in">
      <div className="row" style={{justifyContent:"flex-start"}}><span className={"tag t-"+item.cat}>{item.cat}</span><Stars n={item.stars}/></div>
      <h2>{item.tituloPt}</h2>
      <div className="src">{item.source} · {item.date}</div>
      <div style={{height:14}}/>
      {item.resumo.map((p,i)=><p key={i}>{p}</p>)}
      {item.aviso && <div className="note">{item.aviso}</div>}
      <a className="btn" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte original ↗</a>
    </div></div></div>);
}
function App(){
  const [sel,setSel]=useState(null);
  const itens=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [top,...resto]=itens;
  return (<div className="wrap">
    <header><div><h1>☀️ Portal da Manhã</h1><div className="date">Segunda-feira, 26 de outubro de 2026 · {itens.length} notícias de branding, design e tecnologia</div></div></header>
    <div className="hero" onClick={()=>setSel(top)}>
      <Media item={top}/>
      <div className="body"><div className="row" style={{justifyContent:"flex-start"}}><span className={"tag t-"+top.cat}>{top.cat}</span><Stars n={top.stars}/></div>
        <h2>{top.tituloPt}</h2><div className="src">{top.source} · {top.date}</div>
        <div style={{color:"#4a4d57"}}>{top.resumo[0]}</div></div>
    </div>
    <div className="grid">{resto.map(it=>(
      <article className="card" key={it.url} onClick={()=>setSel(it)}>
        <Media item={it}/>
        <div className="body"><div className="row"><span className={"tag t-"+it.cat}>{it.cat}</span><Stars n={it.stars}/></div>
          <h3>{it.tituloPt}</h3><div className="src">{it.source} · {it.date}</div></div>
      </article>))}</div>
    <footer>Resumos parafraseados em português. Clique em uma notícia para ler mais, sem sair da página.</footer>
    {sel && <Modal item={sel} onClose={()=>setSel(null)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
