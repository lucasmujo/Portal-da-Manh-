<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 29 de setembro de 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14161f;--mut:#6b7185;--line:#e6e8f0;--acc:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 18px 60px}
header h1{font-size:34px;margin:0;letter-spacing:-.02em}
header p{color:var(--mut);margin:4px 0 26px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px rgba(20,22,31,.08);cursor:pointer;transition:transform .2s,box-shadow .2s}
.hero:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(20,22,31,.12)}
.hero .img{min-height:340px}
.hero .txt{padding:30px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:27px;line-height:1.2;margin:0;letter-spacing:-.01em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px;margin-top:24px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 3px 14px rgba(20,22,31,.06);cursor:pointer;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,22,31,.12)}
.card .img{height:180px}
.card .b{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:16.5px;line-height:1.3;margin:0}
.img{position:relative;background:#eceef5;overflow:hidden}
.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.tag{padding:2px 9px;border-radius:99px;font-weight:600;font-size:11.5px}
.Branding{background:#fff0e3;color:#c2570c}.Design{background:#dcf6f0;color:#0d7d6c}.Tecnologia{background:#e8e6ff;color:#4338ca}
.stars{color:#f5a623;letter-spacing:1px}
.modal-bg{position:fixed;inset:0;background:rgba(15,17,26,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 14px;z-index:10;animation:fade .2s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:up .28s ease;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .img{height:340px}
.modal .c{padding:26px 30px 32px}
.modal h2{margin:8px 0 12px;font-size:25px;line-height:1.25}
.modal p{font-size:16px;color:#2a2e3d}
.orig{font-size:13px;color:var(--mut);font-style:italic}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;font-size:14px;text-decoration:none}
.pri{background:var(--acc);color:#fff}.sec{background:#eef0f7;color:var(--ink)}
.note{font-size:12.5px;color:var(--mut);margin-top:14px}
footer{margin-top:40px;text-align:center;color:var(--mut);font-size:13px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.modal .img{height:220px}header h1{font-size:27px}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const NEWS = [
{
  title: "Inca Kola rebrands as the world's other cola war heats up",
  tituloPt: "A Inca Kola perdeu o mapa do Peru e o 'desde 1935': o redesenho da Coca-Cola para a soda peruana irritou os consumidores",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/design/branding/inca-kola-rebrands-as-the-worlds-other-cola-war-heats-up",

  cat: "Branding", stars: 5, data: "27/09/2026",
  resumo: ["A Coca-Cola atualizou a identidade visual da Inca Kola, a icônica bebida peruana de erva-luísa, e a mudança gerou polêmica imediata. O novo logo abandona o contorno em formato do Peru, as bordas brancas e a inscrição 'desde 1935' que marcavam a versão anterior.","O trabalho ficou a cargo da agência Epoch, que buscou melhorar a visibilidade na prateleira e reforçar um ar mais contemporâneo. Manteve-se o amarelo característico e foi criado um logo sonoro a partir do som de batidas em garrafas de vidro tradicionais. A comunicação passou a posicionar a bebida como conectora social e como acompanhamento de refeições.","Muitos peruanos reagiram mal: para críticos, a marca deixou de ter identidade e virou algo genérico, trocando patrimônio por globalização. O movimento acontece num momento de pressão de concorrentes locais como Triple Kola e Oro, que usam combinações de azul e amarelo para disputar a liderança histórica da Inca Kola."]
},
{
  title: "New Logo and Identity for Intuit by JKR and In-house",

  cat: "Branding", stars: 5, data: "28/09/2026",
  resumo: ["A Intuit, dona de produtos de software financeiro, apresentou uma identidade renovada desenvolvida em parceria entre a consultoria Jones Knowles Ritchie (JKR) e a equipe interna da empresa.","O centro da mudança é um wordmark em letras minúsculas, na cor azul, desenhado com uma fonte proprietária chamada MCKL Type. A passagem para minúsculas e a tipografia própria reforçam o reconhecimento da marca no setor de software e serviços financeiros, mantendo continuidade visual e modernizando a apresentação em aplicações digitais e físicas."],

{
  title: "D&AD announces Black Pencil winners",
  tituloPt: "D&AD entrega quatro Lápis Pretos: Coinbase, The Ordinary e AXA lideram, e a Apple é a Marca do Ano",
  source: "Creative Review",
  url: "https://www.creativereview.co.uk/dad-announces-black-pencil-winners/",
  imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/09/DAD-Black-Pencil-scaled.png?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=2560&h=965",
  cat: "Branding", stars: 5, data: "25/09/2026",
  resumo: ["Quatro Lápis Pretos foram entregues na cerimônia do D&AD em Londres. A Isle of Any levou dois, pelo anúncio 'Your Way Out' da Coinbase, que usou coreografia e figurino para simular a estética de um videogame.","A Uncommon Creative Studio foi premiada por 'The Periodic Fable', da The Ordinary, campanha que desmistifica o jargão do setor de beleza, e a Publicis Conseil venceu com 'Three Words', da AXA, iniciativa que incluiu cobertura contra violência doméstica em seguros residenciais.","Entre os demais prêmios, a Apple foi eleita Marca do Ano, a Uncommon Londres ficou com Agência de Publicidade do Ano e a Isle of Any com Agência Independente do Ano. A designer Irma Boom recebeu o President's Award."]

{
  title: "We have the kind of stuff AI wishes it could make: Why trust is more important than ever for the NASA brand",
  tituloPt: "'Temos o que a IA gostaria de fazer': o diretor criativo da NASA explica por que a marca proibiu imagens geradas por IA",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/design/we-have-the-kind-of-stuff-ai-wishes-it-could-make-why-trust-is-more-important-than-ever-for-the-nasa-brand",
  imageUrl: "https://cdn.mos.cms.futurecdn.net/7U2hdcGUCJhHVqMbZdHGg6-1920-80.jpg",
  cat: "Branding", stars: 4, data: "27/09/2026",
  resumo: ["Em entrevista, David Rager, diretor criativo da NASA, conta sua trajetória pouco convencional: música, museus, agências e Disney, até chegar ao Jet Propulsion Laboratory em 2019.","Um dos destaques é a volta do logotipo 'worm', abandonado em 1992 e recuperado para conviver em harmonia com o emblema 'meatball' da agência; o worm hoje integra a coleção permanente do MoMA.","Rager define a marca como comunicadora de otimismo e humanidade e como um bem de confiança pública. Por isso, a NASA proibiu imagens geradas por IA em suas comunicações: quem vê uma imagem da agência precisa saber que ela é real, e o acervo fotográfico e artístico da casa supera o que a IA consegue produzir."]
},
{
  title: "New Logo and Identity for &Cookies by Fishfinger",
  tituloPt: "&Cookies, do Kuwait, ganha identidade gorducha da Fishfinger, com e comercial gigante e vermelho vivo",
  source: "Brand New",
  url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_cookies_by_fishfinger.php",
  imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/09/and_cookies_logo_new.png",
  cat: "Branding", stars: 3, data: "25/09/2026",
  resumo: ["O Brand New publicou o novo logo e a identidade da &Cookies, marca de cookies com sede no Kuwait, criados pelo estúdio Fishfinger.","Pelas tags da publicação, o sistema aposta em traços grossos ('chunky'), no e comercial como elemento de destaque e numa paleta vermelha, com exemplos de aplicação em diferentes pontos de contato."],
  paywall: true
},
{
  title: "Rockwell Group eschews 90-degree angles for Skywalker Grill at Lucas Museum",
  tituloPt: "Sem nenhum ângulo reto: a Rockwell Group desenha o Skywalker Grill, restaurante do Museu Lucas em Los Angeles",
  source: "Dezeen",
  url: "https://www.dezeen.com/2026/09/26/skywalker-grill-lucas-museum-narrative-art-los-angeles-rockwell-group/",
  imageUrl: "https://static.dezeen.com/uploads/2026/09/skywalker-grill_lucas-museum_rockwell-group_dezeen_sq1.jpg",
  cat: "Design", stars: 4, data: "26/09/2026",
  resumo: ["A Rockwell Group concluiu o Skywalker Grill, restaurante e bar no quinto andar do recém-inaugurado Lucas Museum of Narrative Art, em Los Angeles. O projeto eliminou todos os ângulos de 90 graus para dialogar com as formas curvas do edifício do escritório MAD.","Painéis de cerejeira feitos sob medida remetem ao Skywalker Ranch de George Lucas; paredes curvas, divisórias onduladas e colunas anguladas criam espaços orgânicos. O bar sinuoso tem azulejos prateados cintilantes e um fundo iluminado em Corian.","A proposta traz elementos de narrativa cinematográfica, como enquadramento, luz e escala, aliando materiais de alta tecnologia a detalhes artesanais. Uma janela ovoide dá para um terraço com vista do centro de Los Angeles, e o cardápio californiano usa ingredientes como wagyu e ricota com mel do próprio rancho."]
},
{
  title: "New York Times campaign celebrates 175 years",
  tituloPt: "Com o Studio Dumbar, o New York Times comemora 175 anos celebrando a própria história… da publicidade",
  source: "Creative Review",
  url: "https://www.creativereview.co.uk/new-campaign-celebrates-175-years-of-the-new-york-times/",
  imageUrl: "https://d3e341ktepti6g.cloudfront.net/uploads/2026/09/NYTA175_All.png?auto=compress,format&crop=faces,entropy,edges&fit=crop&q=60&w=2000&h=1333",
  cat: "Branding", stars: 4, data: "24/09/2026",
  resumo: ["Para marcar os 175 anos, o New York Times criou, com o Studio Dumbar, uma campanha pouco convencional que celebra tanto o jornalismo quanto o legado publicitário do jornal, mostrando como a publicidade refletiu momentos culturais decisivos.","A experiência reúne anúncios de 1851 até hoje: peças da Tiffany & Co. lançadas três meses após o primeiro número, a virada da Ford para a produção em massa em 1909, a Heinz em 1925 e a campanha da IBM para a NASA em 1966. Exemplos recentes vêm de parcerias do T Brand Studio com Google, DoorDash e L'Oréal.","A liderança do jornal defende que a publicidade muitas vezes antecipa grandes momentos culturais e sustenta o jornalismo independente, ao alcançar leitores engajados que confiam no conteúdo editorial."]
},
{
  title: "SoreThumbStudio rebrands veg1 to prepare flagship vegan multivitamin for retail",
  tituloPt: "veg1, o multivitamínico da Vegan Society, troca a lata de alumínio por sachê compostável e ganha logo desenhado à mão",
  source: "Design Week",
  url: "https://www.designweek.co.uk/sorethumbstudio-rebrands-veg1-to-prepare-flagship-vegan-multivitamin-for-retail/",
  imageUrl: "https://www.designweek.co.uk/content/uploads/2026/09/VEG1®-Close-up-1024x750.jpg",
  cat: "Design", stars: 3, data: "25/09/2026",
  resumo: ["A SoreThumbStudio redesenhou a veg1, suplemento multivitamínico da The Vegan Society, para prepará-lo para a entrada no varejo, depois de anos vendido direto ao consumidor. Os recipientes de alumínio deram lugar a sachês compostáveis em casa, que reduzem desperdício e custos de frete e ajudam na visibilidade em prateleira.","A identidade traz um logotipo em minúsculas desenhado à mão e inspirado nos elementos da tabela periódica, equilibrando simpatia e tom científico suave. O novo slogan, 'Created by vegans, made for everyone', amplia o público para além dos veganos.","A embalagem usa um sistema de duas cores e um grande círculo gráfico para se destacar, e a arquitetura de informação foi reorganizada com base em pesquisas com compradores, com flexibilidade para novas linhas. A gama de quatro SKUs chegou ao mercado no fim do verão de 2026."]
},
{
  title: "LOLA Madrid parodies high-end perfume packaging with luxury Lynx holder",
  tituloPt: "A LOLA Madrid zomba a embalagem de perfume de luxo com um suporte de vidro cobalto para o desodorante Lynx",
  source: "Design Week",
  url: "https://www.designweek.co.uk/lola-madrid-parodies-high-end-perfume-packaging-with-luxury-lynx-holder/",
  imageUrl: "https://www.designweek.co.uk/content/uploads/2026/09/hf_20260827_144834_bbdb9226-20f5-4f9b-8ea5-a76f4255c817-denoise-max-1024x572.png",
  cat: "Design", stars: 4, data: "23/09/2026",
  resumo: ["A agência LOLA Madrid criou para a Lynx, da Unilever, um suporte decorativo extravagante que satiriza a embalagem de fragrâncias de luxo: uma peça translúcida de vidro azul-cobalto com colar prateado polido, dentro da qual entra a lata de aerossol comum.","A ideia parte de testes cegos da Unilever indicando que as fragrâncias da Lynx têm desempenho comparável ao de perfumes que custam cerca de 350 libras. Ao exagerar os códigos do luxo, a campanha provoca o esnobismo do setor.","Segundo o diretor de criação Tomás Ostiglia, é 'um acessório completamente desnecessário e muito chique — e é exatamente esse o ponto'. A distribuição começa em setembro de 2026 em mercados como Reino Unido, Austrália, Alemanha, México, Canadá e Argentina, via compras online selecionadas e ativações."]
},
{
  title: "Nest Egg is a tech-based take on a children's piggy bank",
  tituloPt: "Nest Egg: um ovo que 'choca' um cartão de débito reinventa o cofrinho infantil na era do dinheiro invisível",
  source: "Dezeen",
  url: "https://www.dezeen.com/2026/09/28/nest-egg-filament-piggy-bank/",
  imageUrl: "https://static.dezeen.com/uploads/2026/09/sq-nest-egg-filament_dezeen_2364_col_0.jpg",
  cat: "Design", stars: 3, data: "28/09/2026",
  resumo: ["O estúdio escocês Filament apresentou um conceito de plataforma de educação financeira para crianças, centrado em um objeto em forma de ovo que une interação tátil e aplicativo. A premissa: quando o dinheiro se torna invisível, as lições ligadas a ele desaparecem.","As crianças ganham estrelas digitais por tarefas ou marcos de desenvolvimento e, aos poucos, revelam um personagem escondido no ovo. Ao atingir a meta, o brinquedo vira uma interface NFC para acessar a mesada virtual com toques no celular.","No fim, quando a criança chega à maturidade financeira, o ovo se 'quebra' mecanicamente e revela um cartão de débito real. O cofundador Craig Lynn defende a importância de objetos físicos na educação infantil, e o estúdio busca parceiros bancários para levar o conceito ao mercado."]
},
{
  title: "CorelDRAW adds Text-to-Vector AI in the September update – is it a good move?",
  tituloPt: "CorelDRAW ganha Text-to-Vector: IA que gera vetores editáveis, com curvas e nós, e não imagens achatadas",
  source: "Creative Bloq",
  url: "https://www.creativebloq.com/design/graphic-design-software/coreldraw-adds-text-to-vector-ai-in-the-september-update-is-it-a-good-move",
  imageUrl: "https://cdn.mos.cms.futurecdn.net/EHxixv8fQK56YzKNKNoAnb-1920-80.jpg",
  cat: "Design", stars: 3, data: "28/09/2026",
  resumo: ["A atualização de setembro de 2026 do CorelDRAW traz o Text-to-Vector, recurso de IA que gera arte vetorial totalmente editável, com curvas e nós, em vez de imagens raster.","Há três modelos: Vector Spark, para desenhos simples; Vector Craft, multiuso; e Vector Master, para trabalhos complexos. O usuário pode fornecer sua própria arte como referência para gerar ativos no mesmo estilo. Tudo roda na nuvem, sem exigir GPU local.","A atualização também acelera o PowerTRACE em até quatro vezes e melhora o tratamento de objetos. A ressalva: é IA generativa com limitações, e alguns detalhes se perdem na geração por referência; testadores a veem mais como ferramenta de ideação do que de resultado final."]
},
{
  title: "AMD will acquire Fei-Fei Li's World Labs for $8.2 billion",
  tituloPt: "AMD vai comprar a World Labs, de Fei-Fei Li, por US$ 8,2 bilhões para entrar na corrida dos 'modelos de mundo'",
  source: "TechCrunch",
  url: "https://techcrunch.com/2026/09/28/amd-will-acquire-fei-fei-lis-world-labs-for-8-2-billion/",
  imageUrl: "https://techcrunch.com/wp-content/uploads/2024/10/GettyImages-1833911955.jpg?resize=1200,800",
  cat: "Tecnologia", stars: 3, data: "28/09/2026",
  resumo: ["A AMD vai adquirir a World Labs, startup de IA fundada por Fei-Fei Li, por US$ 8,2 bilhões. Li assumirá como vice-presidente executiva e cientista-chefe da AMD.","A World Labs desenvolve modelos de aprendizado profundo capazes de entender e simular a realidade física. Seu primeiro produto, o Marble, cria experiências imersivas e ambientes sintéticos de treinamento para robótica. Li disse que ampliar a pesquisa exigia 'chegar mais perto do hardware'.","O negócio fortalece a AMD contra a Nvidia, que já tem um portfólio público de modelos de mundo mais robusto. Especialistas veem esses modelos como peça-chave para robótica, de carros autônomos a humanoides, por gerarem dados sintéticos onde faltam dados reais. A conclusão é esperada antes do fim do ano, sujeita à aprovação regulatória."]
}
];

const PAL = {
  Branding:[["#ff9a5a","#ff5e62"],["#ffb347","#e8590c"],["#f7797d","#fbd786"]],
  Design:[["#2dd4bf","#0f766e"],["#5eead4","#059669"],["#34d399","#0e7490"]],
  Tecnologia:[["#6366f1","#a855f7"],["#3b82f6","#7c3aed"],["#818cf8","#4338ca"]]
};
function Ilustra({cat,seed}){
  const p=PAL[cat][seed%3], id="g"+seed;
  return (<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id={id} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[1]}/></linearGradient></defs>
    <rect width="400" height="240" fill={"url(#"+id+")"}/>
    <circle cx={90+seed*17%120} cy="70" r="70" fill="#fff" opacity=".18"/>
    <rect x={200+seed*13%80} y="90" width="140" height="140" rx="28" fill="#fff" opacity=".16" transform="rotate(18 270 160)"/>
    <polygon points="40,230 140,120 240,230" fill="#fff" opacity=".14"/>
    <circle cx="330" cy="50" r="26" fill="#fff" opacity=".25"/>
  </svg>);
}
function Imagem({item,idx,alt}){
  const [falhou,setFalhou]=useState(false);
  return (<div className="img">
    {item.imageUrl && !falhou
      ? <img src={item.imageUrl} alt={alt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>
      : <Ilustra cat={item.cat} seed={idx}/>}
  </div>);
}
const Stars=({n})=><span className="stars" aria-label={n+" de 5 estrelas"}>{"★".repeat(n)}{"☆".repeat(5-n)}</span>;
const Meta=({it})=>(<div className="meta"><span className={"tag "+it.cat}>{it.cat}</span><Stars n={it.stars}/><span>{it.source} · {it.data}</span></div>);

function Modal({it,idx,onClose}){
  useEffect(()=>{const k=e=>e.key==="Escape"&&onClose();document.addEventListener("keydown",k);return()=>document.removeEventListener("keydown",k)},[]);
  return (<div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
    <Imagem item={it} idx={idx} alt={"Imagem da matéria: "+it.tituloPt}/>
    <div className="c">
      <Meta it={it}/>
      <h2>{it.tituloPt}</h2>
      <div className="orig">Título original: {it.title}</div>
      {it.resumo.map((p,i)=><p key={i}>{p}</p>)}
      {it.paywall && <div className="note">Resumo feito a partir dos elementos públicos da matéria (título, tags e chamada); o texto completo está atrás de paywall.</div>}
      <div className="btns"><a className="btn pri" href={it.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a><button className="btn sec" onClick={onClose}>Fechar</button></div>
    </div></div></div>);
}
function App(){
  const [sel,setSel]=useState(null);
  const ord=[...NEWS].sort((a,b)=>b.stars-a.stars);
  const [top,...rest]=ord;
  const idxOf=it=>NEWS.indexOf(it);
  return (<div className="wrap">
    <header><h1>Portal da Manhã</h1><p>Terça-feira, 29 de setembro de 2026 · Branding, design e tecnologia em {new Set(NEWS.map(n=>n.source)).size} portais</p></header>
    <div className="hero" onClick={()=>setSel(top)}>
      <Imagem item={top} idx={idxOf(top)} alt={"Imagem da matéria: "+top.tituloPt}/>
      <div className="txt"><Meta it={top}/><h2>{top.tituloPt}</h2><span style={{color:"var(--acc)",fontWeight:600}}>Ler resumo →</span></div>
    </div>
    <div className="grid">{rest.map(it=>(
      <div className="card" key={it.url} onClick={()=>setSel(it)}>
        <Imagem item={it} idx={idxOf(it)} alt={"Imagem da matéria: "+it.tituloPt}/>
        <div className="b"><Meta it={it}/><h3>{it.tituloPt}</h3></div>
      </div>))}</div>
    {sel && <Modal it={sel} idx={idxOf(sel)} onClose={()=>setSel(null)}/>}
    <footer>Resumos parafraseados em português. Toda a autoria pertence aos portais de origem.</footer>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
