<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal da Manhã — 3 de novembro de 2026</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e8e6e0;--brand:#e4572e;--design:#0f9d8a;--tech:#5b5bd6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:8px;margin-bottom:24px}
h1{font-size:34px;margin:0;letter-spacing:-.02em}.date{color:var(--mute);font-size:15px;text-transform:capitalize}
.hero{display:grid;grid-template-columns:1.25fr 1fr;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(20,20,30,.08);cursor:pointer;transition:transform .25s,box-shadow .25s;margin-bottom:28px}
.hero:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(20,20,30,.12)}
.hero .img{min-height:340px}.hero .body{padding:32px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.hero h2{font-size:30px;line-height:1.15;margin:0;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(20,20,30,.06);cursor:pointer;transition:transform .25s,box-shadow .25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(20,20,30,.12)}
.card .img{height:180px}.card .body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:17px;line-height:1.3;margin:0}
.img{position:relative;background:#eee;overflow:hidden}.img img,.img svg{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mute)}
.tag{padding:3px 10px;border-radius:99px;color:#fff;font-weight:600;font-size:11.5px}
.stars{color:#f5a524;letter-spacing:1px}
.overlay{position:fixed;inset:0;background:rgba(15,17,22,.55);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:30px 16px;z-index:10;animation:fade .2s}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;overflow:hidden;animation:up .3s ease;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal .img{height:340px}.modal .in{padding:28px 32px 34px}
.modal h2{font-size:27px;line-height:1.2;margin:10px 0 4px}.modal .orig{color:var(--mute);font-size:13.5px;font-style:italic;margin-bottom:14px}
.modal p{font-size:16.5px;margin:0 0 14px}.note{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}
.btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
footer{margin-top:36px;color:var(--mute);font-size:13px;text-align:center}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hero .img{min-height:220px}h1{font-size:27px}.modal .img{height:220px}.modal .in{padding:20px}}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const CATS={branding:{nome:"Branding e Publicidade",cor:"#e4572e",pal:["#ff9a5a","#e4572e","#ffd27a","#b83a1d"]},design:{nome:"Design",cor:"#0f9d8a",pal:["#6fe0c5","#0f9d8a","#c8f5e6","#0b6b66"]},tech:{nome:"Tecnologia e IA",cor:"#5b5bd6",pal:["#8a8cff","#5b5bd6","#c9b8ff","#35318f"]}};
const NEWS=[
{
title: "Foster + Partners and MANICA unveil design for new stadium to replace Milan's San Siro",
tituloPt: "Foster + Partners e MANICA revelam projeto do novo estádio que substituirá o San Siro, em Milão",
source: "ArchDaily",
url: "https://www.archdaily.com/1187932/foster-plus-partners-and-manica-unveil-design-for-new-stadium-to-replace-milans-san-siro",
imageUrl: "https://images.adsttc.com/media/images/6ae8/58f5/d5ab/1b01/886e/5251/large_jpg/foster-plus-partners-and-manica-unveil-design-for-new-stadium-to-replace-milans-san-siro_1.jpg?1793612057",
cat:"design",stars:5,
resumo:["Milan e Internazionale apresentaram o projeto do Generali Stadium, arena para 71.500 pessoas que será a casa compartilhada dos dois clubes. A obra é assinada por Foster + Partners em parceria com a MANICA e ficará ao lado do atual San Siro, dentro de uma requalificação de cerca de 281 mil m² da área do entorno. As obras devem começar em 2028, com a primeira partida prevista para a temporada 2031/32, sujeita a aprovações de planejamento.","Na arquitetura, uma estrutura em X de concreto percorre as colunatas e a fachada e sustenta a cobertura; as entradas em formato de losango abrem para amplos corredores panorâmicos. O telhado de dupla curvatura (cerca de 244 x 270 m) usa um sistema estrutural em roda de raios e recebe 27,5 mil m² de painéis fotovoltaicos. O estádio será totalmente elétrico, com ventilação natural, captação de água da chuva, reúso de águas cinzas e meta de certificação LEED Gold e operação neutra em carbono.","Por dentro, dois anéis de arquibancada formam um 'bowl' contínuo de 360 graus, com duas áreas inclinadas atrás dos gols (cerca de 11.700 torcedores cada) que reinterpretam as tradicionais Curvas. São 8.088 lugares de hospitalidade, 3.698 premium e 394 posições para cadeirantes, e o espaço também receberá shows, rúgbi e futebol americano. Os clubes compraram a área em 2025 por € 197 milhões e estimam o custo da obra em € 1,2 bilhão; parte da torcida da Inter protestou na apresentação, pedindo a preservação do San Siro, que seguirá em operação até a inauguração e depois será em grande parte demolido."]},
{
title: "Kay Sends Colin Jost on a Gift-Seeking Odyssey for the Holiday Season",
tituloPt: "Kay manda Colin Jost em uma odisseia em busca do presente perfeito para as festas",
source: "Adweek",
url: "https://adweek.com/creativity/kay-sends-colin-jost-on-a-gift-seeking-odyssey-for-the-holiday-season",
imageUrl: "https://static-www.adweek.com/wp-content/uploads/2026/11/KayHolidayAd.png",
cat:"branding",stars:4,
resumo:["A joalheria Kay recrutou Colin Jost, do Saturday Night Live, para a campanha de fim de ano que brinca com o estresse de escolher um presente. Criada pela The Martin Agency, a peça mostra Jost como um viajante em uma jornada perigosa, livremente inspirada na Odisseia de Homero, atrás de um presente significativo — até encontrar, no meio de uma nevasca, um colar de prata da marca.","Estrategicamente, a Kay muda o foco: em vez de falar do presenteado, como nos anos anteriores, o filme fala da ansiedade de quem presenteia. A campanha cita uma pesquisa da American Psychological Association de 2023 segundo a qual 40% das pessoas têm dificuldade em achar o presente certo. A mensagem é 'presenteie com ousadia': o maior erro seria se conter, não errar o item.","A ação amplia a plataforma 'Love All In', lançada no início do outono, e resgata a ideia de grandes gestos em uma época em que a indiferença está em alta, segundo a presidente da marca, Julie Yoakum. O filme roda no Instagram e no YouTube da Kay, na TV linear e em streaming."]},
{
title: "New Logo and Identity for Teamtailor done In-house",
tituloPt: "Novo logo e identidade da Teamtailor, feitos internamente",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_and_identity_for_teamtailor_done_in_house.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/11/teamtailor_logo_before_after.png",
cat:"branding",stars:4,
resumo:["O Brand New publicou a nova identidade da Teamtailor, empresa sueca de software de recrutamento, desenvolvida pela equipe interna. O post tem o título 'Let's Circle Back' e é classificado no setor corporativo, com as tags círculos, geométrico, in-house, Suécia e wordmark.","As tags indicam um sistema visual geométrico apoiado em círculos e em um logotipo tipográfico (wordmark), com seção de 'antes e depois' do logo e exemplos de aplicação. A publicação marca mais um caso de empresa de tecnologia que opta por conduzir a renovação de marca sem agência externa.","Observação: o artigo completo está atrás de paywall; este resumo se baseia apenas em elementos públicos (título, categoria, setor, tags e legendas das imagens), sem detalhes do racional de design."]},
{
title: "This year's creepiest Halloween advert looked surprisingly ordinary",
tituloPt: "O anúncio de Halloween mais assustador do ano parecia surpreendentemente comum",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/this-years-creepiest-halloween-advert-looked-surprisingly-ordinary",
imageUrl: "https://cdn.mos.cms.futurecdn.net/7haUnywh47s5NPoPAEyjn6-1920-80.jpg",
cat:"branding",stars:4,
resumo:["A campanha 'Ultimate Monster Costume', do estúdio britânico independente Do Not Behave (fundado por Jo Moore em 2025, com as educadoras What Makes a Man e Cheer Up Luv), imita o anúncio de uma loja online de fantasias de Halloween. O link leva a um site falso que vende uma 'Fantasia de Monstro da Vida Real': uma camiseta branca comum, jeans e tênis brancos.","A descrição do 'produto' lista comportamentos como invadir o espaço pessoal de mulheres e compartilhar nudes sem consentimento, e o botão de compra diz 'NÃO COMPRE ESTE COMPORTAMENTO'. A ideia é mostrar que agressores costumam parecer homens comuns, difíceis de identificar, e incentivar aliados homens a ficarem mais atentos.","O site falso recebeu mais de 2.500 visitas, segundo o estúdio. O texto cita dados do Reino Unido de que a violência contra mulheres atinge cerca de uma em cada 12 mulheres na Inglaterra e no País de Gales e que cerca de 97% das mulheres que denunciam agressão sexual conhecem o agressor."]},
{
title: "Is this the most controversial font since Comic Sans?",
tituloPt: "Esta é a fonte mais polêmica desde a Comic Sans?",
source: "Creative Bloq",
url: "https://www.creativebloq.com/news/is-this-the-most-controversial-font-since-comic-sans",
imageUrl: null,
cat:"design",stars:4,
resumo:["O artigo trata de um lettering de pincel ousado, com traços ásperos e leve inclinação, que geradores de imagem por IA produzem com frequência em cartazes. O autor o viu em cafés, restaurantes e até em um salão comunitário de vilarejo. Não se trata de uma fonte real com autoria definida: segundo a resposta do ChatGPT citada no texto, o estilo é gerado a partir de inspirações em designs existentes.","Alguns o comparam à Comic Sans, mas o autor considera a comparação injusta com ela. Pequenos negócios recorrem ao estilo porque é um jeito rápido e barato de fazer um cartaz sem contratar designer. Mandy Roscoe, da Carrick Signs, lembra que 'o problema não é a fonte em si', e sim o uso em contexto errado; a Comic Sans, criada para imitar a escrita à mão dos quadrinhos, foi eleita a segunda fonte mais confiável do mundo em 2020.","A ironia, diz o texto, é que um estilo feito para parecer artesanal e rebelde agora soa nitidamente artificial porque a IA o usa em excesso."]},
{
title: "New Name, Logo, and Identity for Be Runner by PND Futura",
tituloPt: "Novo nome, logo e identidade da Be Runner, assinados pela PND Futura",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_name_logo_and_identity_for_be_runner_by_pnd_futura.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/11/be_runner_logo_before_after.png",
cat:"branding",stars:4,
resumo:["O estúdio PND Futura criou novo nome, logo e identidade para a Be Runner, varejista do setor de corrida na Polônia. O post do Brand New, na categoria 'Spotted', mostra comparações de antes e depois e é marcado com as tags itálico, monograma, naming, laranja, PND Futura, Polônia e corrida.","As tags sugerem um monograma em itálico, que transmite movimento, combinado ao laranja como cor de destaque. O nome anterior da marca não aparece nos trechos públicos da página.","Observação: o texto completo está atrás de paywall; este resumo usa apenas título, categoria, setor, tags e imagens públicas, sem o racional do projeto."]},
{
title: "New Logo for Salesloft",
tituloPt: "Novo logo da Salesloft",
source: "Brand New",
url: "https://www.underconsideration.com/brandnew/archives/new_logo_for_salesloft.php",
imageUrl: "https://www.underconsideration.com/brandnew/wp/wp-content/uploads/2026/11/salesloft_logo_before_after.png",
cat:"branding",stars:3,
resumo:["O Brand New destacou, em 3 de novembro, o novo logo da Salesloft, empresa de software de vendas. O post está na categoria 'Spotted' e traz imagens de antes e depois, com as tags preto, círculos, verde e ícone.","O estúdio ou designer responsável não é identificado no conteúdo público, e não há texto de apoio além do título e das legendas das imagens.","Observação: o artigo completo está atrás de paywall; este resumo se baseia apenas em informações públicas (título, setor, tags), sem detalhes do racional."]},
{
title: "Google takes Dreambeans to India in bid to bring AI-generated personal stories to the masses",
tituloPt: "Google leva o Dreambeans à Índia para popularizar histórias pessoais geradas por IA",
source: "TechCrunch",
url: "https://techcrunch.com/2026/11/02/google-takes-dreambeans-to-india-in-bid-to-bring-ai-generated-personal-stories-to-the-masses",
imageUrl: "https://techcrunch.com/wp-content/uploads/2026/11/google-dreambeans.jpg?resize=1200,800",
cat:"tech",stars:3,
resumo:["O Google lançou na Índia o Dreambeans, app experimental de IA, seu primeiro mercado fora dos EUA. Disponível em Android e iOS, suporta 13 idiomas indianos (como hindi, punjabi, tâmil, télugo e bengali) e inglês. O app estreou em junho e usa dados de serviços conectados — Calendar, Gemini, Gmail, Fotos, Pesquisa e YouTube — para gerar histórias ilustradas sobre os interesses e o dia a dia do usuário, sem precisar de prompt; recentemente ganhou animação com Veo.","Os números são modestos: a Sensor Tower estima cerca de 55 mil downloads nos EUA desde junho, com queda de 84% em outubro (~5,5 mil). Apps comparáveis tiveram muito mais downloads em 30 dias, como o Muse da Meta (7,4 milhões) e o ChatGPT (2,8 milhões). Um limite para a Índia é que só se pode escolher um idioma por vez, sem mistura de hindi e inglês.","Sobre privacidade, o usuário escolhe e desconecta serviços e pode apagar os dados no app; só funciona com contas pessoais do Gmail e as histórias são visíveis apenas ao dono. O risco de a abordagem proativa trazer memórias dolorosas é tratado com a opção de pedir que certos temas não apareçam."]},
{
title: "six-sided transparent cube with LED matrix shapes screenless AI companion",
tituloPt: "Cubo transparente de seis faces com matriz de LED dá forma a companheiro de IA sem tela",
source: "Designboom",
url: "https://www.designboom.com/technology/six-sided-transparent-cube-led-matrix-screenless-ai-companion-adam-miklosi-glyph-1/",
imageUrl: "https://www.designboom.com/wp-content/uploads/2026/11/six-sided-transparent-cube-led-matrix-screenless-ai-companion-adam-miklosi-glyph-1-designboom-1200-1.jpg",
cat:"design",stars:3,
resumo:["O Glyph (1) é um conceito especulativo do designer industrial Adam Miklosi: um companheiro de IA sem tela que traduz a linguagem de design da marca Nothing em um objeto físico. Em vez de menus, a interação é feita pela orientação: girar o cubo para que uma face específica fique para cima ativa o modo programado para ela.","O corpo é uma casca de policarbonato transparente moldada, de bordas arredondadas, deixando à vista um chassi interno texturizado. Cada face tem sua própria matriz de LED programável para exibir gráficos, notificações e telemetria, e pode ser associada a funções como controle da casa inteligente, reprodução de áudio, temporizadores ou um assistente de voz ambiente.","O conceito aparece em versões monocromáticas preto e branco e chegou à Designboom pela seção de submissões DIY dos leitores; as imagens são creditadas a Miklosi."]},
{
title: "mtpeak reimagines the classic sports car with three wheels and carbon fiber bodywork",
tituloPt: "MTPEAK reimagina o esportivo clássico com três rodas e carroceria de fibra de carbono",
source: "Designboom",
url: "https://www.designboom.com/technology/mtpeak-three-wheeled-sports-car-eicma-2026/",
imageUrl: "https://www.designboom.com/twitterimages/uploads/2026/11/imgi_15_ht-guangyu.jpeg",
cat:"design",stars:3,
resumo:["A marca emergente MTPEAK vai apresentar o One All na EICMA 2026, em Milão: um esportivo aberto com duas rodas na frente e uma atrás, a meio caminho entre moto e carro. A silhueta retrô e a cabine aberta evocam roadsters clássicos, enquanto os painéis esculpidos em fibra de carbono dão um toque moderno. É o primeiro modelo da marca.","Segundo a MTPEAK, o motor central é um 2.0 turbo que aciona a roda traseira única por câmbio automático de nove marchas, com relação peso-potência declarada de 370 cv por tonelada, estrutura tubular de aço cromo-molibdênio, freios carbono-cerâmicos ventilados, pneu traseiro de 305 mm e distribuição de peso de 50:50.","A fabricação está ligada à Guangyu Industrial e inclui usinagem CNC, estampagem, soldagem e fibra de carbono feitas internamente; cada veículo será configurado sob medida. O modelo fica na EICMA de 3 a 8 de novembro (Hall 24, Stand O54E), com produção limitada prevista para 2027 — volume, velocidade máxima e aceleração não foram divulgados."]},
{
title: "Hal Jordan has to recharge his ring, but the NoxTi titanium EDC lantern glows for decades",
tituloPt: "Hal Jordan precisa recarregar o anel, mas a lanterna de titânio NoxTi brilha por décadas",
source: "Yanko Design",
url: "https://www.yankodesign.com/2026/11/02/hal-jordan-has-to-recharge-his-ring-but-the-noxti-titanium-edc-lantern-glows-for-decades/",
imageUrl: "https://www.yankodesign.com/images/design_news/2026/10/hal-jordan-has-to-recharge-his-ring-but-the-noxti-titanium-edc-lantern-glows-for-decades/NoxTi-TRI-Ti-Tritium-Keychain-New-Glow-Outshine-the-Night-hero.jpg",
cat:"design",stars:3,
resumo:["A NoxTi TRI, do designer Xedge, é uma lanterna de bolso para chaveiro ou pingente. Três tubos luminosos ficam a 120 graus em um suporte de acrílico PMMA que os faz parecer um único núcleo brilhante. O comprador escolhe tubos de trítio (duração de cerca de duas décadas, segundo a Xedge) ou fotoluminescentes não radioativos, que carregam com a luz ambiente, em seis cores combináveis.","O corpo é de titânio grau 5 usinado em CNC (47 x 14,3 mm, 15,8 g), com luva de quartzo e anéis de vedação; a Xedge diz ter testado de -20 °C a 100 °C. Cada tubo repousa sobre uma esfera de silicone, com mola de aço inox para absorver impactos. Pode ser preso por argola, clipe ou corrente e tem uma esfera cerâmica quebra-vidro; é um localizador, não uma lanterna comum.","O preço de varejo é de cerca de US$ 55 (apoios no Kickstarter a partir de US$ 35), com entregas previstas para fevereiro de 2027 e mais de US$ 81 mil arrecadados. Os dados de durabilidade e luminosidade vêm da própria fabricante e não foram verificados de forma independente."]}
];
function Art({cat,seed,big}){const p=CATS[cat].pal;const s=seed*37;
return(<svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id={"g"+seed} x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor={p[0]}/><stop offset="1" stopColor={p[3]}/></linearGradient></defs>
<rect width="400" height="240" fill={"url(#g"+seed+")"}/>
<circle cx={80+(s%200)} cy={60+(s%90)} r={70+(s%40)} fill={p[2]} opacity=".35"/>
<rect x={200-(s%90)} y={110+(s%40)} width="170" height="170" rx="30" transform={"rotate("+(20+s%40)+" 280 190)"} fill={p[1]} opacity=".5"/>
<circle cx={320-(s%80)} cy={50+(s%50)} r="34" fill="#fff" opacity=".25"/></svg>);}
function Img({item,i}){const [falhou,setFalhou]=useState(false);
return(<div className="img">{item.imageUrl&&!falhou?<img src={item.imageUrl} alt={"Imagem da matéria: "+item.tituloPt} referrerPolicy="no-referrer" loading="lazy" onError={()=>setFalhou(true)}/>:<Art cat={item.cat} seed={i+1}/>}</div>);}
function Tag({cat}){return <span className="tag" style={{background:CATS[cat].cor}}>{CATS[cat].nome}</span>}
function Stars({n}){return <span className="stars" title={n+" de 5"}>{"★".repeat(n)+"☆".repeat(5-n)}</span>}
function Modal({item,i,close}){useEffect(()=>{const h=e=>e.key==="Escape"&&close();document.addEventListener("keydown",h);document.body.style.overflow="hidden";return()=>{document.removeEventListener("keydown",h);document.body.style.overflow=""}},[]);
return(<div className="overlay" onClick={close}><div className="modal" onClick={e=>e.stopPropagation()}><Img item={item} i={i}/><div className="in">
<div className="meta"><Tag cat={item.cat}/><Stars n={item.stars}/><span>{item.source}</span></div>
<h2>{item.tituloPt}</h2><div className="orig">{item.title}</div>
{item.resumo.map((p,k)=><p key={k} className={p.startsWith("Observação")?"note":""}>{p}</p>)}
<div className="btns"><a className="btn p" href={item.url} target="_blank" rel="noopener noreferrer">Ler na fonte ↗</a><button className="btn" onClick={close}>Fechar</button></div></div></div></div>);}
function App(){const [sel,setSel]=useState(null);const [h,...rest]=NEWS;
return(<div className="wrap"><header><div><h1>Portal da Manhã</h1></div><div className="date">terça-feira, 3 de novembro de 2026</div></header>
<div className="hero" onClick={()=>setSel(0)}><Img item={h} i={0}/><div className="body"><div className="meta"><Tag cat={h.cat}/><Stars n={h.stars}/><span>{h.source}</span></div><h2>{h.tituloPt}</h2><div className="meta">Toque para ler o resumo completo →</div></div></div>
<div className="grid">{rest.map((n,k)=><div className="card" key={k} onClick={()=>setSel(k+1)}><Img item={n} i={k+1}/><div className="body"><div className="meta"><Tag cat={n.cat}/><Stars n={n.stars}/></div><h3>{n.tituloPt}</h3><div className="meta">{n.source}</div></div></div>)}</div>

{sel!==null&&<Modal item={NEWS[sel]} i={sel} close={()=>setSel(null)}/>}</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
